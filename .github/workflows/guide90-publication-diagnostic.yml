name: Guide 90 publication diagnostic

on:
  push:
    branches: [revision/guide-00-100-2026]
    paths:
      - '.github/workflows/guide90-publication-diagnostic.yml'
      - 'project/revision-2026/guide-90/qa/GUIDE_90_TRILINGUAL_TECHNICAL_QA_08.md'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: revision/guide-00-100-2026
          fetch-depth: 0
      - name: Run non-destructive validator probe
        shell: python
        run: |
          from pathlib import Path
          import re,json
          root=Path('project/revision-2026/guide-90')
          files=[root/'working-masters/GUIDE_90_INFORMATION_TECHNOLOGY_PROJECT_COORDINATOR_ENGLISH_v2.md',root/'working-masters/GUIDE_90_COORDINADOR_DE_PROYECTOS_DE_TECNOLOGIA_DE_LA_INFORMACION_ES419_v2.md',root/'working-masters/GUIDE_90_COORDENADOR_DE_PROJETOS_DE_TECNOLOGIA_DA_INFORMACAO_PTBR_v2.md']
          texts=[p.read_text(encoding='utf-8') for p in files]
          report={'files':{},'problems':[]}
          for p,t in zip(files,texts):
            report['files'][p.name]={'characters':len(t),'h2':len(re.findall(r'^##\s+.+$',t,re.M)),'urls':len(set(re.findall(r'https://[^\s)<>`]+',t)))}
          urls=[set(re.findall(r'https://[^\s)<>`]+',t)) for t in texts]
          report['reader_url_counts']=[len(x) for x in urls]
          report['reader_url_parity']=urls[0]==urls[1]==urls[2]
          research=(root/'research/GUIDE_90_CURRENT_SOURCE_EVIDENCE_02.md').read_text(encoding='utf-8')
          evidence=set(re.findall(r'https://[^\s)<>`]+',research))
          report['evidence_url_count']=len(evidence)
          controls=[r'15-1299\.09',r'21222',r'25190',r'25110',r'55[,.]940',r'26[,.]89',r'79[,.]370',r'38[,.]16',r'116[,.]580',r'56[,.]05',r'157[,.]500',r'75[,.]72',r'188[,.]470',r'90[,.]61',r'472[,.]000',r'510[,.]500',r'8\s*%',r'31[,.]300',r'68[,.]763',r'45[,.]903',r'103[,.]010',r'162',r'36\s+(?:months|meses)',r'C\$28[,.]85',r'C\$46[,.]15',r'C\$68[,.]68',r'40\s+(?:hours|horas)',r'48\s+(?:hours|horas)',r'16\s*%',r'11\s*%',r'7\s*%',r'6\s*%',r'5\s*%',r'4\s*%']
          semantics={'statistical crosswalk':['computer occupations, all other'],'scope':['scope','alcance','escopo'],'schedule':['schedule','cronograma'],'risk':['risk','riesgo','risco'],'issue':['issue','problema'],'dependency':['dependenc','dependencia'],'decision log':['decision log','registro de decisiones','registro de decisão','decisões'],'change control':['change control','control de cambios','controle de mudanças'],'acceptance':['acceptance','aceptación','aceitação'],'release authority':['release authority','autoridad de producción','autoridade de produção'],'security':['security','seguridad','segurança'],'privacy':['privacy','privacidad','privacidade'],'accessibility':['accessibility','accesibilidad','acessibilidade'],'responsible AI':['responsible ai','ia responsable','ia responsável'],'synthetic':['synthetic','sintético','sintéticos']}
          for p,t in zip(files,texts):
            for pat in controls:
              if not re.search(pat,t,re.I): report['problems'].append(f'{p.name}: missing control {pat}')
            low=t.lower()
            for label,terms in semantics.items():
              if not any(term.lower() in low for term in terms): report['problems'].append(f'{p.name}: missing semantic {label}')
          if not report['reader_url_parity']: report['problems'].append('reader URL parity mismatch')
          if report['reader_url_counts'] != [21,21,21]: report['problems'].append(f"reader URL counts {report['reader_url_counts']} expected [21,21,21]")
          if report['evidence_url_count'] != 27: report['problems'].append(f"evidence URL count {report['evidence_url_count']} expected 27")
          (root/'qa/GUIDE_90_PUBLICATION_DIAGNOSTIC.json').write_text(json.dumps(report,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
      - name: Commit diagnostic only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add project/revision-2026/guide-90/qa/GUIDE_90_PUBLICATION_DIAGNOSTIC.json
          git commit -m 'qa(guide-90): record publication diagnostic' || exit 0
          git pull --rebase origin revision/guide-00-100-2026
          git push origin HEAD:revision/guide-00-100-2026
