name: Guide 50 controlled publication build

on:
  push:
    branches: [revision/guide-00-100-2026]
    paths:
      - '.github/workflows/guide50-publication-build.yml'
      - 'project/revision-2026/guide-50/working-masters/GUIDE_50_PHLEBOTOMY_TECHNICIAN_ENGLISH_v2.md'
      - 'project/revision-2026/guide-50/working-masters/GUIDE_50_PHLEBOTOMY_TECHNICIAN_ES419_v2.md'
      - 'project/revision-2026/guide-50/working-masters/GUIDE_50_PHLEBOTOMY_TECHNICIAN_PTBR_v2.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: guide50-controlled-publication-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out revision branch
        uses: actions/checkout@v5
        with:
          ref: revision/guide-00-100-2026
          fetch-depth: 0

      - name: Install document and rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc libreoffice poppler-utils python3-pil

      - name: Freeze trilingual publication candidates
        run: |
          set -euo pipefail
          SRC='project/revision-2026/guide-50/working-masters'
          OUT='project/revision-2026/guide-50/publication-candidate'
          mkdir -p "$OUT"
          cp "$SRC/GUIDE_50_PHLEBOTOMY_TECHNICIAN_ENGLISH_v2.md" "$OUT/GUIDE_50_ENGLISH_v2.md"
          cp "$SRC/GUIDE_50_PHLEBOTOMY_TECHNICIAN_ES419_v2.md" "$OUT/GUIDE_50_SPANISH_es-419_v2.md"
          cp "$SRC/GUIDE_50_PHLEBOTOMY_TECHNICIAN_PTBR_v2.md" "$OUT/GUIDE_50_PORTUGUESE_pt-BR_v2.md"

      - name: Run trilingual structural source numeric terminology and clinical-safety controls
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re, sys, unicodedata
          out=Path('project/revision-2026/guide-50/publication-candidate')
          files={'en':out/'GUIDE_50_ENGLISH_v2.md','es-419':out/'GUIDE_50_SPANISH_es-419_v2.md','pt-BR':out/'GUIDE_50_PORTUGUESE_pt-BR_v2.md'}
          texts={k:p.read_text(encoding='utf-8') for k,p in files.items()}
          def fold(s):
            s=re.sub(r'[*_`~]+','',s.lower())
            return ''.join(c for c in unicodedata.normalize('NFKD',s) if not unicodedata.combining(c))
          required={
            'en':['# guide 50','phlebotomy','31-9097.00','canada','colombia','registered apprenticeship','bloodborne pathogens','using ai responsibly','cybersecurity and privacy basics','does not claim independent human certification'],
            'es-419':['# guia 50','flebotom','31-9097.00','canada','colombia','registered apprenticeship','patogenos transmitidos por sangre','uso responsable de ia','ciberseguridad','no afirma certificacion humana independiente'],
            'pt-BR':['# guia 50','flebotom','31-9097.00','canada','colombia','registered apprenticeship','patogenos transmitidos pelo sangue','uso responsavel de ia','ciberseguranca','nao afirma certificacao humana independente']}
          problems=[]; sections={}; urls={}
          for lang,text in texts.items():
            low=fold(text); sections[lang]=len(re.findall(r'^##\s+.+$',text,re.M)); urls[lang]=set(re.findall(r'https://[^\s)<>`]+',text))
            if text.startswith('\ufeff') or '\ufffd' in text: problems.append(f'{lang}: UTF-8 defect')
            for bad in ('todo:','lorem ipsum','[insert','translation pending','traduccion pendiente','traducao pendente'):
              if bad in low: problems.append(f'{lang}: placeholder {bad}')
            for marker in required[lang]:
              if fold(marker) not in low: problems.append(f'{lang}: missing marker {marker}')
          if len(set(sections.values())) != 1: problems.append(f'H2 structural mismatch {sections}')
          if min(sections.values()) < 17: problems.append(f'expected at least 17 H2 sections; observed {sections}')
          if len(urls['en']) < 18: problems.append(f'expected at least 18 English source URLs; observed {len(urls["en"])}')
          for lang in ('es-419','pt-BR'):
            if urls[lang] != urls['en']: problems.append(f'{lang}: source URL set differs; missing={sorted(urls["en"]-urls[lang])}; extra={sorted(urls[lang]-urls["en"])}')
          controls=[r'31-9097\.00',r'33101',r'48\s*(?:hour|hora)',r'29\s*CFR\s*1910\.1030',r'21[.,]75',r'45[.,]?230',r'17[.,]20',r'35[.,]?780',r'28[.,]26',r'58[.,]?780',r'139[.,]?700',r'5\s*%\s*[-–]\s*6\s*%',r'18[.,]?400',r'43[.,]?660',r'41[.,]?314',r'38[.,]?353',r'44[.,]?694',r'19[.,]18',r'27[.,]00',r'36[.,]11']
          for lang,text in texts.items():
            for pat in controls:
              if not re.search(pat,text,re.I|re.S): problems.append(f'{lang}: missing controlled value {pat}')
          unsafe=[r'\b(?:ai|artificial intelligence)\s+(?:can|may|should|must)\s+replace\s+(?:approved protocols|clinical judgment|licensed supervision)\b',r'\bindependently diagnose\b',r'\bindependently interpret laboratory results\b']
          for lang,text in texts.items():
            low=fold(text)
            for pat in unsafe:
              if re.search(pat,low,re.I): problems.append(f'{lang}: unsafe scope claim {pat}')
          if problems:
            print('\n'.join(problems)); sys.exit(1)
          print(f'Guide 50 trilingual controls PASS: H2={sections}; URLs={len(urls["en"])}')
          PY

      - name: Validate live source-link behavior
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, sys
          text=Path('project/revision-2026/guide-50/publication-candidate/GUIDE_50_ENGLISH_v2.md').read_text(encoding='utf-8')
          ua='Mozilla/5.0 (compatible; LifelongOpportunityProject-LinkQA/1.0)'; broken=[]; warnings=[]
          def probe(url,method='GET'):
            cmd=['curl','-L','--retry','2','--retry-all-errors','--retry-delay','2','--connect-timeout','10','--max-time','30','-A',ua,'-sS','-o','/dev/null','-w','%{http_code}']
            if method=='HEAD': cmd.insert(1,'-I')
            cp=subprocess.run(cmd+[url],capture_output=True,text=True); code=int(cp.stdout[-3:]) if cp.stdout and cp.stdout[-3:].isdigit() else 0
            return code,cp.returncode,(cp.stderr or '').strip()
          for url in sorted(set(re.findall(r'https://[^\s)<>`]+',text))):
            code,rc,err=probe(url,'GET')
            if code==0: code,rc,err=probe(url,'HEAD')
            if 200<=code<400: state='PASS'
            elif code in (404,410): state='FAIL_BROKEN'; broken.append(f'{url}: HTTP {code}')
            elif code in (401,403,429): state='ACCESS_CONTROLLED_UNVERIFIED'; warnings.append(f'{url}: HTTP {code}')
            elif code==0: state='TRANSPORT_UNVERIFIED'; warnings.append(f'{url}: curl rc={rc}; {err}')
            elif code>=500: state='SERVER_UNVERIFIED'; warnings.append(f'{url}: HTTP {code}')
            else: state='HTTP_UNVERIFIED'; warnings.append(f'{url}: HTTP {code}')
            print(code,state,url)
          if warnings: print('Source verification limitations:\n'+'\n'.join(warnings))
          if broken: print('\n'.join(broken)); sys.exit(1)
          PY

      - name: Generate DOCX and PDF editions
        run: |
          set -euo pipefail
          OUT='project/revision-2026/guide-50/publication-candidate'
          for STEM in GUIDE_50_ENGLISH_v2 GUIDE_50_SPANISH_es-419_v2 GUIDE_50_PORTUGUESE_pt-BR_v2; do
            pandoc "$OUT/$STEM.md" -f gfm-tex_math_dollars -t docx --standalone -o "$OUT/$STEM.docx"
            mkdir -p "$OUT/lo-$STEM"
            libreoffice --headless --convert-to pdf --outdir "$OUT/lo-$STEM" "$OUT/$STEM.docx"
            mv "$OUT/lo-$STEM/$STEM.pdf" "$OUT/$STEM.pdf"
            rmdir "$OUT/lo-$STEM"
          done

      - name: Validate DOCX and searchable PDF integrity
        run: |
          set -euo pipefail
          OUT='project/revision-2026/guide-50/publication-candidate'
          test "$(find "$OUT" -maxdepth 1 -name '*.docx' | wc -l)" -eq 3
          test "$(find "$OUT" -maxdepth 1 -name '*.pdf' | wc -l)" -eq 3
          for DOCX in "$OUT"/*.docx; do unzip -t "$DOCX" >/dev/null; unzip -l "$DOCX" | grep -q 'word/document.xml'; done
          for PDF in "$OUT"/*.pdf; do pdfinfo "$PDF" >/dev/null; TEXT="$(pdftotext "$PDF" - | tr -d '[:space:]')"; test ${#TEXT} -gt 5000; done

      - name: Render and inspect every PDF page
        run: |
          set -euo pipefail
          OUT='project/revision-2026/guide-50/publication-candidate'; rm -rf "$OUT/rendered"
          for PDF in "$OUT"/*.pdf; do STEM="$(basename "$PDF" .pdf)"; mkdir -p "$OUT/rendered/$STEM"; pdftoppm -png -r 110 "$PDF" "$OUT/rendered/$STEM/page" >/dev/null 2>&1; done
          python - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageChops
          import json,sys
          root=Path('project/revision-2026/guide-50/publication-candidate/rendered'); problems=[]; pages=[]
          for path in sorted(root.rglob('*.png')):
            try:
              with Image.open(path) as im: im.verify()
              with Image.open(path) as im:
                gray=im.convert('L'); diff=ImageChops.difference(gray,Image.new('L',gray.size,255)); bbox=diff.point(lambda p:255 if p>12 else 0).getbbox()
                if bbox is None: problems.append(f'{path}: blank page'); continue
                l,t,r,b=bbox; w,h=gray.size; margins={'left':l,'top':t,'right':w-r,'bottom':h-b}
                if min(margins.values())<4: problems.append(f'{path}: possible clipping {margins}')
                pages.append({'file':str(path.relative_to(root)),'status':'PASS','edge_margins':margins})
            except Exception as exc: problems.append(f'{path}: malformed render: {exc}')
          (root/'RENDER_QA.json').write_text(json.dumps({'status':'FAIL' if problems else 'PASS','pages':pages,'problems':problems},indent=2)+'\n',encoding='utf-8')
          if problems: print('\n'.join(problems)); sys.exit(1)
          print(f'All-page render QA PASS: {len(pages)} pages')
          PY

      - name: Generate publication metadata and checksums
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,subprocess
          out=Path('project/revision-2026/guide-50/publication-candidate'); render=json.loads((out/'rendered/RENDER_QA.json').read_text())
          records=[]
          for lang,stem in [('en','GUIDE_50_ENGLISH_v2'),('es-419','GUIDE_50_SPANISH_es-419_v2'),('pt-BR','GUIDE_50_PORTUGUESE_pt-BR_v2')]:
            docx=out/f'{stem}.docx'; pdf=out/f'{stem}.pdf'; info=subprocess.check_output(['pdfinfo',str(pdf)],text=True); count=next(int(x.split(':',1)[1]) for x in info.splitlines() if x.startswith('Pages:')); txt=subprocess.check_output(['pdftotext',str(pdf),'-'],text=True,errors='replace')
            if '\ufffd' in txt: raise SystemExit(f'{pdf}: Unicode replacement character')
            rendered=sum(1 for p in render['pages'] if p['file'].startswith(stem+'/'))
            if rendered!=count: raise SystemExit(f'{stem}: PDF/render page mismatch')
            records.append({'language':lang,'docx':docx.name,'pdf':pdf.name,'docx_bytes':docx.stat().st_size,'pdf_bytes':pdf.stat().st_size,'pdf_pages':count,'rendered_pages':rendered,'status':'PASS'})
          manifest={'guide':'50','occupation':'Phlebotomy Technician','build_date':'2026-08-19','status':'PASS','editions':records,'assurance_boundary':'Internal automated publication QA; not independent human review, professional or clinical certification, certified translation, accessibility certification, medical or legal advice, accreditation, clinical-practice authorization, or employment or earnings guarantee.'}
          (out/'GUIDE_50_PUBLICATION_QA_MANIFEST.json').write_text(json.dumps(manifest,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          targets=sorted(p for p in out.iterdir() if p.is_file() and p.suffix in {'.docx','.pdf'})
          (out/'SHA256SUMS.txt').write_text('\n'.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}' for p in targets)+'\n',encoding='utf-8')
          PY

      - name: Upload rendered-page QA evidence
        uses: actions/upload-artifact@v4
        with:
          name: guide50-rendered-pages
          path: project/revision-2026/guide-50/publication-candidate/rendered
          retention-days: 14

      - name: Remove render images from commit scope
        run: rm -rf project/revision-2026/guide-50/publication-candidate/rendered

      - name: Commit controlled publication candidates
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add project/revision-2026/guide-50/publication-candidate
          if git diff --cached --quiet; then echo 'No publication changes to commit.'; else git commit -m 'Build and validate Guide 50 publication candidates'; git pull --rebase origin revision/guide-00-100-2026; git push origin HEAD:revision/guide-00-100-2026; fi

