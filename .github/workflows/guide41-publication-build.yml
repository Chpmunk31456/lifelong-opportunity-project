name: Guide 41 controlled publication build

on:
  push:
    branches: [revision/guide-00-100-2026]
    paths:
      - '.github/workflows/guide41-publication-build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: guide41-controlled-publication-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out revision branch
        uses: actions/checkout@v5
        with:
          ref: revision/guide-00-100-2026
          fetch-depth: 0

      - name: Install document and rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc libreoffice poppler-utils python3-pil

      - name: Freeze trilingual publication candidates
        shell: bash
        run: |
          set -euo pipefail
          SRC='project/revision-2026/guide-41/working-masters'
          OUT='project/revision-2026/guide-41/publication-candidate'
          mkdir -p "$OUT"
          cp "$SRC/GUIDE_41_CARPENTER_AND_CABINETMAKING_TECHNICIAN_ENGLISH_v2.md" "$OUT/GUIDE_41_ENGLISH_v2.md"
          cp "$SRC/GUIDE_41_CARPENTER_AND_CABINETMAKING_TECHNICIAN_ES419_v2.md" "$OUT/GUIDE_41_SPANISH_es-419_v2.md"
          cp "$SRC/GUIDE_41_CARPENTER_AND_CABINETMAKING_TECHNICIAN_PTBR_v2.md" "$OUT/GUIDE_41_PORTUGUESE_pt-BR_v2.md"

      - name: Run trilingual structural source numeric and terminology controls
        shell: python
        run: |
          from pathlib import Path
          import re, sys, unicodedata
          out=Path('project/revision-2026/guide-41/publication-candidate')
          files={'en':out/'GUIDE_41_ENGLISH_v2.md','es-419':out/'GUIDE_41_SPANISH_es-419_v2.md','pt-BR':out/'GUIDE_41_PORTUGUESE_pt-BR_v2.md'}
          texts={k:p.read_text(encoding='utf-8') for k,p in files.items()}
          def fold(s): return ''.join(c for c in unicodedata.normalize('NFKD',s.lower()) if not unicodedata.combining(c))
          problems=[]; urls={}; sections={}
          required={
            'en':['# guide 41','carpentry','cabinetmaking','registered apprenticeship','red seal','colombia','using ai responsibly','cybersecurity and privacy basics','does not claim independent human certification'],
            'es-419':['# guia 41','carpinter','ebanister','registered apprenticeship','red seal','colombia','uso responsable de ia','ciberseguridad','no afirma certificacion humana independiente'],
            'pt-BR':['# guia 41','carpint','marcenaria','registered apprenticeship','red seal','colombia','uso responsavel de ia','ciberseguranca','nao afirma certificacao humana independente']}
          for lang,text in texts.items():
            low=fold(text)
            sections[lang]=len(re.findall(r'^##\s+.+$',text,re.M))
            urls[lang]=set(re.findall(r'https://[^\s)<>`]+',text))
            if text.startswith('\ufeff') or '\ufffd' in text: problems.append(f'{lang}: UTF-8 defect')
            for bad in ('todo:','lorem ipsum','[insert','translation pending','traduccion pendiente','traducao pendente'):
              if bad in low: problems.append(f'{lang}: placeholder {bad}')
            for marker in required[lang]:
              if fold(marker) not in low: problems.append(f'{lang}: missing marker {marker}')
          if len(set(sections.values())) != 1: problems.append(f'structural mismatch {sections}')
          for lang in ('es-419','pt-BR'):
            if urls[lang] != urls['en']:
              problems.append(f'{lang}: source URL set differs from English; missing={sorted(urls["en"]-urls[lang])}; extra={sorted(urls[lang]-urls["en"])}')
          controls=[
            r'47-2031\.00',r'72310',r'60\s*(?:hour|hora)',r'4[.,]?000',
            r'29[.,]12',r'60[.,]?580',r'959[.,]?000',r'5\s*%.*6\s*%',r'74[.,]?100',
            r'41[.,]?709',r'20\s*(?:per|por)',r'34[.,]?226',r'51[.,]?809',
            r'60[.,]?290',r'29\s*(?:per|por)',r'54[.,]?219',r'66[.,]?817',
            r'22[.,]00',r'32[.,]12',r'44[.,]23']
          for lang,text in texts.items():
            for pat in controls:
              if not re.search(pat,text,re.I|re.S): problems.append(f'{lang}: missing controlled value {pat}')
          if problems:
            print('\n'.join(problems)); sys.exit(1)
          print(f'Guide 41 trilingual controls PASS: sections={sections}; urls={len(urls["en"])}')

      - name: Validate live source-link behavior
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import urlsplit
          import re, subprocess, sys

          text=Path('project/revision-2026/guide-41/publication-candidate/GUIDE_41_ENGLISH_v2.md').read_text(encoding='utf-8')
          problems=[]
          transport_warnings=[]
          official_transport_allowlist={'jobbank.gc.ca','www.jobbank.gc.ca','canada.ca','www.canada.ca'}
          user_agent='Mozilla/5.0 (compatible; LifelongOpportunityProject-LinkQA/1.0)'

          def probe(url, method='GET'):
            cmd=['curl','-L','--retry','2','--retry-all-errors','--retry-delay','2','--connect-timeout','10','--max-time','30','-A',user_agent,'-sS','-o','/dev/null','-w','%{http_code}']
            if method == 'HEAD': cmd.insert(1,'-I')
            cp=subprocess.run(cmd+[url],capture_output=True,text=True)
            code=int(cp.stdout[-3:]) if cp.stdout and cp.stdout[-3:].isdigit() else 0
            return code, cp.returncode, (cp.stderr or '').strip()

          for url in sorted(set(re.findall(r'https://[^\s)<>`]+',text))):
            code, rc, err=probe(url,'GET')
            if code == 0:
              code, rc, err=probe(url,'HEAD')
            if 200 <= code < 400:
              state='PASS'
            elif code in (401,403,429):
              state='ACCESS_CONTROLLED'
            elif code in (404,410):
              state='FAIL_BROKEN'; problems.append(f'{url}: explicit HTTP {code}')
            elif code >= 500:
              state='FAIL_SERVER'; problems.append(f'{url}: HTTP {code} after retries')
            elif code == 0:
              host=(urlsplit(url).hostname or '').lower()
              if host in official_transport_allowlist:
                root=f'https://{host}/'
                root_code, _, root_err=probe(root,'GET')
                state='NETWORK_UNVERIFIED_OFFICIAL'
                transport_warnings.append(f'{url}: exact resource transport-unreachable after retries; official host probe HTTP {root_code}; stderr={err or root_err}')
              else:
                state='FAIL_TRANSPORT'; problems.append(f'{url}: transport failure after retries (curl rc={rc}; stderr={err})')
            else:
              state='FAIL_HTTP'; problems.append(f'{url}: HTTP {code}')
            print(code,state,url)
          if transport_warnings:
            print('Network-only verification warnings:'); print('\n'.join(transport_warnings))
          if problems:
            print('\n'.join(problems)); sys.exit(1)
          PY

      - name: Generate DOCX and PDF editions
        shell: bash
        run: |
          set -euo pipefail
          OUT='project/revision-2026/guide-41/publication-candidate'
          for STEM in GUIDE_41_ENGLISH_v2 GUIDE_41_SPANISH_es-419_v2 GUIDE_41_PORTUGUESE_pt-BR_v2; do
            pandoc "$OUT/$STEM.md" -f gfm -t docx --standalone -o "$OUT/$STEM.docx"
            mkdir -p "$OUT/lo-$STEM"
            libreoffice --headless --convert-to pdf --outdir "$OUT/lo-$STEM" "$OUT/$STEM.docx"
            mv "$OUT/lo-$STEM/$STEM.pdf" "$OUT/$STEM.pdf"
            rmdir "$OUT/lo-$STEM"
          done

      - name: Validate DOCX and searchable PDF integrity
        shell: bash
        run: |
          set -euo pipefail
          OUT='project/revision-2026/guide-41/publication-candidate'
          test "$(find "$OUT" -maxdepth 1 -name '*.docx' | wc -l)" -eq 3
          test "$(find "$OUT" -maxdepth 1 -name '*.pdf' | wc -l)" -eq 3
          for DOCX in "$OUT"/*.docx; do unzip -t "$DOCX" >/dev/null; unzip -l "$DOCX" | grep -q 'word/document.xml'; done
          for PDF in "$OUT"/*.pdf; do pdfinfo "$PDF" >/dev/null; TEXT="$(pdftotext "$PDF" - | tr -d '[:space:]')"; test ${#TEXT} -gt 5000; done

      - name: Render and inspect every PDF page
        shell: bash
        run: |
          set -euo pipefail
          OUT='project/revision-2026/guide-41/publication-candidate'
          rm -rf "$OUT/rendered"
          for PDF in "$OUT"/*.pdf; do STEM="$(basename "$PDF" .pdf)"; mkdir -p "$OUT/rendered/$STEM"; pdftoppm -png -r 110 "$PDF" "$OUT/rendered/$STEM/page" >/dev/null 2>&1; done
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageChops
          import json, sys
          root=Path('project/revision-2026/guide-41/publication-candidate/rendered'); problems=[]; pages=[]
          for path in sorted(root.rglob('*.png')):
            try:
              with Image.open(path) as im: im.verify()
              with Image.open(path) as im:
                gray=im.convert('L'); diff=ImageChops.difference(gray,Image.new('L',gray.size,255)); bbox=diff.point(lambda p:255 if p>12 else 0).getbbox()
                if bbox is None: problems.append(f'{path}: blank page'); continue
                left,top,right,bottom=bbox; w,h=gray.size; margins={'left':left,'top':top,'right':w-right,'bottom':h-bottom}
                if min(margins.values()) < 4: problems.append(f'{path}: possible clipping {margins}')
                pages.append({'file':str(path.relative_to(root)),'status':'PASS','edge_margins':margins})
            except Exception as exc: problems.append(f'{path}: malformed render: {exc}')
          (root/'RENDER_QA.json').write_text(json.dumps({'status':'FAIL' if problems else 'PASS','pages':pages,'problems':problems},indent=2)+'\n',encoding='utf-8')
          if problems: print('\n'.join(problems)); sys.exit(1)
          print(f'All-page render QA PASS: {len(pages)} pages')
          PY

      - name: Generate publication metadata and checksums
        shell: python
        run: |
          from pathlib import Path
          import hashlib, json, subprocess
          out=Path('project/revision-2026/guide-41/publication-candidate'); render=json.loads((out/'rendered/RENDER_QA.json').read_text())
          records=[]
          for lang,stem in [('en','GUIDE_41_ENGLISH_v2'),('es-419','GUIDE_41_SPANISH_es-419_v2'),('pt-BR','GUIDE_41_PORTUGUESE_pt-BR_v2')]:
            docx=out/f'{stem}.docx'; pdf=out/f'{stem}.pdf'; info=subprocess.check_output(['pdfinfo',str(pdf)],text=True); pages=next(int(x.split(':',1)[1]) for x in info.splitlines() if x.startswith('Pages:')); txt=subprocess.check_output(['pdftotext',str(pdf),'-'],text=True,errors='replace')
            if '\ufffd' in txt: raise SystemExit(f'{pdf}: Unicode replacement character')
            rendered=sum(1 for p in render['pages'] if p['file'].startswith(stem+'/'))
            if rendered != pages: raise SystemExit(f'{stem}: render/page mismatch')
            records.append({'language':lang,'docx':docx.name,'pdf':pdf.name,'docx_bytes':docx.stat().st_size,'pdf_bytes':pdf.stat().st_size,'pdf_pages':pages,'rendered_pages':rendered,'status':'PASS'})
          manifest={'guide':'41','occupation':'Carpenter and Cabinetmaking Technician','build_date':'2026-08-14','status':'PASS','editions':records,'assurance_boundary':'Internal automated publication QA; not independent human review, professional translation certification, accessibility certification, legal review, certification-body approval, accreditation, or employment or earnings guarantee.'}
          (out/'GUIDE_41_PUBLICATION_QA_MANIFEST.json').write_text(json.dumps(manifest,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          targets=sorted(p for p in out.iterdir() if p.is_file() and p.suffix in {'.docx','.pdf'})
          (out/'SHA256SUMS.txt').write_text('\n'.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}' for p in targets)+'\n',encoding='utf-8')

      - name: Upload rendered-page QA evidence
        uses: actions/upload-artifact@v4
        with:
          name: guide41-rendered-pages
          path: project/revision-2026/guide-41/publication-candidate/rendered
          retention-days: 14

      - name: Remove render images from commit scope
        run: rm -rf project/revision-2026/guide-41/publication-candidate/rendered

      - name: Commit controlled publication candidates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add project/revision-2026/guide-41/publication-candidate
          if git diff --cached --quiet; then echo 'No publication changes to commit.'; else git commit -m 'Build and validate Guide 41 publication candidates'; git pull --rebase origin revision/guide-00-100-2026; git push origin HEAD:revision/guide-00-100-2026; fi
