name: Guide 55 PR publication dispatcher

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/guide55-publication-dispatch.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Guide 55 controlled publication workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run guide55-publication-build.yml \
            --repo '${{ github.repository }}' \
            --ref revision/guide-00-100-2026
          echo 'Guide 55 controlled publication dispatched.'
