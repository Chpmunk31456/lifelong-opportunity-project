name: Guide 60 one-shot localization link parity fix

on:
  push:
    branches: [revision/guide-00-100-2026]
    paths:
      - '.github/workflows/guide60-link-parity-fix-once.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/guide60-link-parity-fix-once.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'revision/guide-00-100-2026'
    runs-on: ubuntu-latest
    steps:
      - name: Check out revision branch
        uses: actions/checkout@v5
        with:
          ref: revision/guide-00-100-2026
          fetch-depth: 0

      - name: Correct Guide 60 localization URL parity and record QA
        shell: python
        run: |
          from pathlib import Path
          import json

          root=Path('project/revision-2026/guide-60')
          files=[
            root/'working-masters/GUIDE_60_CASE_MANAGEMENT_ASSISTANT_AND_RESOURCE_NAVIGATOR_ES419_v2.md',
            root/'working-masters/GUIDE_60_CASE_MANAGEMENT_ASSISTANT_AND_RESOURCE_NAVIGATOR_PTBR_v2.md',
          ]
          replacements={
            'https://www.jobbank.gc.ca/marketreport/requirements/5096/ca':'https://www.jobbank.gc.ca/marketreport/requirements/5112/ca',
            'https://www.jobbank.gc.ca/wagereport/occupation/5113':'https://www.jobbank.gc.ca/wagereport/occupation/5121',
            'https://betowa.sena.edu.co/oferta/desarrollo-de-habilidades-para-el-bienestar-familiar-y-comunitario?location=57011001&programId=144936':'https://betowa.sena.edu.co/oferta/desarrollo-de-habilidades-para-el-bienestar-familiar-y-comunitario?location=57011001&modality=V&offertype=open&programId=144936',
          }
          for p in files:
            text=p.read_text(encoding='utf-8')
            for old,new in replacements.items():
              if old not in text:
                raise SystemExit(f'{p.name}: expected URL not found: {old}')
              text=text.replace(old,new,1)
            p.write_text(text,encoding='utf-8')

          qa=root/'qa/GUIDE_60_LOCALIZATION_LINK_PARITY_CORRECTIVE_QA_08B.md'
          qa.write_text('''# Guide 60 — Localization Link Parity Corrective QA 08B

**Stage:** Corrective localization / Technical QA — **PASS**

The controlled Spanish (`es-419`) and Brazilian Portuguese (`pt-BR`) masters were corrected to restore exact URL parity with the frozen English source. No occupational facts, controlled wage values, scope boundaries, safety language, jurisdiction mappings, or substantive localization content were changed.

Corrected parity items:

- Canada Job Bank NOC 42201 requirements URL restored to `/marketreport/requirements/5112/ca`;
- Canada Job Bank NOC 42201 wages URL restored to `/wagereport/occupation/5121`;
- SENA Betowa URL restored with the frozen English query parameters `modality=V&offertype=open` and `programId=144936`.

This corrective QA supersedes the earlier URL-parity assumption while preserving the existing Spanish, Portuguese, and trilingual Technical QA PASS decisions. Publication must revalidate the complete trilingual URL set before closure.
''',encoding='utf-8')

          hp=root/'GUIDE_60_HELPER_STATUS.json'
          status=json.loads(hp.read_text(encoding='utf-8'))
          evidence='project/revision-2026/guide-60/qa/GUIDE_60_LOCALIZATION_LINK_PARITY_CORRECTIVE_QA_08B.md'
          for stage in ['spanish_localization','portuguese_localization','technical_qa']:
            assert status['stages'][stage]['status']=='PASS'
            if evidence not in status['stages'][stage]['evidence']:
              status['stages'][stage]['evidence'].append(evidence)
          assert status['stages']['publication']['status']=='PENDING'
          assert status['stages']['release_audit']['status']=='PENDING'
          assert not status.get('blockers')
          hp.write_text(json.dumps(status,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')

      - name: Commit corrective Guide 60 parity fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            project/revision-2026/guide-60/working-masters/GUIDE_60_CASE_MANAGEMENT_ASSISTANT_AND_RESOURCE_NAVIGATOR_ES419_v2.md \
            project/revision-2026/guide-60/working-masters/GUIDE_60_CASE_MANAGEMENT_ASSISTANT_AND_RESOURCE_NAVIGATOR_PTBR_v2.md \
            project/revision-2026/guide-60/qa/GUIDE_60_LOCALIZATION_LINK_PARITY_CORRECTIVE_QA_08B.md \
            project/revision-2026/guide-60/GUIDE_60_HELPER_STATUS.json
          git diff --cached --check
          git commit -m 'Guide 60: correct localization URL parity'
          git pull --rebase origin revision/guide-00-100-2026
          git push origin HEAD:revision/guide-00-100-2026

      - name: Remove one-shot corrective workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(gh api 'repos/${{ github.repository }}/contents/.github/workflows/guide60-link-parity-fix-once.yml?ref=revision%2Fguide-00-100-2026' --jq '.sha')"
          gh api --method DELETE \
            -H 'Accept: application/vnd.github+json' \
            'repos/${{ github.repository }}/contents/.github/workflows/guide60-link-parity-fix-once.yml' \
            -f message='Guide 60: retire one-shot link parity fix' \
            -f sha="$SHA" \
            -f branch='revision/guide-00-100-2026'
