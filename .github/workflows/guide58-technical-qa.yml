# Controlled trigger refresh: 2026-08-20
name: Guide 58 trilingual technical QA

on:
  push:
    branches: [revision/guide-00-100-2026]
    paths:
      - '.github/workflows/guide58-technical-qa.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: guide58-trilingual-technical-qa
  cancel-in-progress: false

jobs:
  technical-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Check out controlled revision branch
        uses: actions/checkout@v5
        with:
          ref: revision/guide-00-100-2026
          fetch-depth: 0

      - name: Run fail-closed trilingual controls
        shell: python
        run: |
          from pathlib import Path
          import json,re,sys,unicodedata

          root=Path('project/revision-2026/guide-58')
          masters=root/'working-masters'
          paths={
            'en': masters/'GUIDE_58_VETERINARY_ASSISTANT_AND_ANIMAL_CARETAKER_ENGLISH_v2.md',
            'es-419': masters/'GUIDE_58_VETERINARY_ASSISTANT_AND_ANIMAL_CARETAKER_ES419_v2.md',
            'pt-BR': masters/'GUIDE_58_VETERINARY_ASSISTANT_AND_ANIMAL_CARETAKER_PTBR_v2.md',
          }
          texts={k:p.read_text(encoding='utf-8') for k,p in paths.items()}
          problems=[]

          def fold(s):
            s=re.sub(r'[*_`~]+','',s.lower())
            return ''.join(c for c in unicodedata.normalize('NFKD',s) if not unicodedata.combining(c))

          status=json.loads((root/'GUIDE_58_HELPER_STATUS.json').read_text(encoding='utf-8'))
          assert status['stages']['portuguese_localization']['status']=='PASS'
          assert status['stages']['technical_qa']['status']=='PENDING'
          assert status['stages']['publication']['status']=='PENDING'
          assert status['stages']['release_audit']['status']=='PENDING'
          assert not status.get('blockers')

          sections={}; urls={}
          for lang,text in texts.items():
            low=fold(text)
            if text.startswith('\ufeff') or '\ufffd' in text:
              problems.append(f'{lang}: UTF-8 defect')
            for bad in ('todo:','lorem ipsum','[insert','translation pending','traduccion pendiente','traducao pendente'):
              if bad in low: problems.append(f'{lang}: placeholder {bad}')
            sections[lang]=len(re.findall(r'^##\s+.+$',text,re.M))
            urls[lang]=set(re.findall(r'https://[^\s)<>`]+',text))
            if sections[lang] < 20: problems.append(f'{lang}: insufficient section structure ({sections[lang]})')
            if len(text) < 16000: problems.append(f'{lang}: unexpectedly short controlled master ({len(text)} chars)')

          if len(set(sections.values())) != 1:
            problems.append(f'trilingual section-count mismatch: {sections}')
          if not (urls['en']==urls['es-419']==urls['pt-BR']):
            for lang in ('es-419','pt-BR'):
              if urls[lang] != urls['en']:
                problems.append(f'{lang}: URL parity mismatch; missing={sorted(urls["en"]-urls[lang])}; extra={sorted(urls[lang]-urls["en"])}')
          if len(urls['en']) != 18:
            problems.append(f'expected 18 frozen source URLs, found {len(urls["en"])}')

          numeric_patterns=[
            r'31-9096\.00',r'65220',r'144[-\s]*(?:hour|hora)',
            r'4[,.]?200',r'525',r'37[,.]320',r'17[,.]94',r'117[,.]800',
            r'9\s*%',r'128[,.]100',r'22[,.]200',r'35[,.]125',r'28[,.]302',r'42[,.]369',
            r'15[,.]00',r'18[,.]00',r'25[,.]50',r'576\s+de\s+2000'
          ]
          for lang,text in texts.items():
            for pat in numeric_patterns:
              if not re.search(pat,text,re.I|re.S): problems.append(f'{lang}: missing controlled value {pat}')

          markers={
            'en':['veterinary assistant','animal caretaker','zoonoses','infection prevention','under the supervision','ai must not','privacy','do not independently','career exploration'],
            'es-419':['asistente veterinario','cuidador de animales','zoonosis','prevencion de infecciones','bajo supervision','ia no debe','privacidad','no realice','exploracion'],
            'pt-BR':['assistente veterinario','cuidador de animais','zoonoses','prevencao de infeccoes','sob supervisao','ia nao deve','privacidade','nao execute','exploracao'],
          }
          for lang,text in texts.items():
            low=fold(text)
            for marker in markers[lang]:
              if fold(marker) not in low: problems.append(f'{lang}: missing safety/terminology marker {marker}')

          assurances={
            'en':'does not claim independent human certification',
            'es-419':'no afirma certificacion humana independiente',
            'pt-BR':'nao afirma certificacao humana independente',
          }
          for lang,text in texts.items():
            if fold(assurances[lang]) not in fold(text): problems.append(f'{lang}: assurance boundary missing')

          if problems:
            print('\n'.join(problems)); sys.exit(1)
          print(f'Guide 58 trilingual Technical QA controls PASS: sections={sections}; frozen_urls={len(urls["en"])}')

      - name: Record Technical QA PASS and advance manifest
        shell: python
        run: |
          from pathlib import Path
          import json
          root=Path('project/revision-2026/guide-58'); qa=root/'qa'
          evidence=qa/'GUIDE_58_TRILINGUAL_TECHNICAL_QA_08.md'
          evidence.write_text('''# Guide 58 — Trilingual Technical QA 08

**Guide:** 58 — Veterinary Assistant and Animal Caretaker  
**Stage:** Trilingual Technical QA — **PASS**  
**Date:** August 20, 2026

Fail-closed controls verified the frozen English, neutral Latin American Spanish (`es-419`), and Brazilian Portuguese (`pt-BR`) masters for UTF-8 integrity, placeholder absence, aligned section structure, exact parity of the 18 frozen source URLs, controlled occupation/classification and wage values, SENA 144-hour training, Canada student-aid values, veterinary-assistant support-scope boundaries, supervision, zoonosis/infection-prevention controls, Ley 576 de 2000, privacy/cybersecurity, AI non-diagnosis and non-treatment boundaries, and the assurance boundary against independent human certification or accreditation claims.

**Decision:** Technical QA **PASS**. Publication and Release Audit remain fail-closed until the controlled DOCX/PDF build, searchable-text validation, all-page rendering inspection, metadata, and SHA-256 checksum controls pass.
''',encoding='utf-8')
          sp=root/'GUIDE_58_HELPER_STATUS.json'
          d=json.loads(sp.read_text(encoding='utf-8'))
          assert d['stages']['portuguese_localization']['status']=='PASS'
          assert d['stages']['technical_qa']['status']=='PENDING'
          assert d['stages']['publication']['status']=='PENDING'
          assert d['stages']['release_audit']['status']=='PENDING'
          assert not d.get('blockers')
          d['stages']['technical_qa']={'status':'PASS','evidence':['project/revision-2026/guide-58/qa/GUIDE_58_TRILINGUAL_TECHNICAL_QA_08.md']}
          sp.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')

      - name: Commit auditable Technical QA closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- project/revision-2026/guide-58/GUIDE_58_HELPER_STATUS.json project/revision-2026/guide-58/qa/GUIDE_58_TRILINGUAL_TECHNICAL_QA_08.md
          git diff --cached --check
          git commit -m 'Guide 58: pass trilingual Technical QA'
          git pull --rebase origin revision/guide-00-100-2026
          git push origin HEAD:revision/guide-00-100-2026
