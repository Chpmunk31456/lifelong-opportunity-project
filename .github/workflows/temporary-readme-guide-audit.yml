name: Temporary README and guide audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  audit:
    if: github.head_ref == 'audit-lifelong-opportunity-project'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Audit repository
        shell: python
        run: |
          from pathlib import Path
          from urllib.parse import unquote
          import re

          root = Path('.')
          readmes = sorted(p for p in root.rglob('README.md') if '.git' not in p.parts)
          all_files = sorted(p for p in root.rglob('*') if p.is_file() and '.git' not in p.parts and '.github/workflows/temporary-readme-guide-audit.yml' != p.as_posix())

          link_re = re.compile(r'(?<!!)\[[^\]]*\]\(([^)]+)\)')
          malformed = []
          broken = []
          local_checked = 0
          external = 0
          anchors = 0
          emails = 0

          for readme in readmes:
              text = readme.read_text(encoding='utf-8', errors='replace')
              if re.search(r'\]\s+\(', text):
                  malformed.append(readme.as_posix())
              for target in link_re.findall(text):
                  target = target.strip()
                  if not target:
                      continue
                  if target.startswith(('http://','https://')):
                      external += 1
                      continue
                  if target.startswith('mailto:'):
                      emails += 1
                      continue
                  if target.startswith('#'):
                      anchors += 1
                      continue
                  clean = unquote(target.split('#',1)[0].split('?',1)[0]).strip()
                  if not clean:
                      anchors += 1
                      continue
                  local_checked += 1
                  resolved = (readme.parent / clean).resolve()
                  try:
                      resolved.relative_to(root.resolve())
                  except ValueError:
                      broken.append((readme.as_posix(), target, 'outside repository'))
                      continue
                  if not resolved.exists():
                      broken.append((readme.as_posix(), target, 'missing'))

          def count_lang(parts, locale):
              return locale in parts

          locales = {'English/en':'en', 'Spanish/es-419':'es-419', 'Portuguese/pt-BR':'pt-BR'}
          inventory = {}
          for label, locale in locales.items():
              files = [p for p in all_files if locale in p.parts]
              inventory[label] = {
                  'total': len(files),
                  'md': sum(p.suffix.lower()=='.md' for p in files),
                  'pdf': sum(p.suffix.lower()=='.pdf' for p in files),
                  'docx': sum(p.suffix.lower()=='.docx' for p in files),
              }

          result = 'PASS' if not broken and not malformed else 'FAIL'
          lines = [
              '# README and Associated-Guide Audit','',
              f'**Overall result:** {result}','',
              '## Summary','',
              f'- README files audited: {len(readmes)}',
              f'- Repository-local links checked: {local_checked}',
              f'- Broken repository-local targets: {len(broken)}',
              f'- README files with malformed `] (` links: {len(malformed)}',
              f'- External links identified but not network-tested: {external}',
              f'- Internal anchors identified: {anchors}',
              f'- Email links identified: {emails}',
              f'- Repository files inventoried: {len(all_files)}','',
              '## Language Inventory',''
          ]
          for label, stats in inventory.items():
              lines.append(f"- {label}: {stats['total']} files (Markdown {stats['md']}, PDF {stats['pdf']}, DOCX {stats['docx']})")
          lines += ['', '## README Files Audited','']
          lines += [f'- `{p.as_posix()}`' for p in readmes]
          lines += ['', '## Broken Repository-Local Targets','']
          if broken:
              lines += [f'- `{src}` → `{target}` ({reason})' for src,target,reason in broken]
          else:
              lines.append('No broken repository-local targets were found.')
          lines += ['', '## Malformed Markdown Links','']
          if malformed:
              lines += [f'- `{p}`' for p in malformed]
          else:
              lines.append('No malformed `] (` link patterns were found.')
          lines += ['', '## Limits','',
                    '- External websites were not tested.',
                    '- This mechanical audit does not certify substantive accuracy, translation quality, accessibility conformance, or document rendering.',
                    '- Missing PDF or DOCX editions are not treated as defects unless a README promises them.']

          Path('project').mkdir(exist_ok=True)
          Path('project/README_ASSOCIATED_GUIDE_AUDIT.md').write_text('\n'.join(lines)+'\n', encoding='utf-8')

      - name: Replace temporary workflow with report
        run: |
          rm .github/workflows/temporary-readme-guide-audit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add README and associated-guide audit report"
          git push origin HEAD:${{ github.head_ref }}
