name: Guide 41 corrective repair

on:
  push:
    branches: [revision/guide-00-100-2026]
    paths:
      - '.github/workflows/guide41-corrective-repair.yml'
      - 'scripts/guide41_corrective_repair.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: guide41-corrective-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out revision branch
        uses: actions/checkout@v5
        with:
          ref: revision/guide-00-100-2026
          fetch-depth: 0

      - name: Apply bounded Guide 41 corrective repair
        run: python scripts/guide41_corrective_repair.py

      - name: Validate repair scope and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code -- project/revision-2026/guide-41/working-masters/GUIDE_41_CARPENTER_AND_CABINETMAKING_TECHNICIAN_ENGLISH_v2.md
          CHANGED="$(git diff --name-only)"
          printf '%s\n' "$CHANGED"
          for f in $CHANGED; do
            case "$f" in
              project/revision-2026/guide-41/working-masters/GUIDE_41_CARPENTER_AND_CABINETMAKING_TECHNICIAN_ES419_v2.md|\
              project/revision-2026/guide-41/working-masters/GUIDE_41_CARPENTER_AND_CABINETMAKING_TECHNICIAN_PTBR_v2.md|\
              .github/workflows/guide41-publication-build.yml) ;;
              *) echo "Unexpected repair-scope file: $f"; exit 1 ;;
            esac
          done
          test -n "$CHANGED"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add project/revision-2026/guide-41/working-masters/GUIDE_41_CARPENTER_AND_CABINETMAKING_TECHNICIAN_ES419_v2.md \
                  project/revision-2026/guide-41/working-masters/GUIDE_41_CARPENTER_AND_CABINETMAKING_TECHNICIAN_PTBR_v2.md \
                  .github/workflows/guide41-publication-build.yml
          git commit -m 'qa(guide-41): repair localization parity and validators'
          git pull --rebase origin revision/guide-00-100-2026
          git push origin HEAD:revision/guide-00-100-2026
