name: Guide 58 Technical QA diagnostic

on:
  push:
    branches: [revision/guide-00-100-2026]
    paths:
      - '.github/workflows/guide58-technical-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: revision/guide-00-100-2026
          fetch-depth: 0
      - name: Run diagnostic and always record findings
        shell: python
        run: |
          from pathlib import Path
          import json,re,unicodedata
          root=Path('project/revision-2026/guide-58'); masters=root/'working-masters'
          paths={'en':masters/'GUIDE_58_VETERINARY_ASSISTANT_AND_ANIMAL_CARETAKER_ENGLISH_v2.md','es-419':masters/'GUIDE_58_VETERINARY_ASSISTANT_AND_ANIMAL_CARETAKER_ES419_v2.md','pt-BR':masters/'GUIDE_58_VETERINARY_ASSISTANT_AND_ANIMAL_CARETAKER_PTBR_v2.md'}
          texts={k:p.read_text(encoding='utf-8') for k,p in paths.items()}; problems=[]
          def fold(s):
            s=re.sub(r'[*_`~]+','',s.lower())
            return ''.join(c for c in unicodedata.normalize('NFKD',s) if not unicodedata.combining(c))
          sections={}; urls={}
          for lang,text in texts.items():
            low=fold(text); sections[lang]=len(re.findall(r'^##\s+.+$',text,re.M)); urls[lang]=set(re.findall(r'https://[^\s)<>`]+',text))
            if text.startswith('\ufeff') or '\ufffd' in text: problems.append(f'{lang}: UTF-8 defect')
            for bad in ('todo:','lorem ipsum','[insert','translation pending','traduccion pendiente','traducao pendente'):
              if bad in low: problems.append(f'{lang}: placeholder {bad}')
            if sections[lang] < 20: problems.append(f'{lang}: insufficient sections {sections[lang]}')
            if len(text) < 16000: problems.append(f'{lang}: short master {len(text)} chars')
          if len(set(sections.values()))!=1: problems.append(f'section mismatch {sections}')
          for lang in ('es-419','pt-BR'):
            if urls[lang]!=urls['en']: problems.append(f'{lang}: URL mismatch missing={sorted(urls["en"]-urls[lang])} extra={sorted(urls[lang]-urls["en"])}')
          if len(urls['en'])!=18: problems.append(f'expected 18 URLs found {len(urls["en"])}')
          pats=[r'31-9096\.00',r'65220',r'144[-\s]*(?:hour|hora)',r'4[,.]?200',r'525',r'37[,.]320',r'17[,.]94',r'117[,.]800',r'9\s*%',r'128[,.]100',r'22[,.]200',r'35[,.]125',r'28[,.]302',r'42[,.]369',r'15[,.]00',r'18[,.]00',r'25[,.]50',r'576\s+de\s+2000']
          for lang,text in texts.items():
            for pat in pats:
              if not re.search(pat,text,re.I|re.S): problems.append(f'{lang}: missing {pat}')
          markers={'en':['veterinary assistant','animal caretaker','zoonoses','infection prevention','under the supervision','ai must not','privacy','do not independently','career exploration'],'es-419':['asistente veterinario','cuidador de animales','zoonosis','prevencion de infecciones','bajo supervision','ia no debe','privacidad','no realice','exploracion'],'pt-BR':['assistente veterinario','cuidador de animais','zoonoses','prevencao de infeccoes','sob supervisao','ia nao deve','privacidade','nao execute','exploracao']}
          for lang,text in texts.items():
            low=fold(text)
            for m in markers[lang]:
              if fold(m) not in low: problems.append(f'{lang}: missing marker {m}')
          assurances={'en':'does not claim independent human certification','es-419':'no afirma certificacion humana independiente','pt-BR':'nao afirma certificacao humana independente'}
          for lang,text in texts.items():
            if fold(assurances[lang]) not in fold(text): problems.append(f'{lang}: assurance missing')
          out={'guide':58,'status':'PASS' if not problems else 'FAIL','sections':sections,'url_counts':{k:len(v) for k,v in urls.items()},'problems':problems}
          (root/'qa/GUIDE_58_TECHNICAL_QA_DIAGNOSTIC.json').write_text(json.dumps(out,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
      - name: Commit diagnostic evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add project/revision-2026/guide-58/qa/GUIDE_58_TECHNICAL_QA_DIAGNOSTIC.json
          git commit -m 'Guide 58: record Technical QA diagnostic'
          git pull --rebase origin revision/guide-00-100-2026
          git push origin HEAD:revision/guide-00-100-2026
