name: Guide 19 controlled publication build

on:
  push:
    branches:
      - revision/guide-00-100-2026
    paths:
      - 'project/revision-2026/guide-19/source/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out revision branch
        uses: actions/checkout@v5
        with:
          ref: revision/guide-00-100-2026
          fetch-depth: 0

      - name: Install document tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc libreoffice poppler-utils

      - name: Prepare controlled sources
        shell: bash
        run: |
          set -euo pipefail
          OUT='project/revision-2026/guide-19/publication-candidate'
          rm -rf "$OUT"
          mkdir -p "$OUT" "$OUT/rendered"
          cp 'project/revision-2026/guide-19/source/GUIDE_19_ENGLISH_WORKING_MASTER_v2.md' "$OUT/GUIDE_19_ENGLISH_v2.md"
          cp 'project/revision-2026/guide-19/source/GUIDE_19_SPANISH_LATAM_WORKING_MASTER_v2.md' "$OUT/GUIDE_19_SPANISH_LATAM_v2.md"
          cp 'project/revision-2026/guide-19/source/GUIDE_19_PORTUGUESE_BR_WORKING_MASTER_v2.md' "$OUT/GUIDE_19_PORTUGUESE_BR_v2.md"

      - name: Structural and source controls
        shell: python
        run: |
          from pathlib import Path
          import re, sys
          out=Path('project/revision-2026/guide-19/publication-candidate')
          files={
            'en': out/'GUIDE_19_ENGLISH_v2.md',
            'es-419': out/'GUIDE_19_SPANISH_LATAM_v2.md',
            'pt-BR': out/'GUIDE_19_PORTUGUESE_BR_v2.md',
          }
          required_numbers=list(range(1,20))
          required_urls=[
            'https://www.onetonline.org/link/details/23-2011.00',
            'https://www.bls.gov/ooh/legal/paralegals-and-legal-assistants.htm',
            'https://www.americanbar.org/groups/paralegals/profession-information/educational-information-for-paralegals/',
            'https://www.jobbank.gc.ca/marketreport/requirements/16074/ca',
            'https://ocupacol.mintrabajo.gov.co/Profile/OccupationalProfile/34113',
            'https://www.mineducacion.gov.co/m/1757/w3-article-156293.html',
            'https://www.americanbar.org/news/abanews/aba-news-archives/2024/07/aba-issues-first-ethics-guidance-ai-tools/',
          ]
          numeric_patterns={
            '61,010': r'(?<!\d)(?:61,010|61\.010)(?!\d)',
            '29.33': r'(?<!\d)(?:29\.33|29,33)(?!\d)',
            '376,200': r'(?<!\d)(?:376,200|376\.200)(?!\d)',
            '376,800': r'(?<!\d)(?:376,800|376\.800)(?!\d)',
            '0%': r'(?<!\d)0\s*%',
            '+600': r'\+600(?!\d)',
            '39,300': r'(?<!\d)(?:39,300|39\.300)(?!\d)',
            '21.63': r'(?<!\d)(?:21\.63|21,63)(?!\d)',
            '33.05': r'(?<!\d)(?:33\.05|33,05)(?!\d)',
            '52.19': r'(?<!\d)(?:52\.19|52,19)(?!\d)',
            '2,208': r'(?<!\d)(?:2,208|2\.208)(?!\d)',
            '5,250': r'(?<!\d)(?:5,250|5\.250)(?!\d)',
            '66,879': r'(?<!\d)(?:66,879|66\.879)(?!\d)',
            '59,731': r'(?<!\d)(?:59,731|59\.731)(?!\d)',
            '28.72': r'(?<!\d)(?:28\.72|28,72)(?!\d)',
          }
          marker_patterns={
            'ABA': r'\bABA\b',
            'California/Califórnia': r'\b(?:California|Califórnia)\b',
            'Arizona': r'\bArizona\b',
            'Minnesota': r'\bMinnesota\b',
            'Oregon': r'\bOregon\b',
            'Utah': r'\bUtah\b',
            'NOC 42200': r'\bNOC\s+42200\b',
            'CUOC 34113': r'\bCUOC\s+34113\b',
            'SNIES': r'\bSNIES\b',
            'CC BY-NC-SA 4.0': r'CC BY-NC-SA 4\.0',
          }
          problems=[]
          for lang,path in files.items():
            text=path.read_text(encoding='utf-8')
            nums=[int(m.group(1)) for m in re.finditer(r'^##\s+(\d+)\.', text, re.M)]
            if nums != required_numbers:
              problems.append(f'{lang}: section sequence {nums}')
            for url in required_urls:
              if url not in text:
                problems.append(f'{lang}: missing URL {url}')
            for label,pattern in numeric_patterns.items():
              if not re.search(pattern, text):
                problems.append(f'{lang}: missing controlled numeric value {label}')
            for label,pattern in marker_patterns.items():
              if not re.search(pattern, text):
                problems.append(f'{lang}: missing controlled marker {label}')
            if '\ufffd' in text:
              problems.append(f'{lang}: Unicode replacement character present')
            lowered=text.lower()
            for bad in ('todo:', 'lorem ipsum', '[insert', 'translation pending'):
              if bad in lowered:
                problems.append(f'{lang}: placeholder marker {bad}')
          if problems:
            print('\n'.join(problems))
            sys.exit(1)
          print('Guide 19 trilingual structural/source controls PASS')

      - name: Generate DOCX and PDF editions
        shell: bash
        run: |
          set -euo pipefail
          OUT='project/revision-2026/guide-19/publication-candidate'
          for STEM in GUIDE_19_ENGLISH_v2 GUIDE_19_SPANISH_LATAM_v2 GUIDE_19_PORTUGUESE_BR_v2; do
            pandoc "$OUT/$STEM.md" -f gfm -t docx --standalone -o "$OUT/$STEM.docx"
            mkdir -p "$OUT/lo-$STEM"
            libreoffice --headless --convert-to pdf --outdir "$OUT/lo-$STEM" "$OUT/$STEM.docx"
            mv "$OUT/lo-$STEM/$STEM.pdf" "$OUT/$STEM.pdf"
            rmdir "$OUT/lo-$STEM"
          done

      - name: Validate DOCX and searchable PDFs
        shell: bash
        run: |
          set -euo pipefail
          OUT='project/revision-2026/guide-19/publication-candidate'
          for DOCX in "$OUT"/*.docx; do
            unzip -t "$DOCX" >/dev/null
            unzip -l "$DOCX" | grep -q 'word/document.xml'
          done
          for PDF in "$OUT"/*.pdf; do
            pdfinfo "$PDF" >/dev/null
            TEXT="$(pdftotext "$PDF" - | tr -d '[:space:]')"
            test ${#TEXT} -gt 5000
          done

      - name: Render all PDF pages
        shell: bash
        run: |
          set -euo pipefail
          OUT='project/revision-2026/guide-19/publication-candidate'
          for PDF in "$OUT"/*.pdf; do
            STEM="$(basename "$PDF" .pdf)"
            mkdir -p "$OUT/rendered/$STEM"
            pdftoppm -png -r 90 "$PDF" "$OUT/rendered/$STEM/page" >/dev/null 2>&1
          done

      - name: Generate manifest and checksums
        shell: python
        run: |
          from pathlib import Path
          import hashlib, json, subprocess
          out=Path('project/revision-2026/guide-19/publication-candidate')
          records=[]
          for lang,stem in [
            ('en','GUIDE_19_ENGLISH_v2'),
            ('es-419','GUIDE_19_SPANISH_LATAM_v2'),
            ('pt-BR','GUIDE_19_PORTUGUESE_BR_v2'),
          ]:
            docx=out/f'{stem}.docx'; pdf=out/f'{stem}.pdf'
            info=subprocess.check_output(['pdfinfo',str(pdf)], text=True)
            pages=None
            for line in info.splitlines():
              if line.startswith('Pages:'):
                pages=int(line.split(':',1)[1].strip())
            txt=subprocess.check_output(['pdftotext',str(pdf),'-'], text=True, errors='replace')
            records.append({
              'language':lang,
              'docx':docx.name,
              'pdf':pdf.name,
              'docx_bytes':docx.stat().st_size,
              'pdf_bytes':pdf.stat().st_size,
              'pdf_pages':pages,
              'pdf_extractable_characters':len(txt.strip()),
              'status':'PASS'
            })
          manifest={
            'guide':'19',
            'occupation':'Paralegal and Legal Assistant',
            'build_date':'2026-08-09',
            'status':'PASS',
            'controls':['19-section trilingual structure','locale-aware controlled numerical values','locale-aware jurisdiction markers','required source URLs','DOCX ZIP integrity','PDF readability','searchable PDF text','SHA-256 checksums','all-page raster rendering'],
            'editions':records,
            'assurance_boundary':'Internal automated publication QA; not independent human review, professional translation certification, accessibility certification, legal review, regulator approval, accreditation, or employment guarantee.'
          }
          (out/'GUIDE_19_PUBLICATION_QA_MANIFEST.json').write_text(json.dumps(manifest,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          targets=sorted([p for p in out.iterdir() if p.is_file() and p.suffix in {'.docx','.pdf'}])
          (out/'SHA256SUMS.txt').write_text('\n'.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}' for p in targets)+'\n',encoding='utf-8')

      - name: Upload rendered pages
        uses: actions/upload-artifact@v4
        with:
          name: guide19-rendered-pages
          path: project/revision-2026/guide-19/publication-candidate/rendered
          retention-days: 14

      - name: Remove render images from commit scope
        run: rm -rf project/revision-2026/guide-19/publication-candidate/rendered

      - name: Commit controlled publication candidates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add project/revision-2026/guide-19/publication-candidate
          if git diff --cached --quiet; then
            echo 'No publication changes to commit.'
          else
            git commit -m 'Build and validate Guide 19 publication candidates'
            git pull --rebase origin revision/guide-00-100-2026
            git push origin HEAD:revision/guide-00-100-2026
          fi
