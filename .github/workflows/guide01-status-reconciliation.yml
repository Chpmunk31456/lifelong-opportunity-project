name: Guide 01 trilingual status reconciliation

on:
  workflow_dispatch:
  push:
    branches:
      - revision/guide-00-100-2026
    paths:
      - .github/workflows/guide01-status-reconciliation.yml
      - scripts/guide01_reconcile_working_master_status.py

permissions:
  contents: write

concurrency:
  group: guide01-status-reconciliation
  cancel-in-progress: false

jobs:
  reconcile-and-verify:
    if: github.repository == 'Chpmunk31456/lifelong-opportunity-project'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out controlled revision branch
        uses: actions/checkout@v4
        with:
          ref: revision/guide-00-100-2026
          fetch-depth: 0

      - name: Reconcile working-master status blocks
        run: python scripts/guide01_reconcile_working_master_status.py

      - name: Verify status, draft controls, and encoding
        shell: python
        run: |
          from pathlib import Path

          checks = {
              Path('project/revision-2026/guide-01/working-masters/GUIDE_01_COMMUNITY_HEALTH_WORKER_ENGLISH_WORKING_MASTER.md'): [
                  '**Review date:** August 5, 2026',
                  'Final editorial and translation freeze, final live-link validation, DOCX/PDF generation, metadata, checksums, and publication QA remain pending.',
              ],
              Path('project/revision-2026/guide-01/working-masters/GUIDE_01_TRABAJADOR_COMUNITARIO_DE_SALUD_ES419_WORKING_MASTER.md'): [
                  '**Fecha de revisión:** 5 de agosto de 2026',
                  'Aún están pendientes la congelación editorial y de traducción, la validación final de enlaces en vivo, la generación de DOCX/PDF, los metadatos, las sumas de comprobación y el control de calidad de publicación.',
              ],
              Path('project/revision-2026/guide-01/working-masters/GUIDE_01_AGENTE_COMUNITARIO_DE_SAUDE_PTBR_WORKING_MASTER.md'): [
                  '**Data de revisão:** 5 de agosto de 2026',
                  'Ainda estão pendentes o congelamento editorial e da tradução, a validação final de links ativos, a geração de DOCX/PDF, os metadados, as somas de verificação e o controle de qualidade de publicação.',
              ],
          }

          prohibited = [
              'independently certified',
              'certificación independiente completada',
              'certificação independente concluída',
          ]

          for path, required in checks.items():
              raw = path.read_bytes()
              if raw.startswith(b'\xef\xbb\xbf'):
                  raise SystemExit(f'Unexpected UTF-8 BOM: {path}')
              text = raw.decode('utf-8')
              if '\ufffd' in text:
                  raise SystemExit(f'Replacement-character encoding defect: {path}')
              for phrase in required:
                  if text.count(phrase) != 1:
                      raise SystemExit(f'Required status phrase missing or duplicated in {path}: {phrase}')
              lower = text.lower()
              for phrase in prohibited:
                  if phrase.lower() in lower:
                      raise SystemExit(f'Unsupported certification claim in {path}: {phrase}')
              print(f'Verified {path}')

      - name: Commit reconciled working masters when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            project/revision-2026/guide-01/working-masters/GUIDE_01_COMMUNITY_HEALTH_WORKER_ENGLISH_WORKING_MASTER.md \
            project/revision-2026/guide-01/working-masters/GUIDE_01_TRABAJADOR_COMUNITARIO_DE_SALUD_ES419_WORKING_MASTER.md \
            project/revision-2026/guide-01/working-masters/GUIDE_01_AGENTE_COMUNITARIO_DE_SAUDE_PTBR_WORKING_MASTER.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Guide 01 working-master status blocks are already reconciled.'
            exit 0
          fi
          git commit -m "docs(guide-01): reconcile trilingual working-master status"
          git push origin HEAD:revision/guide-00-100-2026
