name: Guide 01 terminology normalization

on:
  workflow_dispatch:
  push:
    branches:
      - revision/guide-00-100-2026
    paths:
      - .github/workflows/guide01-terminology-normalization.yml
      - scripts/guide01_normalize_apprenticeship_terms.py

permissions:
  contents: write

concurrency:
  group: guide01-terminology-normalization
  cancel-in-progress: false

jobs:
  normalize-and-verify:
    if: github.repository == 'Chpmunk31456/lifelong-opportunity-project'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out controlled revision branch
        uses: actions/checkout@v4
        with:
          ref: revision/guide-00-100-2026
          fetch-depth: 0

      - name: Apply fail-closed terminology normalization
        run: python scripts/guide01_normalize_apprenticeship_terms.py

      - name: Verify controlled terms and encoding
        shell: python
        run: |
          from pathlib import Path

          checks = {
              Path('project/revision-2026/guide-01/working-masters/GUIDE_01_TRABAJADOR_COMUNITARIO_DE_SALUD_ES419_WORKING_MASTER.md'):
                  '**aprendizaje formal remunerado:** trabajo remunerado estructurado y formación relacionada cuando existe un programa formalmente establecido;',
              Path('project/revision-2026/guide-01/working-masters/GUIDE_01_AGENTE_COMUNITARIO_DE_SAUDE_PTBR_WORKING_MASTER.md'):
                  '**aprendizagem profissional formal remunerada:** trabalho remunerado estruturado e instrução relacionada quando há programa formalmente estabelecido;',
          }

          for path, required in checks.items():
              raw = path.read_bytes()
              if raw.startswith(b'\xef\xbb\xbf'):
                  raise SystemExit(f'Unexpected UTF-8 BOM: {path}')
              text = raw.decode('utf-8')
              if text.count(required) != 1:
                  raise SystemExit(f'Controlled first definition missing or duplicated: {path}')
              if '\ufffd' in text:
                  raise SystemExit(f'Replacement-character encoding defect: {path}')
              print(f'Verified {path}')

      - name: Commit normalized working masters when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            project/revision-2026/guide-01/working-masters/GUIDE_01_TRABAJADOR_COMUNITARIO_DE_SALUD_ES419_WORKING_MASTER.md \
            project/revision-2026/guide-01/working-masters/GUIDE_01_AGENTE_COMUNITARIO_DE_SAUDE_PTBR_WORKING_MASTER.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Guide 01 terminology is already normalized.'
            exit 0
          fi
          git commit -m "fix(guide-01): normalize apprenticeship terminology"
          git push origin HEAD:revision/guide-00-100-2026
