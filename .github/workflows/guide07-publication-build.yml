name: Guide 07 publication build and QA

on:
  workflow_dispatch:
  push:
    branches:
      - revision/guide-00-100-2026
    paths:
      - .github/workflows/guide07-publication-build.yml
      - scripts/guide07_translation_parity.py
      - scripts/guide07_publication_build.py
      - project/revision-2026/guide-07/source/**

permissions:
  contents: write

concurrency:
  group: guide07-publication-build
  cancel-in-progress: false

# Final rebuild after version-control metadata cleanup and parity PASS.
jobs:
  build-and-qa:
    if: github.repository == 'Chpmunk31456/lifelong-opportunity-project'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out controlled revision branch
        uses: actions/checkout@v4
        with:
          ref: revision/guide-00-100-2026
          fetch-depth: 0

      - name: Install document and PDF tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pandoc libreoffice-writer poppler-utils python3-lxml

      - name: Re-run trilingual source parity gate
        run: python scripts/guide07_translation_parity.py

      - name: Build and QA all publication candidates
        run: python scripts/guide07_publication_build.py

      - name: Upload publication candidates and rendered-page evidence
        uses: actions/upload-artifact@v4
        with:
          name: guide07-publication-candidate-evidence
          path: project/revision-2026/guide-07/publication-candidate
          if-no-files-found: error

      - name: Commit completed publication candidates after automated QA
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project/revision-2026/guide-07/publication-candidate
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Guide 07 publication candidates already match generated outputs.'
            exit 0
          fi
          git commit -m "build(guide-07): add trilingual publication candidates and QA evidence"
          git fetch origin revision/guide-00-100-2026
          git rebase origin/revision/guide-00-100-2026
          python scripts/guide07_translation_parity.py
          python scripts/guide07_publication_build.py
          git add project/revision-2026/guide-07/publication-candidate
          git commit --amend --no-edit || true
          git push origin HEAD:revision/guide-00-100-2026
