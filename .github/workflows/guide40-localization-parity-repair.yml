name: Guide 40 localization parity repair

on:
  push:
    branches: [revision/guide-00-100-2026]
    paths:
      - '.github/workflows/guide40-localization-parity-repair.yml'
      - 'scripts/repair_guide40_localization_parity.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: guide40-localization-parity-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out revision branch
        uses: actions/checkout@v5
        with:
          ref: revision/guide-00-100-2026
          fetch-depth: 0

      - name: Repair and verify Guide 40 localization parity
        run: python scripts/repair_guide40_localization_parity.py

      - name: Commit repaired localized masters
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add project/revision-2026/guide-40/working-masters/GUIDE_40_CONSTRUCTION_LABORER_AND_TRADE_HELPER_SPANISH_es-419_v2.md
          git add project/revision-2026/guide-40/working-masters/GUIDE_40_CONSTRUCTION_LABORER_AND_TRADE_HELPER_PORTUGUESE_pt-BR_v2.md
          if git diff --cached --quiet; then
            echo 'No localization parity changes to commit.'
          else
            git commit -m 'Repair Guide 40 localization structural and source parity'
            git pull --rebase origin revision/guide-00-100-2026
            git push origin HEAD:revision/guide-00-100-2026
          fi
