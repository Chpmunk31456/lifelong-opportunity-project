name: Guide 47 publication status probe

on:
  push:
    branches: [revision/guide-00-100-2026]
    paths:
      - '.github/workflows/guide47-publication-status-probe.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check out revision branch
        uses: actions/checkout@v5
        with:
          ref: revision/guide-00-100-2026
          fetch-depth: 0

      - name: Record latest Guide 47 workflow state
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib, urllib.request

          token=os.environ['GH_TOKEN']
          repo=os.environ['REPO']
          base=f'https://api.github.com/repos/{repo}'
          headers={
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'lifelong-opportunity-project-guide47-probe'
          }

          def get(url):
              req=urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)

          def latest(workflow, event=None):
              url=f'{base}/actions/workflows/{workflow}/runs?branch=revision%2Fguide-00-100-2026&per_page=5'
              if event:
                  url += f'&event={event}'
              data=get(url).get('workflow_runs', [])
              if not data:
                  return None
              r=data[0]
              return {
                  'run_id': r.get('id'),
                  'status': r.get('status'),
                  'conclusion': r.get('conclusion'),
                  'event': r.get('event'),
                  'head_sha': r.get('head_sha'),
                  'created_at': r.get('created_at'),
                  'updated_at': r.get('updated_at'),
                  'html_url': r.get('html_url')
              }

          result={
              'guide':'47',
              'purpose':'observe controlled publication workflows only; does not advance QA gates',
              'corrective_repair': latest('guide47-technical-corrective-repair.yml'),
              'dispatch': latest('guide47-publication-dispatch.yml'),
              'publication_build': latest('guide47-publication-build.yml'),
          }
          out=pathlib.Path('project/revision-2026/guide-47/qa/GUIDE_47_PUBLICATION_WORKFLOW_STATUS.json')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(result, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(result, indent=2))
          PY

      - name: Commit observation evidence
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add project/revision-2026/guide-47/qa/GUIDE_47_PUBLICATION_WORKFLOW_STATUS.json
          if git diff --cached --quiet; then
            echo 'No status change to commit.'
          else
            git commit -m 'Record Guide 47 publication workflow status'
            git pull --rebase origin revision/guide-00-100-2026
            git push origin HEAD:revision/guide-00-100-2026
          fi
