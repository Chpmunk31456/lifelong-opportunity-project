name: Guide 58 Technical QA dispatcher

on:
  push:
    branches: [revision/guide-00-100-2026]
    paths:
      - '.github/workflows/guide58-technical-dispatch.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch-and-observe:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Guide 58 Technical QA and wait for result
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/$REPO"
          START="$(date -u +%s)"
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$API/actions/workflows/guide58-technical-qa.yml/dispatches" \
            -d '{"ref":"revision/guide-00-100-2026"}'
          RUN_ID=""
          for i in $(seq 1 24); do
            sleep 5
            JSON="$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$API/actions/workflows/guide58-technical-qa.yml/runs?branch=revision%2Fguide-00-100-2026&event=workflow_dispatch&per_page=10")"
            RUN_ID="$(python -c 'import json,sys,datetime; d=json.load(sys.stdin); start=int(sys.argv[1]);
for r in d.get("workflow_runs",[]):
 t=int(datetime.datetime.fromisoformat(r["created_at"].replace("Z","+00:00")).timestamp())
 if t>=start-5: print(r["id"]); break' "$START" <<<"$JSON")"
            if [ -n "$RUN_ID" ]; then break; fi
          done
          test -n "$RUN_ID"
          echo "Observed Guide 58 Technical QA run: $RUN_ID"
          for i in $(seq 1 90); do
            JSON="$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$API/actions/runs/$RUN_ID")"
            STATUS="$(python -c 'import json,sys; print(json.load(sys.stdin)["status"])' <<<"$JSON")"
            CONCLUSION="$(python -c 'import json,sys; print(json.load(sys.stdin).get("conclusion") or "")' <<<"$JSON")"
            echo "status=$STATUS conclusion=$CONCLUSION"
            if [ "$STATUS" = "completed" ]; then
              test "$CONCLUSION" = "success"
              exit 0
            fi
            sleep 10
          done
          echo "Guide 58 Technical QA observation timed out" >&2
          exit 1
