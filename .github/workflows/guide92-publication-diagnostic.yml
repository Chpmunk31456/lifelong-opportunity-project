name: Guide 92 publication diagnostic

on:
  push:
    branches: [revision/guide-00-100-2026]
    paths:
      - '.github/workflows/guide92-publication-diagnostic.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: revision/guide-00-100-2026
          fetch-depth: 0

      - name: Install publication toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc libreoffice-writer poppler-utils python3-pil

      - name: Run controlled-value and parity preflight
        shell: python
        run: |
          from pathlib import Path
          import json,re
          root=Path('project/revision-2026/guide-92')
          src=root/'working-masters'
          files=[
            src/'GUIDE_92_GEOGRAPHIC_INFORMATION_SYSTEMS_TECHNICIAN_ENGLISH_v2.md',
            src/'GUIDE_92_TECNICO_EN_SISTEMAS_DE_INFORMACION_GEOGRAFICA_ES419_v2.md',
            src/'GUIDE_92_TECNICO_EM_SISTEMAS_DE_INFORMACAO_GEOGRAFICA_PTBR_v2.md']
          texts=[p.read_text(encoding='utf-8') for p in files]
          problems=[]
          details={}
          reader_urls=[]
          for p,t in zip(files,texts):
            urls=set(re.findall(r'https://[^\s)<>`]+',t)); reader_urls.append(urls)
            item={'characters':len(t),'h2':len(re.findall(r'^##\s+.+$',t,re.M)),'urls':len(urls),'missing_controls':[],'missing_semantics':[]}
            if t.startswith('\ufeff') or '\ufffd' in t: problems.append(f'{p.name}: encoding defect')
            if len(t)<14000: problems.append(f'{p.name}: unexpectedly short ({len(t)})')
            if item['h2']<25: problems.append(f'{p.name}: insufficient major sections')
            low=t.lower()
            for bad in ('todo:','lorem ipsum','translation pending','traduccion pendiente','tradução pendente'):
              if bad in low: problems.append(f'{p.name}: placeholder {bad}')
            controls=[
              r'15-1299\.02',r'22214',r'31123',
              r'55[,.]940',r'26[,.]89',r'79[,.]370',r'38[,.]16',r'116[,.]580',r'56[,.]05',r'157[,.]500',r'75[,.]72',r'188[,.]470',r'90[,.]61',
              r'472[,.]000',r'510[,.]500',r'8\s*%',r'31[,.]300',r'25[,.]88',r'17[,.]60',r'38[,.]06',r'749',r'36\s+(?:months|meses)',
              r'C\$23[,.]08',r'C\$38[,.]10',r'C\$53[,.]85',r'80\s+(?:hours|horas)',r'48\s+(?:hours|horas)',
              r'75\s*%',r'67\s*%',r'34\s*%',r'22\s*%',r'21\s*%',r'14\s*%',r'13\s*%',r'10\s*%',r'7\s*%',r'6\s*%',r'5\s*%']
            semantics={
              'statistical crosswalk':['computer occupations, all other'],
              'GIS':['gis','sig'],
              'CRS':['crs'],
              'datum':['datum'],
              'projection':['projection','proyección','projeção'],
              'lineage':['lineage','linaje','linhagem'],
              'metadata':['metadata'],
              'topology':['topology','topología','topologia'],
              'georeferencing':['georeferencing','georreferenciación','georreferenciamento'],
              'spatial analysis':['spatial analysis','análisis espacial','análise espacial'],
              'privacy':['privacy','privacidad','privacidade'],
              'survey boundary':['survey-grade','topográfica','levantamento'],
              'responsible AI':['responsible ai','ia responsable','ia responsável'],
              'accessibility':['accessibility','accesibilidad','acessibilidade'],
              'synthetic':['synthetic','sintético','sintética'],
              'Canada surplus':['strong risk of labour surplus']}
            for pat in controls:
              if not re.search(pat,t,re.I): item['missing_controls'].append(pat)
            for label,terms in semantics.items():
              if not any(term.lower() in low for term in terms): item['missing_semantics'].append(label)
            if item['missing_controls']: problems.append(f"{p.name}: missing controlled values {item['missing_controls']}")
            if item['missing_semantics']: problems.append(f"{p.name}: missing semantic controls {item['missing_semantics']}")
            details[p.name]=item
          if not (reader_urls[0]==reader_urls[1]==reader_urls[2]): problems.append(f'reader URL parity mismatch {[len(x) for x in reader_urls]}')
          if len(reader_urls[0])!=23: problems.append(f'expected 23 shared reader URLs, found {len(reader_urls[0])}')
          research=(root/'research/GUIDE_92_CURRENT_SOURCE_EVIDENCE_02.md').read_text(encoding='utf-8')
          evidence_urls=set(re.findall(r'https://[^\s)<>`]+',research))
          if len(evidence_urls)!=23: problems.append(f'expected 23 evidence URLs, found {len(evidence_urls)}')
          report={'status':'FAIL' if problems else 'PASS','files':details,'reader_url_counts':[len(x) for x in reader_urls],'reader_url_parity':reader_urls[0]==reader_urls[1]==reader_urls[2],'evidence_url_count':len(evidence_urls),'problems':problems}
          (root/'qa/GUIDE_92_PUBLICATION_PREFLIGHT_DIAGNOSTIC.json').write_text(json.dumps(report,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')

      - name: Run non-destructive binary build probe
        shell: python
        run: |
          from pathlib import Path
          import subprocess,json,shutil
          from PIL import Image,ImageChops
          root=Path('project/revision-2026/guide-92')
          src=root/'working-masters'; tmp=Path('/tmp/guide92-binary-diagnostic')
          shutil.rmtree(tmp,ignore_errors=True); tmp.mkdir(parents=True)
          sources=[
            ('en',src/'GUIDE_92_GEOGRAPHIC_INFORMATION_SYSTEMS_TECHNICIAN_ENGLISH_v2.md'),
            ('es-419',src/'GUIDE_92_TECNICO_EN_SISTEMAS_DE_INFORMACION_GEOGRAFICA_ES419_v2.md'),
            ('pt-BR',src/'GUIDE_92_TECNICO_EM_SISTEMAS_DE_INFORMACAO_GEOGRAFICA_PTBR_v2.md')]
          report={'editions':[],'problems':[]}
          for lang,md in sources:
            stem=f'GUIDE_92_{lang}'.replace('-','_')
            docx=tmp/f'{stem}.docx'; pdf=tmp/f'{stem}.pdf'; render=tmp/f'{stem}-render'; render.mkdir()
            item={'language':lang,'source_chars':len(md.read_text(encoding='utf-8'))}
            r=subprocess.run(['pandoc',str(md),'-f','gfm-tex_math_dollars','-t','docx','--standalone','-o',str(docx)],capture_output=True,text=True)
            item['pandoc_rc']=r.returncode
            if r.returncode:
              item['pandoc_error']=r.stderr[-1000:]; report['problems'].append(f'{lang}: pandoc failed'); report['editions'].append(item); continue
            item['docx_bytes']=docx.stat().st_size
            r=subprocess.run(['libreoffice','--headless','--convert-to','pdf','--outdir',str(tmp),str(docx)],capture_output=True,text=True)
            item['libreoffice_rc']=r.returncode
            if r.returncode or not pdf.exists():
              item['libreoffice_error']=(r.stdout+r.stderr)[-1000:]; report['problems'].append(f'{lang}: PDF conversion failed'); report['editions'].append(item); continue
            item['pdf_bytes']=pdf.stat().st_size
            info=subprocess.run(['pdfinfo',str(pdf)],capture_output=True,text=True)
            pages=None
            for line in info.stdout.splitlines():
              if line.startswith('Pages:'): pages=int(line.split(':',1)[1].strip())
            item['pdf_pages']=pages
            text=subprocess.run(['pdftotext',str(pdf),'-'],capture_output=True,text=True)
            item['searchable_chars']=len(''.join(text.stdout.split()))
            r=subprocess.run(['pdftoppm','-png','-r','110',str(pdf),str(render/'page')],capture_output=True,text=True)
            item['render_rc']=r.returncode
            pngs=sorted(render.glob('*.png')); item['rendered_pages']=len(pngs)
            clipping=[]; blanks=[]
            for p in pngs:
              with Image.open(p) as im:
                gray=im.convert('L'); diff=ImageChops.difference(gray,Image.new('L',gray.size,255)); bbox=diff.point(lambda x:255 if x>12 else 0).getbbox()
                if bbox is None: blanks.append(p.name); continue
                l,t,rr,b=bbox; w,h=gray.size
                margins={'left':l,'top':t,'right':w-rr,'bottom':h-b}
                if min(margins.values())<2: clipping.append({'page':p.name,'margins':margins})
            item['blank_pages']=blanks; item['possible_clipping']=clipping
            if pages!=len(pngs): report['problems'].append(f'{lang}: page/render mismatch {pages}!={len(pngs)}')
            if item['searchable_chars']<=9500: report['problems'].append(f"{lang}: searchable chars {item['searchable_chars']} <= 9500")
            if blanks: report['problems'].append(f'{lang}: blank pages {blanks}')
            if clipping: report['problems'].append(f'{lang}: possible clipping')
            report['editions'].append(item)
          (root/'qa/GUIDE_92_BINARY_DIAGNOSTIC.json').write_text(json.dumps(report,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')

      - name: Commit diagnostics only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add project/revision-2026/guide-92/qa/GUIDE_92_PUBLICATION_PREFLIGHT_DIAGNOSTIC.json project/revision-2026/guide-92/qa/GUIDE_92_BINARY_DIAGNOSTIC.json
          git commit -m 'qa(guide-92): record publication preflight diagnostics' || exit 0
          git pull --rebase origin revision/guide-00-100-2026
          git push origin HEAD:revision/guide-00-100-2026
