name: Guide 02 market date refresh

on:
  workflow_dispatch:
  push:
    branches:
      - revision/guide-00-100-2026
    paths:
      - .github/workflows/guide02-market-date-refresh.yml

permissions:
  contents: write

concurrency:
  group: guide02-market-date-refresh
  cancel-in-progress: false

jobs:
  refresh-and-verify:
    if: github.repository == 'Chpmunk31456/lifelong-opportunity-project'
    runs-on: ubuntu-latest

    steps:
      - name: Check out controlled revision branch
        uses: actions/checkout@v4
        with:
          ref: revision/guide-00-100-2026
          fetch-depth: 0

      - name: Refresh verified ZipRecruiter display date
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              Path('project/revision-2026/guide-02/source/GUIDE_02_ENGLISH_WORKING_MASTER_v2.md'): ('July 16, 2026', 'August 7, 2026'),
              Path('project/revision-2026/guide-02/source/GUIDE_02_SPANISH_LATAM_WORKING_MASTER_v2.md'): ('16 de julio de 2026', '7 de agosto de 2026'),
              Path('project/revision-2026/guide-02/source/GUIDE_02_PORTUGUESE_BR_WORKING_MASTER_v2.md'): ('16 de julho de 2026', '7 de agosto de 2026'),
          }

          changed = []
          for path, (old, new) in replacements.items():
              if not path.is_file():
                  raise SystemExit(f'Missing controlled master: {path}')
              raw = path.read_bytes()
              if raw.startswith(b'\xef\xbb\xbf'):
                  raise SystemExit(f'Unexpected UTF-8 BOM: {path}')
              text = raw.decode('utf-8')
              old_count = text.count(old)
              new_count = text.count(new)
              if old_count == 2 and new_count == 0:
                  path.write_text(text.replace(old, new), encoding='utf-8', newline='\n')
                  changed.append(path)
              elif old_count == 0 and new_count == 2:
                  print(f'Already refreshed: {path}')
              else:
                  raise SystemExit(
                      f'Unexpected market-date state in {path}: old={old_count}, new={new_count}'
                  )

          for path, (old, new) in replacements.items():
              text = path.read_text(encoding='utf-8')
              if text.count(old) != 0 or text.count(new) != 2:
                  raise SystemExit(f'Post-refresh verification failed: {path}')
              print(f'Verified refreshed market date: {path}')

          Path('/tmp/guide02_market_date_changed.txt').write_text(
              '\n'.join(str(path) for path in changed), encoding='utf-8'
          )

      - name: Run focused trilingual parity QA
        run: |
          python scripts/guide02_translation_parity.py

      - name: Commit verified refresh when needed
        run: |
          if [ ! -s /tmp/guide02_market_date_changed.txt ]; then
            echo 'All Guide 02 masters already use the verified August 7, 2026 market date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            project/revision-2026/guide-02/source/GUIDE_02_ENGLISH_WORKING_MASTER_v2.md \
            project/revision-2026/guide-02/source/GUIDE_02_SPANISH_LATAM_WORKING_MASTER_v2.md \
            project/revision-2026/guide-02/source/GUIDE_02_PORTUGUESE_BR_WORKING_MASTER_v2.md
          git diff --cached --check
          git commit -m 'fix(guide-02): refresh market source date'
          git push origin HEAD:revision/guide-00-100-2026
