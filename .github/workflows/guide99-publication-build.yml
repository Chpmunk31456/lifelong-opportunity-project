# Controlled Guide 99 publication and release workflow
# Fail-closed trilingual build, link checks, render QA, checksums, diagnostics.
name: Guide 99 controlled publication and release

on:
  push:
    branches: [revision/guide-00-100-2026]
    paths:
      - '.github/workflows/guide99-publication-build.yml'
      - 'project/revision-2026/guide-99/qa/GUIDE_99_TRILINGUAL_TECHNICAL_QA_08.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: guide99-controlled-publication
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out controlled branch
        id: checkout
        uses: actions/checkout@v5
        with:
          ref: revision/guide-00-100-2026
          fetch-depth: 0

      - name: Install publication toolchain
        id: toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc libreoffice-writer poppler-utils python3-pil curl unzip

      - name: Preflight frozen trilingual sources
        id: preflight
        shell: python
        run: |
          import json,re,shutil,sys
          from pathlib import Path
          root=Path('project/revision-2026/guide-99')
          status=json.loads((root/'GUIDE_99_HELPER_STATUS.json').read_text(encoding='utf-8'))
          required=('baseline_inventory','research','english_editorial','evidence_traceability','english_source_freeze','spanish_localization','portuguese_localization','technical_qa')
          for stage in required:
              assert status['stages'][stage]['status']=='PASS', stage
          assert status['stages']['publication']['status']=='PENDING'
          assert status['stages']['release_audit']['status']=='PENDING'
          assert not status.get('blockers')

          src=root/'working-masters'; out=root/'publication-candidate'
          if out.exists(): shutil.rmtree(out)
          out.mkdir(parents=True)
          pairs=[
            ('GUIDE_99_FOOD_SCIENCE_TECHNICIAN_ENGLISH_v2.md','GUIDE_99_ENGLISH_v2.md'),
            ('GUIDE_99_TECNICO_EN_CIENCIA_DE_ALIMENTOS_ES419_v2.md','GUIDE_99_SPANISH_es-419_v2.md'),
            ('GUIDE_99_TECNICO_EM_CIENCIA_DE_ALIMENTOS_PTBR_v2.md','GUIDE_99_PORTUGUESE_pt-BR_v2.md')]
          files=[]
          for source,target in pairs:
              p=src/source
              assert p.exists(), source
              shutil.copy2(p,out/target); files.append(out/target)
          texts=[p.read_text(encoding='utf-8') for p in files]
          problems=[]
          for p,t in zip(files,texts):
              if t.startswith('\ufeff') or '\ufffd' in t: problems.append(f'{p.name}: encoding defect')
              if len(t)<15000: problems.append(f'{p.name}: unexpectedly short ({len(t)})')
              if len(re.findall(r'^##\s+.+$',t,re.M))<20: problems.append(f'{p.name}: insufficient major sections')
              if re.search(r'(?im)^\s*(?:[-*]\s*)?todo\s*:',t): problems.append(f'{p.name}: TODO placeholder')
          urls=[set(re.findall(r'https://[^\s)<>`]+',t)) for t in texts]
          if not (urls[0]==urls[1]==urls[2]): problems.append(f'reader URL parity mismatch {[len(x) for x in urls]}')
          if len(urls[0])<15: problems.append(f'too few shared reader URLs ({len(urls[0])})')
          controls=('19-4013.00','22100','31160')
          for p,t in zip(files,texts):
              for value in controls:
                  if value not in t: problems.append(f'{p.name}: missing controlled occupation value {value}')
          if problems:
              print('\n'.join(problems)); sys.exit(1)
          Path('/tmp/guide99_urls.txt').write_text('\n'.join(sorted(urls[0]))+'\n',encoding='utf-8')
          Path('/tmp/guide99_url_count.txt').write_text(str(len(urls[0])),encoding='utf-8')
          print(f'Guide 99 preflight PASS: 3 editions; {len(urls[0])} shared URLs')

      - name: Check controlled reader links
        id: links
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r url; do
            code="$(curl -L -sS -o /dev/null -w '%{http_code}' --connect-timeout 15 --max-time 35 -A 'Mozilla/5.0 Guide99-QA' "$url" || echo 000)"
            case "$code" in
              200|201|202|204|301|302|303|307|308|401|403|429) echo "LINK OK/WALLED $code $url" ;;
              404|410) echo "LINK FAIL $code $url"; fail=1 ;;
              000|5??) echo "LINK WARN $code $url" ;;
              *) echo "LINK REVIEW $code $url" ;;
            esac
          done < /tmp/guide99_urls.txt
          test "$fail" -eq 0

      - name: Create URL-safe display filter
        id: urlfilter
        run: |
          cat > /tmp/url_safe.lua <<'LUA'
          local function long_url(s) return string.match(s,'^https?://') and string.len(s)>45 end
          function Link(el)
            local t=pandoc.utils.stringify(el.content)
            if long_url(t) then return pandoc.Link({pandoc.Str('Source link')},el.target,el.title) end
            return el
          end
          function Str(el)
            if long_url(el.text) then return pandoc.Link({pandoc.Str('Source link')},el.text) end
            return el
          end
          LUA

      - name: Generate DOCX and searchable PDFs
        id: documents
        run: |
          set -euo pipefail
          OUT='project/revision-2026/guide-99/publication-candidate'
          for STEM in GUIDE_99_ENGLISH_v2 GUIDE_99_SPANISH_es-419_v2 GUIDE_99_PORTUGUESE_pt-BR_v2; do
            pandoc "$OUT/$STEM.md" -f gfm-tex_math_dollars -t docx --standalone --lua-filter=/tmp/url_safe.lua -o "$OUT/$STEM.docx"
            mkdir -p "$OUT/lo-$STEM"
            libreoffice --headless --convert-to pdf --outdir "$OUT/lo-$STEM" "$OUT/$STEM.docx"
            mv "$OUT/lo-$STEM/$STEM.pdf" "$OUT/$STEM.pdf"
            rmdir "$OUT/lo-$STEM"
          done
          test "$(find "$OUT" -maxdepth 1 -name '*.docx' | wc -l)" -eq 3
          test "$(find "$OUT" -maxdepth 1 -name '*.pdf' | wc -l)" -eq 3
          for DOCX in "$OUT"/*.docx; do test -s "$DOCX"; unzip -t "$DOCX" >/dev/null; unzip -l "$DOCX" | grep -q 'word/document.xml'; done
          for PDF in "$OUT"/*.pdf; do test -s "$PDF"; pdfinfo "$PDF" >/dev/null; test "$(pdftotext "$PDF" - | tr -d '[:space:]' | wc -c)" -gt 10000; done

      - name: Render and validate every PDF page
        id: render
        shell: python
        run: |
          import json,subprocess,sys
          from pathlib import Path
          from PIL import Image,ImageChops
          out=Path('project/revision-2026/guide-99/publication-candidate'); rend=out/'rendered'
          for pdf in sorted(out.glob('*.pdf')):
              dest=rend/pdf.stem; dest.mkdir(parents=True,exist_ok=True)
              subprocess.run(['pdftoppm','-png','-r','110',str(pdf),str(dest/'page')],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          problems=[]; pages=[]
          for path in sorted(rend.rglob('*.png')):
              with Image.open(path) as im:
                  gray=im.convert('L'); diff=ImageChops.difference(gray,Image.new('L',gray.size,255)); bbox=diff.point(lambda p:255 if p>12 else 0).getbbox()
                  if bbox is None: problems.append(f'{path}: blank'); continue
                  l,t,r,b=bbox; w,h=gray.size; margins={'left':l,'top':t,'right':w-r,'bottom':h-b}
                  if min(margins.values())<2: problems.append(f'{path}: clipping {margins}')
                  pages.append({'file':str(path.relative_to(rend)),'edge_margins':margins})
          result={'status':'FAIL' if problems else 'PASS','pages':pages,'problems':problems}
          (rend/'RENDER_QA.json').write_text(json.dumps(result,indent=2)+'\n',encoding='utf-8')
          if problems: print('\n'.join(problems)); sys.exit(1)
          print(f'Guide 99 all-page render PASS: {len(pages)} pages')

      - name: Write publication evidence
        id: evidence
        shell: python
        run: |
          import hashlib,json,shutil,subprocess
          from pathlib import Path
          root=Path('project/revision-2026/guide-99'); out=root/'publication-candidate'; qa=root/'qa'; rend=out/'rendered'
          render=json.loads((rend/'RENDER_QA.json').read_text(encoding='utf-8')); assert render['status']=='PASS'
          url_count=int(Path('/tmp/guide99_url_count.txt').read_text())
          editions=[]
          for lang,stem in [('en','GUIDE_99_ENGLISH_v2'),('es-419','GUIDE_99_SPANISH_es-419_v2'),('pt-BR','GUIDE_99_PORTUGUESE_pt-BR_v2')]:
              docx=out/f'{stem}.docx'; pdf=out/f'{stem}.pdf'
              info=subprocess.check_output(['pdfinfo',str(pdf)],text=True)
              count=next(int(line.split(':',1)[1]) for line in info.splitlines() if line.startswith('Pages:'))
              rendered=sum(1 for row in render['pages'] if row['file'].startswith(stem+'/'))
              assert count==rendered
              editions.append({'language':lang,'docx':docx.name,'pdf':pdf.name,'docx_bytes':docx.stat().st_size,'pdf_bytes':pdf.stat().st_size,'pdf_pages':count,'rendered_pages':rendered,'status':'PASS'})
          manifest={'guide':'99','occupation':'Food Science Technician','build_date':'2026-08-22','status':'PASS','editions':editions,'reader_verification_urls':url_count,'english_source_blob':'d98b516e99a8a0d03b18ce570f5e2a0f45ecad93','assurance_boundary':'Internal controlled publication QA; not independent certification, certified translation, food-safety/regulatory/legal/engineering/occupational-safety/cybersecurity/privacy/accessibility certification, funding approval, employment guarantee, or earnings guarantee.'}
          (out/'GUIDE_99_PUBLICATION_QA_MANIFEST.json').write_text(json.dumps(manifest,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          (out/'RENDER_QA.json').write_text(json.dumps(render,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          binaries=sorted([*out.glob('*.docx'),*out.glob('*.pdf')])
          (out/'SHA256SUMS.txt').write_text('\n'.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}' for p in binaries)+'\n',encoding='utf-8')
          (qa/'GUIDE_99_PUBLICATION_QA_09.md').write_text(f'# Guide 99 — Publication QA 09\n\n**Stage:** Publication — **PASS**\n\nEnglish, es-419 and pt-BR Markdown/DOCX/PDF editions passed frozen-source preflight, {url_count}-link reader parity, hard-link checks, DOCX integrity, searchable-PDF validation, all-page rendering, page reconciliation, metadata and SHA-256 checksum generation.\n\nNo independent certification, certified translation, food-safety/regulatory/legal/engineering/occupational-safety/cybersecurity/privacy/accessibility certification, funding approval, employment guarantee or earnings guarantee is claimed.\n',encoding='utf-8')
          (qa/'GUIDE_99_RELEASE_AUDIT_10.md').write_text(f'# Guide 99 — Release Audit 10\n\n**Stage:** Release Audit — **PASS**\n\nRelease audit confirms all predecessor gates, trilingual publication artifacts, {url_count}-reader-link parity, checksums, searchable PDFs, all-page rendering, occupational scope boundaries and zero blockers. Guide 100 may initialize only after the helper status records this release audit as PASS.\n',encoding='utf-8')
          shutil.rmtree(rend)

      - name: Commit verified package
        id: packagecommit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f project/revision-2026/guide-99/qa/GUIDE_99_PUBLICATION_WORKFLOW_DIAGNOSTIC.md || true
          git add project/revision-2026/guide-99/publication-candidate project/revision-2026/guide-99/qa/GUIDE_99_PUBLICATION_QA_09.md project/revision-2026/guide-99/qa/GUIDE_99_RELEASE_AUDIT_10.md
          git commit -m 'build(guide-99): publish controlled trilingual package'
          git pull --rebase origin revision/guide-00-100-2026
          git push origin HEAD:revision/guide-00-100-2026

      - name: Close publication and release status
        id: closegates
        run: |
          set -euo pipefail
          git pull --rebase origin revision/guide-00-100-2026
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('project/revision-2026/guide-99/GUIDE_99_HELPER_STATUS.json'); d=json.loads(p.read_text(encoding='utf-8'))
          assert d['stages']['technical_qa']['status']=='PASS'; assert not d.get('blockers')
          d['stages']['publication']={'status':'PASS','evidence':['project/revision-2026/guide-99/qa/GUIDE_99_PUBLICATION_QA_09.md','project/revision-2026/guide-99/publication-candidate/GUIDE_99_PUBLICATION_QA_MANIFEST.json','project/revision-2026/guide-99/publication-candidate/SHA256SUMS.txt','project/revision-2026/guide-99/publication-candidate/RENDER_QA.json']}
          d['stages']['release_audit']={'status':'PASS','evidence':['project/revision-2026/guide-99/qa/GUIDE_99_RELEASE_AUDIT_10.md']}
          p.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          PY
          git add project/revision-2026/guide-99/GUIDE_99_HELPER_STATUS.json
          git commit -m 'qa(guide-99): close publication and release gates'
          git pull --rebase origin revision/guide-00-100-2026
          git push origin HEAD:revision/guide-00-100-2026

      - name: Record failure diagnostic
        if: failure()
        env:
          RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
          TOOLCHAIN: ${{ steps.toolchain.outcome }}
          PREFLIGHT: ${{ steps.preflight.outcome }}
          LINKS: ${{ steps.links.outcome }}
          URLFILTER: ${{ steps.urlfilter.outcome }}
          DOCUMENTS: ${{ steps.documents.outcome }}
          RENDER: ${{ steps.render.outcome }}
          EVIDENCE: ${{ steps.evidence.outcome }}
          PACKAGECOMMIT: ${{ steps.packagecommit.outcome }}
          CLOSEGATES: ${{ steps.closegates.outcome }}
        run: |
          set +e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin revision/guide-00-100-2026 || true
          cat > project/revision-2026/guide-99/qa/GUIDE_99_PUBLICATION_WORKFLOW_DIAGNOSTIC.md <<EOF
          # Guide 99 — Publication Workflow Diagnostic

          **Run ID:** $RUN_ID  
          **Source SHA:** $SOURCE_SHA

          | Step | Outcome |
          |---|---|
          | toolchain | $TOOLCHAIN |
          | preflight | $PREFLIGHT |
          | links | $LINKS |
          | urlfilter | $URLFILTER |
          | documents | $DOCUMENTS |
          | render | $RENDER |
          | evidence | $EVIDENCE |
          | packagecommit | $PACKAGECOMMIT |
          | closegates | $CLOSEGATES |
          EOF
          git add project/revision-2026/guide-99/qa/GUIDE_99_PUBLICATION_WORKFLOW_DIAGNOSTIC.md
          git commit -m 'diag(guide-99): record publication workflow failure' || true
          git push origin HEAD:revision/guide-00-100-2026 || true
