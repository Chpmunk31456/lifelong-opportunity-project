# Activation push: 2026-08-22 after workflow registration
name: Guide 92 placeholder detector one-shot fix

on:
  push:
    branches: [revision/guide-00-100-2026]
    paths:
      - '.github/workflows/guide92-placeholder-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: guide92-placeholder-detector-fix
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out controlled branch
        uses: actions/checkout@v5
        with:
          ref: revision/guide-00-100-2026
          fetch-depth: 0

      - name: Correct TODO placeholder detection
        shell: python
        run: |
          from pathlib import Path
          p=Path('.github/workflows/guide92-publication-build.yml')
          text=p.read_text(encoding='utf-8')
          old="""            low=t.lower()
            for bad in ('todo:','lorem ipsum','translation pending','traduccion pendiente','tradução pendente'):
              if bad in low: problems.append(f'{p.name}: placeholder {bad}')"""
          new="""            low=t.lower()
            if re.search(r'(?im)^\\s*(?:[-*]\\s*)?todo\\s*:',t): problems.append(f'{p.name}: placeholder TODO')
            for bad in ('lorem ipsum','translation pending','traduccion pendiente','tradução pendente'):
              if bad in low: problems.append(f'{p.name}: placeholder {bad}')"""
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one placeholder block, found {text.count(old)}')
          p.write_text(text.replace(old,new),encoding='utf-8')

      - name: Commit fix and retire helper
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/guide92-placeholder-fix.yml
          git add .github/workflows/guide92-publication-build.yml
          git commit -m 'fix(guide-92): avoid Spanish todo false-positive'
          git pull --rebase origin revision/guide-00-100-2026
          git push origin HEAD:revision/guide-00-100-2026
