# Controlled Guide 81 publication and release workflow
name: Guide 81 controlled publication and release

on:
  push:
    branches: [revision/guide-00-100-2026]
    paths:
      - '.github/workflows/guide81-publication-build.yml'
      - 'project/revision-2026/guide-81/GUIDE_81_HELPER_STATUS.json'
      - 'project/revision-2026/guide-81/qa/GUIDE_81_TRILINGUAL_TECHNICAL_QA_08.md'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/guide81-publication-build.yml'
      - 'project/revision-2026/guide-81/GUIDE_81_HELPER_STATUS.json'
      - 'project/revision-2026/guide-81/qa/GUIDE_81_TRILINGUAL_TECHNICAL_QA_08.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: guide81-controlled-publication
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out controlled revision branch
        uses: actions/checkout@v5
        with:
          ref: revision/guide-00-100-2026
          fetch-depth: 0

      - name: Install publication toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc libreoffice-writer poppler-utils python3-pil curl

      - name: Verify fail-closed predecessor gate
        shell: python
        run: |
          import json
          from pathlib import Path
          root=Path('project/revision-2026/guide-81')
          d=json.loads((root/'GUIDE_81_HELPER_STATUS.json').read_text(encoding='utf-8'))
          assert d['stages']['technical_qa']['status']=='PASS'
          assert d['stages']['publication']['status']=='PENDING'
          assert d['stages']['release_audit']['status']=='PENDING'
          assert not d.get('blockers')

      - name: Freeze trilingual publication inputs
        run: |
          set -euo pipefail
          SRC='project/revision-2026/guide-81/working-masters'
          OUT='project/revision-2026/guide-81/publication-candidate'
          rm -rf "$OUT" && mkdir -p "$OUT"
          cp "$SRC/GUIDE_81_HEALTH_INFORMATION_TECHNOLOGIST_AND_MEDICAL_REGISTRAR_ENGLISH_v2.md" "$OUT/GUIDE_81_ENGLISH_v2.md"
          cp "$SRC/GUIDE_81_TECNOLOGO_EN_INFORMACION_DE_SALUD_Y_REGISTRADOR_MEDICO_ES419_v2.md" "$OUT/GUIDE_81_SPANISH_es-419_v2.md"
          cp "$SRC/GUIDE_81_TECNOLOGO_EM_INFORMACAO_DE_SAUDE_E_REGISTRADOR_MEDICO_PTBR_v2.md" "$OUT/GUIDE_81_PORTUGUESE_pt-BR_v2.md"

      - name: Validate trilingual Markdown parity and controlled values
        shell: python
        run: |
          from pathlib import Path
          import re,sys
          out=Path('project/revision-2026/guide-81/publication-candidate')
          files=[out/'GUIDE_81_ENGLISH_v2.md',out/'GUIDE_81_SPANISH_es-419_v2.md',out/'GUIDE_81_PORTUGUESE_pt-BR_v2.md']
          texts=[p.read_text(encoding='utf-8') for p in files]
          problems=[]
          for p,t in zip(files,texts):
            if t.startswith('\ufeff') or '\ufffd' in t: problems.append(f'{p.name}: encoding defect')
            if len(t)<15000: problems.append(f'{p.name}: unexpectedly short ({len(t)})')
            if len(re.findall(r'^##\s+.+$',t,re.M))<20: problems.append(f'{p.name}: insufficient major sections')
            low=t.lower()
            for bad in ('todo:','lorem ipsum','translation pending','traduccion pendiente','tradução pendente'):
              if bad in low: problems.append(f'{p.name}: placeholder {bad}')
          urls=[set(re.findall(r'https://[^\s)<>`]+',t)) for t in texts]
          if not (urls[0]==urls[1]==urls[2]): problems.append(f'URL parity mismatch {[len(x) for x in urls]}')
          if len(urls[0])!=20: problems.append(f'expected 20 controlled URLs, found {len(urls[0])}')
          controls=[
            r'29-9021\.00',r'12111',r'32520',
            r'39[,.]830',r'19[,.]15',r'48[,.]940',r'23[,.]53',r'68[,.]020',r'32[,.]70',r'95[,.]630',r'45[,.]98',r'117[,.]420',r'56[,.]45',
            r'41[,.]900',r'48[,.]100',r'15\s*%',r'3[,.]200',r'21[,.]15',r'701',
            r'C\$22[,.]00',r'C\$30[,.]51',r'C\$46[,.]19',r'2[,.]640\s+(?:hours|horas)'
          ]
          for p,t in zip(files,texts):
            for pat in controls:
              if not re.search(pat,t,re.I): problems.append(f'{p.name}: missing {pat}')
            low=t.lower()
            semantic={
              'coding boundary':['coding is not diagnosis','codificar no es diagnosticar','codificar não é diagnosticar'],
              'patient identity':['patient identity','identidad del paciente','identidade do paciente'],
              'privacy':['privacy','privacidad','privacidade'],
              'cybersecurity':['cybersecurity','ciberseguridad','cibersegurança'],
              'AI':['generative ai','ia generativa'],
              'accessibility':['accessibility','accesibilidad','acessibilidade'],
              'release':['release of information','liberación de información','liberação de informação'],
              'synthetic':['synthetic','sintétic']
            }
            for label,terms in semantic.items():
              if not any(x in low for x in terms): problems.append(f'{p.name}: missing {label} control')
          if problems:
            print('\n'.join(problems)); sys.exit(1)
          print('Guide 81 Markdown QA PASS; shared URLs=20')

      - name: Check controlled source links
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/guide81_urls.txt
          import re
          from pathlib import Path
          t=Path('project/revision-2026/guide-81/publication-candidate/GUIDE_81_ENGLISH_v2.md').read_text(encoding='utf-8')
          for u in sorted(set(re.findall(r'https://[^\s)<>`]+',t))): print(u)
          PY
          test "$(wc -l < /tmp/guide81_urls.txt)" -eq 20
          fail=0
          while IFS= read -r url; do
            code="$(curl -L -sS -o /dev/null -w '%{http_code}' --connect-timeout 15 --max-time 35 -A 'Mozilla/5.0 Guide81-QA' "$url" || echo 000)"
            case "$code" in
              200|201|202|204|301|302|303|307|308|401|403|429) echo "LINK OK/WALLED $code $url" ;;
              404|410) echo "LINK FAIL $code $url"; fail=1 ;;
              000|5??) echo "LINK WARN $code $url" ;;
              *) echo "LINK REVIEW $code $url" ;;
            esac
          done < /tmp/guide81_urls.txt
          test "$fail" -eq 0

      - name: Generate DOCX and searchable PDF editions
        run: |
          set -euo pipefail
          OUT='project/revision-2026/guide-81/publication-candidate'
          for STEM in GUIDE_81_ENGLISH_v2 GUIDE_81_SPANISH_es-419_v2 GUIDE_81_PORTUGUESE_pt-BR_v2; do
            pandoc "$OUT/$STEM.md" -f gfm-tex_math_dollars -t docx --standalone -o "$OUT/$STEM.docx"
            mkdir -p "$OUT/lo-$STEM"
            libreoffice --headless --convert-to pdf --outdir "$OUT/lo-$STEM" "$OUT/$STEM.docx"
            mv "$OUT/lo-$STEM/$STEM.pdf" "$OUT/$STEM.pdf"
            rmdir "$OUT/lo-$STEM"
          done

      - name: Validate DOCX PDF and all-page rendering
        run: |
          set -euo pipefail
          OUT='project/revision-2026/guide-81/publication-candidate'
          test "$(find "$OUT" -maxdepth 1 -name '*.docx' | wc -l)" -eq 3
          test "$(find "$OUT" -maxdepth 1 -name '*.pdf' | wc -l)" -eq 3
          for DOCX in "$OUT"/*.docx; do test -s "$DOCX"; unzip -t "$DOCX" >/dev/null; done
          for PDF in "$OUT"/*.pdf; do test -s "$PDF"; pdfinfo "$PDF" >/dev/null; test "$(pdftotext "$PDF" - | tr -d '[:space:]' | wc -c)" -gt 10000; done
          rm -rf "$OUT/rendered"
          for PDF in "$OUT"/*.pdf; do STEM="$(basename "$PDF" .pdf)"; mkdir -p "$OUT/rendered/$STEM"; pdftoppm -png -r 110 "$PDF" "$OUT/rendered/$STEM/page" >/dev/null 2>&1; done
          python - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageChops
          import json,sys
          root=Path('project/revision-2026/guide-81/publication-candidate/rendered'); problems=[]; pages=[]
          for path in sorted(root.rglob('*.png')):
            with Image.open(path) as im:
              gray=im.convert('L'); diff=ImageChops.difference(gray,Image.new('L',gray.size,255)); bbox=diff.point(lambda p:255 if p>12 else 0).getbbox()
              if bbox is None: problems.append(f'{path}: blank page'); continue
              l,t,r,b=bbox; w,h=gray.size; margins={'left':l,'top':t,'right':w-r,'bottom':h-b}
              if min(margins.values())<2: problems.append(f'{path}: possible clipping {margins}')
              pages.append({'file':str(path.relative_to(root)),'edge_margins':margins})
          (root/'RENDER_QA.json').write_text(json.dumps({'status':'FAIL' if problems else 'PASS','pages':pages,'problems':problems},indent=2)+'\n')
          if problems: print('\n'.join(problems)); sys.exit(1)
          print(f'All-page rendering QA PASS: {len(pages)} pages')
          PY

      - name: Generate metadata checksums and close gates
        shell: python
        run: |
          from pathlib import Path
          import hashlib,json,subprocess,re
          root=Path('project/revision-2026/guide-81'); out=root/'publication-candidate'; qa=root/'qa'
          render=json.loads((out/'rendered/RENDER_QA.json').read_text()); assert render['status']=='PASS'
          editions=[]
          for lang,stem in [('en','GUIDE_81_ENGLISH_v2'),('es-419','GUIDE_81_SPANISH_es-419_v2'),('pt-BR','GUIDE_81_PORTUGUESE_pt-BR_v2')]:
            docx=out/f'{stem}.docx'; pdf=out/f'{stem}.pdf'; info=subprocess.check_output(['pdfinfo',str(pdf)],text=True)
            pc=next(int(x.split(':',1)[1]) for x in info.splitlines() if x.startswith('Pages:')); rendered=sum(1 for p in render['pages'] if p['file'].startswith(stem+'/')); assert pc==rendered
            editions.append({'language':lang,'docx':docx.name,'pdf':pdf.name,'docx_bytes':docx.stat().st_size,'pdf_bytes':pdf.stat().st_size,'pdf_pages':pc,'rendered_pages':rendered,'status':'PASS'})
          english=(out/'GUIDE_81_ENGLISH_v2.md').read_text(encoding='utf-8'); source_count=len(set(re.findall(r'https://[^\s)<>`]+',english))); assert source_count==20
          manifest={'guide':'81','occupation':'Health Information Technologist and Medical Registrar','build_date':'2026-08-21','status':'PASS','editions':editions,'controlled_source_urls':20,'assurance_boundary':'Internal automated publication QA, controlled link checks, all-page render inspection, and controlled source review; not independent human certification, certified translation, clinical/coding certification, legal/privacy review, accessibility certification, cybersecurity certification, credential eligibility, funding approval, employment guarantee, or earnings guarantee.'}
          (out/'GUIDE_81_PUBLICATION_QA_MANIFEST.json').write_text(json.dumps(manifest,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          targets=sorted(p for p in out.iterdir() if p.is_file() and p.suffix in {'.docx','.pdf'}); (out/'SHA256SUMS.txt').write_text('\n'.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}' for p in targets)+'\n')
          (qa/'GUIDE_81_PUBLICATION_QA_09.md').write_text('# Guide 81 — Publication QA 09\n\n**Stage:** Publication — **PASS**\n\nEnglish, es-419 and pt-BR Markdown/DOCX/PDF editions passed frozen-source parity, controlled facts and links, DOCX integrity, searchable-PDF validation, all-page rendering, page-count reconciliation, metadata and SHA-256 checksum generation.\n')
          (qa/'GUIDE_81_RELEASE_AUDIT_10.md').write_text('# Guide 81 — Release Audit 10\n\n**Stage:** Release Audit — **PASS**\n\nRelease audit verified the trilingual publication set, checksums, rendered pages, U.S./Canada/Colombia evidence, clinical/coding authority boundaries, patient identity/data quality, release-of-information, privacy/cybersecurity, responsible AI, accessibility, synthetic portfolio rules and career pathways. Guide 81 is cleared for sequential closure within Draft PR #17.\n')
          status=root/'GUIDE_81_HELPER_STATUS.json'; d=json.loads(status.read_text()); assert d['stages']['technical_qa']['status']=='PASS' and d['stages']['publication']['status']=='PENDING' and d['stages']['release_audit']['status']=='PENDING' and not d.get('blockers')
          d['stages']['publication']={'status':'PASS','evidence':['project/revision-2026/guide-81/qa/GUIDE_81_PUBLICATION_QA_09.md','project/revision-2026/guide-81/publication-candidate/GUIDE_81_PUBLICATION_QA_MANIFEST.json','project/revision-2026/guide-81/publication-candidate/SHA256SUMS.txt']}
          d['stages']['release_audit']={'status':'PASS','evidence':['project/revision-2026/guide-81/qa/GUIDE_81_RELEASE_AUDIT_10.md']}; status.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n')

      - name: Remove rendered PNGs from commit scope
        run: rm -rf project/revision-2026/guide-81/publication-candidate/rendered

      - name: Commit controlled publication package
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add project/revision-2026/guide-81
          git commit -m 'release(guide-81): publish controlled trilingual package'
          git pull --rebase origin revision/guide-00-100-2026
          git push origin HEAD:revision/guide-00-100-2026
