name: Guide 01 translation baseline extraction and inventory

on:
  workflow_dispatch:
  push:
    branches:
      - revision/guide-00-100-2026
    paths:
      - .github/workflows/guide01-translation-baselines.yml
      - 01-community-health-worker/spanish/DOCX/Guia_01_Promotor_Salud_Comunitaria.docx
      - 01-community-health-worker/portuguese/DOCX/Guia_01_Agente_Comunit_rio_de_Sa_de_PTBR.docx
      - 01-community-health-worker/source/Lifelong_Opportunity_Community_Health_Worker_Guide_English_v1.1_INTEGRATED_MASTER.md

permissions:
  contents: write

concurrency:
  group: guide01-translation-baselines
  cancel-in-progress: false

jobs:
  extract-and-inventory:
    if: github.repository == 'Chpmunk31456/lifelong-opportunity-project'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out controlled revision branch
        uses: actions/checkout@v4
        with:
          ref: revision/guide-00-100-2026
          fetch-depth: 0

      - name: Install extraction tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pandoc

      - name: Extract and inventory translation baselines
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          import json
          import re
          import subprocess

          root = Path('01-community-health-worker')
          source_dir = root / 'source'
          qa_dir = Path('project/revision-2026/guide-01')
          source_dir.mkdir(parents=True, exist_ok=True)
          qa_dir.mkdir(parents=True, exist_ok=True)

          english = source_dir / 'Lifelong_Opportunity_Community_Health_Worker_Guide_English_v1.1_INTEGRATED_MASTER.md'
          if not english.is_file():
              raise SystemExit(f'Missing controlled English master: {english}')
          english_text = english.read_text(encoding='utf-8')
          english_headings = [line for line in english_text.splitlines() if re.match(r'^#{1,6}\s+', line)]

          editions = {
              'es-419': {
                  'docx': root / 'spanish/DOCX/Guia_01_Promotor_Salud_Comunitaria.docx',
                  'target': source_dir / 'Lifelong_Opportunity_Community_Health_Worker_Guide_es-419_v1.0_EXTRACTED_BASELINE.md',
                  'required': ['salud comunitaria', 'comunidad', 'formación', 'empleo'],
              },
              'pt-BR': {
                  'docx': root / 'portuguese/DOCX/Guia_01_Agente_Comunit_rio_de_Sa_de_PTBR.docx',
                  'target': source_dir / 'Lifelong_Opportunity_Community_Health_Worker_Guide_pt-BR_v1.0_EXTRACTED_BASELINE.md',
                  'required': ['saúde comunitária', 'comunidade', 'formação', 'emprego'],
              },
          }

          report = {
              'guide': '01',
              'status': 'legacy translation baselines extracted; revision and translation parity work pending',
              'english_master_sha256': hashlib.sha256(english.read_bytes()).hexdigest(),
              'english_heading_count': len(english_headings),
              'independent_human_certification': False,
              'editions': {},
          }

          for locale, item in editions.items():
              docx = item['docx']
              target = item['target']
              if not docx.is_file():
                  raise SystemExit(f'Missing legacy translation DOCX: {docx}')
              subprocess.run([
                  'pandoc', str(docx), '--from=docx', '--to=gfm', '--wrap=none', '--output', str(target)
              ], check=True)
              text = target.read_text(encoding='utf-8-sig', errors='strict')
              lines = [line.rstrip(' \t') for line in text.splitlines()]
              text = '\n'.join(lines).rstrip() + '\n'
              target.write_text(text, encoding='utf-8', newline='\n')
              if len(text.strip()) < 5000:
                  raise SystemExit(f'{locale} baseline unexpectedly short: {len(text.strip())} characters')
              if '\ufffd' in text or text.startswith('\ufeff'):
                  raise SystemExit(f'{locale} encoding normalization failed')
              lowered = text.casefold()
              required_presence = {term: term.casefold() in lowered for term in item['required']}
              headings = [line for line in text.splitlines() if re.match(r'^#{1,6}\s+', line)]
              urls = sorted(set(re.findall(r'https?://[^\s)>\]]+', text)))
              report['editions'][locale] = {
                  'source_docx': str(docx),
                  'source_docx_sha256': hashlib.sha256(docx.read_bytes()).hexdigest(),
                  'baseline_markdown': str(target),
                  'baseline_sha256': hashlib.sha256(target.read_bytes()).hexdigest(),
                  'characters': len(text),
                  'words': len(re.findall(r"\b\w+[\w'-]*\b", text, flags=re.UNICODE)),
                  'heading_count': len(headings),
                  'external_url_count': len(urls),
                  'required_term_presence': required_presence,
                  'heading_delta_vs_english': len(headings) - len(english_headings),
                  'translation_status': 'legacy baseline only; must not be represented as v1.1 parity-approved',
              }

          json_path = qa_dir / 'TRANSLATION_BASELINE_INVENTORY_01.json'
          json_path.write_text(json.dumps(report, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          md = [
              '# Guide 01 — Translation Baseline Inventory', '',
              '## Status', '',
              '- Legacy Spanish and Brazilian Portuguese DOCX files were extracted to normalized UTF-8 Markdown.',
              '- These files are baselines for controlled revision, not approved v1.1 translations.',
              '- Translation parity, terminology, factual currency, link validation, accessibility, and publication QA remain pending.',
              '- No independent human translation certification, accreditation review, medical review, legal review, or accessibility certification is claimed.', '',
              '## Controlled English source', '',
              f"- SHA-256: `{report['english_master_sha256']}`",
              f"- Heading count: {report['english_heading_count']}", '',
          ]
          for locale, data in report['editions'].items():
              md.extend([
                  f'## {locale} baseline', '',
                  f"- Source DOCX SHA-256: `{data['source_docx_sha256']}`",
                  f"- Extracted Markdown SHA-256: `{data['baseline_sha256']}`",
                  f"- Characters: {data['characters']}",
                  f"- Words: {data['words']}",
                  f"- Headings: {data['heading_count']}",
                  f"- Heading delta versus English master: {data['heading_delta_vs_english']}",
                  f"- External URLs: {data['external_url_count']}",
                  '- Status: legacy baseline only; controlled v1.1 revision required.', '',
              ])
          md.extend([
              '## Next controlled gate', '',
              'Revise the es-419 edition against the English v1.1 integrated master, perform terminology and claim-parity QA, then repeat for pt-BR before document generation.', '',
          ])
          (qa_dir / 'TRANSLATION_BASELINE_INVENTORY_01.md').write_text('\n'.join(md), encoding='utf-8')

      - name: Commit extracted baselines and inventory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 01-community-health-worker/source/Lifelong_Opportunity_Community_Health_Worker_Guide_es-419_v1.0_EXTRACTED_BASELINE.md
          git add 01-community-health-worker/source/Lifelong_Opportunity_Community_Health_Worker_Guide_pt-BR_v1.0_EXTRACTED_BASELINE.md
          git add project/revision-2026/guide-01/TRANSLATION_BASELINE_INVENTORY_01.json
          git add project/revision-2026/guide-01/TRANSLATION_BASELINE_INVENTORY_01.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Translation baseline outputs already match the legacy DOCX inputs.'
            exit 0
          fi
          git commit -m "docs(guide-01): extract Spanish and Portuguese translation baselines"
          git push origin HEAD:revision/guide-00-100-2026
