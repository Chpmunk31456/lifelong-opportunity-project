# Controlled Guide 78 publication and release workflow
name: Guide 78 controlled publication and release

on:
  push:
    branches: [revision/guide-00-100-2026]
    paths:
      - '.github/workflows/guide78-publication-build.yml'
      - 'project/revision-2026/guide-78/GUIDE_78_HELPER_STATUS.json'
      - 'project/revision-2026/guide-78/qa/GUIDE_78_TRILINGUAL_TECHNICAL_QA_08.md'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/guide78-publication-build.yml'
      - 'project/revision-2026/guide-78/GUIDE_78_HELPER_STATUS.json'
      - 'project/revision-2026/guide-78/qa/GUIDE_78_TRILINGUAL_TECHNICAL_QA_08.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: guide78-controlled-publication
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out controlled revision branch
        uses: actions/checkout@v5
        with:
          ref: revision/guide-00-100-2026
          fetch-depth: 0

      - name: Install publication toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc libreoffice-writer poppler-utils python3-pil curl

      - name: Verify fail-closed predecessor gate
        shell: python
        run: |
          import json
          from pathlib import Path
          root=Path('project/revision-2026/guide-78')
          d=json.loads((root/'GUIDE_78_HELPER_STATUS.json').read_text(encoding='utf-8'))
          assert d['stages']['technical_qa']['status']=='PASS'
          assert d['stages']['publication']['status']=='PENDING'
          assert d['stages']['release_audit']['status']=='PENDING'
          assert not d.get('blockers')

      - name: Freeze trilingual publication inputs
        shell: bash
        run: |
          set -euo pipefail
          SRC='project/revision-2026/guide-78/working-masters'
          OUT='project/revision-2026/guide-78/publication-candidate'
          rm -rf "$OUT" && mkdir -p "$OUT"
          cp "$SRC/GUIDE_78_WEB_AND_DIGITAL_INTERFACE_DESIGNER_ENGLISH_v2.md" "$OUT/GUIDE_78_ENGLISH_v2.md"
          cp "$SRC/GUIDE_78_DISENADOR_DE_INTERFACES_WEB_Y_DIGITALES_ES419_v2.md" "$OUT/GUIDE_78_SPANISH_es-419_v2.md"
          cp "$SRC/GUIDE_78_DESIGNER_DE_WEB_E_INTERFACES_DIGITAIS_PTBR_v2.md" "$OUT/GUIDE_78_PORTUGUESE_pt-BR_v2.md"

      - name: Validate trilingual Markdown parity and controlled values
        shell: python
        run: |
          from pathlib import Path
          import re,sys
          out=Path('project/revision-2026/guide-78/publication-candidate')
          files=[out/'GUIDE_78_ENGLISH_v2.md',out/'GUIDE_78_SPANISH_es-419_v2.md',out/'GUIDE_78_PORTUGUESE_pt-BR_v2.md']
          texts=[p.read_text(encoding='utf-8') for p in files]
          problems=[]
          for p,t in zip(files,texts):
            if t.startswith('\ufeff') or '\ufffd' in t: problems.append(f'{p.name}: encoding defect')
            if len(t)<18000: problems.append(f'{p.name}: unexpectedly short ({len(t)})')
            if len(re.findall(r'^##\s+.+$',t,re.M))<18: problems.append(f'{p.name}: insufficient major section structure')
            low=t.lower()
            for bad in ('todo:','lorem ipsum','translation pending','traduccion pendiente','tradução pendente'):
              if bad in low: problems.append(f'{p.name}: placeholder {bad}')
          urls=[set(re.findall(r'https://[^\s)<>`]+',t)) for t in texts]
          if not (urls[0]==urls[1]==urls[2]): problems.append(f'URL parity mismatch {[len(x) for x in urls]}')
          if len(urls[0])!=18: problems.append(f'expected 18 controlled URLs, found {len(urls[0])}')
          controls=[
            r'15-1255\.00',r'21233',r'21662',r'128[,.]900',r'7\s*%',r'9[,.]100',
            r'53[,.]750',r'25[,.]84',r'73[,.]290',r'35[,.]24',r'104[,.]000',r'50[,.]00',r'158[,.]820',r'76[,.]36',r'201[,.]550',r'96[,.]90',
            r'26[,.]94',r'13[,.]39',r'54[,.]17',r'575',r'36\s+(?:months|meses)',
            r'20[,.]00',r'33[,.]65',r'57[,.]69',r'1[,.]834[,.]105',r'30',
            r'4\.5:1',r'3:1',r'200\s*%',r'40\s+(?:hours|horas)',r'80\s*(?:-?hour|horas)'
          ]
          for p,t in zip(files,texts):
            for pat in controls:
              if not re.search(pat,t,re.I): problems.append(f'{p.name}: missing controlled value {pat}')
            low=t.lower()
            checks={
              'accessibility':['accessibility','accesibilidad','acessibilidade'],
              'privacy':['privacy','privacidad','privacidade'],
              'cybersecurity':['cybersecurity','ciberseguridad','cibersegurança'],
              'AI':['generative ai','ia generativa',' ai ',' ia '],
              'portfolio':['portfolio','portafolio','portfólio'],
              'research':['research','investigación','pesquisa'],
              'front-end':['front-end'],
              'handoff':['handoff']
            }
            for label,terms in checks.items():
              if not any(x in low for x in terms): problems.append(f'{p.name}: missing {label} boundary')
          if problems:
            print('\n'.join(problems)); sys.exit(1)
          print('Guide 78 Markdown QA PASS; shared URLs=18')

      - name: Check controlled source links
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/guide78_urls.txt
          import re
          from pathlib import Path
          t=Path('project/revision-2026/guide-78/publication-candidate/GUIDE_78_ENGLISH_v2.md').read_text(encoding='utf-8')
          for u in sorted(set(re.findall(r'https://[^\s)<>`]+',t))): print(u)
          PY
          test "$(wc -l < /tmp/guide78_urls.txt)" -eq 18
          fail=0
          while IFS= read -r url; do
            code="$(curl -L -sS -o /dev/null -w '%{http_code}' --connect-timeout 15 --max-time 35 -A 'Mozilla/5.0 Guide78-QA' "$url" || echo 000)"
            case "$code" in
              200|201|202|204|301|302|303|307|308|401|403|429) echo "LINK OK/WALLED $code $url" ;;
              404|410) echo "LINK FAIL $code $url"; fail=1 ;;
              000|5??) echo "LINK WARN $code $url" ;;
              *) echo "LINK REVIEW $code $url" ;;
            esac
          done < /tmp/guide78_urls.txt
          test "$fail" -eq 0

      - name: Create URL-safe display filter
        shell: bash
        run: |
          cat > /tmp/url_safe.lua <<'LUA'
          local function is_long_url(s) return string.match(s, '^https?://') and string.len(s) > 45 end
          function Link(el)
            local text=pandoc.utils.stringify(el.content)
            if is_long_url(text) then return pandoc.Link({pandoc.Str('Source link')},el.target,el.title) end
            return el
          end
          function Str(el)
            local text=el.text
            if is_long_url(text) then return pandoc.Link({pandoc.Str('Source link')},text) end
            return el
          end
          LUA

      - name: Generate DOCX and searchable PDF editions
        shell: bash
        run: |
          set -euo pipefail
          OUT='project/revision-2026/guide-78/publication-candidate'
          for STEM in GUIDE_78_ENGLISH_v2 GUIDE_78_SPANISH_es-419_v2 GUIDE_78_PORTUGUESE_pt-BR_v2; do
            pandoc "$OUT/$STEM.md" -f gfm-tex_math_dollars -t docx --standalone --lua-filter=/tmp/url_safe.lua -o "$OUT/$STEM.docx"
            mkdir -p "$OUT/lo-$STEM"
            libreoffice --headless --convert-to pdf --outdir "$OUT/lo-$STEM" "$OUT/$STEM.docx"
            mv "$OUT/lo-$STEM/$STEM.pdf" "$OUT/$STEM.pdf"
            rmdir "$OUT/lo-$STEM"
          done

      - name: Validate DOCX PDF and all-page rendering
        shell: bash
        run: |
          set -euo pipefail
          OUT='project/revision-2026/guide-78/publication-candidate'
          test "$(find "$OUT" -maxdepth 1 -name '*.docx' | wc -l)" -eq 3
          test "$(find "$OUT" -maxdepth 1 -name '*.pdf' | wc -l)" -eq 3
          for DOCX in "$OUT"/*.docx; do
            test -s "$DOCX"; unzip -t "$DOCX" >/dev/null; unzip -l "$DOCX" | grep -q 'word/document.xml'
          done
          for PDF in "$OUT"/*.pdf; do
            test -s "$PDF"; pdfinfo "$PDF" >/dev/null
            TEXT="$(pdftotext "$PDF" - | tr -d '[:space:]')"; test ${#TEXT} -gt 12000
          done
          rm -rf "$OUT/rendered"
          for PDF in "$OUT"/*.pdf; do
            STEM="$(basename "$PDF" .pdf)"; mkdir -p "$OUT/rendered/$STEM"
            pdftoppm -png -r 110 "$PDF" "$OUT/rendered/$STEM/page" >/dev/null 2>&1
          done
          python - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageChops
          import json,sys
          root=Path('project/revision-2026/guide-78/publication-candidate/rendered'); problems=[]; pages=[]
          for path in sorted(root.rglob('*.png')):
            with Image.open(path) as im:
              gray=im.convert('L'); diff=ImageChops.difference(gray,Image.new('L',gray.size,255)); bbox=diff.point(lambda p:255 if p>12 else 0).getbbox()
              if bbox is None: problems.append(f'{path}: blank page'); continue
              l,t,r,b=bbox; w,h=gray.size; margins={'left':l,'top':t,'right':w-r,'bottom':h-b}
              if min(margins.values())<2: problems.append(f'{path}: possible clipping {margins}')
              pages.append({'file':str(path.relative_to(root)),'edge_margins':margins})
          (root/'RENDER_QA.json').write_text(json.dumps({'status':'FAIL' if problems else 'PASS','pages':pages,'problems':problems},indent=2)+'\n',encoding='utf-8')
          if problems: print('\n'.join(problems)); sys.exit(1)
          print(f'All-page rendering QA PASS: {len(pages)} pages')
          PY

      - name: Generate metadata checksums and close gates
        shell: python
        run: |
          from pathlib import Path
          import hashlib,json,subprocess
          root=Path('project/revision-2026/guide-78'); out=root/'publication-candidate'
          render=json.loads((out/'rendered/RENDER_QA.json').read_text(encoding='utf-8')); assert render['status']=='PASS'
          editions=[]
          for lang,stem in [('en','GUIDE_78_ENGLISH_v2'),('es-419','GUIDE_78_SPANISH_es-419_v2'),('pt-BR','GUIDE_78_PORTUGUESE_pt-BR_v2')]:
            docx=out/f'{stem}.docx'; pdf=out/f'{stem}.pdf'
            info=subprocess.check_output(['pdfinfo',str(pdf)],text=True)
            page_count=next(int(x.split(':',1)[1]) for x in info.splitlines() if x.startswith('Pages:'))
            rendered=sum(1 for p in render['pages'] if p['file'].startswith(stem+'/'))
            if rendered!=page_count: raise SystemExit(f'{stem}: render/page mismatch {rendered}!={page_count}')
            editions.append({'language':lang,'docx':docx.name,'pdf':pdf.name,'docx_bytes':docx.stat().st_size,'pdf_bytes':pdf.stat().st_size,'pdf_pages':page_count,'rendered_pages':rendered,'status':'PASS'})
          manifest={'guide':'78','occupation':'Web and Digital Interface Designer','build_date':'2026-08-21','status':'PASS','editions':editions,'controlled_source_urls':18,'assurance_boundary':'Internal automated publication QA, controlled live-link checks, all-page render inspection, and controlled source review; not independent human certification, professional translation certification, legal/privacy review, accessibility certification, cybersecurity certification, software-engineering approval, professional accreditation, funding approval, employment guarantee, freelance-work guarantee, client-acquisition guarantee, or earnings guarantee.'}
          (out/'GUIDE_78_PUBLICATION_QA_MANIFEST.json').write_text(json.dumps(manifest,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          targets=sorted(p for p in out.iterdir() if p.is_file() and p.suffix in {'.docx','.pdf'})
          (out/'SHA256SUMS.txt').write_text('\n'.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}' for p in targets)+'\n',encoding='utf-8')
          qa=root/'qa'
          (qa/'GUIDE_78_PUBLICATION_QA_09.md').write_text('# Guide 78 — Publication QA 09\n\n**Stage:** Publication — **PASS**\n\nControlled English, neutral Latin American Spanish (`es-419`), and Brazilian Portuguese (`pt-BR`) Markdown/DOCX/PDF editions passed frozen-source parity, controlled occupation/outlook/wage/accessibility validation, live-link checks, package integrity, searchable-text validation, all-page rendering, page-count reconciliation, metadata, and checksum generation.\n\nNo independent human certification, certified translation, legal/privacy review, accessibility certification, cybersecurity certification, software-engineering approval, professional accreditation, funding approval, employment guarantee, freelance-work guarantee, client-acquisition guarantee, or earnings guarantee is claimed.\n',encoding='utf-8')
          (qa/'GUIDE_78_RELEASE_AUDIT_10.md').write_text('# Guide 78 — Release Audit 10\n\n**Stage:** Release Audit — **PASS**\n\nRelease audit verified all three publication editions, QA manifest, SHA-256 checksums, searchable PDF integrity, all-page rendering evidence, controlled U.S./Canada/Colombia evidence, WIOA/Canada/SENA/OIT-Cinterfor pathways, UI/UX/web/front-end/product authority boundaries, WCAG-aware design limits, ethical research, privacy/cybersecurity safeguards, portfolio integrity, and responsible generative-AI boundaries. Guide 78 is cleared for sequential closure within Draft PR #17.\n',encoding='utf-8')
          status=root/'GUIDE_78_HELPER_STATUS.json'; d=json.loads(status.read_text(encoding='utf-8'))
          assert d['stages']['technical_qa']['status']=='PASS'; assert d['stages']['publication']['status']=='PENDING'; assert d['stages']['release_audit']['status']=='PENDING'; assert not d.get('blockers')
          d['stages']['publication']={'status':'PASS','evidence':['project/revision-2026/guide-78/qa/GUIDE_78_PUBLICATION_QA_09.md','project/revision-2026/guide-78/publication-candidate/GUIDE_78_PUBLICATION_QA_MANIFEST.json','project/revision-2026/guide-78/publication-candidate/SHA256SUMS.txt']}
          d['stages']['release_audit']={'status':'PASS','evidence':['project/revision-2026/guide-78/qa/GUIDE_78_RELEASE_AUDIT_10.md']}
          status.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')

      - name: Remove rendered PNGs from commit scope
        run: rm -rf project/revision-2026/guide-78/publication-candidate/rendered

      - name: Commit controlled publication package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- project/revision-2026/guide-78
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'release(guide-78): publish controlled trilingual package [skip ci]'
          git push origin HEAD:revision/guide-00-100-2026
