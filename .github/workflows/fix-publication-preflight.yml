name: Correct publication preflight defects

on:
  push:
    branches:
      - audit/publication-quality-preflight
    paths:
      - scripts/fix_publication_preflight.py

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: audit/publication-quality-preflight

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Correct inventory and filenames
        run: python scripts/fix_publication_preflight.py

      - name: Commit corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No corrections required."
          else
            git commit -m "Correct publication package inventory and filenames"
            git push origin HEAD:audit/publication-quality-preflight
          fi
