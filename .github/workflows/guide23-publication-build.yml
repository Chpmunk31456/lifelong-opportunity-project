name: Guide 23 controlled publication build

on:
  push:
    branches:
      - revision/guide-00-100-2026
    paths:
      - '.github/workflows/guide23-publication-build.yml'
      - 'project/revision-2026/guide-23/source/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: guide23-controlled-publication-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out revision branch
        uses: actions/checkout@v5
        with:
          ref: revision/guide-00-100-2026
          fetch-depth: 0

      - name: Install document tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc libreoffice poppler-utils

      - name: Prepare controlled sources
        shell: bash
        run: |
          set -euo pipefail
          OUT='project/revision-2026/guide-23/publication-candidate'
          rm -rf "$OUT"
          mkdir -p "$OUT" "$OUT/rendered"
          cp 'project/revision-2026/guide-23/source/GUIDE_23_PROPERTY_MANAGER_COMMUNITY_ASSOCIATION_MANAGER_ENGLISH_v2_WORKING_MASTER.md' "$OUT/GUIDE_23_ENGLISH_v2.md"
          cp 'project/revision-2026/guide-23/source/GUIDE_23_ADMINISTRADOR_PROPIEDADES_COPROPIEDADES_ES419_v2_WORKING_MASTER.md' "$OUT/GUIDE_23_SPANISH_LATAM_v2.md"
          cp 'project/revision-2026/guide-23/source/GUIDE_23_GESTOR_IMOVEIS_ASSOCIACAO_CONDOMINIAL_PTBR_v2_WORKING_MASTER.md' "$OUT/GUIDE_23_PORTUGUESE_BR_v2.md"

      - name: Trilingual structural, link, encoding, and source controls
        shell: python
        run: |
          from pathlib import Path
          import re, sys
          out=Path('project/revision-2026/guide-23/publication-candidate')
          files={
            'en': out/'GUIDE_23_ENGLISH_v2.md',
            'es-419': out/'GUIDE_23_SPANISH_LATAM_v2.md',
            'pt-BR': out/'GUIDE_23_PORTUGUESE_BR_v2.md',
          }
          required_urls=[
            'https://www.onetonline.org/link/summary/11-9141.00',
            'https://www.bls.gov/ooh/management/property-real-estate-and-community-association-managers.htm',
            'https://www.indeed.com/career/property-manager/salaries',
            'https://www.ziprecruiter.com/Salaries/Property-Manager-Salary',
            'https://www.hud.gov/helping-americans/fair-housing-act-overview',
            'https://www.careeronestop.org/Credentials/Toolkit/find-local-training-help.aspx',
            'https://www.apprenticeship.gov/',
            'https://www.jobbank.gc.ca/marketreport/wages-occupation/12494/ca',
            'https://www.jobbank.gc.ca/marketreport/requirements/12494/ca',
          ]
          required_markers=[
            r'CC BY-NC-SA 4\.0', r'\bWIOA\b', r'\bSENA\b',
            r'Apprenticeship\.gov', r'Ley\s+675\s+de\s+2001',
            r'\bNOC\s+13101\b', r'\b(?:AI|IA)\b'
          ]
          problems=[]; counts={}
          for lang,path in files.items():
            text=path.read_text(encoding='utf-8')
            if text.startswith('\ufeff'): problems.append(f'{lang}: unexpected UTF-8 BOM')
            if '\ufffd' in text: problems.append(f'{lang}: Unicode replacement character present')
            headings=re.findall(r'^##\s+.+$', text, re.M); counts[lang]=len(headings)
            if len(headings) < 15: problems.append(f'{lang}: too few level-2 headings ({len(headings)})')
            for u in required_urls:
              if u not in text: problems.append(f'{lang}: missing required URL {u}')
            for p in required_markers:
              if not re.search(p,text,re.I): problems.append(f'{lang}: missing controlled marker {p}')
            urls=re.findall(r'https://[^\s)<>]+', text)
            for u in urls:
              if ' ' in u or not re.match(r'^https://[^\s]+$',u): problems.append(f'{lang}: malformed URL {u}')
            low=text.lower()
            for bad in ('todo:', 'lorem ipsum', '[insert', 'translation pending', 'traducción pendiente', 'tradução pendente'):
              if bad in low: problems.append(f'{lang}: placeholder marker {bad}')
          if len(set(counts.values())) != 1: problems.append(f'level-2 heading count mismatch: {counts}')
          if problems:
            print('\n'.join(problems)); sys.exit(1)
          print(f'Guide 23 structural/link/source controls PASS: {counts}')

      - name: Generate DOCX and PDF editions
        shell: bash
        run: |
          set -euo pipefail
          OUT='project/revision-2026/guide-23/publication-candidate'
          for STEM in GUIDE_23_ENGLISH_v2 GUIDE_23_SPANISH_LATAM_v2 GUIDE_23_PORTUGUESE_BR_v2; do
            pandoc "$OUT/$STEM.md" -f gfm -t docx --standalone -o "$OUT/$STEM.docx"
            mkdir -p "$OUT/lo-$STEM"
            libreoffice --headless --convert-to pdf --outdir "$OUT/lo-$STEM" "$OUT/$STEM.docx"
            mv "$OUT/lo-$STEM/$STEM.pdf" "$OUT/$STEM.pdf"
            rmdir "$OUT/lo-$STEM"
          done

      - name: Validate DOCX and searchable PDFs
        shell: bash
        run: |
          set -euo pipefail
          OUT='project/revision-2026/guide-23/publication-candidate'
          test "$(find "$OUT" -maxdepth 1 -name '*.docx' | wc -l)" -eq 3
          test "$(find "$OUT" -maxdepth 1 -name '*.pdf' | wc -l)" -eq 3
          for DOCX in "$OUT"/*.docx; do
            unzip -t "$DOCX" >/dev/null
            unzip -l "$DOCX" | grep -q 'word/document.xml'
          done
          for PDF in "$OUT"/*.pdf; do
            pdfinfo "$PDF" >/dev/null
            TEXT="$(pdftotext "$PDF" - | tr -d '[:space:]')"
            test ${#TEXT} -gt 5000
          done

      - name: Render all PDF pages
        shell: bash
        run: |
          set -euo pipefail
          OUT='project/revision-2026/guide-23/publication-candidate'
          for PDF in "$OUT"/*.pdf; do
            STEM="$(basename "$PDF" .pdf)"
            mkdir -p "$OUT/rendered/$STEM"
            pdftoppm -png -r 90 "$PDF" "$OUT/rendered/$STEM/page" >/dev/null 2>&1
          done
          test "$(find "$OUT/rendered" -name '*.png' | wc -l)" -gt 3

      - name: Generate metadata manifest and checksums
        shell: python
        run: |
          from pathlib import Path
          import hashlib, json, subprocess
          out=Path('project/revision-2026/guide-23/publication-candidate')
          records=[]
          for lang,stem in [('en','GUIDE_23_ENGLISH_v2'),('es-419','GUIDE_23_SPANISH_LATAM_v2'),('pt-BR','GUIDE_23_PORTUGUESE_BR_v2')]:
            docx=out/f'{stem}.docx'; pdf=out/f'{stem}.pdf'
            info=subprocess.check_output(['pdfinfo',str(pdf)],text=True)
            pages=next(int(x.split(':',1)[1].strip()) for x in info.splitlines() if x.startswith('Pages:'))
            txt=subprocess.check_output(['pdftotext',str(pdf),'-'],text=True,errors='replace')
            if '\ufffd' in txt: raise SystemExit(f'{pdf}: Unicode replacement character in PDF text')
            records.append({'language':lang,'docx':docx.name,'pdf':pdf.name,'docx_bytes':docx.stat().st_size,'pdf_bytes':pdf.stat().st_size,'pdf_pages':pages,'pdf_extractable_characters':len(txt.strip()),'status':'PASS'})
          manifest={'guide':'23','occupation':'Property Manager and Community Association Manager','build_date':'2026-08-10','status':'PASS','controls':['trilingual structural parity','required source URLs','URL syntax','UTF-8/BOM controls','DOCX ZIP integrity','searchable PDF text','all-page raster rendering','metadata manifest','SHA-256 checksums'],'editions':records,'assurance_boundary':'Internal automated publication QA; not independent human review, professional translation certification, accessibility certification, legal review, property-management licensing advice, accreditation, or employment or earnings guarantee.'}
          (out/'GUIDE_23_PUBLICATION_QA_MANIFEST.json').write_text(json.dumps(manifest,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          targets=sorted(p for p in out.iterdir() if p.is_file() and p.suffix in {'.docx','.pdf'})
          (out/'SHA256SUMS.txt').write_text('\n'.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}' for p in targets)+'\n',encoding='utf-8')

      - name: Upload rendered pages
        uses: actions/upload-artifact@v4
        with:
          name: guide23-rendered-pages
          path: project/revision-2026/guide-23/publication-candidate/rendered
          retention-days: 14

      - name: Remove render images from commit scope
        run: rm -rf project/revision-2026/guide-23/publication-candidate/rendered

      - name: Commit controlled publication candidates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add project/revision-2026/guide-23/publication-candidate
          if git diff --cached --quiet; then
            echo 'No publication changes to commit.'
          else
            git commit -m 'Build and validate Guide 23 publication candidates'
            git pull --rebase origin revision/guide-00-100-2026
            git push origin HEAD:revision/guide-00-100-2026
          fi
