name: Guide 48 publication unblock

on:
  push:
    branches: [revision/guide-00-100-2026]
    paths:
      - '.github/workflows/guide48-unblock-publication.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cancel-stale-and-redispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale Guide 48 publication runs and redispatch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/$REPO"
          JSON="$(curl --fail -sS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$API/actions/workflows/guide48-publication-build.yml/runs?branch=revision%2Fguide-00-100-2026&per_page=20")"
          printf '%s' "$JSON" | python - <<'PY' > /tmp/active-runs.txt
          import json, sys
          data = json.load(sys.stdin)
          active = {'queued', 'in_progress', 'pending', 'waiting', 'requested'}
          for run in data.get('workflow_runs', []):
              if run.get('status') in active:
                  print(run['id'])
          PY
          if [ -s /tmp/active-runs.txt ]; then
            while read -r RUN_ID; do
              echo "Cancelling stale Guide 48 publication run $RUN_ID"
              CODE="$(curl -sS -o /tmp/cancel-body -w '%{http_code}' -X POST \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "$API/actions/runs/$RUN_ID/cancel")"
              if [ "$CODE" != "202" ] && [ "$CODE" != "409" ]; then
                cat /tmp/cancel-body
                echo "Unexpected cancel response $CODE for run $RUN_ID" >&2
                exit 1
              fi
            done < /tmp/active-runs.txt
          fi
          sleep 8
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$API/actions/workflows/guide48-publication-build.yml/dispatches" \
            -d '{"ref":"revision/guide-00-100-2026"}'
          echo "Guide 48 controlled publication build redispatched after stale-run cleanup."
