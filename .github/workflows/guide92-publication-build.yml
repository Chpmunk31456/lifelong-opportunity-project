# Controlled Guide 92 publication and release workflow
# v4.1: conflict-safe package/status commits, compact render QA, and line-anchored TODO detection.
name: Guide 92 controlled publication and release

on:
  push:
    branches: [revision/guide-00-100-2026]
    paths:
      - '.github/workflows/guide92-publication-build.yml'
      - 'project/revision-2026/guide-92/qa/GUIDE_92_TRILINGUAL_TECHNICAL_QA_08.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: guide92-controlled-publication
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out latest controlled branch
        uses: actions/checkout@v5
        with:
          ref: revision/guide-00-100-2026
          fetch-depth: 0

      - name: Install publication toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc libreoffice-writer poppler-utils python3-pil curl

      - name: Verify fail-closed predecessor gate
        shell: python
        run: |
          import json
          from pathlib import Path
          root=Path('project/revision-2026/guide-92')
          d=json.loads((root/'GUIDE_92_HELPER_STATUS.json').read_text(encoding='utf-8'))
          assert d['stages']['technical_qa']['status']=='PASS'
          assert d['stages']['publication']['status']=='PENDING'
          assert d['stages']['release_audit']['status']=='PENDING'
          assert not d.get('blockers')

      - name: Freeze trilingual publication inputs
        run: |
          set -euo pipefail
          SRC='project/revision-2026/guide-92/working-masters'
          OUT='project/revision-2026/guide-92/publication-candidate'
          rm -rf "$OUT" && mkdir -p "$OUT"
          cp "$SRC/GUIDE_92_GEOGRAPHIC_INFORMATION_SYSTEMS_TECHNICIAN_ENGLISH_v2.md" "$OUT/GUIDE_92_ENGLISH_v2.md"
          cp "$SRC/GUIDE_92_TECNICO_EN_SISTEMAS_DE_INFORMACION_GEOGRAFICA_ES419_v2.md" "$OUT/GUIDE_92_SPANISH_es-419_v2.md"
          cp "$SRC/GUIDE_92_TECNICO_EM_SISTEMAS_DE_INFORMACAO_GEOGRAFICA_PTBR_v2.md" "$OUT/GUIDE_92_PORTUGUESE_pt-BR_v2.md"

      - name: Validate trilingual Markdown parity and controlled values
        shell: python
        run: |
          from pathlib import Path
          import re,sys
          root=Path('project/revision-2026/guide-92'); out=root/'publication-candidate'
          files=[out/'GUIDE_92_ENGLISH_v2.md',out/'GUIDE_92_SPANISH_es-419_v2.md',out/'GUIDE_92_PORTUGUESE_pt-BR_v2.md']
          texts=[p.read_text(encoding='utf-8') for p in files]
          problems=[]
          for p,t in zip(files,texts):
            if t.startswith('\ufeff') or '\ufffd' in t: problems.append(f'{p.name}: encoding defect')
            if len(t)<14000: problems.append(f'{p.name}: unexpectedly short ({len(t)})')
            if len(re.findall(r'^##\s+.+$',t,re.M))<25: problems.append(f'{p.name}: insufficient major sections')
            low=t.lower()
            if re.search(r'(?im)^\s*(?:[-*]\s*)?todo\s*:',t): problems.append(f'{p.name}: placeholder TODO')
            for bad in ('lorem ipsum','translation pending','traduccion pendiente','tradução pendente'):
              if bad in low: problems.append(f'{p.name}: placeholder {bad}')
          urls=[set(re.findall(r'https://[^\s)<>`]+',t)) for t in texts]
          if not (urls[0]==urls[1]==urls[2]): problems.append(f'reader URL parity mismatch {[len(x) for x in urls]}')
          if len(urls[0])!=23: problems.append(f'expected 23 shared reader URLs, found {len(urls[0])}')
          research=(root/'research/GUIDE_92_CURRENT_SOURCE_EVIDENCE_02.md').read_text(encoding='utf-8')
          evidence=set(re.findall(r'https://[^\s)<>`]+',research))
          if len(evidence)!=23: problems.append(f'expected 23 evidence URLs, found {len(evidence)}')
          controls=[
            r'15-1299\.02',r'22214',r'31123',
            r'55[,.]940',r'26[,.]89',r'79[,.]370',r'38[,.]16',r'116[,.]580',r'56[,.]05',r'157[,.]500',r'75[,.]72',r'188[,.]470',r'90[,.]61',
            r'472[,.]000',r'510[,.]500',r'8\s*%',r'31[,.]300',r'25[,.]88',r'17[,.]60',r'38[,.]06',r'749',r'36\s+(?:months|meses)',
            r'C\$23[,.]08',r'C\$38[,.]10',r'C\$53[,.]85',r'80\s+(?:hours|horas)',r'48\s+(?:hours|horas)',
            r'75\s*%',r'67\s*%',r'34\s*%',r'22\s*%',r'21\s*%',r'14\s*%',r'13\s*%',r'10\s*%',r'7\s*%',r'6\s*%',r'5\s*%'
          ]
          semantics={
            'statistical crosswalk':['computer occupations, all other'],
            'GIS':['gis','sig'],'CRS':['crs'],'datum':['datum'],
            'projection':['projection','proyección','projeção'],
            'lineage':['lineage','linaje','linhagem'],'metadata':['metadata'],
            'topology':['topology','topología','topologia'],
            'georeferencing':['georeferencing','georreferenciación','georreferenciamento'],
            'spatial analysis':['spatial analysis','análisis espacial','análise espacial'],
            'privacy':['privacy','privacidad','privacidade'],
            'survey boundary':['survey-grade','topográfica','levantamento'],
            'responsible AI':['responsible ai','ia responsable','ia responsável'],
            'accessibility':['accessibility','accesibilidad','acessibilidade'],
            'synthetic':['synthetic','sintético','sintética'],
            'Canada surplus':['strong risk of labour surplus']
          }
          for p,t in zip(files,texts):
            for pat in controls:
              if not re.search(pat,t,re.I): problems.append(f'{p.name}: missing controlled value {pat}')
            low=t.lower()
            for label,terms in semantics.items():
              if not any(term.lower() in low for term in terms): problems.append(f'{p.name}: missing semantic control {label}')
          if problems:
            print('\n'.join(problems)); sys.exit(1)
          print('Guide 92 Markdown QA PASS; reader URLs=23; evidence URLs=23')

      - name: Check controlled evidence links
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/guide92_urls.txt
          import re
          from pathlib import Path
          t=Path('project/revision-2026/guide-92/research/GUIDE_92_CURRENT_SOURCE_EVIDENCE_02.md').read_text(encoding='utf-8')
          for u in sorted(set(re.findall(r'https://[^\s)<>`]+',t))): print(u)
          PY
          test "$(wc -l < /tmp/guide92_urls.txt)" -eq 23
          fail=0
          while IFS= read -r url; do
            code="$(curl -L -sS -o /dev/null -w '%{http_code}' --connect-timeout 15 --max-time 35 -A 'Mozilla/5.0 Guide92-QA' "$url" || echo 000)"
            case "$code" in
              200|201|202|204|301|302|303|307|308|401|403|429) echo "LINK OK/WALLED $code $url" ;;
              404|410) echo "LINK FAIL $code $url"; fail=1 ;;
              000|5??) echo "LINK WARN $code $url" ;;
              *) echo "LINK REVIEW $code $url" ;;
            esac
          done < /tmp/guide92_urls.txt
          test "$fail" -eq 0

      - name: Create URL-safe display filter
        run: |
          cat > /tmp/url_safe.lua <<'LUA'
          local function is_long_url(s) return string.match(s, '^https?://') and string.len(s) > 45 end
          function Link(el)
            local text=pandoc.utils.stringify(el.content)
            if is_long_url(text) then return pandoc.Link({pandoc.Str('Source link')},el.target,el.title) end
            return el
          end
          function Str(el)
            local text=el.text
            if is_long_url(text) then return pandoc.Link({pandoc.Str('Source link')},text) end
            return el
          end
          LUA

      - name: Generate DOCX and searchable PDF editions
        run: |
          set -euo pipefail
          OUT='project/revision-2026/guide-92/publication-candidate'
          for STEM in GUIDE_92_ENGLISH_v2 GUIDE_92_SPANISH_es-419_v2 GUIDE_92_PORTUGUESE_pt-BR_v2; do
            pandoc "$OUT/$STEM.md" -f gfm-tex_math_dollars -t docx --standalone --lua-filter=/tmp/url_safe.lua -o "$OUT/$STEM.docx"
            mkdir -p "$OUT/lo-$STEM"
            libreoffice --headless --convert-to pdf --outdir "$OUT/lo-$STEM" "$OUT/$STEM.docx"
            mv "$OUT/lo-$STEM/$STEM.pdf" "$OUT/$STEM.pdf"
            rmdir "$OUT/lo-$STEM"
          done

      - name: Validate DOCX PDF and all-page rendering
        run: |
          set -euo pipefail
          OUT='project/revision-2026/guide-92/publication-candidate'
          test "$(find "$OUT" -maxdepth 1 -name '*.docx' | wc -l)" -eq 3
          test "$(find "$OUT" -maxdepth 1 -name '*.pdf' | wc -l)" -eq 3
          for DOCX in "$OUT"/*.docx; do test -s "$DOCX"; unzip -t "$DOCX" >/dev/null; unzip -l "$DOCX" | grep -q 'word/document.xml'; done
          for PDF in "$OUT"/*.pdf; do test -s "$PDF"; pdfinfo "$PDF" >/dev/null; test "$(pdftotext "$PDF" - | tr -d '[:space:]' | wc -c)" -gt 9500; done
          rm -rf "$OUT/rendered"
          for PDF in "$OUT"/*.pdf; do STEM="$(basename "$PDF" .pdf)"; mkdir -p "$OUT/rendered/$STEM"; pdftoppm -png -r 110 "$PDF" "$OUT/rendered/$STEM/page" >/dev/null 2>&1; done
          python - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageChops
          import json,sys
          root=Path('project/revision-2026/guide-92/publication-candidate/rendered'); problems=[]; pages=[]
          for path in sorted(root.rglob('*.png')):
            with Image.open(path) as im:
              gray=im.convert('L'); diff=ImageChops.difference(gray,Image.new('L',gray.size,255)); bbox=diff.point(lambda p:255 if p>12 else 0).getbbox()
              if bbox is None: problems.append(f'{path}: blank page'); continue
              l,t,r,b=bbox; w,h=gray.size; margins={'left':l,'top':t,'right':w-r,'bottom':h-b}
              if min(margins.values())<2: problems.append(f'{path}: possible clipping {margins}')
              pages.append({'file':str(path.relative_to(root)),'edge_margins':margins})
          (root/'RENDER_QA.json').write_text(json.dumps({'status':'FAIL' if problems else 'PASS','pages':pages,'problems':problems},indent=2)+'\n',encoding='utf-8')
          if problems: print('\n'.join(problems)); sys.exit(1)
          print(f'All-page rendering QA PASS: {len(pages)} pages')
          PY

      - name: Generate publication metadata and preserve compact render QA
        shell: python
        run: |
          from pathlib import Path
          import hashlib,json,subprocess,shutil
          root=Path('project/revision-2026/guide-92'); out=root/'publication-candidate'; qa=root/'qa'
          render=json.loads((out/'rendered/RENDER_QA.json').read_text(encoding='utf-8')); assert render['status']=='PASS'
          editions=[]
          for lang,stem in [('en','GUIDE_92_ENGLISH_v2'),('es-419','GUIDE_92_SPANISH_es-419_v2'),('pt-BR','GUIDE_92_PORTUGUESE_pt-BR_v2')]:
            docx=out/f'{stem}.docx'; pdf=out/f'{stem}.pdf'; info=subprocess.check_output(['pdfinfo',str(pdf)],text=True)
            pc=next(int(x.split(':',1)[1]) for x in info.splitlines() if x.startswith('Pages:'))
            rendered=sum(1 for p in render['pages'] if p['file'].startswith(stem+'/'))
            assert pc==rendered
            editions.append({'language':lang,'docx':docx.name,'pdf':pdf.name,'docx_bytes':docx.stat().st_size,'pdf_bytes':pdf.stat().st_size,'pdf_pages':pc,'rendered_pages':rendered,'status':'PASS'})
          manifest={'guide':'92','occupation':'Geographic Information Systems Technician','build_date':'2026-08-22','status':'PASS','editions':editions,'controlled_evidence_urls':23,'reader_verification_urls':23,'official_statistics_boundary':'O*NET 15-1299.02 wage and employment values are collected from Computer Occupations, All Other; all editions preserve this disclosure and separately label title-specific Indeed GIS Technician context.','assurance_boundary':'Internal automated publication QA, controlled link checks, all-page render inspection, and controlled source review; not independent human certification, certified translation, legal/surveying/cadastral/privacy/cybersecurity/geospatial-accuracy/regulatory/accessibility certification, training-provider accreditation, funding approval, employment guarantee, or earnings guarantee.'}
          (out/'GUIDE_92_PUBLICATION_QA_MANIFEST.json').write_text(json.dumps(manifest,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          (out/'RENDER_QA.json').write_text(json.dumps(render,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          targets=sorted(p for p in out.iterdir() if p.is_file() and p.suffix in {'.docx','.pdf'})
          (out/'SHA256SUMS.txt').write_text('\n'.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}' for p in targets)+'\n',encoding='utf-8')
          (qa/'GUIDE_92_PUBLICATION_QA_09.md').write_text('# Guide 92 — Publication QA 09\n\n**Stage:** Publication — **PASS**\n\nEnglish, es-419 and pt-BR Markdown/DOCX/PDF editions passed occupation/numeric/semantic parity, mandatory Computer Occupations, All Other crosswalk disclosure, 23-link reader parity, 23-source evidence-link checks, DOCX integrity, searchable-PDF validation, all-page rendering, page reconciliation, metadata and SHA-256 checksum generation.\n\nNo independent human certification, certified translation, legal/surveying/cadastral/privacy/security/geospatial-accuracy/regulatory/accessibility certification, funding approval, employment guarantee or earnings guarantee is claimed.\n',encoding='utf-8')
          (qa/'GUIDE_92_RELEASE_AUDIT_10.md').write_text('# Guide 92 — Release Audit 10\n\n**Stage:** Release Audit — **PASS**\n\nRelease audit confirms all predecessor gates, trilingual publication artifacts, 23-source/23-reader-link traceability, required U.S. statistics crosswalk disclosure, checksums and all-page rendering. No blockers remain.\n',encoding='utf-8')
          shutil.rmtree(out/'rendered')

      - name: Commit verified publication package without status file
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          OUT='project/revision-2026/guide-92/publication-candidate'
          git add \
            "$OUT/GUIDE_92_ENGLISH_v2.md" "$OUT/GUIDE_92_SPANISH_es-419_v2.md" "$OUT/GUIDE_92_PORTUGUESE_pt-BR_v2.md" \
            "$OUT/GUIDE_92_ENGLISH_v2.docx" "$OUT/GUIDE_92_SPANISH_es-419_v2.docx" "$OUT/GUIDE_92_PORTUGUESE_pt-BR_v2.docx" \
            "$OUT/GUIDE_92_ENGLISH_v2.pdf" "$OUT/GUIDE_92_SPANISH_es-419_v2.pdf" "$OUT/GUIDE_92_PORTUGUESE_pt-BR_v2.pdf" \
            "$OUT/GUIDE_92_PUBLICATION_QA_MANIFEST.json" "$OUT/RENDER_QA.json" "$OUT/SHA256SUMS.txt" \
            project/revision-2026/guide-92/qa/GUIDE_92_PUBLICATION_QA_09.md \
            project/revision-2026/guide-92/qa/GUIDE_92_RELEASE_AUDIT_10.md
          git commit -m 'build(guide-92): publish controlled trilingual package'
          git pull --rebase origin revision/guide-00-100-2026
          git push origin HEAD:revision/guide-00-100-2026

      - name: Refresh live branch and close status gates separately
        run: |
          set -euo pipefail
          git pull --rebase origin revision/guide-00-100-2026
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('project/revision-2026/guide-92/GUIDE_92_HELPER_STATUS.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d['stages']['technical_qa']['status']=='PASS'
          assert not d.get('blockers')
          d['stages']['publication']={'status':'PASS','evidence':['project/revision-2026/guide-92/qa/GUIDE_92_PUBLICATION_QA_09.md','project/revision-2026/guide-92/publication-candidate/GUIDE_92_PUBLICATION_QA_MANIFEST.json','project/revision-2026/guide-92/publication-candidate/SHA256SUMS.txt','project/revision-2026/guide-92/publication-candidate/RENDER_QA.json']}
          d['stages']['release_audit']={'status':'PASS','evidence':['project/revision-2026/guide-92/qa/GUIDE_92_RELEASE_AUDIT_10.md']}
          d['blockers']=[]
          d.pop('workflow_retry_note',None)
          p.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          PY
          git add project/revision-2026/guide-92/GUIDE_92_HELPER_STATUS.json
          git commit -m 'qa(guide-92): close publication and release gates' || true
          git pull --rebase origin revision/guide-00-100-2026
          git push origin HEAD:revision/guide-00-100-2026
