name: Guide 91 publication diagnostic

on:
  push:
    branches: [revision/guide-00-100-2026]
    paths:
      - '.github/workflows/guide91-publication-diagnostic.yml'
      - 'project/revision-2026/guide-91/qa/GUIDE_91_TRILINGUAL_TECHNICAL_QA_08.md'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: revision/guide-00-100-2026
          fetch-depth: 0
      - name: Run non-destructive Markdown validator probe
        shell: python
        run: |
          from pathlib import Path
          import re,json
          root=Path('project/revision-2026/guide-91')
          files=[root/'working-masters/GUIDE_91_CLOUD_SUPPORT_SPECIALIST_ENGLISH_v2.md',root/'working-masters/GUIDE_91_ESPECIALISTA_DE_SOPORTE_EN_LA_NUBE_ES419_v2.md',root/'working-masters/GUIDE_91_ESPECIALISTA_EM_SUPORTE_DE_NUVEM_PTBR_v2.md']
          texts=[p.read_text(encoding='utf-8') for p in files]
          report={'files':{},'problems':[]}
          for p,t in zip(files,texts):
            report['files'][p.name]={'characters':len(t),'h2':len(re.findall(r'^##\s+.+$',t,re.M)),'urls':len(set(re.findall(r'https://[^\s)<>`]+',t)))}
          urls=[set(re.findall(r'https://[^\s)<>`]+',t)) for t in texts]
          report['reader_url_counts']=[len(x) for x in urls]; report['reader_url_parity']=urls[0]==urls[1]==urls[2]
          research=(root/'research/GUIDE_91_CURRENT_SOURCE_EVIDENCE_02.md').read_text(encoding='utf-8')
          report['evidence_url_count']=len(set(re.findall(r'https://[^\s)<>`]+',research)))
          controls=[r'15-1231\.00',r'22220',r'22221',r'35130',r'35121',r'47[,.]120',r'22[,.]65',r'58[,.]240',r'28[,.]00',r'76[,.]220',r'36[,.]64',r'98[,.]750',r'47[,.]48',r'127[,.]780',r'61[,.]43',r'152[,.]700',r'155[,.]500',r'2\s*%',r'9[,.]600',r'135[,.]392',r'88[,.]667',r'206[,.]741',r'4[,.]5\s*k',r'36\s+(?:months|meses)',r'C\$21[,.]00',r'C\$36[,.]00',r'C\$55[,.]00',r'C\$20[,.]50',r'C\$31[,.]47',r'C\$49[,.]00',r'2[,.]256\s+(?:hours|horas)',r'48\s+(?:hours|horas)',r'13\s*%',r'9\s*%',r'7\s*%',r'6\s*%',r'5\s*%',r'3\s*%',r'10\s*%']
          semantics={'cloud':['cloud','nube','nuvem'],'shared responsibility':['shared responsibility','responsabilidad compartida','responsabilidade compartilhada'],'MFA':['mfa'],'least privilege':['least privilege','mínimo privilegio','menor privilégio'],'DNS':['dns'],'backup':['backup'],'recoverability':['recoverability','recuperabilidad','recuperabilidade'],'replication':['replication','replicación','replicação'],'production authority':['production authority','autoridad de producción','autoridade de produção'],'privacy':['privacy','privacidad','privacidade'],'data residency':['data residency','residencia de datos','residência de dados'],'cost':['cost','costo','custo'],'accessibility':['accessibility','accesibilidad','acessibilidade'],'responsible AI':['responsible ai','ia responsable','ia responsável'],'synthetic':['synthetic','sintético','sintética']}
          for p,t in zip(files,texts):
            for pat in controls:
              if not re.search(pat,t,re.I): report['problems'].append(f'{p.name}: missing control {pat}')
            low=t.lower()
            for label,terms in semantics.items():
              if not any(term.lower() in low for term in terms): report['problems'].append(f'{p.name}: missing semantic {label}')
          if not report['reader_url_parity']: report['problems'].append('reader URL parity mismatch')
          if report['reader_url_counts'] != [30,30,30]: report['problems'].append(f"reader URL counts {report['reader_url_counts']} expected [30,30,30]")
          if report['evidence_url_count'] != 36: report['problems'].append(f"evidence URL count {report['evidence_url_count']} expected 36")
          (root/'qa/GUIDE_91_PUBLICATION_DIAGNOSTIC.json').write_text(json.dumps(report,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
      - name: Commit diagnostic only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add project/revision-2026/guide-91/qa/GUIDE_91_PUBLICATION_DIAGNOSTIC.json
          git commit -m 'qa(guide-91): record publication diagnostic' || exit 0
          git pull --rebase origin revision/guide-00-100-2026
          git push origin HEAD:revision/guide-00-100-2026
