name: Guide 07 finalize publication status labels

on:
  workflow_dispatch:
  push:
    branches:
      - revision/guide-00-100-2026
    paths:
      - .github/workflows/guide07-finalize-status-labels.yml
      - scripts/guide07_finalize_status_labels.py

permissions:
  contents: write

concurrency:
  group: guide07-finalize-status-labels
  cancel-in-progress: false

jobs:
  finalize:
    if: github.repository == 'Chpmunk31456/lifelong-opportunity-project'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out controlled revision branch
        uses: actions/checkout@v4
        with:
          ref: revision/guide-00-100-2026
          fetch-depth: 0

      - name: Apply fail-closed status-label corrections
        run: python scripts/guide07_finalize_status_labels.py

      - name: Commit corrected source status labels
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project/revision-2026/guide-07/source
          git diff --cached --check
          git commit -m "fix(guide-07): align source status labels with publication candidate"
          git fetch origin revision/guide-00-100-2026
          git rebase origin/revision/guide-00-100-2026
          git push origin HEAD:revision/guide-00-100-2026
