name: Guide 07 final release audit

on:
  workflow_dispatch:
  push:
    branches:
      - revision/guide-00-100-2026
    paths:
      - .github/workflows/guide07-release-audit.yml
      - scripts/guide07_release_audit.py
      - project/revision-2026/guide-07/GUIDE_07_HELPER_STATUS.json
      - project/revision-2026/guide-07/qa/GUIDE_07_FULL_PAGE_VISUAL_REVIEW_10.md
      - project/revision-2026/guide-07/publication-candidate/**

permissions:
  contents: write

concurrency:
  group: guide07-release-audit
  cancel-in-progress: false

jobs:
  audit:
    if: github.repository == 'Chpmunk31456/lifelong-opportunity-project'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out controlled revision branch
        uses: actions/checkout@v4
        with:
          ref: revision/guide-00-100-2026
          fetch-depth: 0

      - name: Run fail-closed release auditor
        run: python scripts/guide07_release_audit.py

      - name: Commit final release-audit evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project/revision-2026/guide-07/qa/GUIDE_07_FINAL_PUBLICATION_CANDIDATE_GATE_11.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Guide 07 final audit evidence already current.'
            exit 0
          fi
          git commit -m "qa(guide-07): record final publication-candidate PASS"
          git fetch origin revision/guide-00-100-2026
          git rebase origin/revision/guide-00-100-2026
          python scripts/guide07_release_audit.py
          git add project/revision-2026/guide-07/qa/GUIDE_07_FINAL_PUBLICATION_CANDIDATE_GATE_11.md
          git commit --amend --no-edit || true
          git push origin HEAD:revision/guide-00-100-2026
