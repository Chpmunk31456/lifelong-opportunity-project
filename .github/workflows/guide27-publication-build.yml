name: Guide 27 controlled publication build

on:
  push:
    branches:
      - revision/guide-00-100-2026
    paths:
      - '.github/workflows/guide27-publication-build.yml'
      - 'project/revision-2026/guide-27/publication-candidate/GUIDE_27_ENGLISH_v2.md'
      - 'project/revision-2026/guide-27/publication-candidate/GUIDE_27_SPANISH_es-419_v2.md'
      - 'project/revision-2026/guide-27/publication-candidate/GUIDE_27_PORTUGUESE_BR_v2.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: guide27-controlled-publication-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out revision branch
        uses: actions/checkout@v5
        with:
          ref: revision/guide-00-100-2026
          fetch-depth: 0

      - name: Install document tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc libreoffice poppler-utils

      - name: Trilingual structural, link, encoding, and source controls
        shell: python
        run: |
          from pathlib import Path
          import re, sys
          out=Path('project/revision-2026/guide-27/publication-candidate')
          files={
            'en': out/'GUIDE_27_ENGLISH_v2.md',
            'es-419': out/'GUIDE_27_SPANISH_es-419_v2.md',
            'pt-BR': out/'GUIDE_27_PORTUGUESE_BR_v2.md',
          }
          required_urls=[
            'https://www.bls.gov/ooh/installation-maintenance-and-repair/diesel-service-technicians-and-mechanics.htm',
            'https://www.dol.gov/agencies/eta/wioa/programs',
            'https://www.careeronestop.org/LocalHelp/EmploymentAndTraining/find-WIOA-training-programs.aspx',
            'https://www.apprenticeship.gov/apprenticeship-occupations/listings?occupationCode=49-3031.00',
            'https://studentaid.gov/',
            'https://www.irs.gov/newsroom/irs-updates-frequently-asked-questions-about-section-127-educational-assistance-programs',
            'https://www.epa.gov/mvac/section-609-technician-training-and-certification-programs',
            'https://www.osha.gov/diesel-exhaust/standards',
            'https://www.cdc.gov/niosh/npg/npgd0207.html',
            'https://www.jobbank.gc.ca/marketreport/summary-occupation/14814/ca',
            'https://red-seal.ca/eng/trades/truck-transp-mech.shtml',
            'https://www.jobbank.gc.ca/marketreport/summary-occupation/7497/ca',
            'https://www.red-seal.ca/eng/trades/heavydutyequiptech/overview.shtml',
            'https://betowa.sena.edu.co/oferta/mantenimiento-de-los-motores-diesel?modality=P&programId=122854',
            'https://ape.sena.edu.co/',
            'https://www.indeed.com/career/diesel-mechanic/salaries',
          ]
          required_patterns=[
            r'\bWIOA\b', r'\bSENA\b', r'Apprenticeship\.gov', r'\b72410\b', r'\b72401\b',
            r'(?:Section|Secci[oó]n|Se[cç][aã]o)\s+609', r'\b(?:AI|IA)\b', r'2\.0'
          ]
          problems=[]; counts={}; urls_by_lang={}
          for lang,path in files.items():
            if not path.exists(): problems.append(f'{lang}: missing {path}'); continue
            text=path.read_text(encoding='utf-8')
            if text.startswith('\ufeff'): problems.append(f'{lang}: unexpected UTF-8 BOM')
            if '\ufffd' in text: problems.append(f'{lang}: Unicode replacement character present')
            numbered=re.findall(r'^##\s+\d+\.', text, re.M); counts[lang]=len(numbered)
            if len(numbered) != 18: problems.append(f'{lang}: expected 18 numbered sections, found {len(numbered)}')
            urls=re.findall(r'https://[^\s)<>]+', text); urls_by_lang[lang]=len(urls)
            for u in required_urls:
              if u not in text: problems.append(f'{lang}: missing required URL {u}')
            for p in required_patterns:
              if not re.search(p,text,re.I): problems.append(f'{lang}: missing controlled marker {p}')
            low=text.lower()
            for bad in ('todo:', 'lorem ipsum', '[insert', 'translation pending', 'traducción pendiente', 'tradução pendente'):
              if bad in low: problems.append(f'{lang}: placeholder marker {bad}')
          if len(set(counts.values())) != 1: problems.append(f'numbered-section mismatch: {counts}')
          if len(set(urls_by_lang.values())) != 1: problems.append(f'URL-count mismatch: {urls_by_lang}')
          if problems:
            print('\n'.join(problems)); sys.exit(1)
          print(f'Guide 27 structural/link/source controls PASS: sections={counts}; urls={urls_by_lang}')

      - name: Generate DOCX and PDF editions
        shell: bash
        run: |
          set -euo pipefail
          OUT='project/revision-2026/guide-27/publication-candidate'
          for STEM in GUIDE_27_ENGLISH_v2 GUIDE_27_SPANISH_es-419_v2 GUIDE_27_PORTUGUESE_BR_v2; do
            pandoc "$OUT/$STEM.md" -f gfm -t docx --standalone -o "$OUT/$STEM.docx"
            mkdir -p "$OUT/lo-$STEM"
            libreoffice --headless --convert-to pdf --outdir "$OUT/lo-$STEM" "$OUT/$STEM.docx"
            mv "$OUT/lo-$STEM/$STEM.pdf" "$OUT/$STEM.pdf"
            rmdir "$OUT/lo-$STEM"
          done

      - name: Validate DOCX and searchable PDFs
        shell: bash
        run: |
          set -euo pipefail
          OUT='project/revision-2026/guide-27/publication-candidate'
          test "$(find "$OUT" -maxdepth 1 -name '*.docx' | wc -l)" -eq 3
          test "$(find "$OUT" -maxdepth 1 -name '*.pdf' | wc -l)" -eq 3
          for DOCX in "$OUT"/*.docx; do
            unzip -t "$DOCX" >/dev/null
            unzip -l "$DOCX" | grep -q 'word/document.xml'
          done
          for PDF in "$OUT"/*.pdf; do
            pdfinfo "$PDF" >/dev/null
            TEXT="$(pdftotext "$PDF" - | tr -d '[:space:]')"
            test ${#TEXT} -gt 5000
          done

      - name: Render all PDF pages
        shell: bash
        run: |
          set -euo pipefail
          OUT='project/revision-2026/guide-27/publication-candidate'
          rm -rf "$OUT/rendered"
          for PDF in "$OUT"/*.pdf; do
            STEM="$(basename "$PDF" .pdf)"
            mkdir -p "$OUT/rendered/$STEM"
            pdftoppm -png -r 110 "$PDF" "$OUT/rendered/$STEM/page" >/dev/null 2>&1
          done
          test "$(find "$OUT/rendered" -name '*.png' | wc -l)" -gt 3

      - name: Generate metadata manifest and checksums
        shell: python
        run: |
          from pathlib import Path
          import hashlib, json, subprocess
          out=Path('project/revision-2026/guide-27/publication-candidate')
          records=[]
          for lang,stem in [('en','GUIDE_27_ENGLISH_v2'),('es-419','GUIDE_27_SPANISH_es-419_v2'),('pt-BR','GUIDE_27_PORTUGUESE_BR_v2')]:
            docx=out/f'{stem}.docx'; pdf=out/f'{stem}.pdf'
            info=subprocess.check_output(['pdfinfo',str(pdf)],text=True)
            pages=next(int(x.split(':',1)[1].strip()) for x in info.splitlines() if x.startswith('Pages:'))
            txt=subprocess.check_output(['pdftotext',str(pdf),'-'],text=True,errors='replace')
            if '\ufffd' in txt: raise SystemExit(f'{pdf}: Unicode replacement character in PDF text')
            records.append({'language':lang,'docx':docx.name,'pdf':pdf.name,'docx_bytes':docx.stat().st_size,'pdf_bytes':pdf.stat().st_size,'pdf_pages':pages,'pdf_extractable_characters':len(txt.strip()),'status':'PASS'})
          manifest={'guide':'27','occupation':'Diesel Service Technician and Mechanic','build_date':'2026-08-11','status':'PASS','controls':['trilingual structural parity','required source URLs','URL parity','UTF-8/BOM controls','placeholder scan','DOCX ZIP integrity','searchable PDF text','all-page raster rendering','metadata manifest','SHA-256 checksums'],'editions':records,'assurance_boundary':'Internal automated publication QA; not independent human review, professional translation certification, accessibility certification, legal review, trade licensing approval, accreditation, or employment or earnings guarantee.'}
          (out/'GUIDE_27_PUBLICATION_QA_MANIFEST.json').write_text(json.dumps(manifest,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          targets=sorted(p for p in out.iterdir() if p.is_file() and p.suffix in {'.docx','.pdf'})
          (out/'SHA256SUMS.txt').write_text('\n'.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}' for p in targets)+'\n',encoding='utf-8')

      - name: Upload rendered pages
        uses: actions/upload-artifact@v4
        with:
          name: guide27-rendered-pages
          path: project/revision-2026/guide-27/publication-candidate/rendered
          retention-days: 14

      - name: Remove render images from commit scope
        run: rm -rf project/revision-2026/guide-27/publication-candidate/rendered

      - name: Commit controlled publication candidates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add project/revision-2026/guide-27/publication-candidate
          if git diff --cached --quiet; then
            echo 'No publication changes to commit.'
          else
            git commit -m 'Build and validate Guide 27 publication candidates'
            git pull --rebase origin revision/guide-00-100-2026
            git push origin HEAD:revision/guide-00-100-2026
          fi
