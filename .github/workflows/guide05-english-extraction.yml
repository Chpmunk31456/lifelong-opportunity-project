name: Guide 05 English extraction and reconciliation

on:
  workflow_dispatch:
  push:
    branches:
      - revision/guide-00-100-2026
    paths:
      - .github/workflows/guide05-english-extraction.yml
      - 05-bookkeeping-and-payroll-specialist/english/docx/Lifelong_Opportunity_Bookkeeping_and_Payroll_Specialist_Guide_English_v1.0.docx
      - 05-bookkeeping-and-payroll-specialist/english/pdf/Lifelong_Opportunity_Bookkeeping_and_Payroll_Specialist_Guide_English_v1.0.pdf

permissions:
  contents: write

concurrency:
  group: guide05-english-extraction
  cancel-in-progress: false

jobs:
  extract-and-reconcile:
    if: github.repository == 'Chpmunk31456/lifelong-opportunity-project'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out controlled revision branch
        uses: actions/checkout@v4
        with:
          ref: revision/guide-00-100-2026
          fetch-depth: 0

      - name: Install deterministic parsers
        run: python -m pip install --disable-pip-version-check python-docx==1.1.2 pypdf==5.9.0

      - name: Extract legacy DOCX and PDF and build reconciliation evidence
        shell: python
        run: |
          from pathlib import Path
          from docx import Document
          from pypdf import PdfReader
          import hashlib
          import re
          import difflib

          root = Path('.')
          docx_path = root / '05-bookkeeping-and-payroll-specialist/english/docx/Lifelong_Opportunity_Bookkeeping_and_Payroll_Specialist_Guide_English_v1.0.docx'
          pdf_path = root / '05-bookkeeping-and-payroll-specialist/english/pdf/Lifelong_Opportunity_Bookkeeping_and_Payroll_Specialist_Guide_English_v1.0.pdf'
          out = root / 'project/revision-2026/guide-05/qa/evidence'
          out.mkdir(parents=True, exist_ok=True)

          def file_sha256(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def strip_trailing_ws(text):
              return '\n'.join(line.rstrip() for line in text.splitlines()).rstrip() + '\n'

          doc = Document(docx_path)
          blocks = []
          headings = []
          for paragraph in doc.paragraphs:
              text = ' '.join(paragraph.text.split())
              if text:
                  blocks.append(text)
                  style = (paragraph.style.name or '').lower()
                  if 'heading' in style:
                      headings.append(text)
          for table in doc.tables:
              for row in table.rows:
                  values = [' '.join(cell.text.split()) for cell in row.cells]
                  values = [value for value in values if value]
                  if values:
                      blocks.append(' | '.join(values))
          doc_text = '\n'.join(blocks)

          reader = PdfReader(str(pdf_path))
          pages = []
          for number, page in enumerate(reader.pages, 1):
              text = (page.extract_text() or '').replace('\x00', '').strip()
              pages.append('--- PAGE ' + str(number) + ' ---\n' + text)
          pdf_text = '\n'.join(pages)

          doc_extract = out / 'guide05_legacy_docx_extract.txt'
          pdf_extract = out / 'guide05_legacy_pdf_extract.txt'
          doc_extract.write_text(strip_trailing_ws(doc_text), encoding='utf-8')
          pdf_extract.write_text(strip_trailing_ws(pdf_text), encoding='utf-8')

          def normalize(text):
              text = text.lower().replace('–', '-').replace('—', '-').replace('’', "'")
              text = re.sub(r'--- page \d+ ---', ' ', text)
              text = re.sub(r'\s+', ' ', text)
              text = re.sub(r"[^a-z0-9$%+./#' -]", '', text)
              return text.strip()

          nd = normalize(doc_text)
          npdf = normalize(pdf_text)
          sequence = difflib.SequenceMatcher(None, nd, npdf).ratio()
          token_pattern = r"[a-z0-9][a-z0-9$%+./#'-]*"
          doc_tokens = set(re.findall(token_pattern, nd))
          pdf_tokens = set(re.findall(token_pattern, npdf))
          union = doc_tokens | pdf_tokens
          jaccard = len(doc_tokens & pdf_tokens) / len(union) if union else 1.0

          fact_pattern = re.compile(r'(?<![A-Za-z])(?:\$?\d[\d,.]*%?|IRS|FLSA|BLS|WIOA|SENA)', re.I)
          doc_facts = set(value.lower() for value in fact_pattern.findall(doc_text))
          pdf_facts = set(value.lower() for value in fact_pattern.findall(pdf_text))
          only_doc = sorted(doc_facts - pdf_facts)
          only_pdf = sorted(pdf_facts - doc_facts)

          if sequence >= 0.90 and jaccard >= 0.90 and not only_doc and not only_pdf:
              classification = 'HIGH_EQUIVALENCE'
          elif sequence >= 0.80 and jaccard >= 0.85 and len(only_doc) + len(only_pdf) <= 4:
              classification = 'PROBABLE_EQUIVALENCE_REVIEW_REQUIRED'
          else:
              classification = 'RECONCILE'

          lines = [
              '# Guide 05 — Legacy English Extraction and Reconciliation 02',
              '',
              'Date: 2026-08-08',
              'Branch: `revision/guide-00-100-2026`',
              'Guide: 05 — Bookkeeping and Payroll Specialist',
              '',
              '## Gate purpose',
              '',
              'Deterministically extract the legacy English DOCX and searchable PDF, preserve both text extractions as audit evidence, and measure whether one artifact can safely be treated as the sole source for the 2026 reconstruction. This is a source-reconciliation control, not factual revalidation, tax or legal advice, publication approval, independent human review, certification, accreditation, or accessibility certification.',
              '',
              '## Artifact fingerprints',
              '',
              '- DOCX Git blob SHA: `51f522332fc8b91077c6d842c27bee88b6df3e92`',
              '- PDF Git blob SHA: `3a6e258509b7688ceb6dde8322648cbeca82e85d`',
              '- DOCX SHA-256: `' + file_sha256(docx_path) + '`',
              '- PDF SHA-256: `' + file_sha256(pdf_path) + '`',
              '- DOCX extracted non-empty blocks: ' + str(len(blocks)),
              '- PDF pages: ' + str(len(reader.pages)),
              '- DOCX extracted characters: ' + format(len(doc_text), ','),
              '- PDF extracted characters: ' + format(len(pdf_text), ','),
              '',
              '## Deterministic comparison',
              '',
              '- Normalized character-sequence similarity: **' + format(sequence, '.4f') + '**',
              '- Normalized unique-token Jaccard similarity: **' + format(jaccard, '.4f') + '**',
              '- Material token/fact set only in DOCX: `' + (', '.join(only_doc) or 'none detected') + '`',
              '- Material token/fact set only in PDF: `' + (', '.join(only_pdf) or 'none detected') + '`',
              '- Automated classification: **' + classification + '**',
              '',
              'The character score is deliberately sensitive to pagination, line wrapping, and repeated PDF headers. The token score is more tolerant of layout noise. Neither score by itself proves substantive equivalence.',
              '',
              '## DOCX heading inventory',
              '',
          ]
          lines.extend('- ' + heading for heading in headings[:100])
          lines.extend([
              '',
              '## Evidence files',
              '',
              '- `project/revision-2026/guide-05/qa/evidence/guide05_legacy_docx_extract.txt`',
              '- `project/revision-2026/guide-05/qa/evidence/guide05_legacy_pdf_extract.txt`',
              '',
              '## Controlled decision',
              '',
              '**HOLD for substantive reconciliation.** The extracted evidence is deterministic and auditable, but the 2026 English working master must not be frozen from an automated similarity score alone. Review the extracted substantive sections, identify any PDF-only or DOCX-only material, and record the composite-source decision before drafting the revised master.',
              '',
          ])
          qa = root / 'project/revision-2026/guide-05/qa/GUIDE_05_LEGACY_ENGLISH_EXTRACTION_RECONCILIATION_02.md'
          qa.parent.mkdir(parents=True, exist_ok=True)
          qa.write_text(strip_trailing_ws('\n'.join(lines)), encoding='utf-8')
          print('classification=' + classification)
          print('sequence_similarity=' + format(sequence, '.4f'))
          print('token_jaccard=' + format(jaccard, '.4f'))

      - name: Commit completed extraction evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project/revision-2026/guide-05/qa/GUIDE_05_LEGACY_ENGLISH_EXTRACTION_RECONCILIATION_02.md
          git add project/revision-2026/guide-05/qa/evidence/guide05_legacy_docx_extract.txt
          git add project/revision-2026/guide-05/qa/evidence/guide05_legacy_pdf_extract.txt
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Guide 05 extraction outputs already match the current artifacts.'
            exit 0
          fi
          git commit -m "docs(guide-05): extract and reconcile legacy English artifacts"
          git fetch origin revision/guide-00-100-2026
          git rebase origin/revision/guide-00-100-2026
          git push origin HEAD:revision/guide-00-100-2026
