name: Guide 24 controlled publication build

on:
  push:
    branches:
      - revision/guide-00-100-2026
    paths:
      - '.github/workflows/guide24-publication-build.yml'
      - '24-facilities-coordinator-and-building-operations-assistant/english/**'
      - '24-facilities-coordinator-and-building-operations-assistant/spanish/**'
      - '24-facilities-coordinator-and-building-operations-assistant/portuguese/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: guide24-controlled-publication-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out revision branch
        uses: actions/checkout@v5
        with:
          ref: revision/guide-00-100-2026
          fetch-depth: 0

      - name: Install document tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc libreoffice poppler-utils

      - name: Prepare controlled sources
        shell: bash
        run: |
          set -euo pipefail
          OUT='project/revision-2026/guide-24/publication-candidate'
          rm -rf "$OUT"
          mkdir -p "$OUT" "$OUT/rendered"
          cp '24-facilities-coordinator-and-building-operations-assistant/english/Guide_24_Facilities_Coordinator_and_Building_Operations_Assistant_English_v2.0.md' "$OUT/GUIDE_24_ENGLISH_v2.md"
          cp '24-facilities-coordinator-and-building-operations-assistant/spanish/Guia_24_Coordinacion_de_Facilities_y_Asistencia_de_Operaciones_de_Edificios_es-419_v2.0.md' "$OUT/GUIDE_24_SPANISH_LATAM_v2.md"
          cp '24-facilities-coordinator-and-building-operations-assistant/portuguese/Guia_24_Coordenacao_de_Facilities_e_Assistencia_de_Operacoes_Prediais_pt-BR_v2.0.md' "$OUT/GUIDE_24_PORTUGUESE_BR_v2.md"

      - name: Trilingual structural, link, encoding, and source controls
        shell: python
        run: |
          from pathlib import Path
          import re, sys
          out=Path('project/revision-2026/guide-24/publication-candidate')
          files={
            'en': out/'GUIDE_24_ENGLISH_v2.md',
            'es-419': out/'GUIDE_24_SPANISH_LATAM_v2.md',
            'pt-BR': out/'GUIDE_24_PORTUGUESE_BR_v2.md',
          }
          required_urls=[
            'https://www.onetonline.org/link/summary/11-3013.00',
            'https://www.bls.gov/news.release/ocwage.t01.htm',
            'https://www.bls.gov/ooh/management/administrative-services-managers.htm',
            'https://www.indeed.com/career/facility-coordinator/salaries',
            'https://www.careeronestop.org/LocalHelp/EmploymentAndTraining/find-WIOA-training-programs.aspx',
            'https://www.apprenticeship.gov/apprenticeship-industries/construction',
            'https://www.jobbank.gc.ca/marketreport/wages-occupation/297406/ca',
            'https://www.jobbank.gc.ca/marketreport/wages-occupation/14403/ca',
            'https://normograma.sena.edu.co/compilacion/docs/circular_sena_0282_2024.htm',
          ]
          required_markers=[
            r'\bWIOA\b', r'\bSENA\b', r'Apprenticeship\.gov',
            r'\bNOC\s+70012\b', r'\bNOC\s+73201\b', r'\b(?:AI|IA)\b',
            r'Version\s+2\.0|Versi[oó]n\s+2\.0|Vers[aã]o\s+2\.0'
          ]
          problems=[]; counts={}; url_counts={}
          for lang,path in files.items():
            text=path.read_text(encoding='utf-8')
            if text.startswith('\ufeff'): problems.append(f'{lang}: unexpected UTF-8 BOM')
            if '\ufffd' in text: problems.append(f'{lang}: Unicode replacement character present')
            headings=re.findall(r'^##\s+.+$', text, re.M); counts[lang]=len(headings)
            if len(headings) < 15: problems.append(f'{lang}: too few level-2 headings ({len(headings)})')
            urls=re.findall(r'https://[^\s)<>]+', text); url_counts[lang]=len(urls)
            for u in required_urls:
              if u not in text: problems.append(f'{lang}: missing required URL {u}')
            for p in required_markers:
              if not re.search(p,text,re.I): problems.append(f'{lang}: missing controlled marker {p}')
            for u in urls:
              if ' ' in u or not re.match(r'^https://[^\s]+$',u): problems.append(f'{lang}: malformed URL {u}')
            low=text.lower()
            for bad in ('todo:', 'lorem ipsum', '[insert', 'translation pending', 'traducción pendiente', 'tradução pendente'):
              if bad in low: problems.append(f'{lang}: placeholder marker {bad}')
          if len(set(counts.values())) != 1: problems.append(f'level-2 heading count mismatch: {counts}')
          if max(url_counts.values()) - min(url_counts.values()) > 2: problems.append(f'URL-count drift exceeds tolerance: {url_counts}')
          if problems:
            print('\n'.join(problems)); sys.exit(1)
          print(f'Guide 24 structural/link/source controls PASS: headings={counts}; urls={url_counts}')

      - name: Generate DOCX and PDF editions
        shell: bash
        run: |
          set -euo pipefail
          OUT='project/revision-2026/guide-24/publication-candidate'
          for STEM in GUIDE_24_ENGLISH_v2 GUIDE_24_SPANISH_LATAM_v2 GUIDE_24_PORTUGUESE_BR_v2; do
            pandoc "$OUT/$STEM.md" -f gfm -t docx --standalone -o "$OUT/$STEM.docx"
            mkdir -p "$OUT/lo-$STEM"
            libreoffice --headless --convert-to pdf --outdir "$OUT/lo-$STEM" "$OUT/$STEM.docx"
            mv "$OUT/lo-$STEM/$STEM.pdf" "$OUT/$STEM.pdf"
            rmdir "$OUT/lo-$STEM"
          done

      - name: Validate DOCX and searchable PDFs
        shell: bash
        run: |
          set -euo pipefail
          OUT='project/revision-2026/guide-24/publication-candidate'
          test "$(find "$OUT" -maxdepth 1 -name '*.docx' | wc -l)" -eq 3
          test "$(find "$OUT" -maxdepth 1 -name '*.pdf' | wc -l)" -eq 3
          for DOCX in "$OUT"/*.docx; do
            unzip -t "$DOCX" >/dev/null
            unzip -l "$DOCX" | grep -q 'word/document.xml'
          done
          for PDF in "$OUT"/*.pdf; do
            pdfinfo "$PDF" >/dev/null
            TEXT="$(pdftotext "$PDF" - | tr -d '[:space:]')"
            test ${#TEXT} -gt 5000
          done

      - name: Render all PDF pages
        shell: bash
        run: |
          set -euo pipefail
          OUT='project/revision-2026/guide-24/publication-candidate'
          for PDF in "$OUT"/*.pdf; do
            STEM="$(basename "$PDF" .pdf)"
            mkdir -p "$OUT/rendered/$STEM"
            pdftoppm -png -r 110 "$PDF" "$OUT/rendered/$STEM/page" >/dev/null 2>&1
          done
          test "$(find "$OUT/rendered" -name '*.png' | wc -l)" -gt 3

      - name: Generate metadata manifest and checksums
        shell: python
        run: |
          from pathlib import Path
          import hashlib, json, subprocess
          out=Path('project/revision-2026/guide-24/publication-candidate')
          records=[]
          for lang,stem in [('en','GUIDE_24_ENGLISH_v2'),('es-419','GUIDE_24_SPANISH_LATAM_v2'),('pt-BR','GUIDE_24_PORTUGUESE_BR_v2')]:
            docx=out/f'{stem}.docx'; pdf=out/f'{stem}.pdf'
            info=subprocess.check_output(['pdfinfo',str(pdf)],text=True)
            pages=next(int(x.split(':',1)[1].strip()) for x in info.splitlines() if x.startswith('Pages:'))
            txt=subprocess.check_output(['pdftotext',str(pdf),'-'],text=True,errors='replace')
            if '\ufffd' in txt: raise SystemExit(f'{pdf}: Unicode replacement character in PDF text')
            records.append({'language':lang,'docx':docx.name,'pdf':pdf.name,'docx_bytes':docx.stat().st_size,'pdf_bytes':pdf.stat().st_size,'pdf_pages':pages,'pdf_extractable_characters':len(txt.strip()),'status':'PASS'})
          manifest={'guide':'24','occupation':'Facilities Coordinator and Building Operations Assistant','build_date':'2026-08-10','status':'PASS','controls':['trilingual structural parity','required source URLs','URL syntax','UTF-8/BOM controls','placeholder scan','DOCX ZIP integrity','searchable PDF text','all-page raster rendering','metadata manifest','SHA-256 checksums'],'editions':records,'assurance_boundary':'Internal automated publication QA; not independent human review, professional translation certification, accessibility certification, legal review, trade licensing advice, accreditation, or employment or earnings guarantee.'}
          (out/'GUIDE_24_PUBLICATION_QA_MANIFEST.json').write_text(json.dumps(manifest,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          targets=sorted(p for p in out.iterdir() if p.is_file() and p.suffix in {'.docx','.pdf'})
          (out/'SHA256SUMS.txt').write_text('\n'.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}' for p in targets)+'\n',encoding='utf-8')

      - name: Upload rendered pages
        uses: actions/upload-artifact@v4
        with:
          name: guide24-rendered-pages
          path: project/revision-2026/guide-24/publication-candidate/rendered
          retention-days: 14

      - name: Remove render images from commit scope
        run: rm -rf project/revision-2026/guide-24/publication-candidate/rendered

      - name: Commit controlled publication candidates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add project/revision-2026/guide-24/publication-candidate
          if git diff --cached --quiet; then
            echo 'No publication changes to commit.'
          else
            git commit -m 'Build and validate Guide 24 publication candidates'
            git pull --rebase origin revision/guide-00-100-2026
            git push origin HEAD:revision/guide-00-100-2026
          fi
