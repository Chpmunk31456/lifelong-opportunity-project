name: Guide 49 controlled publication build

on:
  push:
    branches: [revision/guide-00-100-2026]
    paths:
      - '.github/workflows/guide49-publication-build.yml'
      - 'project/revision-2026/guide-49/working-masters/GUIDE_49_DENTAL_ASSISTANT_ENGLISH_v2.md'
      - 'project/revision-2026/guide-49/working-masters/GUIDE_49_DENTAL_ASSISTANT_ES419_v2.md'
      - 'project/revision-2026/guide-49/working-masters/GUIDE_49_DENTAL_ASSISTANT_PTBR_v2.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: guide49-controlled-publication-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out revision branch
        uses: actions/checkout@v5
        with:
          ref: revision/guide-00-100-2026
          fetch-depth: 0

      - name: Install document and rendering tools
        run: |
          set -euo pipefail
          timeout 10m sudo apt-get update
          timeout 12m sudo apt-get install -y pandoc libreoffice poppler-utils python3-pil

      - name: Freeze trilingual publication candidates
        run: |
          set -euo pipefail
          SRC='project/revision-2026/guide-49/working-masters'
          OUT='project/revision-2026/guide-49/publication-candidate'
          mkdir -p "$OUT"
          cp "$SRC/GUIDE_49_DENTAL_ASSISTANT_ENGLISH_v2.md" "$OUT/GUIDE_49_ENGLISH_v2.md"
          cp "$SRC/GUIDE_49_DENTAL_ASSISTANT_ES419_v2.md" "$OUT/GUIDE_49_SPANISH_es-419_v2.md"
          cp "$SRC/GUIDE_49_DENTAL_ASSISTANT_PTBR_v2.md" "$OUT/GUIDE_49_PORTUGUESE_pt-BR_v2.md"

      - name: Run trilingual structural source numeric terminology and safety controls
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re, sys, unicodedata
          out=Path('project/revision-2026/guide-49/publication-candidate')
          files={'en':out/'GUIDE_49_ENGLISH_v2.md','es-419':out/'GUIDE_49_SPANISH_es-419_v2.md','pt-BR':out/'GUIDE_49_PORTUGUESE_pt-BR_v2.md'}
          texts={k:p.read_text(encoding='utf-8') for k,p in files.items()}
          def fold(s):
            s=re.sub(r'[*_`~]+','',s.lower())
            return ''.join(c for c in unicodedata.normalize('NFKD',s) if not unicodedata.combining(c))
          required={
            'en':['# guide 49','dental assistant','31-9091.00','33100.01','cuoc 53292','rethus','registered apprenticeship','using ai responsibly in dental assisting','cybersecurity basics for a dental office','do not publish one definitive national sena','does not claim independent human certification'],
            'es-419':['# guia 49','asistente dental','31-9091.00','33100.01','cuoc 53292','rethus','registered apprenticeship','uso responsable de ia','ciberseguridad','no publiques una duracion nacional unica y definitiva','no afirma certificacion humana independiente'],
            'pt-BR':['# guia 49','assistente odontologico','31-9091.00','33100.01','cuoc 53292','rethus','registered apprenticeship','uso responsavel de ia','ciberseguranca','nao publique uma duracao nacional unica e definitiva','nao afirma certificacao humana independente']}
          problems=[]; sections={}; urls={}
          for lang,text in texts.items():
            low=fold(text); sections[lang]=len(re.findall(r'^##\s+.+$',text,re.M)); urls[lang]=set(re.findall(r'https://[^\s)<>`]+',text))
            if text.startswith('\ufeff') or '\ufffd' in text: problems.append(f'{lang}: UTF-8 defect')
            for bad in ('todo:','lorem ipsum','[insert','translation pending','traduccion pendiente','traducao pendente'):
              if bad in low: problems.append(f'{lang}: placeholder {bad}')
            for marker in required[lang]:
              if fold(marker) not in low: problems.append(f'{lang}: missing marker {marker}')
          if len(set(sections.values())) != 1: problems.append(f'H2 structural mismatch {sections}')
          if min(sections.values()) < 30: problems.append(f'expected at least 30 H2 sections; observed {sections}')
          if len(urls['en']) < 20: problems.append(f'expected at least 20 English direct source URLs; observed {len(urls["en"])}')
          for lang in ('es-419','pt-BR'):
            if urls[lang] != urls['en']: problems.append(f'{lang}: source URL set differs; missing={sorted(urls["en"]-urls[lang])}; extra={sorted(urls[lang]-urls["en"])}')
          controls=[
            r'31-9091\.00',r'23\.11',r'48,070',r'22\.74',r'47,300',r'36,190',r'61,780',
            r'381,900',r'406,300',r'6\s*%',r'24,400',r'52,900',r'41,739',r'\$20\b',r'37,596',r'46,260',r'33,824',r'50,376',
            r'33100',r'33100\.01',r'21\.00',r'27\.00',r'35\.00',r'72\.3\s*%',r'4,200',r'525',r'53292',r'ReTHUS'
          ]
          for lang,text in texts.items():
            for pat in controls:
              if not re.search(pat,text,re.I|re.S): problems.append(f'{lang}: missing controlled value {pat}')
          # Context-safe safety check: target only affirmative independent-scope statements.
          forbidden={
            'en':['dental assistants may independently diagnose','ai may replace dentist judgment','a dental assistant certificate automatically authorizes radiography everywhere'],
            'es-419':['los asistentes dentales pueden diagnosticar de manera independiente','la ia puede reemplazar el criterio del dentista','un certificado de asistente dental autoriza automaticamente radiografias en cualquier lugar'],
            'pt-BR':['assistentes odontologicos podem diagnosticar de forma independente','a ia pode substituir o julgamento do dentista','um certificado de assistente odontologico autoriza automaticamente radiografias em qualquer lugar']}
          for lang,text in texts.items():
            low=fold(text)
            for phrase in forbidden[lang]:
              if fold(phrase) in low: problems.append(f'{lang}: unsafe affirmative scope claim {phrase}')
          if problems:
            print('\n'.join(problems)); sys.exit(1)
          print(f'Guide 49 trilingual controls PASS: H2={sections}; URLs={len(urls["en"])}')
          PY

      - name: Validate live source-link behavior
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, sys
          text=Path('project/revision-2026/guide-49/publication-candidate/GUIDE_49_ENGLISH_v2.md').read_text(encoding='utf-8')
          ua='Mozilla/5.0 (compatible; LifelongOpportunityProject-LinkQA/1.0)'; broken=[]; warnings=[]
          def probe(url,method='GET'):
            cmd=['curl','-L','--retry','2','--retry-all-errors','--retry-delay','2','--connect-timeout','10','--max-time','30','-A',ua,'-sS','-o','/dev/null','-w','%{http_code}']
            if method=='HEAD': cmd.insert(1,'-I')
            cp=subprocess.run(cmd+[url],capture_output=True,text=True); code=int(cp.stdout[-3:]) if cp.stdout and cp.stdout[-3:].isdigit() else 0
            return code,cp.returncode,(cp.stderr or '').strip()
          for url in sorted(set(re.findall(r'https://[^\s)<>`]+',text))):
            code,rc,err=probe(url,'GET')
            if code==0: code,rc,err=probe(url,'HEAD')
            if 200<=code<400: state='PASS'
            elif code in (404,410): state='FAIL_BROKEN'; broken.append(f'{url}: HTTP {code}')
            elif code in (401,403,429): state='ACCESS_CONTROLLED_UNVERIFIED'; warnings.append(f'{url}: HTTP {code}')
            elif code==0: state='TRANSPORT_UNVERIFIED'; warnings.append(f'{url}: curl rc={rc}; {err}')
            elif code>=500: state='SERVER_UNVERIFIED'; warnings.append(f'{url}: HTTP {code}')
            else: state='HTTP_UNVERIFIED'; warnings.append(f'{url}: HTTP {code}')
            print(code,state,url)
          if warnings: print('Source verification limitations:\n'+'\n'.join(warnings))
          if broken: print('\n'.join(broken)); sys.exit(1)
          PY

      - name: Generate DOCX and PDF editions
        run: |
          set -euo pipefail
          OUT='project/revision-2026/guide-49/publication-candidate'
          for STEM in GUIDE_49_ENGLISH_v2 GUIDE_49_SPANISH_es-419_v2 GUIDE_49_PORTUGUESE_pt-BR_v2; do
            pandoc "$OUT/$STEM.md" -f gfm-tex_math_dollars -t docx --standalone -o "$OUT/$STEM.docx"
            mkdir -p "$OUT/lo-$STEM"
            libreoffice --headless --convert-to pdf --outdir "$OUT/lo-$STEM" "$OUT/$STEM.docx"
            mv "$OUT/lo-$STEM/$STEM.pdf" "$OUT/$STEM.pdf"
            rmdir "$OUT/lo-$STEM"
          done

      - name: Validate DOCX and searchable PDF integrity
        run: |
          set -euo pipefail
          OUT='project/revision-2026/guide-49/publication-candidate'
          test "$(find "$OUT" -maxdepth 1 -name '*.docx' | wc -l)" -eq 3
          test "$(find "$OUT" -maxdepth 1 -name '*.pdf' | wc -l)" -eq 3
          for DOCX in "$OUT"/*.docx; do unzip -t "$DOCX" >/dev/null; unzip -l "$DOCX" | grep -q 'word/document.xml'; done
          for PDF in "$OUT"/*.pdf; do pdfinfo "$PDF" >/dev/null; TEXT="$(pdftotext "$PDF" - | tr -d '[:space:]')"; test ${#TEXT} -gt 5000; done

      - name: Render and inspect every PDF page
        run: |
          set -euo pipefail
          OUT='project/revision-2026/guide-49/publication-candidate'; rm -rf "$OUT/rendered"
          for PDF in "$OUT"/*.pdf; do STEM="$(basename "$PDF" .pdf)"; mkdir -p "$OUT/rendered/$STEM"; pdftoppm -png -r 110 "$PDF" "$OUT/rendered/$STEM/page" >/dev/null 2>&1; done
          python - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageChops
          import json,sys
          root=Path('project/revision-2026/guide-49/publication-candidate/rendered'); problems=[]; pages=[]
          for path in sorted(root.rglob('*.png')):
            try:
              with Image.open(path) as im: im.verify()
              with Image.open(path) as im:
                gray=im.convert('L'); diff=ImageChops.difference(gray,Image.new('L',gray.size,255)); bbox=diff.point(lambda p:255 if p>12 else 0).getbbox()
                if bbox is None: problems.append(f'{path}: blank page'); continue
                l,t,r,b=bbox; w,h=gray.size; margins={'left':l,'top':t,'right':w-r,'bottom':h-b}
                if min(margins.values())<4: problems.append(f'{path}: possible clipping {margins}')
                pages.append({'file':str(path.relative_to(root)),'status':'PASS','edge_margins':margins})
            except Exception as exc: problems.append(f'{path}: malformed render: {exc}')
          (root/'RENDER_QA.json').write_text(json.dumps({'status':'FAIL' if problems else 'PASS','pages':pages,'problems':problems},indent=2)+'\n',encoding='utf-8')
          if problems: print('\n'.join(problems)); sys.exit(1)
          print(f'All-page render QA PASS: {len(pages)} pages')
          PY

      - name: Generate publication metadata and checksums
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,subprocess
          out=Path('project/revision-2026/guide-49/publication-candidate'); render=json.loads((out/'rendered/RENDER_QA.json').read_text())
          records=[]
          for lang,stem in [('en','GUIDE_49_ENGLISH_v2'),('es-419','GUIDE_49_SPANISH_es-419_v2'),('pt-BR','GUIDE_49_PORTUGUESE_pt-BR_v2')]:
            docx=out/f'{stem}.docx'; pdf=out/f'{stem}.pdf'; info=subprocess.check_output(['pdfinfo',str(pdf)],text=True); count=next(int(x.split(':',1)[1]) for x in info.splitlines() if x.startswith('Pages:')); txt=subprocess.check_output(['pdftotext',str(pdf),'-'],text=True,errors='replace')
            if '\ufffd' in txt: raise SystemExit(f'{pdf}: Unicode replacement character')
            rendered=sum(1 for p in render['pages'] if p['file'].startswith(stem+'/'))
            if rendered!=count: raise SystemExit(f'{stem}: PDF/render page mismatch')
            records.append({'language':lang,'docx':docx.name,'pdf':pdf.name,'docx_bytes':docx.stat().st_size,'pdf_bytes':pdf.stat().st_size,'pdf_pages':count,'rendered_pages':rendered,'status':'PASS'})
          manifest={'guide':'49','occupation':'Dental Assistant','build_date':'2026-08-19','status':'PASS','editions':records,'assurance_boundary':'Internal automated publication QA; not independent human review, professional translation certification, accessibility certification, accreditation, dental or legal review, clinical-practice authorization, certification-body approval, credential transfer, or employment or earnings guarantee.'}
          (out/'GUIDE_49_PUBLICATION_QA_MANIFEST.json').write_text(json.dumps(manifest,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          targets=sorted(p for p in out.iterdir() if p.is_file() and p.suffix in {'.docx','.pdf'})
          (out/'SHA256SUMS.txt').write_text('\n'.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}' for p in targets)+'\n',encoding='utf-8')
          PY

      - name: Upload rendered-page QA evidence
        uses: actions/upload-artifact@v4
        with:
          name: guide49-rendered-pages
          path: project/revision-2026/guide-49/publication-candidate/rendered
          retention-days: 14

      - name: Remove render images from commit scope
        run: rm -rf project/revision-2026/guide-49/publication-candidate/rendered

      - name: Commit controlled publication candidates
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add project/revision-2026/guide-49/publication-candidate
          if git diff --cached --quiet; then
            echo 'No publication changes to commit.'
          else
            git commit -m 'Build and validate Guide 49 publication candidates'
            git pull --rebase origin revision/guide-00-100-2026
            git push origin HEAD:revision/guide-00-100-2026
          fi
