name: Guide 46 one-time Spanish terminology correction

on:
  push:
    branches: [revision/guide-00-100-2026]
    paths:
      - '.github/workflows/guide46-spanish-correction.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: revision/guide-00-100-2026
          fetch-depth: 0

      - name: Normalize Spanish high-risk location terminology
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('project/revision-2026/guide-46/working-masters/GUIDE_46_ENVIRONMENTAL_FIELD_TECHNICIAN_ES419_v2.md')
          text = path.read_text(encoding='utf-8')
          old = 'un pozo, alcantarilla, bóveda, tanque, alcantarilla, recipiente, zanja, excavación, espacio de acceso reducido'
          new = 'un foso, pozo de inspección, bóveda, tanque, alcantarillado, recipiente, zanja, excavación, espacio de acceso reducido'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one controlled replacement; found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Commit correction
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add project/revision-2026/guide-46/working-masters/GUIDE_46_ENVIRONMENTAL_FIELD_TECHNICIAN_ES419_v2.md
          git commit -m 'Guide 46: refine Spanish hazard terminology'
          git pull --rebase origin revision/guide-00-100-2026
          git push origin HEAD:revision/guide-00-100-2026
