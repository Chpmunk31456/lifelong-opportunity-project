name: Guide 03 publication build and QA

on:
  workflow_dispatch:
  push:
    branches:
      - revision/guide-00-100-2026
    paths:
      - .github/workflows/guide03-publication-build.yml

permissions:
  contents: write

concurrency:
  group: guide03-publication-build
  cancel-in-progress: false

jobs:
  build-and-qa:
    if: github.repository == 'Chpmunk31456/lifelong-opportunity-project'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out controlled revision branch
        uses: actions/checkout@v4
        with:
          ref: revision/guide-00-100-2026
          fetch-depth: 0

      - name: Install document and PDF tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pandoc libreoffice-writer poppler-utils python3-lxml

      - name: Re-run trilingual source parity gate
        run: python scripts/guide03_translation_parity.py

      - name: Build trilingual DOCX files
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          source_dir = Path('project/revision-2026/guide-03/source')
          output_dir = Path('project/revision-2026/guide-03/publication-candidate')
          output_dir.mkdir(parents=True, exist_ok=True)

          editions = {
              'English': source_dir / 'GUIDE_03_ENGLISH_WORKING_MASTER_v2.md',
              'es-419': source_dir / 'GUIDE_03_SPANISH_LATAM_WORKING_MASTER_v2.md',
              'pt-BR': source_dir / 'GUIDE_03_PORTUGUESE_BR_WORKING_MASTER_v2.md',
          }

          for locale, source in editions.items():
              raw = source.read_bytes()
              if raw.startswith(b'\xef\xbb\xbf'):
                  raise SystemExit(f'Unexpected UTF-8 BOM: {source}')
              raw.decode('utf-8', errors='strict')
              target = output_dir / f'Lifelong_Opportunity_Guide_03_Medical_Billing_and_Coding_Specialist_{locale}_v2.0.docx'
              subprocess.run([
                  'pandoc', str(source), '--from=gfm', '--to=docx', '--standalone',
                  '--metadata', f'lang={locale}', '--output', str(target)
              ], check=True)
              if target.stat().st_size < 15000:
                  raise SystemExit(f'DOCX unexpectedly small: {target}')
              print(f'Built {target}')

      - name: Convert DOCX files to PDF
        run: |
          mkdir -p project/revision-2026/guide-03/publication-candidate/pdf
          libreoffice --headless --convert-to pdf --outdir project/revision-2026/guide-03/publication-candidate/pdf \
            project/revision-2026/guide-03/publication-candidate/*.docx
          test "$(find project/revision-2026/guide-03/publication-candidate/pdf -maxdepth 1 -name '*.pdf' | wc -l)" -eq 3

      - name: Run DOCX PDF metadata link and publication QA
        shell: python
        run: |
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib
          import json
          import re
          import subprocess
          import unicodedata

          source_dir = Path('project/revision-2026/guide-03/source')
          root = Path('project/revision-2026/guide-03/publication-candidate')
          pdf_dir = root / 'pdf'
          locales = {
              'English': ('GUIDE_03_ENGLISH_WORKING_MASTER_v2.md', 'Lifelong Opportunity Guide 03', 'en-US', 'July 20, 2026'),
              'es-419': ('GUIDE_03_SPANISH_LATAM_WORKING_MASTER_v2.md', 'Guía de Oportunidades para Toda la Vida 03', 'es-419', '20 de julio de 2026'),
              'pt-BR': ('GUIDE_03_PORTUGUESE_BR_WORKING_MASTER_v2.md', 'Guia de Oportunidades para Toda a Vida 03', 'pt-BR', '20 de julho de 2026'),
          }

          report = {
              'guide': '03',
              'occupation': 'Medical Billing and Coding Specialist',
              'version': '2.0',
              'status': 'publication candidate; automated QA only',
              'independent_human_certification': False,
              'professional_translation_certification': False,
              'accessibility_certification': False,
              'files': [],
          }

          def normalize(value):
              value = unicodedata.normalize('NFKD', value)
              value = ''.join(ch for ch in value if not unicodedata.combining(ch))
              return ' '.join(value.casefold().split())

          def source_urls(text):
              return set(re.findall(r'https?://[^\s)>\]]+', text))

          for locale, (source_name, title, lang_code, market_date) in locales.items():
              source = source_dir / source_name
              source_text = source.read_text(encoding='utf-8')
              urls = source_urls(source_text)
              if len(urls) < 15:
                  raise SystemExit(f'{locale}: unexpectedly low source URL count {len(urls)}')
              if len(re.findall(r'^#\s+\d{1,2}\.\s+', source_text, re.MULTILINE)) != 19:
                  raise SystemExit(f'{locale}: expected 19 numbered source sections')
              if '\ufffd' in source_text:
                  raise SystemExit(f'{locale}: replacement character in source')
              if market_date not in source_text:
                  raise SystemExit(f'{locale}: exact-title market source date missing')

              docx = root / f'Lifelong_Opportunity_Guide_03_Medical_Billing_and_Coding_Specialist_{locale}_v2.0.docx'
              pdf = pdf_dir / f'Lifelong_Opportunity_Guide_03_Medical_Billing_and_Coding_Specialist_{locale}_v2.0.pdf'
              if not docx.is_file() or not pdf.is_file():
                  raise SystemExit(f'Missing generated pair for {locale}')

              with ZipFile(docx) as zf:
                  names = set(zf.namelist())
                  required = {'word/document.xml', 'word/_rels/document.xml.rels', 'docProps/core.xml'}
                  missing = required - names
                  if missing:
                      raise SystemExit(f'{docx}: missing OOXML parts {sorted(missing)}')
                  document_xml = zf.read('word/document.xml').decode('utf-8', errors='strict')
                  relationships = zf.read('word/_rels/document.xml.rels').decode('utf-8', errors='strict')
                  core_xml = zf.read('docProps/core.xml').decode('utf-8', errors='strict')
                  if '\ufffd' in document_xml + relationships + core_xml:
                      raise SystemExit(f'{docx}: encoding replacement character detected')
                  missing_links = sorted(url for url in urls if url not in relationships)
                  if missing_links:
                      raise SystemExit(f'{docx}: source hyperlinks missing from relationships: {missing_links}')

              pdfinfo = subprocess.run(['pdfinfo', str(pdf)], check=True, text=True, capture_output=True).stdout
              match = re.search(r'^Pages:\s+(\d+)$', pdfinfo, re.MULTILINE)
              pages = int(match.group(1)) if match else 0
              if pages < 8:
                  raise SystemExit(f'{pdf}: unexpectedly low page count {pages}')

              txt = pdf.with_suffix('.txt')
              subprocess.run(['pdftotext', '-layout', str(pdf), str(txt)], check=True)
              extracted = txt.read_text(encoding='utf-8', errors='replace')
              txt.unlink()
              if len(extracted.strip()) < 10000:
                  raise SystemExit(f'{pdf}: insufficient extractable text')
              if normalize(title) not in normalize(extracted):
                  raise SystemExit(f'{pdf}: expected title not found')
              if '\ufffd' in extracted:
                  raise SystemExit(f'{pdf}: replacement-character encoding defect detected')

              for file in (docx, pdf):
                  report['files'].append({
                      'locale': locale,
                      'language_code': lang_code,
                      'path': str(file),
                      'bytes': file.stat().st_size,
                      'sha256': hashlib.sha256(file.read_bytes()).hexdigest(),
                      'pages': pages if file.suffix == '.pdf' else None,
                  })

          manifest = root / 'GUIDE_03_PUBLICATION_QA_MANIFEST.json'
          manifest.write_text(json.dumps(report, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          checksums = root / 'SHA256SUMS.txt'
          checksums.write_text('\n'.join(
              f"{item['sha256']}  {Path(item['path']).relative_to(root)}" for item in report['files']
          ) + '\n', encoding='utf-8')

      - name: Render first pages for visual-inspection evidence
        run: |
          mkdir -p project/revision-2026/guide-03/publication-candidate/rendered
          for pdf in project/revision-2026/guide-03/publication-candidate/pdf/*.pdf; do
            base="$(basename "$pdf" .pdf)"
            pdftoppm -f 1 -singlefile -png -r 130 "$pdf" \
              "project/revision-2026/guide-03/publication-candidate/rendered/${base}_page_001"
          done
          test "$(find project/revision-2026/guide-03/publication-candidate/rendered -name '*.png' | wc -l)" -eq 3

      - name: Commit completed publication candidates after QA
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project/revision-2026/guide-03/publication-candidate
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Guide 03 publication candidates already match generated outputs.'
            exit 0
          fi
          git commit -m "build(guide-03): add trilingual publication candidates and QA manifest"
          git fetch origin revision/guide-00-100-2026
          git rebase origin/revision/guide-00-100-2026
          python scripts/guide03_translation_parity.py
          git push origin HEAD:revision/guide-00-100-2026
