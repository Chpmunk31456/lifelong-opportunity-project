name: Guide 00 publication build and QA

on:
  workflow_dispatch:
  push:
    branches:
      - revision/guide-00-100-2026
    paths:
      - .github/workflows/guide00-publication-build.yml
      - 00-foundation-guide/source/**

permissions:
  contents: write

concurrency:
  group: guide00-publication-build
  cancel-in-progress: false

jobs:
  build-and-qa:
    if: github.repository == 'Chpmunk31456/lifelong-opportunity-project'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out controlled revision branch
        uses: actions/checkout@v4
        with:
          ref: revision/guide-00-100-2026
          fetch-depth: 0

      - name: Install document and PDF tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pandoc libreoffice-writer poppler-utils python3-lxml

      - name: Build trilingual DOCX files
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          source_dir = Path('00-foundation-guide/source')
          output_dir = Path('00-foundation-guide/publication-candidate')
          output_dir.mkdir(parents=True, exist_ok=True)

          editions = {
              'English': source_dir / 'Lifelong_Opportunity_Foundation_Guide_English_v1.1_INTEGRATED_MASTER.md',
              'es-419': source_dir / 'Lifelong_Opportunity_Foundation_Guide_es-419_v1.1_INTEGRATED_MASTER.md',
              'pt-BR': source_dir / 'Lifelong_Opportunity_Foundation_Guide_pt-BR_v1.1_INTEGRATED_MASTER.md',
          }

          for locale, source in editions.items():
              if not source.is_file():
                  raise SystemExit(f'Missing source master: {source}')
              if source.read_bytes().startswith(b'\xef\xbb\xbf'):
                  raise SystemExit(f'Unexpected UTF-8 BOM: {source}')
              target = output_dir / f'Lifelong_Opportunity_Foundation_Guide_{locale}_v1.1.docx'
              subprocess.run([
                  'pandoc', str(source), '--from=gfm', '--to=docx',
                  '--standalone', '--output', str(target)
              ], check=True)
              if target.stat().st_size < 10000:
                  raise SystemExit(f'DOCX unexpectedly small: {target}')
              print(f'Built {target}')

      - name: Convert DOCX files to PDF
        run: |
          mkdir -p 00-foundation-guide/publication-candidate/pdf
          libreoffice --headless --convert-to pdf --outdir 00-foundation-guide/publication-candidate/pdf \
            00-foundation-guide/publication-candidate/*.docx
          test "$(find 00-foundation-guide/publication-candidate/pdf -maxdepth 1 -name '*.pdf' | wc -l)" -eq 3

      - name: Run structural, hyperlink, PDF, and metadata QA
        shell: python
        run: |
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib
          import json
          import re
          import subprocess
          import unicodedata

          root = Path('00-foundation-guide/publication-candidate')
          pdf_dir = root / 'pdf'
          report = {
              'guide': '00',
              'version': '1.1',
              'status': 'publication candidate; automated QA only',
              'independent_certification': False,
              'files': []
          }

          expected = {
              'English': 'Lifelong Opportunity Foundation Guide',
              'es-419': 'Guía Fundacional de Oportunidades para Toda la Vida',
              'pt-BR': 'Guia Fundamental de Oportunidades ao Longo da Vida',
          }
          canonical = 'https://red-seal.ca/eng/about/program.shtml'
          obsolete = 'https://www.red-seal.ca/eng/contact/c.4nt.1ct.shtml'

          def normalized_text(value):
              value = unicodedata.normalize('NFKD', value)
              value = ''.join(ch for ch in value if not unicodedata.combining(ch))
              return ' '.join(value.casefold().split())

          for locale, expected_title in expected.items():
              docx = root / f'Lifelong_Opportunity_Foundation_Guide_{locale}_v1.1.docx'
              pdf = pdf_dir / f'Lifelong_Opportunity_Foundation_Guide_{locale}_v1.1.pdf'
              if not docx.is_file() or not pdf.is_file():
                  raise SystemExit(f'Missing generated pair for {locale}')

              with ZipFile(docx) as zf:
                  names = set(zf.namelist())
                  required = {'word/document.xml', 'word/_rels/document.xml.rels', 'docProps/core.xml'}
                  missing = required - names
                  if missing:
                      raise SystemExit(f'{docx}: missing OOXML parts {sorted(missing)}')
                  document_xml = zf.read('word/document.xml')
                  relationships = zf.read('word/_rels/document.xml.rels')
                  full_xml = document_xml + relationships
                  if obsolete.encode() in full_xml:
                      raise SystemExit(f'{docx}: obsolete Red Seal URL present')
                  if locale == 'English' and canonical.encode() not in full_xml:
                      raise SystemExit(f'{docx}: canonical Red Seal URL missing')

              pdfinfo = subprocess.run(['pdfinfo', str(pdf)], check=True, text=True, capture_output=True).stdout
              match = re.search(r'^Pages:\s+(\d+)$', pdfinfo, re.MULTILINE)
              pages = int(match.group(1)) if match else 0
              if pages < 5:
                  raise SystemExit(f'{pdf}: unexpectedly low page count {pages}')

              text_file = pdf.with_suffix('.txt')
              subprocess.run(['pdftotext', '-layout', str(pdf), str(text_file)], check=True)
              text = text_file.read_text(encoding='utf-8', errors='replace')
              if len(text.strip()) < 5000:
                  raise SystemExit(f'{pdf}: insufficient extractable text')
              if normalized_text(expected_title) not in normalized_text(text):
                  raise SystemExit(f'{pdf}: expected title not found in normalized extracted text')
              if '\ufffd' in text:
                  raise SystemExit(f'{pdf}: replacement-character encoding defect detected')

              for file in (docx, pdf):
                  digest = hashlib.sha256(file.read_bytes()).hexdigest()
                  report['files'].append({
                      'locale': locale,
                      'path': str(file),
                      'bytes': file.stat().st_size,
                      'sha256': digest,
                      'pages': pages if file.suffix == '.pdf' else None,
                  })

              text_file.unlink()

          manifest = root / 'GUIDE_00_PUBLICATION_QA_MANIFEST.json'
          manifest.write_text(json.dumps(report, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          checksums = root / 'SHA256SUMS.txt'
          lines = [f"{item['sha256']}  {Path(item['path']).relative_to(root)}" for item in report['files']]
          checksums.write_text('\n'.join(lines) + '\n', encoding='utf-8')

      - name: Render first pages for visual inspection artifact
        run: |
          mkdir -p 00-foundation-guide/publication-candidate/rendered
          for pdf in 00-foundation-guide/publication-candidate/pdf/*.pdf; do
            base="$(basename "$pdf" .pdf)"
            pdftoppm -f 1 -singlefile -png -r 130 "$pdf" \
              "00-foundation-guide/publication-candidate/rendered/${base}_page_001"
          done
          test "$(find 00-foundation-guide/publication-candidate/rendered -name '*.png' | wc -l)" -eq 3

      - name: Commit publication candidates after QA
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 00-foundation-guide/publication-candidate
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Publication candidates already match generated outputs.'
            exit 0
          fi
          git commit -m "build(guide-00): add trilingual publication candidates and QA manifest"
          git push origin HEAD:revision/guide-00-100-2026
