name: Guide 01 final status freeze

on:
  workflow_dispatch:
  push:
    branches:
      - revision/guide-00-100-2026
    paths:
      - .github/workflows/guide01-final-status-freeze.yml

permissions:
  contents: write

jobs:
  reconcile-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revision/guide-00-100-2026
          fetch-depth: 0

      - name: Reconcile trilingual QA status statements
        shell: python
        run: |
          from pathlib import Path
          from datetime import date

          root = Path("project/revision-2026/guide-01/working-masters")
          files = {
              "en": root / "GUIDE_01_COMMUNITY_HEALTH_WORKER_ENGLISH_WORKING_MASTER.md",
              "es": root / "GUIDE_01_TRABAJADOR_COMUNITARIO_DE_SALUD_ES419_WORKING_MASTER.md",
              "pt": root / "GUIDE_01_AGENTE_COMUNITARIO_DE_SAUDE_PTBR_WORKING_MASTER.md",
          }

          replacements = {
            "en": [
              (
                "**Status:** Substantive English working master completed from the controlled official-source baseline. Legacy comparison, trilingual integration, structural-parity review, terminology normalization, market-income reconciliation, and controlled link review are recorded. Final editorial and translation freeze, final live-link validation, DOCX/PDF generation, metadata, checksums, and publication QA remain pending.",
                "**Status:** Substantive English working master completed from the controlled official-source baseline. Legacy comparison, trilingual integration, sentence-level editorial review, structural-parity and safety review, terminology normalization, market-income reconciliation, and controlled link review are recorded. The trilingual editorial and terminology freeze is complete. Final live-link and dated market-estimate validation, DOCX/PDF generation, metadata, checksums, rendering, and publication QA remain pending."
              ),
              (
                "- compare the working master against the legacy English DOCX and document retained, corrected, and removed claims;\n",
                ""
              ),
              (
                "- complete editorial QA after legacy comparison;\n- complete final sentence-level review of the aligned neutral Latin American Spanish and Brazilian Portuguese masters;\n- reconcile any intentional localization exceptions and freeze terminology and structural parity;\n",
                ""
              ),
            ],
            "es": [
              (
                "**Estado:** Maestro sustantivo en español es-419 completado a partir del maestro controlado en inglés y del registro terminológico trilingüe. La integración trilingüe, la revisión de paridad estructural, la normalización terminológica, la conciliación de estimaciones de ingresos y la revisión controlada de enlaces están registradas. Aún están pendientes la congelación editorial y de traducción, la validación final de enlaces en vivo, la generación de DOCX/PDF, los metadatos, las sumas de comprobación y el control de calidad de publicación.",
                "**Estado:** Maestro sustantivo en español es-419 completado a partir del maestro controlado en inglés y del registro terminológico trilingüe. La integración trilingüe, la revisión editorial oración por oración, la revisión de paridad estructural y seguridad, la normalización terminológica, la conciliación de estimaciones de ingresos y la revisión controlada de enlaces están registradas. La congelación editorial y terminológica trilingüe está completa. Aún están pendientes la validación final de enlaces en vivo y estimaciones de mercado fechadas, la generación de DOCX/PDF, los metadatos, las sumas de comprobación, la representación de páginas y el control de calidad de publicación."
              ),
              (
                "- comparar el maestro en inglés con el DOCX heredado y documentar las afirmaciones conservadas, corregidas y eliminadas;\n",
                ""
              ),
              (
                "- completar la revisión de paridad terminológica y estructural con el maestro en inglés;\n- crear el maestro alineado en portugués de Brasil;\n",
                ""
              ),
            ],
            "pt": [
              (
                "**Status:** Mestre substantivo em português brasileiro concluído a partir do mestre controlado em inglês e do registro terminológico trilíngue. A integração trilíngue, a revisão de paridade estrutural, a normalização terminológica, a reconciliação das estimativas de renda e a revisão controlada de links estão registradas. Ainda estão pendentes o congelamento editorial e de tradução, a validação final de links ativos, a geração de DOCX/PDF, metadados, checksums e QA de publicação.",
                "**Status:** Mestre substantivo em português brasileiro concluído a partir do mestre controlado em inglês e do registro terminológico trilíngue. A integração trilíngue, a revisão editorial frase por frase, a revisão de paridade estrutural e segurança, a normalização terminológica, a reconciliação das estimativas de renda e a revisão controlada de links estão registradas. O congelamento editorial e terminológico trilíngue está concluído. Ainda estão pendentes a validação final de links ativos e estimativas de mercado datadas, a geração de DOCX/PDF, metadados, checksums, renderização e QA de publicação."
              ),
              (
                "- comparar o mestre de trabalho com o DOCX legado em inglês e documentar alegações mantidas, corrigidas e removidas;\n",
                ""
              ),
              (
                "- concluir o QA editorial após a comparação com o legado;\n- executar QA de terminologia e paridade estrutural entre inglês, es-419 e pt-BR;\n",
                ""
              ),
            ],
          }

          results = []
          for lang, path in files.items():
              raw = path.read_bytes()
              if raw.startswith(b"\xef\xbb\xbf"):
                  raise SystemExit(f"BOM detected: {path}")
              text = raw.decode("utf-8")
              original = text
              for old, new in replacements[lang]:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f"Expected exactly one occurrence in {path}: {old[:80]!r}; found {count}")
                  text = text.replace(old, new, 1)
              if text == original:
                  raise SystemExit(f"No change produced for {path}")
              if any(line.endswith((" ", "\t")) for line in text.splitlines()):
                  raise SystemExit(f"Trailing whitespace detected: {path}")
              path.write_text(text, encoding="utf-8", newline="\n")
              results.append(f"- `{path}`: status reconciled; stale completed gates removed.")

          evidence = Path("project/revision-2026/guide-01/TRILINGUAL_EDITORIAL_FREEZE_EXECUTION_QA_02.md")
          evidence.write_text(
              "# Guide 01 — Trilingual Editorial Freeze Execution QA 02\n\n"
              "**Execution date:** 2026-08-06  \n"
              "**Scope:** English, neutral Latin American Spanish (es-419), and Brazilian Portuguese (pt-BR) controlled working masters.\n\n"
              "## Result\n\n"
              "PASS — The three working-master status blocks now accurately record completion of sentence-level editorial review, terminology normalization, structural-parity review, safety-meaning review, and the trilingual editorial/terminology freeze. Stale pending items for legacy comparison, cross-language master creation, editorial review, and terminology/parity review were removed.\n\n"
              "## Files changed\n\n" + "\n".join(results) + "\n\n"
              "## Remaining publication hold\n\n"
              "Guide 01 remains **not publication-ready** until final live-link validation, dated revalidation of non-government market estimates, DOCX and searchable PDF generation, OOXML/PDF/hyperlink checks, metadata, rendering, filenames, checksums, and publication-manifest QA pass.\n\n"
              "## Assurance boundary\n\n"
              "This automated control does not constitute independent human certification, professional translation certification, accreditation review, accessibility certification, medical review, or legal review.\n",
              encoding="utf-8",
              newline="\n",
          )

      - name: Validate controlled scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 4
          printf '%s\n' "${changed[@]}" | grep -Fx 'project/revision-2026/guide-01/working-masters/GUIDE_01_COMMUNITY_HEALTH_WORKER_ENGLISH_WORKING_MASTER.md'
          printf '%s\n' "${changed[@]}" | grep -Fx 'project/revision-2026/guide-01/working-masters/GUIDE_01_TRABAJADOR_COMUNITARIO_DE_SALUD_ES419_WORKING_MASTER.md'
          printf '%s\n' "${changed[@]}" | grep -Fx 'project/revision-2026/guide-01/working-masters/GUIDE_01_AGENTE_COMUNITARIO_DE_SAUDE_PTBR_WORKING_MASTER.md'
          printf '%s\n' "${changed[@]}" | grep -Fx 'project/revision-2026/guide-01/TRILINGUAL_EDITORIAL_FREEZE_EXECUTION_QA_02.md'

      - name: Commit completed reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add project/revision-2026/guide-01/working-masters project/revision-2026/guide-01/TRILINGUAL_EDITORIAL_FREEZE_EXECUTION_QA_02.md
          git commit -m 'Guide 01: reconcile trilingual editorial freeze status'
          git push origin HEAD:revision/guide-00-100-2026
