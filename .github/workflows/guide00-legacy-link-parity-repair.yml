name: Guide 00 legacy link-parity repair

on:
  workflow_dispatch:
  push:
    branches:
      - revision/guide-00-100-2026
    paths:
      - .github/workflows/guide00-legacy-link-parity-repair.yml

permissions:
  contents: write

concurrency:
  group: guide00-legacy-link-parity-repair
  cancel-in-progress: false

jobs:
  repair-and-validate:
    if: github.repository == 'Chpmunk31456/lifelong-opportunity-project'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out controlled revision branch
        uses: actions/checkout@v4
        with:
          ref: revision/guide-00-100-2026
          fetch-depth: 0

      - name: Repair source-link parity and close technical QA
        run: |
          python scripts/guide00_legacy_technical_qa.py repair-links
          python scripts/guide00_legacy_technical_qa.py validate
          python scripts/guide00_legacy_technical_qa.py close-status

      - name: Commit auditable repair evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            00-foundation-guide/source/Lifelong_Opportunity_Foundation_Guide_es-419_v1.1_INTEGRATED_MASTER.md \
            00-foundation-guide/source/Lifelong_Opportunity_Foundation_Guide_pt-BR_v1.1_INTEGRATED_MASTER.md \
            project/revision-2026/guide-00/GUIDE_00_HELPER_STATUS.json \
            project/revision-2026/guide-00/qa/GUIDE_00_TRILINGUAL_LINK_PARITY_REPAIR_08A.md \
            project/revision-2026/guide-00/qa/GUIDE_00_TRILINGUAL_TECHNICAL_QA_08.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Guide 00 link parity is already repaired and validated.'
            exit 0
          fi
          git commit -m "qa(guide-00): repair link parity and pass technical QA"
          git push origin HEAD:revision/guide-00-100-2026
