name: Guide 47 publication dispatch

on:
  push:
    branches: [revision/guide-00-100-2026]
    paths:
      - '.github/workflows/guide47-publication-dispatch.yml'

permissions:
  actions: write
  contents: write

jobs:
  dispatch-and-observe:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch controlled publication workflow and record result
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/$REPO"
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$API/actions/workflows/guide47-publication-build.yml/dispatches" \
            -d '{"ref":"revision/guide-00-100-2026"}'
          sleep 5
          RUN_ID="$(curl --fail -sS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$API/actions/workflows/guide47-publication-build.yml/runs?branch=revision%2Fguide-00-100-2026&event=workflow_dispatch&per_page=1" \
            | python -c 'import json,sys; d=json.load(sys.stdin); print(d["workflow_runs"][0]["id"])')"
          echo "TARGET_RUN_ID=$RUN_ID"
          FINAL=""
          for i in $(seq 1 60); do
            JSON="$(curl --fail -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$API/actions/runs/$RUN_ID")"
            STATUS="$(printf '%s' "$JSON" | python -c 'import json,sys; print(json.load(sys.stdin)["status"])')"
            CONCLUSION="$(printf '%s' "$JSON" | python -c 'import json,sys; print(json.load(sys.stdin).get("conclusion") or "")')"
            echo "target status=$STATUS conclusion=$CONCLUSION"
            if [ "$STATUS" = completed ]; then FINAL="$CONCLUSION"; break; fi
            sleep 10
          done
          test -n "$FINAL"
          mkdir -p project/revision-2026/guide-47/qa
          printf '{\n  "guide": "47",\n  "workflow": "guide47-publication-build.yml",\n  "run_id": %s,\n  "conclusion": "%s",\n  "observed_at": "%s"\n}\n' "$RUN_ID" "$FINAL" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > project/revision-2026/guide-47/qa/GUIDE_47_PUBLICATION_DISPATCH_STATUS.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add project/revision-2026/guide-47/qa/GUIDE_47_PUBLICATION_DISPATCH_STATUS.json
          git commit -m "Record Guide 47 publication workflow result"
          git pull --rebase origin revision/guide-00-100-2026
          git push origin HEAD:revision/guide-00-100-2026
          test "$FINAL" = success
