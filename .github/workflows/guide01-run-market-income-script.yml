name: Guide 01 run market income integration script

on:
  push:
    branches:
      - revision/guide-00-100-2026
    paths:
      - .github/workflows/guide01-run-market-income-script.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: guide01-run-market-income-script
  cancel-in-progress: false

jobs:
  integrate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out controlled revision branch
        uses: actions/checkout@v4
        with:
          ref: revision/guide-00-100-2026
          fetch-depth: 0

      - name: Run fail-closed trilingual integration
        run: python scripts/guide01_integrate_market_income.py

      - name: Verify and commit completed guide changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project/revision-2026/guide-01/working-masters/
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Guide 01 market-income content was already integrated."
            exit 0
          fi
          git commit -m "Guide 01: integrate verified trilingual market income estimates"
          git push origin HEAD:revision/guide-00-100-2026
