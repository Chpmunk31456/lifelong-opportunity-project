name: Guide 01 run market income integration script

on:
  push:
    branches:
      - revision/guide-00-100-2026
    paths:
      - .github/workflows/guide01-run-market-income-script.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: guide01-run-market-income-script
  cancel-in-progress: false

jobs:
  integrate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out controlled revision branch
        uses: actions/checkout@v4
        with:
          ref: revision/guide-00-100-2026
          fetch-depth: 0

      - name: Align integration anchors with controlled localized masters
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/guide01_integrate_market_income.py")
          text = path.read_text(encoding="utf-8")
          replacements = {
              "- Oficina de Estadísticas Laborales de Estados Unidos, *Occupational Outlook Handbook*, trabajadores comunitarios de salud, modificado el 28 de agosto de 2025: https://www.bls.gov/ooh/community-and-social-service/community-health-workers.htm\\n":
              "- U.S. Bureau of Labor Statistics, *Occupational Outlook Handbook, Community Health Workers*, modificado el 28 de agosto de 2025: https://www.bls.gov/ooh/community-and-social-service/community-health-workers.htm\\n",
              "- añadir una estimación actual del mercado no gubernamental, claramente identificada y defendible, solo si supera los controles de evidencia;":
              "- añadir una estimación de mercado no gubernamental actual, claramente identificada, únicamente si supera los controles de evidencia;",
              "- Bureau of Labor Statistics dos Estados Unidos, *Occupational Outlook Handbook*, Community Health Workers, modificado em 28 de agosto de 2025: https://www.bls.gov/ooh/community-and-social-service/community-health-workers.htm\\n":
              "- U.S. Bureau of Labor Statistics, Occupational Outlook Handbook, Community Health Workers, modificado em 28 de agosto de 2025: https://www.bls.gov/ooh/community-and-social-service/community-health-workers.htm\\n",
              "- adicionar uma estimativa atual de mercado não governamental, claramente identificada e defensável, somente se ela passar pelos controles de evidência;":
              "- adicionar uma estimativa atual não governamental, claramente identificada, somente se ela atender aos controles de evidência;",
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one stale localized integration anchor; found {count}: {old}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8", newline="\n")
          PY

      - name: Run fail-closed trilingual integration
        run: python scripts/guide01_integrate_market_income.py

      - name: Verify and commit completed guide changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/guide01_integrate_market_income.py project/revision-2026/guide-01/working-masters/
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Guide 01 market-income content was already integrated."
            exit 0
          fi
          git commit -m "Guide 01: integrate verified trilingual market income estimates"
          git push origin HEAD:revision/guide-00-100-2026

