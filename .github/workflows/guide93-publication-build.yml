# Controlled Guide 93 publication and release workflow
# v1: fail-closed trilingual build, compact render QA, and conflict-safe status closure.
name: Guide 93 controlled publication and release

on:
  push:
    branches: [revision/guide-00-100-2026]
    paths:
      - '.github/workflows/guide93-publication-build.yml'
      - 'project/revision-2026/guide-93/qa/GUIDE_93_TRILINGUAL_TECHNICAL_QA_08.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: guide93-controlled-publication
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out latest controlled branch
        uses: actions/checkout@v5
        with:
          ref: revision/guide-00-100-2026
          fetch-depth: 0

      - name: Install publication toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc libreoffice-writer poppler-utils python3-pil curl

      - name: Verify fail-closed predecessor gate
        shell: python
        run: |
          import json
          from pathlib import Path
          root=Path('project/revision-2026/guide-93')
          d=json.loads((root/'GUIDE_93_HELPER_STATUS.json').read_text(encoding='utf-8'))
          assert d['stages']['baseline_inventory']['status']=='PASS'
          assert d['stages']['research']['status']=='PASS'
          assert d['stages']['english_editorial']['status']=='PASS'
          assert d['stages']['evidence_traceability']['status']=='PASS'
          assert d['stages']['english_source_freeze']['status']=='PASS'
          assert d['stages']['spanish_localization']['status']=='PASS'
          assert d['stages']['portuguese_localization']['status']=='PASS'
          assert d['stages']['technical_qa']['status']=='PASS'
          assert d['stages']['publication']['status']=='PENDING'
          assert d['stages']['release_audit']['status']=='PENDING'
          assert not d.get('blockers')

      - name: Freeze trilingual publication inputs
        run: |
          set -euo pipefail
          SRC='project/revision-2026/guide-93/working-masters'
          OUT='project/revision-2026/guide-93/publication-candidate'
          rm -rf "$OUT" && mkdir -p "$OUT"
          cp "$SRC/GUIDE_93_SURVEYING_AND_MAPPING_TECHNICIAN_ENGLISH_v2.md" "$OUT/GUIDE_93_ENGLISH_v2.md"
          cp "$SRC/GUIDE_93_TECNICO_EN_TOPOGRAFIA_Y_CARTOGRAFIA_ES419_v2.md" "$OUT/GUIDE_93_SPANISH_es-419_v2.md"
          cp "$SRC/GUIDE_93_TECNICO_EM_AGRIMENSURA_E_MAPEAMENTO_PTBR_v2.md" "$OUT/GUIDE_93_PORTUGUESE_pt-BR_v2.md"

      - name: Validate trilingual Markdown parity and controlled values
        shell: python
        run: |
          from pathlib import Path
          import re,sys
          root=Path('project/revision-2026/guide-93'); out=root/'publication-candidate'
          files=[out/'GUIDE_93_ENGLISH_v2.md',out/'GUIDE_93_SPANISH_es-419_v2.md',out/'GUIDE_93_PORTUGUESE_pt-BR_v2.md']
          texts=[p.read_text(encoding='utf-8') for p in files]
          problems=[]
          for p,t in zip(files,texts):
            if t.startswith('\ufeff') or '\ufffd' in t: problems.append(f'{p.name}: encoding defect')
            if len(t)<12000: problems.append(f'{p.name}: unexpectedly short ({len(t)})')
            if len(re.findall(r'^##\s+.+$',t,re.M))<25: problems.append(f'{p.name}: insufficient major sections')
            if re.search(r'(?im)^\s*(?:[-*]\s*)?todo\s*:',t): problems.append(f'{p.name}: placeholder TODO')
            low=t.lower()
            for bad in ('lorem ipsum','translation pending','traduccion pendiente','tradução pendente'):
              if bad in low: problems.append(f'{p.name}: placeholder {bad}')
          urls=[set(re.findall(r'https://[^\s)<>`]+',t)) for t in texts]
          if not (urls[0]==urls[1]==urls[2]): problems.append(f'reader URL parity mismatch {[len(x) for x in urls]}')
          if len(urls[0])!=19: problems.append(f'expected 19 shared reader URLs, found {len(urls[0])}')
          controls=[
            r'17-3031\.00',r'22213',r'31122',
            r'51[,.]940',r'24[,.]97',r'59[,.]400',r'62[,.]100',r'5\s*%',r'7[,.]600',
            r'23\s*%',r'20\s*%',r'13\s*%',
            r'C\$22[,.]00',r'C\$29[,.]75',r'C\$46[,.]00',
            r'350[,.]000',r'2[,.]910[,.]053',r'3[,.]984',r'2[,.]304',r'2028',r'3\s+(?:years|años|anos)',
            r'3123-05',r'3123-10',r'3123-20'
          ]
          semantics={
            'total station':['total station','estación total','estação total'],
            'GNSS':['gnss'],
            'coordinate systems':['coordinate reference systems','sistemas de referencia de coordenadas','sistemas de referência de coordenadas'],
            'traverse closure':['traverses and closure','poligonales y cierre','poligonais e fechamento'],
            'professional boundary':['licensed or authorized surveyor','topógrafo/agrimensor autorizado','profissional habilitado'],
            'photogrammetry':['photogrammetry','fotogrametría','fotogrametria'],
            'drone':['drone','drones'],
            'privacy':['privacy','privacidad','privacidade'],
            'field safety':['field safety','seguridad en campo','segurança em campo'],
            'responsible AI':['responsible ai','ia responsable','ia responsável'],
            'accessibility':['accessibility','accesibilidad','acessibilidade'],
            'synthetic portfolio':['synthetic','sintético','sintéticos']
          }
          for p,t in zip(files,texts):
            for pat in controls:
              if not re.search(pat,t,re.I): problems.append(f'{p.name}: missing controlled value {pat}')
            low=t.lower()
            for label,terms in semantics.items():
              if not any(term.lower() in low for term in terms): problems.append(f'{p.name}: missing semantic control {label}')
          if problems:
            print('\n'.join(problems)); sys.exit(1)
          print('Guide 93 Markdown QA PASS; reader URLs=19')

      - name: Check controlled reader links
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/guide93_urls.txt
          import re
          from pathlib import Path
          t=Path('project/revision-2026/guide-93/publication-candidate/GUIDE_93_ENGLISH_v2.md').read_text(encoding='utf-8')
          for u in sorted(set(re.findall(r'https://[^\s)<>`]+',t))): print(u)
          PY
          test "$(wc -l < /tmp/guide93_urls.txt)" -eq 19
          fail=0
          while IFS= read -r url; do
            code="$(curl -L -sS -o /dev/null -w '%{http_code}' --connect-timeout 15 --max-time 35 -A 'Mozilla/5.0 Guide93-QA' "$url" || echo 000)"
            case "$code" in
              200|201|202|204|301|302|303|307|308|401|403|429) echo "LINK OK/WALLED $code $url" ;;
              404|410) echo "LINK FAIL $code $url"; fail=1 ;;
              000|5??) echo "LINK WARN $code $url" ;;
              *) echo "LINK REVIEW $code $url" ;;
            esac
          done < /tmp/guide93_urls.txt
          test "$fail" -eq 0

      - name: Create URL-safe display filter
        run: |
          cat > /tmp/url_safe.lua <<'LUA'
          local function is_long_url(s) return string.match(s, '^https?://') and string.len(s) > 45 end
          function Link(el)
            local text=pandoc.utils.stringify(el.content)
            if is_long_url(text) then return pandoc.Link({pandoc.Str('Source link')},el.target,el.title) end
            return el
          end
          function Str(el)
            local text=el.text
            if is_long_url(text) then return pandoc.Link({pandoc.Str('Source link')},text) end
            return el
          end
          LUA

      - name: Generate DOCX and searchable PDF editions
        run: |
          set -euo pipefail
          OUT='project/revision-2026/guide-93/publication-candidate'
          for STEM in GUIDE_93_ENGLISH_v2 GUIDE_93_SPANISH_es-419_v2 GUIDE_93_PORTUGUESE_pt-BR_v2; do
            pandoc "$OUT/$STEM.md" -f gfm-tex_math_dollars -t docx --standalone --lua-filter=/tmp/url_safe.lua -o "$OUT/$STEM.docx"
            mkdir -p "$OUT/lo-$STEM"
            libreoffice --headless --convert-to pdf --outdir "$OUT/lo-$STEM" "$OUT/$STEM.docx"
            mv "$OUT/lo-$STEM/$STEM.pdf" "$OUT/$STEM.pdf"
            rmdir "$OUT/lo-$STEM"
          done

      - name: Validate DOCX PDF and all-page rendering
        run: |
          set -euo pipefail
          OUT='project/revision-2026/guide-93/publication-candidate'
          test "$(find "$OUT" -maxdepth 1 -name '*.docx' | wc -l)" -eq 3
          test "$(find "$OUT" -maxdepth 1 -name '*.pdf' | wc -l)" -eq 3
          for DOCX in "$OUT"/*.docx; do test -s "$DOCX"; unzip -t "$DOCX" >/dev/null; unzip -l "$DOCX" | grep -q 'word/document.xml'; done
          for PDF in "$OUT"/*.pdf; do test -s "$PDF"; pdfinfo "$PDF" >/dev/null; test "$(pdftotext "$PDF" - | tr -d '[:space:]' | wc -c)" -gt 9000; done
          rm -rf "$OUT/rendered"
          for PDF in "$OUT"/*.pdf; do STEM="$(basename "$PDF" .pdf)"; mkdir -p "$OUT/rendered/$STEM"; pdftoppm -png -r 110 "$PDF" "$OUT/rendered/$STEM/page" >/dev/null 2>&1; done
          python - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageChops
          import json,sys
          root=Path('project/revision-2026/guide-93/publication-candidate/rendered'); problems=[]; pages=[]
          for path in sorted(root.rglob('*.png')):
            with Image.open(path) as im:
              gray=im.convert('L'); diff=ImageChops.difference(gray,Image.new('L',gray.size,255)); bbox=diff.point(lambda p:255 if p>12 else 0).getbbox()
              if bbox is None: problems.append(f'{path}: blank page'); continue
              l,t,r,b=bbox; w,h=gray.size; margins={'left':l,'top':t,'right':w-r,'bottom':h-b}
              if min(margins.values())<2: problems.append(f'{path}: possible clipping {margins}')
              pages.append({'file':str(path.relative_to(root)),'edge_margins':margins})
          (root/'RENDER_QA.json').write_text(json.dumps({'status':'FAIL' if problems else 'PASS','pages':pages,'problems':problems},indent=2)+'\n',encoding='utf-8')
          if problems: print('\n'.join(problems)); sys.exit(1)
          print(f'All-page rendering QA PASS: {len(pages)} pages')
          PY

      - name: Generate publication metadata and compact render QA
        shell: python
        run: |
          from pathlib import Path
          import hashlib,json,subprocess,shutil
          root=Path('project/revision-2026/guide-93'); out=root/'publication-candidate'; qa=root/'qa'
          render=json.loads((out/'rendered/RENDER_QA.json').read_text(encoding='utf-8')); assert render['status']=='PASS'
          editions=[]
          for lang,stem in [('en','GUIDE_93_ENGLISH_v2'),('es-419','GUIDE_93_SPANISH_es-419_v2'),('pt-BR','GUIDE_93_PORTUGUESE_pt-BR_v2')]:
            docx=out/f'{stem}.docx'; pdf=out/f'{stem}.pdf'; info=subprocess.check_output(['pdfinfo',str(pdf)],text=True)
            pc=next(int(x.split(':',1)[1]) for x in info.splitlines() if x.startswith('Pages:'))
            rendered=sum(1 for p in render['pages'] if p['file'].startswith(stem+'/'))
            assert pc==rendered
            editions.append({'language':lang,'docx':docx.name,'pdf':pdf.name,'docx_bytes':docx.stat().st_size,'pdf_bytes':pdf.stat().st_size,'pdf_pages':pc,'rendered_pages':rendered,'status':'PASS'})
          manifest={'guide':'93','occupation':'Surveying and Mapping Technician','build_date':'2026-08-22','status':'PASS','editions':editions,'reader_verification_urls':19,'english_source_blob':'effdfcd7908596a0285100e7856d898ee60abfe7','assurance_boundary':'Internal controlled publication QA, hard-link checks, searchable-PDF validation, all-page rendering, source traceability and checksum generation; not independent human certification, certified translation, legal/surveying/cadastral/engineering/aviation/privacy/cybersecurity/safety/accessibility certification, training-provider accreditation, funding approval, employment guarantee, or earnings guarantee.'}
          (out/'GUIDE_93_PUBLICATION_QA_MANIFEST.json').write_text(json.dumps(manifest,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          (out/'RENDER_QA.json').write_text(json.dumps(render,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          targets=sorted(p for p in out.iterdir() if p.is_file() and p.suffix in {'.docx','.pdf'})
          (out/'SHA256SUMS.txt').write_text('\n'.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}' for p in targets)+'\n',encoding='utf-8')
          (qa/'GUIDE_93_PUBLICATION_QA_09.md').write_text('# Guide 93 — Publication QA 09\n\n**Stage:** Publication — **PASS**\n\nEnglish, es-419 and pt-BR Markdown/DOCX/PDF editions passed controlled-value and semantic parity, 19-link reader parity, hard-link checks, DOCX integrity, searchable-PDF validation, all-page rendering, page reconciliation, metadata and SHA-256 checksum generation.\n\nNo independent human certification, certified translation, legal/surveying/cadastral/engineering/aviation/privacy/security/safety/accessibility certification, funding approval, employment guarantee or earnings guarantee is claimed.\n',encoding='utf-8')
          (qa/'GUIDE_93_RELEASE_AUDIT_10.md').write_text('# Guide 93 — Release Audit 10\n\n**Stage:** Release Audit — **PASS**\n\nRelease audit confirms all predecessor gates, trilingual publication artifacts, 19-reader-link parity, checksums, searchable PDFs, all-page rendering, technician/professional-scope boundaries and zero blockers.\n',encoding='utf-8')
          shutil.rmtree(out/'rendered')

      - name: Commit verified publication package without status file
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          OUT='project/revision-2026/guide-93/publication-candidate'
          git add \
            "$OUT/GUIDE_93_ENGLISH_v2.md" "$OUT/GUIDE_93_SPANISH_es-419_v2.md" "$OUT/GUIDE_93_PORTUGUESE_pt-BR_v2.md" \
            "$OUT/GUIDE_93_ENGLISH_v2.docx" "$OUT/GUIDE_93_SPANISH_es-419_v2.docx" "$OUT/GUIDE_93_PORTUGUESE_pt-BR_v2.docx" \
            "$OUT/GUIDE_93_ENGLISH_v2.pdf" "$OUT/GUIDE_93_SPANISH_es-419_v2.pdf" "$OUT/GUIDE_93_PORTUGUESE_pt-BR_v2.pdf" \
            "$OUT/GUIDE_93_PUBLICATION_QA_MANIFEST.json" "$OUT/RENDER_QA.json" "$OUT/SHA256SUMS.txt" \
            project/revision-2026/guide-93/qa/GUIDE_93_PUBLICATION_QA_09.md \
            project/revision-2026/guide-93/qa/GUIDE_93_RELEASE_AUDIT_10.md
          git commit -m 'build(guide-93): publish controlled trilingual package'
          git pull --rebase origin revision/guide-00-100-2026
          git push origin HEAD:revision/guide-00-100-2026

      - name: Refresh live branch and close status gates separately
        run: |
          set -euo pipefail
          git pull --rebase origin revision/guide-00-100-2026
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('project/revision-2026/guide-93/GUIDE_93_HELPER_STATUS.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d['stages']['technical_qa']['status']=='PASS'
          assert not d.get('blockers')
          d['stages']['publication']={'status':'PASS','evidence':['project/revision-2026/guide-93/qa/GUIDE_93_PUBLICATION_QA_09.md','project/revision-2026/guide-93/publication-candidate/GUIDE_93_PUBLICATION_QA_MANIFEST.json','project/revision-2026/guide-93/publication-candidate/SHA256SUMS.txt','project/revision-2026/guide-93/publication-candidate/RENDER_QA.json']}
          d['stages']['release_audit']={'status':'PASS','evidence':['project/revision-2026/guide-93/qa/GUIDE_93_RELEASE_AUDIT_10.md']}
          d['blockers']=[]
          p.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          PY
          git add project/revision-2026/guide-93/GUIDE_93_HELPER_STATUS.json
          git commit -m 'qa(guide-93): close publication and release gates'
          git pull --rebase origin revision/guide-00-100-2026
          git push origin HEAD:revision/guide-00-100-2026
