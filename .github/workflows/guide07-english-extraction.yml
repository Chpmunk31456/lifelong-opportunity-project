name: Guide 07 English extraction evidence

on:
  workflow_dispatch:
  push:
    branches:
      - revision/guide-00-100-2026
    paths:
      - .github/workflows/guide07-english-extraction.yml
      - scripts/guide07_legacy_extract.py
      - 07-customer-service-specialist/english/docx/Lifelong_Opportunity_Customer_Service_Specialist_Guide_English_v1.0.docx
      - 07-customer-service-specialist/english/pdf/Lifelong_Opportunity_Customer_Service_Specialist_Guide_English_v1.0.pdf

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revision/guide-00-100-2026
      - run: python -m pip install --disable-pip-version-check python-docx==1.1.2 pypdf==5.9.0
      - run: python scripts/guide07_legacy_extract.py
      - uses: actions/upload-artifact@v4
        with:
          name: guide07-legacy-extraction-evidence
          path: |
            project/revision-2026/guide-07/qa/GUIDE_07_LEGACY_ENGLISH_EXTRACTION_RECONCILIATION_02.md
            project/revision-2026/guide-07/qa/evidence/guide07_legacy_docx_extract.txt
            project/revision-2026/guide-07/qa/evidence/guide07_legacy_pdf_extract.txt
