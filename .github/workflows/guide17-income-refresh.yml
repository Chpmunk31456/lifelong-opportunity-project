name: Guide 17 verified income refresh

on:
  push:
    branches:
      - revision/guide-00-100-2026
    paths:
      - .github/workflows/guide17-income-refresh.yml
      - scripts/guide17_apply_income_refresh.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: guide17-income-refresh
  cancel-in-progress: false

jobs:
  correct:
    if: github.repository == 'Chpmunk31456/lifelong-opportunity-project'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out controlled revision branch
        uses: actions/checkout@v4
        with:
          ref: revision/guide-00-100-2026
          fetch-depth: 0

      - name: Apply fail-closed verified income correction
        run: python scripts/guide17_apply_income_refresh.py

      - name: Verify corrected source state
        shell: python
        run: |
          from pathlib import Path
          p = Path('17-bank-teller-and-member-services-representative/references/english-v2-working-master.md')
          raw = p.read_bytes()
          assert not raw.startswith(b'\xef\xbb\xbf')
          text = raw.decode('utf-8', errors='strict')
          assert '\ufffd' not in text
          assert '$19.25/hour average base salary' in text
          assert 'page updated July 20, 2026' in text
          assert '$36,351/year average, approximately $17.48/hour' in text
          assert 'page state reviewed July 27, 2026' in text
          assert '$37,557/year average, approximately $18/hour' in text
          assert 'As of July 01, 2026' in text
          assert '$19.28/hour' not in text
          assert '$37,554/year average' not in text
          print('Guide 17 corrected source verification: PASS')

      - name: Commit corrected master and recheck evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            17-bank-teller-and-member-services-representative/references/english-v2-working-master.md \
            17-bank-teller-and-member-services-representative/references/english-v2-private-income-recheck-2026-08-09.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Guide 17 already contains the verified income correction.'
            exit 0
          fi
          git commit -m "fix(guide-17): align private income snapshot to reproducible sources"
          git fetch origin revision/guide-00-100-2026
          git rebase origin/revision/guide-00-100-2026
          python scripts/guide17_apply_income_refresh.py
          git add \
            17-bank-teller-and-member-services-representative/references/english-v2-working-master.md \
            17-bank-teller-and-member-services-representative/references/english-v2-private-income-recheck-2026-08-09.md
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit --amend --no-edit
          fi
          git push origin HEAD:revision/guide-00-100-2026
