name: Generalized manual pipeline

on:
  workflow_dispatch:
    inputs:
      guide_number:
        description: 'Guide number (08-100)'
        required: true
        default: '08'
        type: string
      stage:
        description: 'Deterministic stage to run'
        required: true
        default: 'validate-config'
        type: choice
        options:
          - validate-config
          - parity
          - build
          - release-audit
          - status
  push:
    branches:
      - revision/guide-00-100-2026
    paths:
      - .github/workflows/manual-pipeline.yml
      - scripts/manual_pipeline.py
      - project/pipeline/**

permissions:
  contents: write

env:
  PIPELINE_GUIDE: ${{ inputs.guide_number || '08' }}
  PIPELINE_STAGE: ${{ inputs.stage || 'validate-config' }}

concurrency:
  group: manual-pipeline-${{ inputs.guide_number || '08' }}-${{ inputs.stage || 'validate-config' }}
  cancel-in-progress: false

jobs:
  run:
    if: github.repository == 'Chpmunk31456/lifelong-opportunity-project'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out controlled revision branch
        uses: actions/checkout@v4
        with:
          ref: revision/guide-00-100-2026
          fetch-depth: 0

      - name: Validate guide range
        shell: bash
        run: |
          GUIDE="$PIPELINE_GUIDE"
          if ! [[ "$GUIDE" =~ ^[0-9]{2,3}$ ]]; then
            echo "Guide number must be numeric (08-100)."
            exit 1
          fi
          N=$((10#$GUIDE))
          if (( N < 8 || N > 100 )); then
            echo "Generalized pipeline is authorized for Guides 08-100."
            exit 1
          fi

      - name: Install publication dependencies
        if: env.PIPELINE_STAGE == 'build' || env.PIPELINE_STAGE == 'release-audit'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pandoc libreoffice-writer poppler-utils

      - name: Run generalized controller
        run: python scripts/manual_pipeline.py "$PIPELINE_STAGE" --guide "$PIPELINE_GUIDE"

      - name: Verify fail-closed readiness behavior
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          status_path = Path('project/revision-2026/guide-08/GUIDE_08_HELPER_STATUS.json')
          status = json.loads(status_path.read_text(encoding='utf-8'))
          required = ('research', 'english_editorial', 'evidence_traceability', 'english_source_freeze')
          localization_paths = (
              Path('project/revision-2026/guide-08/source/GUIDE_08_SPANISH_LATAM_WORKING_MASTER_v2.md'),
              Path('project/revision-2026/guide-08/source/GUIDE_08_PORTUGUESE_BR_WORKING_MASTER_v2.md'),
          )
          ready = all(status['stages'][name]['status'] == 'PASS' for name in required) and all(p.exists() for p in localization_paths)
          if ready:
              print('Guide 08 prerequisites now permit parity; negative fail-closed smoke test no longer applies.')
          else:
              proc = subprocess.run(
                  ['python', 'scripts/manual_pipeline.py', 'parity', '--guide', '08'],
                  text=True, capture_output=True
              )
              print(proc.stdout)
              print(proc.stderr)
              if proc.returncode == 0:
                  raise SystemExit('FAIL: parity unexpectedly passed before Guide 08 prerequisites were complete')
              print('PASS: generalized pipeline failed closed before parity prerequisites were complete.')
          PY

      - name: Upload publication evidence
        if: env.PIPELINE_STAGE == 'build'
        uses: actions/upload-artifact@v4
        with:
          name: guide-${{ env.PIPELINE_GUIDE }}-publication-evidence
          path: project/revision-2026/guide-${{ env.PIPELINE_GUIDE }}/publication-candidate
          if-no-files-found: error

      - name: Commit deterministic build outputs
        if: env.PIPELINE_STAGE == 'build'
        run: |
          GUIDE="$PIPELINE_GUIDE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "project/revision-2026/guide-${GUIDE}/publication-candidate"
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Publication outputs already current.'
            exit 0
          fi
          git commit -m "build(guide-${GUIDE}): generalized publication candidates"
          git fetch origin revision/guide-00-100-2026
          git rebase origin/revision/guide-00-100-2026
          python scripts/manual_pipeline.py parity --guide "$GUIDE"
          python scripts/manual_pipeline.py build --guide "$GUIDE"
          git add "project/revision-2026/guide-${GUIDE}/publication-candidate"
          git commit --amend --no-edit || true
          git push origin HEAD:revision/guide-00-100-2026

      - name: Safety note
        run: |
          echo 'This workflow never merges PR #17 and never publishes externally.'
          echo 'Subjective research/editorial/localization PASS states must be supplied by explicit evidence.'
