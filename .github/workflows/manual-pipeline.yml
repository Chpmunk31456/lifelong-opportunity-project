name: Generalized manual pipeline

on:
  workflow_dispatch:
    inputs:
      guide_number:
        description: 'Guide number (08-100)'
        required: true
        default: '08'
        type: string
      stage:
        description: 'Deterministic stage to run'
        required: true
        default: 'validate-config'
        type: choice
        options:
          - validate-config
          - parity
          - build
          - release-audit
          - status

permissions:
  contents: read

concurrency:
  group: manual-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    if: github.repository == 'Chpmunk31456/lifelong-opportunity-project'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out requested ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve guide and stage
        shell: bash
        run: |
          echo "PIPELINE_GUIDE=${{ inputs.guide_number }}" >> "$GITHUB_ENV"
          echo "PIPELINE_STAGE=${{ inputs.stage }}" >> "$GITHUB_ENV"

      - name: Validate guide range and stage
        shell: bash
        run: |
          GUIDE="$PIPELINE_GUIDE"
          STAGE="$PIPELINE_STAGE"
          if ! [[ "$GUIDE" =~ ^[0-9]{2,3}$ ]]; then
            echo "Guide number must be numeric (08-100)."
            exit 1
          fi
          N=$((10#$GUIDE))
          if (( N < 8 || N > 100 )); then
            echo "Generalized pipeline is authorized for Guides 08-100."
            exit 1
          fi
          case "$STAGE" in
            validate-config|parity|build|release-audit|status) ;;
            *) echo "Unsupported pipeline stage: $STAGE"; exit 1 ;;
          esac

      - name: Install publication dependencies
        if: env.PIPELINE_STAGE == 'build' || env.PIPELINE_STAGE == 'release-audit'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pandoc libreoffice-writer poppler-utils

      - name: Run generalized controller
        shell: bash
        run: |
          GUIDE="$PIPELINE_GUIDE"
          STAGE="$PIPELINE_STAGE"
          QA_DIR="project/revision-2026/guide-${GUIDE}/qa"
          mkdir -p "$QA_DIR"

          if [[ "$STAGE" == 'parity' ]]; then
            {
              echo "# Guide ${GUIDE} — Generalized Trilingual Parity QA"
              echo
              echo "Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo "Source commit: $GITHUB_SHA"
              echo
              echo '```text'
              python scripts/manual_pipeline.py parity --guide "$GUIDE"
              echo '```'
              echo
              echo '**Gate result: PASS — deterministic trilingual parity.**'
              echo
              echo 'This automated PASS verifies configured structure, URL parity, UTF-8 integrity and critical fact patterns. It does not claim independent human or professional translation certification.'
            } | tee "$QA_DIR/GUIDE_${GUIDE}_TRILINGUAL_PARITY_QA.md"
          elif [[ "$STAGE" == 'release-audit' ]]; then
            {
              echo "# Guide ${GUIDE} — Generalized Release Audit"
              echo
              echo "Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo "Source commit: $GITHUB_SHA"
              echo
              echo '```text'
              python scripts/manual_pipeline.py release-audit --guide "$GUIDE"
              echo '```'
              echo
              echo '**Gate result: PASS — generalized deterministic release audit.**'
              echo
              echo 'This gate reconciles configured upstream evidence, publication artifacts, checksums and visual-review evidence. It does not claim independent human, legal, accessibility or professional translation certification.'
            } | tee "$QA_DIR/GUIDE_${GUIDE}_RELEASE_AUDIT.md"
          else
            python scripts/manual_pipeline.py "$STAGE" --guide "$GUIDE"
          fi

      - name: Upload deterministic gate evidence
        if: env.PIPELINE_STAGE == 'parity' || env.PIPELINE_STAGE == 'release-audit'
        uses: actions/upload-artifact@v4
        with:
          name: guide-${{ env.PIPELINE_GUIDE }}-${{ env.PIPELINE_STAGE }}-evidence
          path: project/revision-2026/guide-${{ env.PIPELINE_GUIDE }}/qa/GUIDE_${{ env.PIPELINE_GUIDE }}_*.md
          if-no-files-found: error

      - name: Upload publication evidence
        if: env.PIPELINE_STAGE == 'build'
        uses: actions/upload-artifact@v4
        with:
          name: guide-${{ env.PIPELINE_GUIDE }}-publication-evidence
          path: project/revision-2026/guide-${{ env.PIPELINE_GUIDE }}/publication-candidate
          if-no-files-found: error

      - name: Report repository mutations without pushing
        if: always()
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No tracked repository changes were produced.'
          else
            echo 'The pipeline produced local runner changes only. Protected branches are never written by this workflow.'
            git status --short
          fi

      - name: Safety note
        run: |
          echo 'This workflow is read-only with respect to GitHub repository contents.'
          echo 'Any generated repository changes must be reviewed and committed from a maintenance branch through a pull request.'
