name: Guide 40 controlled publication build

on:
  push:
    branches: [revision/guide-00-100-2026]
    paths:
      - '.github/workflows/guide40-publication-build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: guide40-controlled-publication-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out revision branch
        uses: actions/checkout@v5
        with:
          ref: revision/guide-00-100-2026
          fetch-depth: 0

      - name: Install document and rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc libreoffice poppler-utils python3-pil

      - name: Freeze trilingual publication candidates
        shell: bash
        run: |
          set -euo pipefail
          SRC='project/revision-2026/guide-40/working-masters'
          OUT='project/revision-2026/guide-40/publication-candidate'
          mkdir -p "$OUT"
          cp "$SRC/GUIDE_40_CONSTRUCTION_LABORER_AND_TRADE_HELPER_ENGLISH_v2.md" "$OUT/GUIDE_40_ENGLISH_v2.md"
          cp "$SRC/GUIDE_40_CONSTRUCTION_LABORER_AND_TRADE_HELPER_SPANISH_es-419_v2.md" "$OUT/GUIDE_40_SPANISH_es-419_v2.md"
          cp "$SRC/GUIDE_40_CONSTRUCTION_LABORER_AND_TRADE_HELPER_PORTUGUESE_pt-BR_v2.md" "$OUT/GUIDE_40_PORTUGUESE_pt-BR_v2.md"

      - name: Run trilingual structural source numeric and terminology controls
        shell: python
        run: |
          from pathlib import Path
          import re, sys, unicodedata
          out=Path('project/revision-2026/guide-40/publication-candidate')
          files={'en':out/'GUIDE_40_ENGLISH_v2.md','es-419':out/'GUIDE_40_SPANISH_es-419_v2.md','pt-BR':out/'GUIDE_40_PORTUGUESE_pt-BR_v2.md'}
          texts={k:p.read_text(encoding='utf-8') for k,p in files.items()}
          def fold(s): return ''.join(c for c in unicodedata.normalize('NFKD',s.lower()) if not unicodedata.combining(c))
          problems=[]; urls={}; sections={}
          required={
            'en':['# guide 40','version 2.0','construction laborer','safety comes before speed','apprenticeship','colombia','using ai responsibly','cybersecurity and privacy basics','does not provide legal advice'],
            'es-419':['# guia 40','version 2.0','construccion','seguridad','aprendizaje','colombia','uso responsable de ia','ciberseguridad','asesoria legal'],
            'pt-BR':['# guia 40','versao 2.0','construcao','seguranca','aprendizagem','colombia','uso responsavel de ia','ciberseguranca','orientacao juridica']}
          for lang,text in texts.items():
            low=fold(text)
            sections[lang]=len(re.findall(r'^##\s+.+$',text,re.M))
            urls[lang]=set(re.findall(r'https://[^\s)<>`]+',text))
            if text.startswith('\ufeff') or '\ufffd' in text: problems.append(f'{lang}: UTF-8 defect')
            for bad in ('todo:','lorem ipsum','[insert','translation pending','traduccion pendiente','traducao pendente'):
              if bad in low: problems.append(f'{lang}: placeholder {bad}')
            for marker in required[lang]:
              if fold(marker) not in low: problems.append(f'{lang}: missing marker {marker}')
          if len(set(sections.values())) != 1: problems.append(f'structural mismatch {sections}')
          for lang in ('es-419','pt-BR'):
            if urls[lang] != urls['en']: problems.append(f'{lang}: source URL set differs from English')
          controls=[r'47-2061\.00',r'75110',r'1[,.]?296',r'4[,.]?000',r'46[,.]?050',r'22[.,]14',r'46[,.]?730',r'40[,.]?430',r'1[,.]?649[,.]?100',r'7\s*%',r'149[,.]?400',r'47[,.]?120',r'22[.,]66',r'43[,.]?578',r'21(?:[.,]00)?',r'40[,.]?504',r'49[,.]?004',r'18[.,]25',r'25[.,]00',r'40[.,]00']
          for lang,text in texts.items():
            for pat in controls:
              if not re.search(pat,text,re.I): problems.append(f'{lang}: missing controlled value {pat}')
          if problems:
            print('\n'.join(problems)); sys.exit(1)
          print(f'Guide 40 trilingual controls PASS: sections={sections}')

      - name: Validate live source-link behavior
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, sys
          text=Path('project/revision-2026/guide-40/publication-candidate/GUIDE_40_ENGLISH_v2.md').read_text(encoding='utf-8')
          problems=[]
          for url in sorted(set(re.findall(r'https://[^\s)<>`]+',text))):
            cp=subprocess.run(['curl','-L','--max-time','35','-sS','-o','/dev/null','-w','%{http_code}',url],capture_output=True,text=True)
            code=int(cp.stdout[-3:]) if cp.stdout and cp.stdout[-3:].isdigit() else 0
            state='PASS' if 200 <= code < 400 else ('ACCESS_CONTROLLED' if code in (401,403,429) else 'FAIL')
            print(code,state,url)
            if state == 'FAIL': problems.append(f'{url}: HTTP {code}')
          if problems:
            print('\n'.join(problems)); sys.exit(1)
          PY

      - name: Generate DOCX and PDF editions
        shell: bash
        run: |
          set -euo pipefail
          OUT='project/revision-2026/guide-40/publication-candidate'
          for STEM in GUIDE_40_ENGLISH_v2 GUIDE_40_SPANISH_es-419_v2 GUIDE_40_PORTUGUESE_pt-BR_v2; do
            pandoc "$OUT/$STEM.md" -f gfm -t docx --standalone -o "$OUT/$STEM.docx"
            mkdir -p "$OUT/lo-$STEM"
            libreoffice --headless --convert-to pdf --outdir "$OUT/lo-$STEM" "$OUT/$STEM.docx"
            mv "$OUT/lo-$STEM/$STEM.pdf" "$OUT/$STEM.pdf"
            rmdir "$OUT/lo-$STEM"
          done

      - name: Validate DOCX and searchable PDF integrity
        shell: bash
        run: |
          set -euo pipefail
          OUT='project/revision-2026/guide-40/publication-candidate'
          test "$(find "$OUT" -maxdepth 1 -name '*.docx' | wc -l)" -eq 3
          test "$(find "$OUT" -maxdepth 1 -name '*.pdf' | wc -l)" -eq 3
          for DOCX in "$OUT"/*.docx; do unzip -t "$DOCX" >/dev/null; unzip -l "$DOCX" | grep -q 'word/document.xml'; done
          for PDF in "$OUT"/*.pdf; do pdfinfo "$PDF" >/dev/null; TEXT="$(pdftotext "$PDF" - | tr -d '[:space:]')"; test ${#TEXT} -gt 5000; done

      - name: Render and inspect every PDF page
        shell: bash
        run: |
          set -euo pipefail
          OUT='project/revision-2026/guide-40/publication-candidate'
          rm -rf "$OUT/rendered"
          for PDF in "$OUT"/*.pdf; do STEM="$(basename "$PDF" .pdf)"; mkdir -p "$OUT/rendered/$STEM"; pdftoppm -png -r 110 "$PDF" "$OUT/rendered/$STEM/page" >/dev/null 2>&1; done
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageChops
          import json, sys
          root=Path('project/revision-2026/guide-40/publication-candidate/rendered'); problems=[]; pages=[]
          for path in sorted(root.rglob('*.png')):
            try:
              with Image.open(path) as im: im.verify()
              with Image.open(path) as im:
                gray=im.convert('L'); diff=ImageChops.difference(gray,Image.new('L',gray.size,255)); bbox=diff.point(lambda p:255 if p>12 else 0).getbbox()
                if bbox is None: problems.append(f'{path}: blank page'); continue
                left,top,right,bottom=bbox; w,h=gray.size; margins={'left':left,'top':top,'right':w-right,'bottom':h-bottom}
                if min(margins.values()) < 4: problems.append(f'{path}: possible clipping {margins}')
                pages.append({'file':str(path.relative_to(root)),'status':'PASS','edge_margins':margins})
            except Exception as exc: problems.append(f'{path}: malformed render: {exc}')
          (root/'RENDER_QA.json').write_text(json.dumps({'status':'FAIL' if problems else 'PASS','pages':pages,'problems':problems},indent=2)+'\n',encoding='utf-8')
          if problems: print('\n'.join(problems)); sys.exit(1)
          print(f'All-page render QA PASS: {len(pages)} pages')
          PY

      - name: Generate publication metadata and checksums
        shell: python
        run: |
          from pathlib import Path
          import hashlib, json, subprocess
          out=Path('project/revision-2026/guide-40/publication-candidate'); render=json.loads((out/'rendered/RENDER_QA.json').read_text())
          records=[]
          for lang,stem in [('en','GUIDE_40_ENGLISH_v2'),('es-419','GUIDE_40_SPANISH_es-419_v2'),('pt-BR','GUIDE_40_PORTUGUESE_pt-BR_v2')]:
            docx=out/f'{stem}.docx'; pdf=out/f'{stem}.pdf'; info=subprocess.check_output(['pdfinfo',str(pdf)],text=True); pages=next(int(x.split(':',1)[1]) for x in info.splitlines() if x.startswith('Pages:')); txt=subprocess.check_output(['pdftotext',str(pdf),'-'],text=True,errors='replace')
            if '\ufffd' in txt: raise SystemExit(f'{pdf}: Unicode replacement character')
            rendered=sum(1 for p in render['pages'] if p['file'].startswith(stem+'/'))
            if rendered != pages: raise SystemExit(f'{stem}: render/page mismatch')
            records.append({'language':lang,'docx':docx.name,'pdf':pdf.name,'docx_bytes':docx.stat().st_size,'pdf_bytes':pdf.stat().st_size,'pdf_pages':pages,'rendered_pages':rendered,'status':'PASS'})
          manifest={'guide':'40','occupation':'Construction Laborer and Trade Helper','build_date':'2026-08-13','status':'PASS','editions':records,'assurance_boundary':'Internal automated publication QA; not independent human review, professional translation certification, accessibility certification, legal review, certification-body approval, accreditation, or employment or earnings guarantee.'}
          (out/'GUIDE_40_PUBLICATION_QA_MANIFEST.json').write_text(json.dumps(manifest,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          targets=sorted(p for p in out.iterdir() if p.is_file() and p.suffix in {'.docx','.pdf'})
          (out/'SHA256SUMS.txt').write_text('\n'.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}' for p in targets)+'\n',encoding='utf-8')

      - name: Upload rendered-page QA evidence
        uses: actions/upload-artifact@v4
        with:
          name: guide40-rendered-pages
          path: project/revision-2026/guide-40/publication-candidate/rendered
          retention-days: 14

      - name: Remove render images from commit scope
        run: rm -rf project/revision-2026/guide-40/publication-candidate/rendered

      - name: Commit controlled publication candidates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add project/revision-2026/guide-40/publication-candidate
          if git diff --cached --quiet; then echo 'No publication changes to commit.'; else git commit -m 'Build and validate Guide 40 publication candidates'; git pull --rebase origin revision/guide-00-100-2026; git push origin HEAD:revision/guide-00-100-2026; fi
