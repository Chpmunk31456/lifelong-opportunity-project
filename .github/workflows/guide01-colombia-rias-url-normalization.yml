name: Guide 01 Colombia RIAS URL normalization

on:
  workflow_dispatch:
  push:
    branches:
      - revision/guide-00-100-2026
    paths:
      - .github/workflows/guide01-colombia-rias-url-normalization.yml

permissions:
  contents: write

concurrency:
  group: guide01-colombia-rias-url-normalization
  cancel-in-progress: false

jobs:
  normalize-and-verify:
    if: github.repository == 'Chpmunk31456/lifelong-opportunity-project'
    runs-on: ubuntu-latest

    steps:
      - name: Check out controlled revision branch
        uses: actions/checkout@v4
        with:
          ref: revision/guide-00-100-2026
          fetch-depth: 0

      - name: Normalize canonical Colombia RIAS URL
        shell: python
        run: |
          from pathlib import Path

          old = 'https://www2.minsalud.gov.co/salud/publica/ssr/Paginas/Rutas-integrales-de-atencion-en-salud-RIAS.aspx'
          new = 'https://www.minsalud.gov.co/salud/publica/ssr/Paginas/Rutas-integrales-de-atencion-en-salud-RIAS.aspx'

          files = [
              Path('project/revision-2026/guide-01/working-masters/GUIDE_01_COMMUNITY_HEALTH_WORKER_ENGLISH_WORKING_MASTER.md'),
              Path('project/revision-2026/guide-01/working-masters/GUIDE_01_TRABAJADOR_COMUNITARIO_DE_SALUD_ES419_WORKING_MASTER.md'),
              Path('project/revision-2026/guide-01/working-masters/GUIDE_01_AGENTE_COMUNITARIO_DE_SAUDE_PTBR_WORKING_MASTER.md'),
          ]

          changed = []
          for path in files:
              if not path.is_file():
                  raise SystemExit(f'Missing controlled working master: {path}')
              raw = path.read_bytes()
              if raw.startswith(b'\xef\xbb\xbf'):
                  raise SystemExit(f'Unexpected UTF-8 BOM: {path}')
              text = raw.decode('utf-8')
              old_count = text.count(old)
              new_count = text.count(new)

              if old_count == 1 and new_count == 0:
                  path.write_text(text.replace(old, new), encoding='utf-8', newline='\n')
                  changed.append(path)
              elif old_count == 0 and new_count == 1:
                  print(f'Already normalized: {path}')
              else:
                  raise SystemExit(
                      f'Unexpected RIAS URL state in {path}: legacy={old_count}, canonical={new_count}'
                  )

          for path in files:
              text = path.read_text(encoding='utf-8')
              if text.count(old) != 0 or text.count(new) != 1:
                  raise SystemExit(f'Post-normalization verification failed: {path}')
              print(f'Verified canonical RIAS URL: {path}')

          Path('/tmp/guide01_rias_changed.txt').write_text(
              '\n'.join(str(path) for path in changed), encoding='utf-8'
          )

      - name: Commit verified normalization when needed
        run: |
          if [ ! -s /tmp/guide01_rias_changed.txt ]; then
            echo 'All Guide 01 working masters already use the canonical RIAS URL.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            project/revision-2026/guide-01/working-masters/GUIDE_01_COMMUNITY_HEALTH_WORKER_ENGLISH_WORKING_MASTER.md \
            project/revision-2026/guide-01/working-masters/GUIDE_01_TRABAJADOR_COMUNITARIO_DE_SALUD_ES419_WORKING_MASTER.md \
            project/revision-2026/guide-01/working-masters/GUIDE_01_AGENTE_COMUNITARIO_DE_SAUDE_PTBR_WORKING_MASTER.md
          git diff --cached --check
          git commit -m 'fix(guide-01): use canonical Colombia RIAS URL'
          git push origin HEAD:revision/guide-00-100-2026
