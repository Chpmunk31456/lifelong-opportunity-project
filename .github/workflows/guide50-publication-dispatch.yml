name: Guide 50 publication dispatch and gate closure

on:
  push:
    branches: [revision/guide-00-100-2026]
    paths:
      - '.github/workflows/guide50-publication-dispatch.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: guide50-publication-dispatch
  cancel-in-progress: false

jobs:
  dispatch-close:
    runs-on: ubuntu-latest
    steps:
      - name: Check out authoritative revision branch
        uses: actions/checkout@v5
        with:
          ref: revision/guide-00-100-2026
          fetch-depth: 0

      - name: Confirm Guide 50 is exactly at Technical QA
        shell: python
        run: |
          import json
          from pathlib import Path
          p=Path('project/revision-2026/guide-50/GUIDE_50_HELPER_STATUS.json')
          m=json.loads(p.read_text(encoding='utf-8'))
          expected=['baseline_inventory','research','english_editorial','evidence_traceability','english_source_freeze','spanish_localization','portuguese_localization']
          bad=[k for k in expected if m['stages'][k]['status']!='PASS']
          if bad: raise SystemExit(f'Guide 50 upstream gates not PASS: {bad}')
          if m['stages']['technical_qa']['status'] not in ('PENDING','PASS'):
            raise SystemExit('Unexpected Technical QA state')
          print('Guide 50 manifest precondition PASS')

      - name: Dispatch controlled Guide 50 publication build
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID="$(gh run list --workflow guide50-publication-build.yml --branch revision/guide-00-100-2026 --limit 10 --json databaseId,status,conclusion --jq '[.[] | select(.status == "completed" and .conclusion == "success")] | first | .databaseId // empty')"
          if [ -n "$RUN_ID" ]; then
            echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
            echo "Reusing successful controlled publication run $RUN_ID; package verification remains mandatory."
            exit 0
          fi
          START="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run guide50-publication-build.yml --ref revision/guide-00-100-2026
          for i in $(seq 1 30); do
            RUN_ID="$(gh run list --workflow guide50-publication-build.yml --branch revision/guide-00-100-2026 --limit 10 --json databaseId,createdAt,status --jq --arg s "$START" '[.[] | select(.createdAt >= $s)] | sort_by(.createdAt) | last | .databaseId // empty')"
            if [ -n "$RUN_ID" ]; then break; fi
            sleep 10
          done
          test -n "$RUN_ID"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Dispatched controlled publication run $RUN_ID"

      - name: Wait for controlled publication result
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          gh run watch "$RUN_ID" --exit-status

      - name: Refresh branch and verify generated publication package
        env:
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin revision/guide-00-100-2026
          OUT='project/revision-2026/guide-50/publication-candidate'
          test -f "$OUT/GUIDE_50_PUBLICATION_QA_MANIFEST.json"
          test -f "$OUT/SHA256SUMS.txt"
          test "$(find "$OUT" -maxdepth 1 -name '*.docx' | wc -l)" -eq 3
          test "$(find "$OUT" -maxdepth 1 -name '*.pdf' | wc -l)" -eq 3
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          out=Path('project/revision-2026/guide-50/publication-candidate')
          q=json.loads((out/'GUIDE_50_PUBLICATION_QA_MANIFEST.json').read_text(encoding='utf-8'))
          if q.get('status')!='PASS' or len(q.get('editions',[]))!=3 or any(x.get('status')!='PASS' for x in q['editions']):
              raise SystemExit('Publication QA manifest is not a complete PASS')
          listed={}
          for line in (out/'SHA256SUMS.txt').read_text(encoding='utf-8').splitlines():
              if not line.strip(): continue
              h,name=line.split(None,1); listed[name.strip()]=h
          targets=sorted(p for p in out.iterdir() if p.suffix in {'.docx','.pdf'})
          if len(targets)!=6: raise SystemExit('Expected six DOCX/PDF publication files')
          for p in targets:
              got=hashlib.sha256(p.read_bytes()).hexdigest()
              if listed.get(p.name)!=got: raise SystemExit(f'Checksum mismatch: {p.name}')
          print('Guide 50 publication package verification PASS')
          PY

      - name: Record Technical QA Publication and Release Audit PASS
        env:
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        shell: python
        run: |
          import json, subprocess
          from pathlib import Path
          root=Path('project/revision-2026/guide-50')
          qa=root/'qa'; qa.mkdir(parents=True,exist_ok=True)
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          technical=qa/'GUIDE_50_TECHNICAL_QA_08.md'
          publication=qa/'GUIDE_50_PUBLICATION_GATE_09.md'
          release=qa/'GUIDE_50_RELEASE_AUDIT_10.md'
          technical.write_text(f'''# Guide 50 — Trilingual Technical QA 08\n\n**Guide:** 50 — Phlebotomy Technician  \n**Controlled publication run:** `{__import__('os').environ['RUN_ID']}`  \n**Validated branch head after publication build:** `{head}`  \n**Status:** **PASS**\n\nThe controlled publication build passed trilingual structural/source/numeric/terminology/clinical-safety controls, live-link behavior checks, DOCX integrity, searchable-PDF integrity, all-page render QA, publication metadata generation, and SHA-256 checksum generation.\n\nThis is internal automated QA and does not claim independent human review, professional/clinical certification, certified translation, accessibility certification, accreditation, medical/legal advice, clinical-practice authorization, or guaranteed employment/earnings.\n''',encoding='utf-8')
          publication.write_text(f'''# Guide 50 — Publication Gate 09\n\n**Status:** **PASS**\n\nPublication candidates for English, neutral Latin American Spanish (`es-419`), and Brazilian Portuguese (`pt-BR`) are present as DOCX and PDF files. `GUIDE_50_PUBLICATION_QA_MANIFEST.json` records all three editions PASS, and `SHA256SUMS.txt` reconciles all six published document artifacts. Controlled publication run: `{__import__('os').environ['RUN_ID']}`.\n''',encoding='utf-8')
          release.write_text(f'''# Guide 50 — Release Audit 10\n\n**Status:** **PASS**\n\nRelease audit confirms the Guide 50 fail-closed sequence: Baseline Inventory, Research, English Editorial, Evidence/Traceability, English Source Freeze, Spanish Localization, Portuguese Localization, Technical QA, and Publication all have auditable PASS evidence. The controlled package has trilingual DOCX/PDF artifacts, PASS publication metadata, and verified SHA-256 checksums.\n\nNo claim of independent human certification, clinical authorization, professional translation certification, accessibility certification, accreditation, legal/medical advice, or employment/earnings guarantee is made.\n''',encoding='utf-8')
          mp=root/'GUIDE_50_HELPER_STATUS.json'
          m=json.loads(mp.read_text(encoding='utf-8'))
          m['updated']='2026-08-19'
          m['stages']['technical_qa']={'status':'PASS','evidence':[str(technical)]}
          m['stages']['publication']={'status':'PASS','evidence':[str(publication),str(root/'publication-candidate/GUIDE_50_PUBLICATION_QA_MANIFEST.json'),str(root/'publication-candidate/SHA256SUMS.txt')]}
          m['stages']['release_audit']={'status':'PASS','evidence':[str(release)]}
          mp.write_text(json.dumps(m,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')

      - name: Validate closed helper manifest and commit closure
        shell: bash
        run: |
          set -euo pipefail
          python scripts/manual_helper_gate.py --guide 50 --target technical_qa
          python scripts/manual_helper_gate.py --guide 50 --target publication
          python scripts/manual_helper_gate.py --guide 50 --target release_audit
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add project/revision-2026/guide-50/qa/GUIDE_50_TECHNICAL_QA_08.md \
                  project/revision-2026/guide-50/qa/GUIDE_50_PUBLICATION_GATE_09.md \
                  project/revision-2026/guide-50/qa/GUIDE_50_RELEASE_AUDIT_10.md \
                  project/revision-2026/guide-50/GUIDE_50_HELPER_STATUS.json
          git commit -m 'Close Guide 50 controlled publication gates'
          git pull --rebase origin revision/guide-00-100-2026
          git push origin HEAD:revision/guide-00-100-2026

# Controlled gate-closure trigger: 2026-08-19 14:08 America/Bogota
