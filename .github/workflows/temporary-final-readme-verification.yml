name: Temporary final README verification

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    if: github.head_ref == 'audit-lifelong-opportunity-project'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Rebuild final audit report
        shell: python
        run: |
          from pathlib import Path
          from urllib.parse import unquote
          import re

          root = Path('.')
          excluded = {'.github/workflows/temporary-final-readme-verification.yml'}
          readmes = sorted(p for p in root.rglob('README.md') if '.git' not in p.parts)
          all_files = sorted(p for p in root.rglob('*') if p.is_file() and '.git' not in p.parts and p.as_posix() not in excluded)
          link_re = re.compile(r'(?<!!)\[[^\]]*\]\(([^)]+)\)')
          malformed, broken = [], []
          local_checked = external = anchors = emails = 0

          for readme in readmes:
              text = readme.read_text(encoding='utf-8', errors='replace')
              if re.search(r'\]\s+\(', text):
                  malformed.append(readme.as_posix())
              for target in link_re.findall(text):
                  target = target.strip()
                  if target.startswith(('http://','https://')):
                      external += 1; continue
                  if target.startswith('mailto:'):
                      emails += 1; continue
                  if target.startswith('#'):
                      anchors += 1; continue
                  clean = unquote(target.split('#',1)[0].split('?',1)[0]).strip()
                  if not clean:
                      anchors += 1; continue
                  local_checked += 1
                  resolved = (readme.parent / clean).resolve()
                  try:
                      resolved.relative_to(root.resolve())
                  except ValueError:
                      broken.append((readme.as_posix(), target, 'outside repository'))
                      continue
                  if not resolved.exists():
                      broken.append((readme.as_posix(), target, 'missing'))

          rows = []
          for label, folder in [('English/english','english'),('Spanish/spanish','spanish'),('Portuguese/portuguese','portuguese')]:
              matches = [p for p in all_files if folder in p.parts]
              rows.append(f"- {label}: {len(matches)} files (Markdown {sum(p.suffix.lower()=='.md' for p in matches)}, PDF {sum(p.suffix.lower()=='.pdf' for p in matches)}, DOCX {sum(p.suffix.lower()=='.docx' for p in matches)})")

          nested = sorted(
              p.as_posix() for p in all_files
              if any(p.parts[i] == p.parts[i+1] and p.parts[i] in {'english','spanish','portuguese'} for i in range(len(p.parts)-1))
          )
          result = 'PASS' if not broken and not malformed and not nested else 'FAIL'
          lines = [
              '# README and Associated-Guide Audit','',
              f'**Overall result:** {result}','',
              '## Summary','',
              f'- README files audited: {len(readmes)}',
              f'- Repository-local links checked: {local_checked}',
              f'- Broken repository-local targets: {len(broken)}',
              f'- README files with malformed `] (` links: {len(malformed)}',
              f'- External links identified but not network-tested: {external}',
              f'- Internal anchors identified: {anchors}',
              f'- Email links identified: {emails}',
              f'- Repository files inventoried: {len(all_files)}','',
              '## Language Inventory',''
          ] + rows + ['', '## README Files Audited',''] + [f'- `{p.as_posix()}`' for p in readmes]
          lines += ['', '## Broken Repository-Local Targets','']
          lines += [f'- `{s}` → `{t}` ({r})' for s,t,r in broken] if broken else ['No broken repository-local targets were found.']
          lines += ['', '## Malformed Markdown Links','']
          lines += [f'- `{p}`' for p in malformed] if malformed else ['No malformed `] (` link patterns were found.']
          lines += ['', '## Nested Language Directories','']
          lines += [f'- `{p}`' for p in nested] if nested else ['No duplicated language-directory nesting was found.']
          lines += ['', '## Limits','',
                    '- External websites were not tested.',
                    '- This mechanical audit does not certify substantive accuracy, translation quality, accessibility conformance, or document rendering.',
                    '- Missing PDF or DOCX editions are not treated as defects unless a README promises them.']
          Path('project/README_ASSOCIATED_GUIDE_AUDIT.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')

      - name: Commit final report
        run: |
          rm .github/workflows/temporary-final-readme-verification.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refresh final repository audit after Guide 08 repair"
          git push origin HEAD:${{ github.head_ref }}
