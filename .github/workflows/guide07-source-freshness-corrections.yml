name: Guide 07 source freshness corrections

on:
  push:
    branches:
      - revision/guide-00-100-2026
    paths:
      - .github/workflows/guide07-source-freshness-corrections.yml
      - scripts/guide07_apply_freshness_corrections.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: guide07-source-freshness-corrections
  cancel-in-progress: false

jobs:
  correct:
    if: github.repository == 'Chpmunk31456/lifelong-opportunity-project'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out controlled revision branch
        uses: actions/checkout@v4
        with:
          ref: revision/guide-00-100-2026
          fetch-depth: 0

      - name: Apply fail-closed source corrections
        run: python scripts/guide07_apply_freshness_corrections.py

      - name: Verify source text after correction
        shell: python
        run: |
          from pathlib import Path
          p = Path('project/revision-2026/guide-07/source/GUIDE_07_ENGLISH_WORKING_MASTER_v2.md')
          raw = p.read_bytes()
          assert not raw.startswith(b'\xef\xbb\xbf')
          text = raw.decode('utf-8', errors='strict')
          assert '\ufffd' not in text
          assert '**August 8, 2026**' in text
          assert 'both in-person and virtual offerings appearing' not in text
          assert '**48-hour complementary, in-person special course**' in text
          print('Guide 07 corrected source verification: PASS')

      - name: Commit corrected source only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project/revision-2026/guide-07/source/GUIDE_07_ENGLISH_WORKING_MASTER_v2.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Guide 07 source already contains verified freshness corrections.'
            exit 0
          fi
          git commit -m "fix(guide-07): refresh salary dates and SENA modality claim"
          git fetch origin revision/guide-00-100-2026
          git rebase origin/revision/guide-00-100-2026
          python scripts/guide07_apply_freshness_corrections.py || true
          git add project/revision-2026/guide-07/source/GUIDE_07_ENGLISH_WORKING_MASTER_v2.md
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit --amend --no-edit
          fi
          git push origin HEAD:revision/guide-00-100-2026
