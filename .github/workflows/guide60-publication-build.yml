name: Guide 60 archived release audit

on:
  push:
    branches:
      - revision/guide-00-100-2026
    paths:
      - '.github/workflows/guide60-publication-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guide60-archived-release-audit
  cancel-in-progress: false

jobs:
  verify-closed-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out controlled revision branch
        uses: actions/checkout@v4
        with:
          ref: revision/guide-00-100-2026

      - name: Verify Guide 60 remains closed and blocker-free
        shell: python
        run: |
          import json
          from pathlib import Path

          root = Path('project/revision-2026/guide-60')
          status_path = root / 'GUIDE_60_HELPER_STATUS.json'
          data = json.loads(status_path.read_text(encoding='utf-8'))

          if data.get('guide') != '60':
              raise SystemExit('Guide number mismatch in Guide 60 helper status')
          if data.get('blockers'):
              raise SystemExit(f"Guide 60 has blockers: {data['blockers']}")

          required_stages = (
              'baseline_inventory',
              'research',
              'english_editorial',
              'evidence_traceability',
              'english_source_freeze',
              'spanish_localization',
              'portuguese_localization',
              'technical_qa',
              'publication',
              'release_audit',
          )
          for stage in required_stages:
              state = data.get('stages', {}).get(stage, {}).get('status')
              if state != 'PASS':
                  raise SystemExit(f'Guide 60 stage is not PASS: {stage}={state}')

          required_release_files = (
              root / 'qa/GUIDE_60_PUBLICATION_QA_09.md',
              root / 'qa/GUIDE_60_RELEASE_AUDIT_10.md',
              root / 'publication-candidate/GUIDE_60_PUBLICATION_QA_MANIFEST.json',
              root / 'publication-candidate/SHA256SUMS.txt',
          )
          missing = [str(path) for path in required_release_files if not path.exists()]
          if missing:
              raise SystemExit('Guide 60 closed-release evidence is missing: ' + ', '.join(missing))

          manifest = json.loads(
              (root / 'publication-candidate/GUIDE_60_PUBLICATION_QA_MANIFEST.json').read_text(encoding='utf-8')
          )
          if manifest.get('status') != 'PASS':
              raise SystemExit('Guide 60 publication manifest is not PASS')

          print('Guide 60 archived release audit PASS')
          print('No publication files were regenerated or modified.')

      - name: Safety note
        run: |
          echo 'Guide 60 is already released and this workflow is intentionally read-only.'
          echo 'It does not merge PR #17 and cannot republish Guide 60.'
