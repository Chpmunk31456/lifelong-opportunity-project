name: Guide 60 one-shot publication retry dispatcher

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/guide60-publication-retry-once.yml'

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    if: github.event.pull_request.head.ref == 'revision/guide-00-100-2026'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch updated Guide 60 controlled publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run guide60-publication-build.yml \
            --repo '${{ github.repository }}' \
            --ref revision/guide-00-100-2026
          echo 'Updated Guide 60 controlled publication dispatched.'

      - name: Remove one-shot retry dispatcher
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="$(gh api 'repos/${{ github.repository }}/contents/.github/workflows/guide60-publication-retry-once.yml?ref=revision%2Fguide-00-100-2026' --jq '.sha')"
          gh api --method DELETE \
            -H 'Accept: application/vnd.github+json' \
            'repos/${{ github.repository }}/contents/.github/workflows/guide60-publication-retry-once.yml' \
            -f message='Guide 60: retire one-shot publication retry dispatcher' \
            -f sha="$SHA" \
            -f branch='revision/guide-00-100-2026'
