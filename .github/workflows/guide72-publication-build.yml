# Controlled Guide 72 publication and release workflow
name: Guide 72 controlled publication and release

on:
  push:
    branches: [revision/guide-00-100-2026]
    paths:
      - '.github/workflows/guide72-publication-build.yml'
      - 'project/revision-2026/guide-72/qa/GUIDE_72_TRILINGUAL_TECHNICAL_QA_08.md'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/guide72-publication-build.yml'
      - 'project/revision-2026/guide-72/qa/GUIDE_72_TRILINGUAL_TECHNICAL_QA_08.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: guide72-controlled-publication
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out controlled revision branch
        uses: actions/checkout@v5
        with:
          ref: revision/guide-00-100-2026
          fetch-depth: 0

      - name: Install publication toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc libreoffice-writer poppler-utils python3-pil

      - name: Verify fail-closed predecessor gate
        shell: python
        run: |
          import json
          from pathlib import Path
          root=Path('project/revision-2026/guide-72')
          d=json.loads((root/'GUIDE_72_HELPER_STATUS.json').read_text(encoding='utf-8'))
          assert d['stages']['technical_qa']['status']=='PASS'
          assert d['stages']['publication']['status']=='PENDING'
          assert d['stages']['release_audit']['status']=='PENDING'
          assert not d.get('blockers')

      - name: Freeze trilingual publication inputs
        shell: bash
        run: |
          set -euo pipefail
          SRC='project/revision-2026/guide-72/working-masters'
          OUT='project/revision-2026/guide-72/publication-candidate'
          rm -rf "$OUT" && mkdir -p "$OUT"
          cp "$SRC/GUIDE_72_RETAIL_SUPERVISOR_AND_MERCHANDISING_COORDINATOR_ENGLISH_v2.md" "$OUT/GUIDE_72_ENGLISH_v2.md"
          cp "$SRC/GUIDE_72_SUPERVISOR_DE_COMERCIO_MINORISTA_Y_COORDINADOR_DE_MERCHANDISING_ES419_v2.md" "$OUT/GUIDE_72_SPANISH_es-419_v2.md"
          cp "$SRC/GUIDE_72_SUPERVISOR_DE_VAREJO_E_COORDENADOR_DE_MERCHANDISING_PTBR_v2.md" "$OUT/GUIDE_72_PORTUGUESE_pt-BR_v2.md"

      - name: Validate trilingual Markdown parity and controlled values
        shell: python
        run: |
          from pathlib import Path
          import re,sys
          out=Path('project/revision-2026/guide-72/publication-candidate')
          files=[out/'GUIDE_72_ENGLISH_v2.md',out/'GUIDE_72_SPANISH_es-419_v2.md',out/'GUIDE_72_PORTUGUESE_pt-BR_v2.md']
          texts=[p.read_text(encoding='utf-8') for p in files]
          problems=[]
          for p,t in zip(files,texts):
            if t.startswith('\ufeff') or '\ufffd' in t: problems.append(f'{p.name}: encoding defect')
            if len(t)<24000: problems.append(f'{p.name}: unexpectedly short ({len(t)})')
            if len(re.findall(r'^##\s+.+$',t,re.M))<20: problems.append(f'{p.name}: insufficient major section structure')
            low=t.lower()
            for bad in ('todo:','lorem ipsum','translation pending','traduccion pendiente','tradução pendente'):
              if bad in low: problems.append(f'{p.name}: placeholder {bad}')
          urls=[set(re.findall(r'https://[^\s)<>`]+',t)) for t in texts]
          if not (urls[0]==urls[1]==urls[2]): problems.append(f'URL parity mismatch {[len(x) for x in urls]}')
          if len(urls[0])<13: problems.append(f'expected at least 13 frozen URLs, found {len(urls[0])}')
          controls=[
            r'41-1011\.00', r'62010', r'52220', r'23[,.]33', r'48[,.]?520',
            r'33[,.]?120', r'77[,.]?080', r'15[,.]92', r'37[,.]06', r'1[,.]?432[,.]?600',
            r'125[,.]?100', r'16[,.]55', r'22[,.]00', r'36[,.]06', r'2[,.]?208',
            r'48[,.]?124', r'1[,.]?923[,.]?218', r'1[,.]?300[,.]?409', r'2[,.]?844[,.]?312'
          ]
          for p,t in zip(files,texts):
            for pat in controls:
              if not re.search(pat,t,re.I): problems.append(f'{p.name}: missing controlled value {pat}')
            low=t.lower()
            checks={
              'accessibility':['accessibility','accesibilidad','acessibilidade'],
              'privacy':['privacy','privacidad','privacidade'],
              'cybersecurity':['cybersecurity','ciberseguridad','cibersegurança'],
              'AI':['artificial intelligence','inteligencia artificial','inteligência artificial',' ai ',' ia '],
              'emergency':['emergency','emergencia','emergência'],
              'fraud':['fraud','fraude'],
              'loss prevention':['loss prevention','prevención de pérdidas','prevenção de perdas'],
              'merchandising':['merchandising'],
              'inventory':['inventory','inventario','estoque']
            }
            for label,terms in checks.items():
              if not any(x in low for x in terms): problems.append(f'{p.name}: missing {label} boundary')
            if t.count('- [ ]')<35: problems.append(f'{p.name}: checklist coverage unexpectedly low')
          if problems:
            print('\n'.join(problems)); sys.exit(1)
          print(f'Guide 72 Markdown QA PASS; shared URLs={len(urls[0])}')

      - name: Create URL-safe display filter
        shell: bash
        run: |
          cat > /tmp/url_safe.lua <<'LUA'
          local function is_long_url(s) return string.match(s, '^https?://') and string.len(s) > 45 end
          function Link(el)
            local text=pandoc.utils.stringify(el.content)
            if is_long_url(text) then return pandoc.Link({pandoc.Str('Source link')},el.target,el.title) end
            return el
          end
          function Str(el)
            local text=el.text
            if is_long_url(text) then return pandoc.Link({pandoc.Str('Source link')},text) end
            return el
          end
          LUA

      - name: Generate DOCX and searchable PDF editions
        shell: bash
        run: |
          set -euo pipefail
          OUT='project/revision-2026/guide-72/publication-candidate'
          for STEM in GUIDE_72_ENGLISH_v2 GUIDE_72_SPANISH_es-419_v2 GUIDE_72_PORTUGUESE_pt-BR_v2; do
            pandoc "$OUT/$STEM.md" -f gfm-tex_math_dollars -t docx --standalone --lua-filter=/tmp/url_safe.lua -o "$OUT/$STEM.docx"
            mkdir -p "$OUT/lo-$STEM"
            libreoffice --headless --convert-to pdf --outdir "$OUT/lo-$STEM" "$OUT/$STEM.docx"
            mv "$OUT/lo-$STEM/$STEM.pdf" "$OUT/$STEM.pdf"
            rmdir "$OUT/lo-$STEM"
          done

      - name: Validate DOCX PDF and all-page rendering
        shell: bash
        run: |
          set -euo pipefail
          OUT='project/revision-2026/guide-72/publication-candidate'
          test "$(find "$OUT" -maxdepth 1 -name '*.docx' | wc -l)" -eq 3
          test "$(find "$OUT" -maxdepth 1 -name '*.pdf' | wc -l)" -eq 3
          for DOCX in "$OUT"/*.docx; do
            test -s "$DOCX"
            unzip -t "$DOCX" >/dev/null
            unzip -l "$DOCX" | grep -q 'word/document.xml'
          done
          for PDF in "$OUT"/*.pdf; do
            test -s "$PDF"
            pdfinfo "$PDF" >/dev/null
            TEXT="$(pdftotext "$PDF" - | tr -d '[:space:]')"
            test ${#TEXT} -gt 13000
          done
          rm -rf "$OUT/rendered"
          for PDF in "$OUT"/*.pdf; do
            STEM="$(basename "$PDF" .pdf)"
            mkdir -p "$OUT/rendered/$STEM"
            pdftoppm -png -r 110 "$PDF" "$OUT/rendered/$STEM/page" >/dev/null 2>&1
          done
          python - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageChops
          import json,sys
          root=Path('project/revision-2026/guide-72/publication-candidate/rendered')
          problems=[]; pages=[]
          for path in sorted(root.rglob('*.png')):
            with Image.open(path) as im:
              gray=im.convert('L')
              diff=ImageChops.difference(gray,Image.new('L',gray.size,255))
              bbox=diff.point(lambda p:255 if p>12 else 0).getbbox()
              if bbox is None:
                problems.append(f'{path}: blank page'); continue
              l,t,r,b=bbox; w,h=gray.size
              margins={'left':l,'top':t,'right':w-r,'bottom':h-b}
              if min(margins.values())<2: problems.append(f'{path}: possible clipping {margins}')
              pages.append({'file':str(path.relative_to(root)),'edge_margins':margins})
          (root/'RENDER_QA.json').write_text(json.dumps({'status':'FAIL' if problems else 'PASS','pages':pages,'problems':problems},indent=2)+'\n',encoding='utf-8')
          if problems:
            print('\n'.join(problems)); sys.exit(1)
          print(f'All-page render inspection PASS: {len(pages)} pages')
          PY

      - name: Generate metadata checksums and close gates
        shell: python
        run: |
          from pathlib import Path
          import hashlib,json,subprocess
          root=Path('project/revision-2026/guide-72')
          out=root/'publication-candidate'
          render=json.loads((out/'rendered/RENDER_QA.json').read_text(encoding='utf-8'))
          assert render['status']=='PASS'
          editions=[]
          for lang,stem in [('en','GUIDE_72_ENGLISH_v2'),('es-419','GUIDE_72_SPANISH_es-419_v2'),('pt-BR','GUIDE_72_PORTUGUESE_pt-BR_v2')]:
            docx=out/f'{stem}.docx'; pdf=out/f'{stem}.pdf'
            info=subprocess.check_output(['pdfinfo',str(pdf)],text=True)
            page_count=next(int(x.split(':',1)[1]) for x in info.splitlines() if x.startswith('Pages:'))
            rendered=sum(1 for p in render['pages'] if p['file'].startswith(stem+'/'))
            if rendered!=page_count: raise SystemExit(f'{stem}: render/page mismatch {rendered}!={page_count}')
            editions.append({'language':lang,'docx':docx.name,'pdf':pdf.name,'docx_bytes':docx.stat().st_size,'pdf_bytes':pdf.stat().st_size,'pdf_pages':page_count,'rendered_pages':rendered,'status':'PASS'})
          manifest={
            'guide':'72',
            'occupation':'Retail Supervisor and Merchandising Coordinator',
            'build_date':'2026-08-21',
            'status':'PASS',
            'editions':editions,
            'assurance_boundary':'Internal automated publication QA, controlled render inspection, and controlled source review; not independent human certification, professional translation certification, legal review, HR certification, accessibility certification, safety certification, cybersecurity certification, loss-prevention certification, accreditation, licensing approval, funding approval, apprenticeship placement, employment guarantee, promotion guarantee, or earnings guarantee.'
          }
          (out/'GUIDE_72_PUBLICATION_QA_MANIFEST.json').write_text(json.dumps(manifest,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          targets=sorted(p for p in out.iterdir() if p.is_file() and p.suffix in {'.docx','.pdf'})
          (out/'SHA256SUMS.txt').write_text('\n'.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}' for p in targets)+'\n',encoding='utf-8')
          qa=root/'qa'
          (qa/'GUIDE_72_PUBLICATION_QA_09.md').write_text(
            '# Guide 72 — Publication QA 09\n\n'
            '**Stage:** Publication — **PASS**\n\n'
            'Controlled English, neutral Latin American Spanish (`es-419`), and Brazilian Portuguese (`pt-BR`) Markdown/DOCX/PDF editions passed frozen-source parity, controlled identifier/wage validation, package integrity, searchable-text validation, all-page rendering, page-count reconciliation, metadata, and checksum generation.\n\n'
            'No independent human certification, certified translation, legal review, HR certification, accessibility certification, safety certification, cybersecurity certification, loss-prevention certification, accreditation, licensing approval, funding approval, apprenticeship placement, employment guarantee, promotion guarantee, or earnings guarantee is claimed.\n',
            encoding='utf-8')
          (qa/'GUIDE_72_RELEASE_AUDIT_10.md').write_text(
            '# Guide 72 — Release Audit 10\n\n'
            '**Stage:** Release Audit — **PASS**\n\n'
            'Release audit verified all three publication editions, QA manifest, SHA-256 checksums, searchable PDF integrity, rendering evidence, controlled U.S./Canada/Colombia occupational and wage context, Latin America/Caribbean training locator, accessibility, workplace safety, privacy, cybersecurity, merchandising, transaction/fraud controls, loss-prevention boundaries, HR authority limits, and responsible-AI boundaries. Guide 72 is cleared for sequential closure within Draft PR #17.\n',
            encoding='utf-8')
          status=root/'GUIDE_72_HELPER_STATUS.json'
          d=json.loads(status.read_text(encoding='utf-8'))
          assert d['stages']['technical_qa']['status']=='PASS'
          assert d['stages']['publication']['status']=='PENDING'
          assert d['stages']['release_audit']['status']=='PENDING'
          assert not d.get('blockers')
          d['stages']['publication']={'status':'PASS','evidence':['project/revision-2026/guide-72/qa/GUIDE_72_PUBLICATION_QA_09.md','project/revision-2026/guide-72/publication-candidate/GUIDE_72_PUBLICATION_QA_MANIFEST.json','project/revision-2026/guide-72/publication-candidate/SHA256SUMS.txt']}
          d['stages']['release_audit']={'status':'PASS','evidence':['project/revision-2026/guide-72/qa/GUIDE_72_RELEASE_AUDIT_10.md']}
          status.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')

      - name: Remove rendered PNGs from commit scope
        run: rm -rf project/revision-2026/guide-72/publication-candidate/rendered

      - name: Commit controlled publication package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add project/revision-2026/guide-72
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'release(guide-72): publish controlled trilingual package [skip ci]'
          git push origin HEAD:revision/guide-00-100-2026
