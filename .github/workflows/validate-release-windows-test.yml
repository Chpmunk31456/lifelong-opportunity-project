name: Temporary Windows release validator test

on:
  pull_request:
    paths:
      - 'scripts/validate-release.ps1'
      - '.github/workflows/validate-release-windows-test.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Enable long paths
        shell: powershell
        run: git config --system core.longpaths true

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validator dependencies
        run: python -m pip install -r requirements.txt

      - name: Run release validator
        shell: powershell
        run: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\scripts\validate-release.ps1
