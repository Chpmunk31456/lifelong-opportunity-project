name: Guide 53 render edge diagnostic

on:
  push:
    branches: [revision/guide-00-100-2026]
    paths:
      - '.github/workflows/guide53-render-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out revision branch
        uses: actions/checkout@v5
        with:
          ref: revision/guide-00-100-2026
          fetch-depth: 0

      - name: Install diagnostic toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc libreoffice-writer poppler-utils python3-pil

      - name: Rebuild English and Portuguese publication PDFs
        shell: bash
        run: |
          set -euo pipefail
          SRC='project/revision-2026/guide-53/working-masters'
          OUT='/tmp/guide53-diagnostic'
          rm -rf "$OUT"
          mkdir -p "$OUT"
          cp "$SRC/GUIDE_53_PHYSICAL_THERAPIST_ASSISTANT_ENGLISH_v2.md" "$OUT/GUIDE_53_ENGLISH_v2.md"
          cp "$SRC/GUIDE_53_PHYSICAL_THERAPIST_ASSISTANT_PORTUGUESE_pt-BR_v1.md" "$OUT/GUIDE_53_PORTUGUESE_pt-BR_v1.md"
          cat > /tmp/bounded_urls.lua <<'LUA'
          function Link(el)
            local text = pandoc.utils.stringify(el.content)
            if text == el.target and string.len(text) > 45 then
              return pandoc.Link({pandoc.Str('Source link')}, el.target, el.title)
            end
            return el
          end
          LUA
          for STEM in GUIDE_53_ENGLISH_v2 GUIDE_53_PORTUGUESE_pt-BR_v1; do
            pandoc "$OUT/$STEM.md" -f gfm -t docx --standalone --lua-filter=/tmp/bounded_urls.lua -o "$OUT/$STEM.docx"
            libreoffice --headless --convert-to pdf --outdir "$OUT" "$OUT/$STEM.docx"
          done

      - name: Generate edge-object diagnostic report
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess, xml.etree.ElementTree as ET
          from pathlib import Path
          from PIL import Image, ImageChops

          out=Path('/tmp/guide53-diagnostic')
          render=out/'rendered'; render.mkdir(exist_ok=True)
          report=Path('project/revision-2026/guide-53/qa/GUIDE_53_RENDER_EDGE_DIAGNOSTIC.md')
          cases=[
            ('GUIDE_53_ENGLISH_v2.pdf',5,'english-page-05'),
            ('GUIDE_53_PORTUGUESE_pt-BR_v1.pdf',6,'portuguese-page-06'),
          ]
          lines=['# Guide 53 — Render Edge Diagnostic','',
                 '**Purpose:** identify the actual object reaching the right page edge without changing any controlled publication gate.','',
                 '**Status:** diagnostic only — no PASS/FAIL gate transition.','']
          for pdf_name,page,render_stem in cases:
            pdf=out/pdf_name
            xml=out/f'{pdf.stem}-page-{page}.xml'
            subprocess.run(['pdftotext','-f',str(page),'-l',str(page),'-bbox-layout',str(pdf),str(xml)],check=True)
            root=ET.parse(xml).getroot()
            page_el=next((e for e in root.iter() if e.tag.endswith('page')),None)
            width=float(page_el.attrib.get('width','0')) if page_el is not None else 0.0
            words=[]
            for e in root.iter():
              if not e.tag.endswith('word'): continue
              x1=float(e.attrib.get('xMax','0')); x0=float(e.attrib.get('xMin','0'))
              y0=float(e.attrib.get('yMin','0')); y1=float(e.attrib.get('yMax','0'))
              text=''.join(e.itertext()).strip()
              words.append((width-x1,x0,x1,y0,y1,text))
            words.sort(key=lambda x:x[0])

            prefix=render/render_stem
            subprocess.run(['pdftoppm','-f',str(page),'-singlefile','-png','-r','110',str(pdf),str(prefix)],check=True)
            png=prefix.with_suffix('.png')
            with Image.open(png) as im:
              gray=im.convert('L')
              diff=ImageChops.difference(gray,Image.new('L',gray.size,255))
              bbox=diff.point(lambda px:255 if px>12 else 0).getbbox()
              margins=None if bbox is None else {'left':bbox[0],'top':bbox[1],'right':im.size[0]-bbox[2],'bottom':im.size[1]-bbox[3]}

            lines += [f'## {pdf_name} — page {page}','',
                      f'- PDF width: `{width:.2f}` points',
                      f'- Raster size at 110 dpi: `{im.size[0]} × {im.size[1]}` pixels',
                      f'- Raster content margins: `{margins}`','',
                      '### 30 text boxes nearest the right edge','',
                      '| Distance to right (pt) | xMin | xMax | yMin–yMax | Text |',
                      '|---:|---:|---:|---:|---|']
            for distance,x0,x1,y0,y1,text in words[:30]:
              safe=text.replace('|','\\|')
              lines.append(f'| {distance:.2f} | {x0:.2f} | {x1:.2f} | {y0:.2f}–{y1:.2f} | `{safe}` |')
            lines += ['']

          lines += ['## Interpretation rule','',
                    'If all reported text boxes retain a normal positive right-side distance while raster content still reaches pixel 0 at the right edge, the edge-touching object is non-text (for example a rule, border, drawing, or rendering artifact). If a text box itself approaches the PDF page width, that text object is the primary repair target.','']
          report.write_text('\n'.join(lines),encoding='utf-8')
          print(report.read_text(encoding='utf-8'))
          PY

      - name: Upload diagnostic render evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guide53-render-edge-diagnostic
          path: |
            /tmp/guide53-diagnostic/rendered
            /tmp/guide53-diagnostic/*-page-*.xml
          retention-days: 14

      - name: Commit diagnostic report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- project/revision-2026/guide-53/qa/GUIDE_53_RENDER_EDGE_DIAGNOSTIC.md
          git diff --cached --check
          git commit -m 'Guide 53: record render edge diagnostic'
          git pull --rebase origin revision/guide-00-100-2026
          git push origin HEAD:revision/guide-00-100-2026
