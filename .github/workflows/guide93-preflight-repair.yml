name: Guide 93 preflight repair

on:
  push:
    branches: [revision/guide-00-100-2026]
    paths:
      - '.github/workflows/guide93-preflight-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: revision/guide-00-100-2026
          fetch-depth: 0
      - name: Repair false-negative education-duration control
        shell: python
        run: |
          from pathlib import Path
          p=Path('.github/workflows/guide93-publication-build.yml')
          s=p.read_text(encoding='utf-8')
          old="r'3\\s+(?:years|años|anos)'"
          new="r'(?:3\\s+(?:years|años|anos)|two\\s+or\\s+more\\s+years)'"
          assert old in s, 'expected Guide 93 duration control not found'
          assert s.count(old)==1, 'duration control must be unique'
          p.write_text(s.replace(old,new),encoding='utf-8')
      - name: Commit repair and remove one-shot helper
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/guide93-preflight-repair.yml
          git add .github/workflows/guide93-publication-build.yml
          git commit -m 'fix(guide-93): align publication preflight with source wording'
          git pull --rebase origin revision/guide-00-100-2026
          git push origin HEAD:revision/guide-00-100-2026
