name: Guide 48 status probe
on:
  push:
    branches: [revision/guide-00-100-2026]
    paths: ['.github/workflows/guide48-status-probe.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: revision/guide-00-100-2026
          fetch-depth: 0
      - name: Record workflow state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p project/revision-2026/guide-48/qa
          gh api 'repos/${{ github.repository }}/actions/workflows/guide48-publication-build.yml/runs?branch=revision%2Fguide-00-100-2026&per_page=5' --jq '.workflow_runs[] | "- Run `\(.id)` — status **\(.status)**, conclusion **\(.conclusion)**, head `\(.head_sha)`."' > /tmp/runs.txt
          { echo '# Guide 48 — publication workflow status'; echo; cat /tmp/runs.txt; echo; echo 'Technical QA remains PENDING until a complete controlled run passes.'; } > project/revision-2026/guide-48/qa/GUIDE_48_PUBLICATION_WORKFLOW_STATUS_08A.md
      - name: Commit evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add project/revision-2026/guide-48/qa/GUIDE_48_PUBLICATION_WORKFLOW_STATUS_08A.md
          git commit -m 'qa(guide-48): record publication workflow status' || exit 0
          git pull --rebase origin revision/guide-00-100-2026
          git push origin HEAD:revision/guide-00-100-2026

