# Activation touch 2026-08-22: workflow existed before this push.
name: Disable legacy completed-guide publication auto-triggers

on:
  push:
    branches: [revision/guide-00-100-2026]
    paths:
      - '.github/workflows/disable-legacy-publication-autotriggers.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out controlled revision branch
        uses: actions/checkout@v5
        with:
          ref: revision/guide-00-100-2026
          fetch-depth: 0

      - name: Convert completed-guide publication workflows to manual-only
        shell: python
        run: |
          from pathlib import Path
          import re

          targets = [64, 71, 72, 77, 78, 79, 80, 81, 82, 83]
          changed = []
          for n in targets:
              p = Path(f'.github/workflows/guide{n}-publication-build.yml')
              if not p.exists():
                  raise SystemExit(f'Missing expected workflow: {p}')
              text = p.read_text(encoding='utf-8')
              new, count = re.subn(
                  r'(?ms)^on:\n.*?^permissions:',
                  'on:\n  workflow_dispatch:\n\npermissions:',
                  text,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(f'Could not isolate trigger block in {p}')
              if new != text:
                  p.write_text(new, encoding='utf-8')
                  changed.append(str(p))
          print('Changed workflows:')
          print('\n'.join(changed))
          if len(changed) != len(targets):
              raise SystemExit(f'Expected {len(targets)} changes, got {len(changed)}')

      - name: Commit trigger cleanup
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/guide{64,71,72,77,78,79,80,81,82,83}-publication-build.yml
          git commit -m 'chore(ci): disable legacy publication auto-triggers'
          git pull --rebase origin revision/guide-00-100-2026
          git push origin HEAD:revision/guide-00-100-2026
