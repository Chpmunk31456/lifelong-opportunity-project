name: Guide 67 controlled publication and release

on:
  push:
    branches: [revision/guide-00-100-2026]
    paths:
      - '.github/workflows/guide67-publication-build.yml'
      - 'project/revision-2026/guide-67/GUIDE_67_HELPER_STATUS.json'
      - 'project/revision-2026/guide-67/qa/GUIDE_67_TRILINGUAL_TECHNICAL_QA_08.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: guide67-controlled-publication
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out controlled revision branch
        uses: actions/checkout@v5
        with:
          ref: revision/guide-00-100-2026
          fetch-depth: 0

      - name: Install publication toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc libreoffice-writer poppler-utils python3-pil

      - name: Verify fail-closed predecessor gate
        shell: python
        run: |
          import json
          from pathlib import Path
          root=Path('project/revision-2026/guide-67')
          d=json.loads((root/'GUIDE_67_HELPER_STATUS.json').read_text(encoding='utf-8'))
          assert d['stages']['technical_qa']['status']=='PASS'
          assert d['stages']['publication']['status']=='PENDING'
          assert d['stages']['release_audit']['status']=='PENDING'
          assert not d.get('blockers')

      - name: Freeze trilingual publication inputs
        shell: bash
        run: |
          set -euo pipefail
          SRC='project/revision-2026/guide-67/working-masters'
          OUT='project/revision-2026/guide-67/publication-candidate'
          rm -rf "$OUT" && mkdir -p "$OUT"
          cp "$SRC/GUIDE_67_COOK_AND_CULINARY_SPECIALIST_ENGLISH_v2.md" "$OUT/GUIDE_67_ENGLISH_v2.md"
          cp "$SRC/GUIDE_67_COOK_AND_CULINARY_SPECIALIST_ES419_v2.md" "$OUT/GUIDE_67_SPANISH_es-419_v2.md"
          cp "$SRC/GUIDE_67_COOK_AND_CULINARY_SPECIALIST_PTBR_v2.md" "$OUT/GUIDE_67_PORTUGUESE_pt-BR_v2.md"

      - name: Validate trilingual Markdown parity and controlled values
        shell: python
        run: |
          from pathlib import Path
          import re,sys
          out=Path('project/revision-2026/guide-67/publication-candidate')
          files=[out/'GUIDE_67_ENGLISH_v2.md',out/'GUIDE_67_SPANISH_es-419_v2.md',out/'GUIDE_67_PORTUGUESE_pt-BR_v2.md']
          texts=[p.read_text(encoding='utf-8') for p in files]
          problems=[]
          for p,t in zip(files,texts):
            if t.startswith('\ufeff') or '\ufffd' in t: problems.append(f'{p.name}: encoding defect')
            if len(t)<12000: problems.append(f'{p.name}: unexpectedly short ({len(t)})')
            if len(re.findall(r'^##\s+.+$',t,re.M))<18: problems.append(f'{p.name}: insufficient major section structure')
            low=t.lower()
            for bad in ('todo:','lorem ipsum','translation pending','traduccion pendiente','tradução pendente'):
              if bad in low: problems.append(f'{p.name}: placeholder {bad}')
          urls=[set(re.findall(r'https://[^\s)<>`]+',t)) for t in texts]
          if not (urls[0]==urls[1]==urls[2]): problems.append(f'URL parity mismatch {[len(x) for x in urls]}')
          if len(urls[0])!=17: problems.append(f'expected 17 frozen URLs, found {len(urls[0])}')
          controls=[r'35-2014\.00',r'63200',r'17[,.]98',r'37[,.]?390',r'34[,.]?010',r'44[,.]?620',r'1[,.]?460[,.]?200',r'250[,.]?700',r'35[,.]?760',r'17[,.]19',r'2[,.]?805[,.]?100',r'130[,.]?600',r'33[,.]?340',r'16[,.]03',r'28[,.]?000',r'37[,.]?500',r'15[,.]00',r'18[,.]00',r'25[,.]00',r'2[,.]?200',r'40']
          for p,t in zip(files,texts):
            for pat in controls:
              if not re.search(pat,t,re.I): problems.append(f'{p.name}: missing controlled value {pat}')
            low=t.lower()
            if not any(x in low for x in ['privacy','privacidad','privacidade']): problems.append(f'{p.name}: missing privacy boundary')
            if not any(x in low for x in ['cyber','ciber']): problems.append(f'{p.name}: missing cybersecurity boundary')
            if not any(x in low for x in ['artificial intelligence','inteligencia artificial','inteligência artificial',' ia ',' ai ']): problems.append(f'{p.name}: missing AI boundary')
            if not any(x in low for x in ['allergen','alerg','alérg']): problems.append(f'{p.name}: missing allergen boundary')
          if problems:
            print('\n'.join(problems)); sys.exit(1)
          print(f'Guide 67 Markdown QA PASS; shared URLs={len(urls[0])}')

      - name: Create URL-safe display filter
        shell: bash
        run: |
          cat > /tmp/url_safe.lua <<'LUA'
          local function is_long_url(s) return string.match(s, '^https?://') and string.len(s) > 45 end
          function Link(el)
            local text=pandoc.utils.stringify(el.content)
            if is_long_url(text) then return pandoc.Link({pandoc.Str('Source link')},el.target,el.title) end
            return el
          end
          function Str(el)
            local text=el.text
            if is_long_url(text) then return pandoc.Link({pandoc.Str('Source link')},text) end
            return el
          end
          LUA

      - name: Generate DOCX and searchable PDF editions
        shell: bash
        run: |
          set -euo pipefail
          OUT='project/revision-2026/guide-67/publication-candidate'
          for STEM in GUIDE_67_ENGLISH_v2 GUIDE_67_SPANISH_es-419_v2 GUIDE_67_PORTUGUESE_pt-BR_v2; do
            pandoc "$OUT/$STEM.md" -f gfm-tex_math_dollars -t docx --standalone --lua-filter=/tmp/url_safe.lua -o "$OUT/$STEM.docx"
            mkdir -p "$OUT/lo-$STEM"
            libreoffice --headless --convert-to pdf --outdir "$OUT/lo-$STEM" "$OUT/$STEM.docx"
            mv "$OUT/lo-$STEM/$STEM.pdf" "$OUT/$STEM.pdf"
            rmdir "$OUT/lo-$STEM"
          done

      - name: Validate DOCX PDF and all-page rendering
        shell: bash
        run: |
          set -euo pipefail
          OUT='project/revision-2026/guide-67/publication-candidate'
          test "$(find "$OUT" -maxdepth 1 -name '*.docx' | wc -l)" -eq 3
          test "$(find "$OUT" -maxdepth 1 -name '*.pdf' | wc -l)" -eq 3
          for DOCX in "$OUT"/*.docx; do unzip -t "$DOCX" >/dev/null; unzip -l "$DOCX" | grep -q 'word/document.xml'; done
          for PDF in "$OUT"/*.pdf; do pdfinfo "$PDF" >/dev/null; TEXT="$(pdftotext "$PDF" - | tr -d '[:space:]')"; test ${#TEXT} -gt 6000; done
          rm -rf "$OUT/rendered"
          for PDF in "$OUT"/*.pdf; do STEM="$(basename "$PDF" .pdf)"; mkdir -p "$OUT/rendered/$STEM"; pdftoppm -png -r 110 "$PDF" "$OUT/rendered/$STEM/page" >/dev/null 2>&1; done
          python - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageChops
          import json,sys
          root=Path('project/revision-2026/guide-67/publication-candidate/rendered'); problems=[]; pages=[]
          for path in sorted(root.rglob('*.png')):
            with Image.open(path) as im:
              gray=im.convert('L'); diff=ImageChops.difference(gray,Image.new('L',gray.size,255)); bbox=diff.point(lambda p:255 if p>12 else 0).getbbox()
              if bbox is None: problems.append(f'{path}: blank page'); continue
              l,t,r,b=bbox; w,h=gray.size; margins={'left':l,'top':t,'right':w-r,'bottom':h-b}
              if min(margins.values())<2: problems.append(f'{path}: possible clipping {margins}')
              pages.append({'file':str(path.relative_to(root)),'edge_margins':margins})
          (root/'RENDER_QA.json').write_text(json.dumps({'status':'FAIL' if problems else 'PASS','pages':pages,'problems':problems},indent=2)+'\n',encoding='utf-8')
          if problems: print('\n'.join(problems)); sys.exit(1)
          print(f'All-page rendering QA PASS: {len(pages)} pages')
          PY

      - name: Generate metadata checksums and close gates
        shell: python
        run: |
          from pathlib import Path
          import hashlib,json,subprocess
          root=Path('project/revision-2026/guide-67'); out=root/'publication-candidate'
          render=json.loads((out/'rendered/RENDER_QA.json').read_text(encoding='utf-8')); assert render['status']=='PASS'
          editions=[]
          for lang,stem in [('en','GUIDE_67_ENGLISH_v2'),('es-419','GUIDE_67_SPANISH_es-419_v2'),('pt-BR','GUIDE_67_PORTUGUESE_pt-BR_v2')]:
            docx=out/f'{stem}.docx'; pdf=out/f'{stem}.pdf'
            info=subprocess.check_output(['pdfinfo',str(pdf)],text=True)
            page_count=next(int(x.split(':',1)[1]) for x in info.splitlines() if x.startswith('Pages:'))
            rendered=sum(1 for p in render['pages'] if p['file'].startswith(stem+'/'))
            if rendered!=page_count: raise SystemExit(f'{stem}: render/page mismatch {rendered}!={page_count}')
            editions.append({'language':lang,'docx':docx.name,'pdf':pdf.name,'docx_bytes':docx.stat().st_size,'pdf_bytes':pdf.stat().st_size,'pdf_pages':page_count,'rendered_pages':rendered,'status':'PASS'})
          manifest={'guide':'67','occupation':'Cook and Culinary Specialist','build_date':'2026-08-21','status':'PASS','editions':editions,'assurance_boundary':'Internal automated publication QA and controlled source review; not independent human certification, professional translation certification, professional culinary or food-safety certification, legal review, accessibility certification, accreditation, or employment/earnings guarantee.'}
          (out/'GUIDE_67_PUBLICATION_QA_MANIFEST.json').write_text(json.dumps(manifest,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          targets=sorted(p for p in out.iterdir() if p.is_file() and p.suffix in {'.docx','.pdf'})
          (out/'SHA256SUMS.txt').write_text('\n'.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}' for p in targets)+'\n',encoding='utf-8')
          qa=root/'qa'
          (qa/'GUIDE_67_PUBLICATION_QA_09.md').write_text('# Guide 67 — Publication QA 09\n\n**Stage:** Publication — **PASS**\n\nControlled English, neutral Latin American Spanish (`es-419`), and Brazilian Portuguese (`pt-BR`) Markdown/DOCX/PDF editions passed frozen-source parity, controlled identifier/wage validation, package integrity, searchable-text validation, all-page rendering, page-count reconciliation, metadata, and checksum generation.\n\nNo independent human certification, certified translation, professional culinary or food-safety certification, legal review, accessibility certification, accreditation, employment guarantee, or earnings guarantee is claimed.\n',encoding='utf-8')
          (qa/'GUIDE_67_RELEASE_AUDIT_10.md').write_text('# Guide 67 — Release Audit 10\n\n**Stage:** Release Audit — **PASS**\n\nRelease audit verified all three publication editions, QA manifest, SHA-256 checksums, searchable PDF integrity, rendering evidence, source parity, controlled U.S./Canada/Colombia context, food/allergen and worker-safety controls, authority limits, privacy, cybersecurity, accessibility, and responsible-AI boundaries. Guide 67 is cleared for sequential closure within Draft PR #17.\n',encoding='utf-8')
          status=root/'GUIDE_67_HELPER_STATUS.json'; d=json.loads(status.read_text(encoding='utf-8'))
          assert d['stages']['technical_qa']['status']=='PASS'; assert not d.get('blockers')
          d['stages']['publication']={'status':'PASS','evidence':['project/revision-2026/guide-67/qa/GUIDE_67_PUBLICATION_QA_09.md','project/revision-2026/guide-67/publication-candidate/GUIDE_67_PUBLICATION_QA_MANIFEST.json','project/revision-2026/guide-67/publication-candidate/SHA256SUMS.txt']}
          d['stages']['release_audit']={'status':'PASS','evidence':['project/revision-2026/guide-67/qa/GUIDE_67_RELEASE_AUDIT_10.md']}
          status.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')

      - name: Remove rendered PNGs from commit scope
        run: rm -rf project/revision-2026/guide-67/publication-candidate/rendered

      - name: Commit controlled publication package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add project/revision-2026/guide-67
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'release(guide-67): publish controlled trilingual package'
          git push origin HEAD:revision/guide-00-100-2026
