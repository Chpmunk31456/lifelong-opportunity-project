name: Final Guides 00-100 release changelog refresh

on:
  workflow_dispatch:
  push:
    branches:
      - revision/guide-00-100-2026
    paths:
      - scripts/finalize_guides_00_100_release_changelog.py
      - scripts/generate_guides_00_100_release_changelog.py
      - project/revision-2026/guide-0*/GUIDE_*_LEGACY_CLOSURE_RECONCILIATION_2026-08-23.md
      - .github/workflows/final-release-changelog-refresh.yml

permissions:
  contents: write

concurrency:
  group: final-guides-00-100-release-changelog-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out controlled revision branch
        uses: actions/checkout@v4
        with:
          ref: revision/guide-00-100-2026
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate and validate final collection release documentation
        run: python scripts/finalize_guides_00_100_release_changelog.py

      - name: Check generated diff
        run: git diff --check

      - name: Commit refreshed release documentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add project/revision-2026/GUIDES_00_100_RELEASE_CHANGELOG.md project/revision-2026/GUIDES_00_100_RELEASE_CHANGELOG_QA.md
          if git diff --cached --quiet; then
            echo 'Final collection documentation already current.'
            exit 0
          fi
          git commit -m 'docs(collection): finalize Guides 00-100 release status'
          git pull --rebase origin revision/guide-00-100-2026
          python scripts/finalize_guides_00_100_release_changelog.py
          git add project/revision-2026/GUIDES_00_100_RELEASE_CHANGELOG.md project/revision-2026/GUIDES_00_100_RELEASE_CHANGELOG_QA.md
          git diff --check
          if ! git diff --cached --quiet; then
            git commit --amend --no-edit
          fi
          git push origin HEAD:revision/guide-00-100-2026
