name: Guide 18 controlled publication build

on:
  push:
    branches:
      - revision/guide-00-100-2026
    paths:
      - 'project/revision-2026/guide-18/source/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out revision branch
        uses: actions/checkout@v4
        with:
          ref: revision/guide-00-100-2026
          fetch-depth: 0

      - name: Install document tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc libreoffice poppler-utils

      - name: Prepare controlled sources
        shell: bash
        run: |
          set -euo pipefail
          OUT='project/revision-2026/guide-18/publication-candidate'
          rm -rf "$OUT"
          mkdir -p "$OUT" "$OUT/rendered"
          cp 'project/revision-2026/guide-18/source/GUIDE_18_ENGLISH_WORKING_MASTER_v2.md' "$OUT/GUIDE_18_ENGLISH_v2.md"
          cp 'project/revision-2026/guide-18/source/GUIDE_18_SPANISH_LATAM_WORKING_MASTER_v2.md' "$OUT/GUIDE_18_SPANISH_LATAM_v2.md"
          cp 'project/revision-2026/guide-18/source/GUIDE_18_PORTUGUESE_BR_WORKING_MASTER_v2.md' "$OUT/GUIDE_18_PORTUGUESE_BR_v2.md"

      - name: Structural and source controls
        shell: python
        run: |
          from pathlib import Path
          import re, sys
          out=Path('project/revision-2026/guide-18/publication-candidate')
          files={
            'en': out/'GUIDE_18_ENGLISH_v2.md',
            'es-419': out/'GUIDE_18_SPANISH_LATAM_v2.md',
            'pt-BR': out/'GUIDE_18_PORTUGUESE_BR_v2.md',
          }
          required_numbers=list(range(1,20))
          required_urls=[
            'https://www.onetonline.org/link/details/43-6012.00',
            'https://www.bls.gov/ooh/office-and-administrative-support/secretaries-and-administrative-assistants.htm',
            'https://www.jobbank.gc.ca/marketreport/summary-occupation/26967/ca',
            'https://studentaid.gov/articles/fafsa-student-steps/',
            'https://www.americanbar.org/news/abanews/aba-news-archives/2024/07/aba-issues-first-ethics-guidance-ai-tools/',
          ]
          numeric_patterns={
            '54,140': r'(?<!\d)(?:54,140|54\.140)(?!\d)',
            '156,300': r'(?<!\d)(?:156,300|156\.300)(?!\d)',
            '147,300': r'(?<!\d)(?:147,300|147\.300)(?!\d)',
            '-6%': r'-6\s*%',
            '-9,000': r'-(?:9,000|9\.000)(?!\d)',
            '18.75': r'(?<!\d)(?:18\.75|18,75)(?!\d)',
            '27.47': r'(?<!\d)(?:27\.47|27,47)(?!\d)',
            '41.72': r'(?<!\d)(?:41\.72|41,72)(?!\d)',
            '2,208': r'(?<!\d)(?:2,208|2\.208)(?!\d)',
            '5,250': r'(?<!\d)(?:5,250|5\.250)(?!\d)',
            '53,753': r'(?<!\d)(?:53,753|53\.753)(?!\d)',
            '25.84': r'(?<!\d)(?:25\.84|25,84)(?!\d)',
            '22.92': r'(?<!\d)(?:22\.92|22,92)(?!\d)',
          }
          problems=[]
          for lang,path in files.items():
            text=path.read_text(encoding='utf-8')
            nums=[int(m.group(1)) for m in re.finditer(r'^##\s+(\d+)\.', text, re.M)]
            if nums != required_numbers:
              problems.append(f'{lang}: section sequence {nums}')
            for url in required_urls:
              if url not in text:
                problems.append(f'{lang}: missing URL {url}')
            for label,pattern in numeric_patterns.items():
              if not re.search(pattern, text):
                problems.append(f'{lang}: missing controlled numeric value {label}')
            if '\ufffd' in text:
              problems.append(f'{lang}: Unicode replacement character present')
            lowered=text.lower()
            for bad in ('todo:', 'lorem ipsum', '[insert', 'translation pending'):
              if bad in lowered:
                problems.append(f'{lang}: placeholder marker {bad}')
          if problems:
            print('\n'.join(problems))
            sys.exit(1)
          print('Trilingual structural/source controls PASS')

      - name: Generate DOCX and PDF editions
        shell: bash
        run: |
          set -euo pipefail
          OUT='project/revision-2026/guide-18/publication-candidate'
          for STEM in GUIDE_18_ENGLISH_v2 GUIDE_18_SPANISH_LATAM_v2 GUIDE_18_PORTUGUESE_BR_v2; do
            pandoc "$OUT/$STEM.md" -f gfm -t docx --standalone -o "$OUT/$STEM.docx"
            mkdir -p "$OUT/lo-$STEM"
            libreoffice --headless --convert-to pdf --outdir "$OUT/lo-$STEM" "$OUT/$STEM.docx"
            mv "$OUT/lo-$STEM/$STEM.pdf" "$OUT/$STEM.pdf"
            rmdir "$OUT/lo-$STEM"
          done

      - name: Validate DOCX and searchable PDFs
        shell: bash
        run: |
          set -euo pipefail
          OUT='project/revision-2026/guide-18/publication-candidate'
          for DOCX in "$OUT"/*.docx; do
            unzip -t "$DOCX" >/dev/null
            unzip -l "$DOCX" | grep -q 'word/document.xml'
          done
          for PDF in "$OUT"/*.pdf; do
            pdfinfo "$PDF" >/dev/null
            TEXT="$(pdftotext "$PDF" - | tr -d '[:space:]')"
            test ${#TEXT} -gt 5000
          done

      - name: Render all PDF pages
        shell: bash
        run: |
          set -euo pipefail
          OUT='project/revision-2026/guide-18/publication-candidate'
          for PDF in "$OUT"/*.pdf; do
            STEM="$(basename "$PDF" .pdf)"
            mkdir -p "$OUT/rendered/$STEM"
            pdftoppm -png -r 90 "$PDF" "$OUT/rendered/$STEM/page" >/dev/null 2>&1
          done

      - name: Generate manifest and checksums
        shell: python
        run: |
          from pathlib import Path
          import hashlib, json, subprocess
          out=Path('project/revision-2026/guide-18/publication-candidate')
          records=[]
          for lang,stem in [
            ('en','GUIDE_18_ENGLISH_v2'),
            ('es-419','GUIDE_18_SPANISH_LATAM_v2'),
            ('pt-BR','GUIDE_18_PORTUGUESE_BR_v2'),
          ]:
            docx=out/f'{stem}.docx'; pdf=out/f'{stem}.pdf'
            info=subprocess.check_output(['pdfinfo',str(pdf)], text=True)
            pages=None
            for line in info.splitlines():
              if line.startswith('Pages:'):
                pages=int(line.split(':',1)[1].strip())
            txt=subprocess.check_output(['pdftotext',str(pdf),'-'], text=True, errors='replace')
            records.append({
              'language':lang,
              'docx':docx.name,
              'pdf':pdf.name,
              'docx_bytes':docx.stat().st_size,
              'pdf_bytes':pdf.stat().st_size,
              'pdf_pages':pages,
              'pdf_extractable_characters':len(txt.strip()),
              'status':'PASS'
            })
          manifest={
            'guide':'18',
            'occupation':'Legal Administrative Assistant and Legal Office Coordinator',
            'build_date':'2026-08-09',
            'status':'PASS',
            'controls':['19-section trilingual structure','locale-aware controlled numerical values','required source URLs','DOCX ZIP integrity','PDF readability','searchable PDF text','SHA-256 checksums','all-page raster rendering'],
            'editions':records,
            'assurance_boundary':'Internal automated publication QA; not independent human review, professional translation certification, accessibility certification, legal review, regulator approval, accreditation, or employment guarantee.'
          }
          (out/'GUIDE_18_PUBLICATION_QA_MANIFEST.json').write_text(json.dumps(manifest,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          targets=sorted([p for p in out.iterdir() if p.is_file() and p.suffix in {'.docx','.pdf'}])
          (out/'SHA256SUMS.txt').write_text('\n'.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}' for p in targets)+'\n',encoding='utf-8')

      - name: Upload rendered pages
        uses: actions/upload-artifact@v4
        with:
          name: guide18-rendered-pages
          path: project/revision-2026/guide-18/publication-candidate/rendered
          retention-days: 14

      - name: Remove render images from commit scope
        run: rm -rf project/revision-2026/guide-18/publication-candidate/rendered

      - name: Commit controlled publication candidates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add project/revision-2026/guide-18/publication-candidate
          if git diff --cached --quiet; then
            echo 'No publication changes to commit.'
          else
            git commit -m 'Build and validate Guide 18 publication candidates'
            git pull --rebase origin revision/guide-00-100-2026
            git push origin HEAD:revision/guide-00-100-2026
          fi
