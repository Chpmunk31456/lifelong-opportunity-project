name: Guide 02 English artifact extraction QA

on:
  workflow_dispatch:
  push:
    branches:
      - revision/guide-00-100-2026
    paths:
      - .github/workflows/guide02-english-artifact-extraction.yml
      - scripts/guide02_extract_english_artifacts.py
      - scripts/guide02_divergence_report.py
      - 02-peer-support-specialist/english/**
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/guide02-english-artifact-extraction.yml
      - scripts/guide02_extract_english_artifacts.py
      - scripts/guide02_divergence_report.py
      - 02-peer-support-specialist/english/**

permissions:
  contents: write

concurrency:
  group: guide02-english-artifact-extraction
  cancel-in-progress: false

jobs:
  extract-and-compare:
    if: github.repository == 'Chpmunk31456/lifelong-opportunity-project'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out controlled revision branch
        uses: actions/checkout@v4
        with:
          ref: revision/guide-00-100-2026
          fetch-depth: 0

      - name: Install deterministic Python PDF parser
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir 'pypdf==6.1.1'

      - name: Run fail-closed Guide 02 artifact extraction
        id: extraction
        continue-on-error: true
        run: python3 scripts/guide02_extract_english_artifacts.py

      - name: Characterize DOCX/PDF divergence
        if: always()
        run: |
          set -euo pipefail
          test -s project/revision-2026/guide-02/source/GUIDE_02_ENGLISH_DOCX_EXTRACTED_BASELINE.md
          test -s project/revision-2026/guide-02/source/GUIDE_02_ENGLISH_PDF_EXTRACTED_BASELINE.txt
          python3 scripts/guide02_divergence_report.py

      - name: Report generated diagnostics
        if: always()
        run: |
          set -euo pipefail
          for f in \
            project/revision-2026/guide-02/qa/GUIDE_02_ENGLISH_ARTIFACT_EXTRACTION_QA_01.md \
            project/revision-2026/guide-02/qa/GUIDE_02_ENGLISH_DIVERGENCE_CHARACTERIZATION_06.md \
            project/revision-2026/guide-02/qa/GUIDE_02_ENGLISH_SEMANTIC_EQUIVALENCE_RESULT_08.md \
            project/revision-2026/guide-02/qa/pdf-technical-results.json; do
            if [ -f "$f" ]; then echo "--- $f ---"; cat "$f"; fi
          done

      - name: Commit auditable extraction and divergence evidence
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add project/revision-2026/guide-02/source project/revision-2026/guide-02/qa
          # The raw PDF text extraction intentionally preserves page-layout whitespace.
          # Apply whitespace-error checks only to authored QA evidence, not raw extracts.
          git diff --cached --check -- project/revision-2026/guide-02/qa
          if git diff --cached --quiet; then
            echo 'Guide 02 diagnostic evidence already matches the current artifacts.'
          else
            git commit -m 'Add Guide 02 English semantic equivalence diagnostics'
            git push origin HEAD:revision/guide-00-100-2026
          fi

      - name: Enforce controlled equivalence gate
        if: always()
        run: |
          set -euo pipefail
          REPORT='project/revision-2026/guide-02/qa/GUIDE_02_ENGLISH_ARTIFACT_EXTRACTION_QA_01.md'
          SEMANTIC='project/revision-2026/guide-02/qa/GUIDE_02_ENGLISH_SEMANTIC_EQUIVALENCE_RESULT_08.md'
          test -s "$REPORT"
          test -s "$SEMANTIC"
          # Preserve the original strict artifact-equivalence control. The semantic
          # diagnostic informs baseline selection but does not silently convert a HOLD
          # into a PASS.
          grep -q 'PASS for technical source-equivalence intake' "$REPORT"
          test '${{ steps.extraction.outcome }}' = 'success'
