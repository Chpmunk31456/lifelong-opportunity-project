name: Guide 02 English artifact extraction QA

on:
  workflow_dispatch:
  push:
    branches:
      - revision/guide-00-100-2026
    paths:
      - .github/workflows/guide02-english-artifact-extraction.yml
      - scripts/guide02_extract_english_artifacts.py
      - 02-peer-support-specialist/english/**
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/guide02-english-artifact-extraction.yml
      - scripts/guide02_extract_english_artifacts.py
      - 02-peer-support-specialist/english/**

permissions:
  contents: write

concurrency:
  group: guide02-english-artifact-extraction
  cancel-in-progress: false

jobs:
  extract-and-compare:
    if: github.repository == 'Chpmunk31456/lifelong-opportunity-project'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out controlled revision branch
        uses: actions/checkout@v4
        with:
          ref: revision/guide-00-100-2026
          fetch-depth: 0

      - name: Install PDF inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils qpdf

      - name: Run fail-closed Guide 02 artifact extraction
        run: python3 scripts/guide02_extract_english_artifacts.py

      - name: Validate generated evidence
        run: |
          set -euo pipefail
          test -s project/revision-2026/guide-02/source/GUIDE_02_ENGLISH_DOCX_EXTRACTED_BASELINE.md
          test -s project/revision-2026/guide-02/source/GUIDE_02_ENGLISH_PDF_EXTRACTED_BASELINE.txt
          test -s project/revision-2026/guide-02/qa/GUIDE_02_ENGLISH_ARTIFACT_EXTRACTION_QA_01.md
          grep -q 'PASS for technical source-equivalence intake' project/revision-2026/guide-02/qa/GUIDE_02_ENGLISH_ARTIFACT_EXTRACTION_QA_01.md
          git diff --check

      - name: Commit completed extraction evidence
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add project/revision-2026/guide-02/source project/revision-2026/guide-02/qa
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Guide 02 extraction evidence already matches the current artifacts.'
            exit 0
          fi
          git commit -m 'Add Guide 02 English artifact extraction QA'
          git push origin HEAD:revision/guide-00-100-2026
