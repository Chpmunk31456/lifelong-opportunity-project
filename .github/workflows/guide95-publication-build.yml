# Controlled Guide 95 publication and release workflow
# v1.1: server-activated fail-closed trilingual build and release closure.
name: Guide 95 controlled publication and release

on:
  push:
    branches: [revision/guide-00-100-2026]
    paths:
      - '.github/workflows/guide95-publication-build.yml'
      - 'project/revision-2026/guide-95/qa/GUIDE_95_TRILINGUAL_TECHNICAL_QA_08.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: guide95-controlled-publication
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: revision/guide-00-100-2026
          fetch-depth: 0

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc libreoffice-writer poppler-utils python3-pil curl

      - name: Preflight and freeze inputs
        shell: python
        run: |
          import json,re,shutil,sys
          from pathlib import Path
          root=Path('project/revision-2026/guide-95'); src=root/'working-masters'; out=root/'publication-candidate'
          d=json.loads((root/'GUIDE_95_HELPER_STATUS.json').read_text(encoding='utf-8'))
          for s in ('baseline_inventory','research','english_editorial','evidence_traceability','english_source_freeze','spanish_localization','portuguese_localization','technical_qa'): assert d['stages'][s]['status']=='PASS',s
          assert d['stages']['publication']['status']=='PENDING'; assert d['stages']['release_audit']['status']=='PENDING'; assert not d.get('blockers')
          if out.exists(): shutil.rmtree(out)
          out.mkdir(parents=True)
          pairs=[('GUIDE_95_ARCHITECTURAL_AND_CIVIL_DRAFTER_ENGLISH_v2.md','GUIDE_95_ENGLISH_v2.md'),('GUIDE_95_DELINEANTE_ARQUITECTONICO_Y_CIVIL_ES419_v2.md','GUIDE_95_SPANISH_es-419_v2.md'),('GUIDE_95_DESENHISTA_ARQUITETONICO_E_CIVIL_PTBR_v2.md','GUIDE_95_PORTUGUESE_pt-BR_v2.md')]
          files=[]
          for a,b in pairs: shutil.copy2(src/a,out/b); files.append(out/b)
          texts=[p.read_text(encoding='utf-8') for p in files]; probs=[]
          urls=[set(re.findall(r'https://[^\s)<>`]+',t)) for t in texts]
          if not (urls[0]==urls[1]==urls[2]) or len(urls[0])!=19: probs.append(f'URL parity/count mismatch {[len(x) for x in urls]}')
          controls=[r'17-3011\.00',r'22212',r'31181',r'46[,.]260',r'55[,.]650',r'66[,.]150',r'80[,.]870',r'99[,.]710',r'22[,.]24',r'26[,.]76',r'31[,.]80',r'38[,.]88',r'47[,.]94',r'110[,.]500',r'65[,.]380',r'16[,.]200',r'C\$21[,.]50',r'C\$31[,.]79',r'C\$48[,.]38',r'3[,.]984',r'48\s+(?:hours|horas)',r'63[,.]976',r'275',r'45[,.]358',r'90[,.]235',r'1[,.]965[,.]646']
          for p,t in zip(files,texts):
            if len(t)<16000: probs.append(f'{p.name}: short')
            if len(re.findall(r'^##\s+.+$',t,re.M))<25: probs.append(f'{p.name}: too few sections')
            if re.search(r'(?im)^\s*(?:[-*]\s*)?todo\s*:',t): probs.append(f'{p.name}: TODO')
            for pat in controls:
              if not re.search(pat,t,re.I): probs.append(f'{p.name}: missing {pat}')
          if probs: print('\n'.join(probs)); sys.exit(1)
          Path('/tmp/guide95_urls.txt').write_text('\n'.join(sorted(urls[0]))+'\n',encoding='utf-8')
          print('Guide 95 preflight PASS')

      - name: Check reader links
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r url; do
            code="$(curl -L -sS -o /dev/null -w '%{http_code}' --connect-timeout 15 --max-time 35 -A 'Mozilla/5.0 Guide95-QA' "$url" || echo 000)"
            case "$code" in 404|410) echo "LINK FAIL $code $url"; fail=1;; *) echo "LINK $code $url";; esac
          done < /tmp/guide95_urls.txt
          test "$fail" -eq 0

      - name: Build DOCX and PDFs
        run: |
          set -euo pipefail
          OUT='project/revision-2026/guide-95/publication-candidate'
          for STEM in GUIDE_95_ENGLISH_v2 GUIDE_95_SPANISH_es-419_v2 GUIDE_95_PORTUGUESE_pt-BR_v2; do
            pandoc "$OUT/$STEM.md" -f gfm -t docx --standalone -o "$OUT/$STEM.docx"
            mkdir -p "$OUT/lo-$STEM"
            libreoffice --headless --convert-to pdf --outdir "$OUT/lo-$STEM" "$OUT/$STEM.docx"
            mv "$OUT/lo-$STEM/$STEM.pdf" "$OUT/$STEM.pdf"
            rmdir "$OUT/lo-$STEM"
          done
          for d in "$OUT"/*.docx; do unzip -t "$d" >/dev/null; done
          for p in "$OUT"/*.pdf; do pdfinfo "$p" >/dev/null; test "$(pdftotext "$p" - | tr -d '[:space:]' | wc -c)" -gt 10000; done

      - name: Render all pages and write release evidence
        shell: python
        run: |
          import hashlib,json,shutil,subprocess,sys
          from pathlib import Path
          from PIL import Image,ImageChops
          root=Path('project/revision-2026/guide-95'); out=root/'publication-candidate'; qa=root/'qa'; rend=out/'rendered'; pages=[]; probs=[]
          for pdf in sorted(out.glob('*.pdf')):
            dest=rend/pdf.stem; dest.mkdir(parents=True,exist_ok=True)
            subprocess.run(['pdftoppm','-png','-r','110',str(pdf),str(dest/'page')],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          for path in sorted(rend.rglob('*.png')):
            with Image.open(path) as im:
              g=im.convert('L'); diff=ImageChops.difference(g,Image.new('L',g.size,255)); bbox=diff.point(lambda p:255 if p>12 else 0).getbbox()
              if bbox is None: probs.append(f'{path}: blank'); continue
              l,t,r,b=bbox; w,h=g.size; m={'left':l,'top':t,'right':w-r,'bottom':h-b}
              if min(m.values())<2: probs.append(f'{path}: clipping {m}')
              pages.append({'file':str(path.relative_to(rend)),'edge_margins':m})
          if probs: print('\n'.join(probs)); sys.exit(1)
          editions=[]
          for lang,stem in [('en','GUIDE_95_ENGLISH_v2'),('es-419','GUIDE_95_SPANISH_es-419_v2'),('pt-BR','GUIDE_95_PORTUGUESE_pt-BR_v2')]:
            docx=out/f'{stem}.docx'; pdf=out/f'{stem}.pdf'; info=subprocess.check_output(['pdfinfo',str(pdf)],text=True); n=next(int(x.split(':',1)[1]) for x in info.splitlines() if x.startswith('Pages:')); rendered=sum(1 for x in pages if x['file'].startswith(stem+'/')); assert n==rendered
            editions.append({'language':lang,'docx':docx.name,'pdf':pdf.name,'docx_bytes':docx.stat().st_size,'pdf_bytes':pdf.stat().st_size,'pdf_pages':n,'rendered_pages':rendered,'status':'PASS'})
          render={'status':'PASS','pages':pages,'problems':[]}; (out/'RENDER_QA.json').write_text(json.dumps(render,indent=2)+'\n')
          manifest={'guide':'95','occupation':'Architectural and Civil Drafter','build_date':'2026-08-22','status':'PASS','editions':editions,'reader_verification_urls':19,'english_source_blob':'6ea978ca9dce507dc547ab5f46bfd32a701f3ab5'}
          (out/'GUIDE_95_PUBLICATION_QA_MANIFEST.json').write_text(json.dumps(manifest,indent=2)+'\n')
          bins=sorted([*out.glob('*.docx'),*out.glob('*.pdf')]); (out/'SHA256SUMS.txt').write_text('\n'.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}' for p in bins)+'\n')
          (qa/'GUIDE_95_PUBLICATION_QA_09.md').write_text('# Guide 95 — Publication QA 09\n\n**Stage:** Publication — **PASS**\n\nTrilingual Markdown/DOCX/PDF editions passed 19-link parity, hard-link checks, DOCX integrity, searchable-PDF validation, all-page rendering, page reconciliation, metadata and SHA-256 checksums. No independent certification or outcome guarantee is claimed.\n')
          (qa/'GUIDE_95_RELEASE_AUDIT_10.md').write_text('# Guide 95 — Release Audit 10\n\n**Stage:** Release Audit — **PASS**\n\nAll predecessor gates and publication artifacts are present, trilingual, searchable, rendered, checksummed and blocker-free. Guide 96 may initialize only after helper status closure.\n')
          shutil.rmtree(rend)

      - name: Commit package
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add project/revision-2026/guide-95/publication-candidate project/revision-2026/guide-95/qa/GUIDE_95_PUBLICATION_QA_09.md project/revision-2026/guide-95/qa/GUIDE_95_RELEASE_AUDIT_10.md
          git commit -m 'build(guide-95): publish controlled trilingual package'
          git pull --rebase origin revision/guide-00-100-2026
          git push origin HEAD:revision/guide-00-100-2026

      - name: Close status
        run: |
          set -euo pipefail
          git pull --rebase origin revision/guide-00-100-2026
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('project/revision-2026/guide-95/GUIDE_95_HELPER_STATUS.json'); d=json.loads(p.read_text())
          d['stages']['publication']={'status':'PASS','evidence':['project/revision-2026/guide-95/qa/GUIDE_95_PUBLICATION_QA_09.md','project/revision-2026/guide-95/publication-candidate/GUIDE_95_PUBLICATION_QA_MANIFEST.json','project/revision-2026/guide-95/publication-candidate/SHA256SUMS.txt','project/revision-2026/guide-95/publication-candidate/RENDER_QA.json']}
          d['stages']['release_audit']={'status':'PASS','evidence':['project/revision-2026/guide-95/qa/GUIDE_95_RELEASE_AUDIT_10.md']}; p.write_text(json.dumps(d,indent=2)+'\n')
          PY
          git add project/revision-2026/guide-95/GUIDE_95_HELPER_STATUS.json
          git commit -m 'status(guide-95): close publication and release audit'
          git pull --rebase origin revision/guide-00-100-2026
          git push origin HEAD:revision/guide-00-100-2026
