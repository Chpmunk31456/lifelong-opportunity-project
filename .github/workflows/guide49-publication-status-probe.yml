name: Guide 49 publication status probe

on:
  push:
    branches: [revision/guide-00-100-2026]
    paths:
      - '.github/workflows/guide49-publication-status-probe.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out revision branch
        uses: actions/checkout@v5
        with:
          ref: revision/guide-00-100-2026
          fetch-depth: 0

      - name: Observe Guide 49 publication build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sleep 5
          RUN_ID="$(gh api 'repos/${{ github.repository }}/actions/workflows/guide49-publication-build.yml/runs?branch=revision%2Fguide-00-100-2026&per_page=5' --jq '.workflow_runs[0].id')"
          test -n "$RUN_ID"
          STATUS='unknown'; CONCLUSION='null'; HEAD_SHA='unknown'
          for i in $(seq 1 120); do
            STATUS="$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID" --jq '.status')"
            CONCLUSION="$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID" --jq '.conclusion // "null"')"
            HEAD_SHA="$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID" --jq '.head_sha')"
            echo "Guide 49 publication run $RUN_ID: status=$STATUS conclusion=$CONCLUSION head=$HEAD_SHA"
            [ "$STATUS" = 'completed' ] && break
            sleep 10
          done
          mkdir -p project/revision-2026/guide-49/qa
          python - "$RUN_ID" "$STATUS" "$CONCLUSION" "$HEAD_SHA" <<'PY'
          import json,sys,datetime
          run_id,status,conclusion,head_sha=sys.argv[1:]
          data={
            'guide':'49',
            'workflow':'guide49-publication-build.yml',
            'run_id':int(run_id),
            'status':status,
            'conclusion':None if conclusion=='null' else conclusion,
            'head_sha':head_sha,
            'observed_at':datetime.datetime.now(datetime.timezone.utc).isoformat()
          }
          open('project/revision-2026/guide-49/qa/GUIDE_49_PUBLICATION_WORKFLOW_STATUS.json','w',encoding='utf-8').write(json.dumps(data,indent=2)+'\n')
          PY

      - name: Commit observer evidence
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add project/revision-2026/guide-49/qa/GUIDE_49_PUBLICATION_WORKFLOW_STATUS.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'qa(guide-49): record publication workflow result'
          git pull --rebase origin revision/guide-00-100-2026
          git push origin HEAD:revision/guide-00-100-2026

