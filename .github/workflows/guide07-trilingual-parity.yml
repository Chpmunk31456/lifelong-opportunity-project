name: Guide 07 trilingual source parity

on:
  workflow_dispatch:
  push:
    branches:
      - revision/guide-00-100-2026
    paths:
      - .github/workflows/guide07-trilingual-parity.yml
      - scripts/guide07_translation_parity.py
      - project/revision-2026/guide-07/source/GUIDE_07_ENGLISH_WORKING_MASTER_v2.md
      - project/revision-2026/guide-07/source/GUIDE_07_SPANISH_LATAM_WORKING_MASTER_v2.md
      - project/revision-2026/guide-07/source/GUIDE_07_PORTUGUESE_BR_WORKING_MASTER_v2.md

permissions:
  contents: write

concurrency:
  group: guide07-trilingual-parity
  cancel-in-progress: false

jobs:
  parity:
    if: github.repository == 'Chpmunk31456/lifelong-opportunity-project'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out controlled revision branch
        uses: actions/checkout@v4
        with:
          ref: revision/guide-00-100-2026
          fetch-depth: 0

      - name: Run deterministic trilingual parity
        run: python scripts/guide07_translation_parity.py

      - name: Commit parity QA evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project/revision-2026/guide-07/qa/GUIDE_07_TRILINGUAL_PARITY_QA_09.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Parity evidence already current.'
            exit 0
          fi
          git commit -m "qa(guide-07): record trilingual parity PASS"
          git fetch origin revision/guide-00-100-2026
          git rebase origin/revision/guide-00-100-2026
          python scripts/guide07_translation_parity.py
          git add project/revision-2026/guide-07/qa/GUIDE_07_TRILINGUAL_PARITY_QA_09.md
          git commit --amend --no-edit || true
          git push origin HEAD:revision/guide-00-100-2026
