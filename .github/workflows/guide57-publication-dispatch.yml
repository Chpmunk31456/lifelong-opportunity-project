name: Guide 57 PR publication dispatcher

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/guide57-publication-dispatch.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Guide 57 controlled publication workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run guide57-publication-build.yml \
            --repo '${{ github.repository }}' \
            --ref revision/guide-00-100-2026
          echo 'Guide 57 controlled publication dispatched from the verified Technical QA PASS state.'
