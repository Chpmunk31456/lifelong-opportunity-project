name: Guide 24 localization reconciliation

on:
  push:
    branches:
      - revision/guide-00-100-2026
    paths:
      - '.github/workflows/guide24-localization-reconcile.yml'
      - 'scripts/guide24_localization_reconcile.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: revision/guide-00-100-2026
          fetch-depth: 0
      - name: Reconcile es-419 and pt-BR to frozen English evidence
        run: python scripts/guide24_localization_reconcile.py
      - name: Commit reconciled localized sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 24-facilities-coordinator-and-building-operations-assistant/spanish/Guia_24_Coordinacion_de_Facilities_y_Asistencia_de_Operaciones_de_Edificios_es-419_v2.0.md
          git add 24-facilities-coordinator-and-building-operations-assistant/portuguese/Guia_24_Coordenacao_de_Facilities_e_Assistencia_de_Operacoes_Prediais_pt-BR_v2.0.md
          if git diff --cached --quiet; then
            echo 'No localization changes to commit.'
          else
            git commit -m 'fix(guide-24): reconcile localized evidence parity'
            git pull --rebase origin revision/guide-00-100-2026
            git push origin HEAD:revision/guide-00-100-2026
          fi
