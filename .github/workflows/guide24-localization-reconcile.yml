          def replace_section(text, start, end, replacement):
              pattern = rf'(?ms)^## {re.escape(start)}.*?(?=^## {re.escape(end)})'
              new, n = re.subn(pattern, replacement+'\n', text)
              if n != 1:
                  raise SystemExit(f'Expected one section {start}->{end}, found {n}')
              return new

          es=files['es'].read_text(encoding='utf-8')
          es=replace_section(es,'4.','5.',es4)
          es=replace_section(es,'5.','6.',es5)
          es=replace_section(es,'6.','7.',es6)
          es=re.sub(r'(?ms)^## 15\..*\Z', es15, es)
          files['es'].write_text(es.rstrip()+'\n',encoding='utf-8')

          pt=files['pt'].read_text(encoding='utf-8')
          pt=replace_section(pt,'4.','5.',pt4)
          pt=replace_section(pt,'5.','6.',pt5)
          pt=replace_section(pt,'6.','7.',pt6)
          pt=re.sub(r'(?ms)^## 15\..*\Z', pt15, pt)
          files['pt'].write_text(pt.rstrip()+'\n',encoding='utf-8')

          for lang,path in files.items():
              text=path.read_text(encoding='utf-8')
              count=len(re.findall(r'^##\s+.+$',text,re.M))
              if count != 17:
                  raise SystemExit(f'{lang}: expected 17 level-2 headings after reconciliation, found {count}')
              for marker in ('NOC 70012','NOC 73201','WIOA','SENA'):
                  if marker not in text: raise SystemExit(f'{lang}: missing {marker}')
          print('Guide 24 localized source reconciliation complete')
