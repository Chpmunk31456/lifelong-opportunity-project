name: Final Guides 00-100 release changelog

on:
  pull_request:
    paths:
      - ".github/workflows/repository-metadata-audit.yml"
      - "scripts/generate_guides_00_100_release_changelog.py"
      - "project/revision-2026/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run repository metadata audit
        run: python tools/audit_repository_metadata.py

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: final-release-repository-metadata-audit
          path: QA_METADATA_AUDIT.md
          if-no-files-found: error

  final-release-changelog:
    if: >-
      github.event_name == 'pull_request' &&
      github.base_ref == 'revision/guide-00-100-2026' &&
      github.head_ref == 'trigger/final-release-changelog' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out controlled revision branch
        uses: actions/checkout@v6
        with:
          ref: revision/guide-00-100-2026
          fetch-depth: 0

      - name: Generate and validate final 00-100 release/change documentation
        run: python scripts/generate_guides_00_100_release_changelog.py

      - name: Commit validated release/change documentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add project/revision-2026/GUIDES_00_100_RELEASE_CHANGELOG.md \
                  project/revision-2026/GUIDES_00_100_RELEASE_CHANGELOG_QA.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Final release/change documentation already current.'
            exit 0
          fi
          git commit -m 'docs(release): publish Guides 00-100 release changelog'
          for attempt in 1 2 3 4 5; do
            git fetch origin revision/guide-00-100-2026
            git rebase origin/revision/guide-00-100-2026
            if git push origin HEAD:revision/guide-00-100-2026; then
              echo 'Final release/change documentation committed.'
              exit 0
            fi
            if [[ "$attempt" == '5' ]]; then exit 1; fi
            sleep 2
          done

      - name: Safety note
        run: |
          echo 'This carrier does not merge PR #17.'
          echo 'It writes only validated collection-level release documentation to the controlled branch.'
