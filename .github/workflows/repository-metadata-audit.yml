name: Repository metadata audit

on:
  pull_request:
    paths:
      - "**/*.md"
      - "**/*.docx"
      - "**/*.pdf"
      - "tools/audit_repository_metadata.py"
      - ".github/workflows/repository-metadata-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run metadata audit
        run: python tools/audit_repository_metadata.py

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: repository-metadata-audit
          path: QA_METADATA_AUDIT.md
          if-no-files-found: error
