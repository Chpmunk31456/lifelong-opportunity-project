name: Guide 00 publication requalification

on:
  pull_request:
    paths:
      - ".github/workflows/repository-metadata-audit.yml"
      - "scripts/guide00_publication_recovery.py"
      - "scripts/guide00_publication_recovery_dynamic.py"
      - "scripts/guide00_dead_link_repair.py"
      - "00-foundation-guide/**"
      - "project/revision-2026/guide-00/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run repository metadata audit
        run: python tools/audit_repository_metadata.py

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: guide00-publication-metadata-audit
          path: QA_METADATA_AUDIT.md
          if-no-files-found: error

  guide00-publication-build:
    if: >-
      github.event_name == 'pull_request' &&
      github.base_ref == 'revision/guide-00-100-2026' &&
      github.head_ref == 'trigger/guide00-publication-requal' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Check out controlled revision branch
        uses: actions/checkout@v6
        with:
          ref: revision/guide-00-100-2026
          fetch-depth: 0

      - name: Repair confirmed dead Guide 00 source link
        run: python scripts/guide00_dead_link_repair.py repair

      - name: Revalidate trilingual technical QA after source maintenance
        run: python scripts/guide00_legacy_technical_qa.py validate

      - name: Synchronize Guide 00 freeze/helper evidence
        run: python scripts/guide00_dead_link_repair.py sync-status

      - name: Commit source maintenance and refreshed technical evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 00-foundation-guide/source/Lifelong_Opportunity_Foundation_Guide_English_v1.1_INTEGRATED_MASTER.md \
                  00-foundation-guide/source/Lifelong_Opportunity_Foundation_Guide_es-419_v1.1_INTEGRATED_MASTER.md \
                  00-foundation-guide/source/Lifelong_Opportunity_Foundation_Guide_pt-BR_v1.1_INTEGRATED_MASTER.md \
                  project/revision-2026/guide-00/qa/GUIDE_00_DEAD_LINK_REPAIR_08C.md \
                  project/revision-2026/guide-00/qa/GUIDE_00_ENGLISH_SOURCE_FREEZE_AMENDMENT_08C.md \
                  project/revision-2026/guide-00/qa/GUIDE_00_TRILINGUAL_TECHNICAL_QA_08.md \
                  project/revision-2026/guide-00/GUIDE_00_HELPER_STATUS.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Guide 00 source maintenance already current.'
          else
            git commit -m 'fix(guide-00): replace confirmed dead official source link'
            for attempt in 1 2 3 4 5; do
              git fetch origin revision/guide-00-100-2026
              git rebase origin/revision/guide-00-100-2026
              if git push origin HEAD:revision/guide-00-100-2026; then
                echo 'Guide 00 source maintenance committed.'
                break
              fi
              if [[ "$attempt" == '5' ]]; then exit 1; fi
              sleep 2
            done
          fi

      - name: Install publication toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc libreoffice-writer poppler-utils python3-pil curl unzip

      - name: Build fresh Guide 00 publication candidate
        run: python scripts/guide00_publication_recovery_dynamic.py build

      - name: Upload all-page render review artifact
        uses: actions/upload-artifact@v6
        with:
          name: guide00-publication-renders
          path: 00-foundation-guide/publication-candidate/rendered
          if-no-files-found: error
          retention-days: 7

      - name: Commit automated publication candidate and render evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A 00-foundation-guide/publication-candidate \
                     project/revision-2026/guide-00/qa/GUIDE_00_PUBLICATION_AUTOMATED_QA_09A.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Guide 00 automated publication candidate already current.'
            exit 0
          fi
          git commit -m 'build(guide-00): requalify controlled publication candidate'
          for attempt in 1 2 3 4 5; do
            git fetch origin revision/guide-00-100-2026
            git rebase origin/revision/guide-00-100-2026
            if git push origin HEAD:revision/guide-00-100-2026; then
              echo 'Guide 00 automated publication candidate committed.'
              exit 0
            fi
            if [[ "$attempt" == '5' ]]; then exit 1; fi
            sleep 2
          done

      - name: Safety note
        run: |
          echo 'Guide 00 remains 8/10 after this job.'
          echo 'Publication and Release Audit stay PENDING until direct full-page visual review is separately recorded.'
          echo 'This carrier does not merge PR #17.'
