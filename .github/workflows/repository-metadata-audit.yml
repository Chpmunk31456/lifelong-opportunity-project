name: Guide 00 legacy technical QA

on:
  pull_request:
    paths:
      - ".github/workflows/repository-metadata-audit.yml"
      - "scripts/guide00_legacy_technical_qa.py"
      - "00-foundation-guide/source/**"
      - "project/revision-2026/guide-00/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run repository metadata audit
        run: python tools/audit_repository_metadata.py

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: guide00-legacy-technical-metadata-audit
          path: QA_METADATA_AUDIT.md
          if-no-files-found: error

  guide00-technical-qa:
    if: >-
      github.event_name == 'pull_request' &&
      github.base_ref == 'revision/guide-00-100-2026' &&
      github.head_ref == 'trigger/guide00-legacy-technical-qa' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out controlled revision branch
        uses: actions/checkout@v6
        with:
          ref: revision/guide-00-100-2026
          fetch-depth: 0

      - name: Repair localized Guide 00 source-link parity
        run: python scripts/guide00_legacy_technical_qa.py repair-links

      - name: Commit localized link-parity repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 00-foundation-guide/source/Lifelong_Opportunity_Foundation_Guide_es-419_v1.1_INTEGRATED_MASTER.md \
                  00-foundation-guide/source/Lifelong_Opportunity_Foundation_Guide_pt-BR_v1.1_INTEGRATED_MASTER.md \
                  project/revision-2026/guide-00/qa/GUIDE_00_TRILINGUAL_LINK_PARITY_REPAIR_08A.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Guide 00 localized link parity already current.'
          else
            git commit -m 'fix(guide-00): restore trilingual source-link parity'
            for attempt in 1 2 3 4 5; do
              git fetch origin revision/guide-00-100-2026
              git rebase origin/revision/guide-00-100-2026
              if git push origin HEAD:revision/guide-00-100-2026; then
                echo 'Guide 00 link-parity repair committed.'
                break
              fi
              if [[ "$attempt" == '5' ]]; then exit 1; fi
              sleep 2
            done
          fi

      - name: Refresh controlled branch after repair
        run: git pull --rebase origin revision/guide-00-100-2026

      - name: Validate Guide 00 trilingual technical parity
        run: python scripts/guide00_legacy_technical_qa.py validate

      - name: Commit Guide 00 technical QA evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add project/revision-2026/guide-00/qa/GUIDE_00_TRILINGUAL_TECHNICAL_QA_08.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Guide 00 technical QA evidence already current.'
          else
            git commit -m 'qa(guide-00): pass final trilingual technical gate'
            for attempt in 1 2 3 4 5; do
              git fetch origin revision/guide-00-100-2026
              git rebase origin/revision/guide-00-100-2026
              if git push origin HEAD:revision/guide-00-100-2026; then
                echo 'Guide 00 technical QA evidence committed.'
                break
              fi
              if [[ "$attempt" == '5' ]]; then exit 1; fi
              sleep 2
            done
          fi

      - name: Advance Guide 00 helper only after evidence commit
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin revision/guide-00-100-2026
          python scripts/guide00_legacy_technical_qa.py close-status
          git add project/revision-2026/guide-00/GUIDE_00_HELPER_STATUS.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Guide 00 helper already reflects technical QA PASS.'
            exit 0
          fi
          git commit -m 'status(guide-00): advance to publication gate'
          for attempt in 1 2 3 4 5; do
            git fetch origin revision/guide-00-100-2026
            git rebase origin/revision/guide-00-100-2026
            if git push origin HEAD:revision/guide-00-100-2026; then
              echo 'Guide 00 helper advanced.'
              exit 0
            fi
            if [[ "$attempt" == '5' ]]; then exit 1; fi
            sleep 2
          done

      - name: Safety note
        run: |
          echo 'Guide 00 Publication and Release Audit remain pending.'
          echo 'This carrier does not merge PR #17.'
