name: Repository metadata audit
# Guide 95 recovery carrier v4 — one exact same-repository PR may execute visible recovery diagnostics.

on:
  pull_request:
    paths:
      - "**/*.md"
      - "**/*.docx"
      - "**/*.pdf"
      - "tools/audit_repository_metadata.py"
      - ".github/workflows/repository-metadata-audit.yml"
  push:
    branches:
      - revision/guide-00-100-2026
    paths:
      - ".github/workflows/repository-metadata-audit.yml"
      - "scripts/guide95_publication_recovery.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run metadata audit
        run: python tools/audit_repository_metadata.py

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-metadata-audit
          path: QA_METADATA_AUDIT.md
          if-no-files-found: error

  guide95-publication-recovery:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/revision/guide-00-100-2026') ||
      (github.event_name == 'pull_request' &&
       github.base_ref == 'revision/guide-00-100-2026' &&
       github.head_ref == 'trigger/guide95-pr-carrier' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Check out controlled revision branch
        uses: actions/checkout@v4
        with:
          ref: revision/guide-00-100-2026
          fetch-depth: 0

      - name: Determine whether Guide 95 still needs recovery
        id: gate
        shell: python
        run: |
          import json, os
          from pathlib import Path
          p=Path('project/revision-2026/guide-95/GUIDE_95_HELPER_STATUS.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          needed = d['stages']['publication']['status'] != 'PASS' or d['stages']['release_audit']['status'] != 'PASS'
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              f.write(f"needed={'true' if needed else 'false'}\n")
          print(f"Guide 95 recovery needed: {needed}")

      - name: Install Guide 95 publication toolchain
        if: steps.gate.outputs.needed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc libreoffice-writer poppler-utils python3-pil curl

      - name: Build and validate Guide 95 package
        if: steps.gate.outputs.needed == 'true'
        run: python scripts/guide95_publication_recovery.py build

      - name: Commit verified Guide 95 package
        if: steps.gate.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add project/revision-2026/guide-95/publication-candidate \
                  project/revision-2026/guide-95/qa/GUIDE_95_PUBLICATION_QA_09.md \
                  project/revision-2026/guide-95/qa/GUIDE_95_RELEASE_AUDIT_10.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Guide 95 package already current.'
          else
            git commit -m 'build(guide-95): publish controlled trilingual package'
            for attempt in 1 2 3 4 5; do
              git fetch origin revision/guide-00-100-2026
              git rebase origin/revision/guide-00-100-2026
              if git push origin HEAD:revision/guide-00-100-2026; then
                echo 'Guide 95 package committed.'
                break
              fi
              if [[ "$attempt" == '5' ]]; then exit 1; fi
              sleep 2
            done
          fi

      - name: Close Guide 95 helper status after package commit
        if: steps.gate.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin revision/guide-00-100-2026
          python scripts/guide95_publication_recovery.py close-status
          git add project/revision-2026/guide-95/GUIDE_95_HELPER_STATUS.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Guide 95 status already closed.'
            exit 0
          fi
          git commit -m 'status(guide-95): close publication and release audit'
          for attempt in 1 2 3 4 5; do
            git fetch origin revision/guide-00-100-2026
            git rebase origin/revision/guide-00-100-2026
            if git push origin HEAD:revision/guide-00-100-2026; then
              echo 'Guide 95 status closure committed.'
              exit 0
            fi
            if [[ "$attempt" == '5' ]]; then exit 1; fi
            sleep 2
          done

      - name: Safety note
        run: |
          echo 'Guide 95 recovery is fail-closed and does not merge PR #17.'
          echo 'The same-repository PR recovery allowance is restricted to trigger/guide95-pr-carrier.'
