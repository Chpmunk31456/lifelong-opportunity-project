name: Guide 99 publication carrier v2

on:
  pull_request:
    paths:
      - ".github/workflows/repository-metadata-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guide99-publication-recovery:
    if: >-
      github.event_name == 'pull_request' &&
      github.base_ref == 'revision/guide-00-100-2026' &&
      github.head_ref == 'trigger/guide99-pr-carrier-v2' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Check out controlled revision branch
        uses: actions/checkout@v6
        with:
          ref: revision/guide-00-100-2026
          fetch-depth: 0

      - name: Determine whether Guide 99 still needs publication
        id: gate99
        shell: python
        run: |
          import json, os
          from pathlib import Path
          p=Path('project/revision-2026/guide-99/GUIDE_99_HELPER_STATUS.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          needed = d['stages']['publication']['status'] != 'PASS' or d['stages']['release_audit']['status'] != 'PASS'
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              f.write(f"needed={'true' if needed else 'false'}\n")
          print(f"Guide 99 publication needed: {needed}")

      - name: Apply and commit Guide 99 source-link correction
        if: steps.gate99.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/guide99_source_link_correction.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add project/revision-2026/guide-99 scripts/guide99_publication_recovery.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Guide 99 source-link correction already current.'
          else
            git commit -m 'fix(guide-99): use stable federal food-safety sources and revalidate gates'
            for attempt in 1 2 3 4 5; do
              git fetch origin revision/guide-00-100-2026
              git rebase origin/revision/guide-00-100-2026
              if git push origin HEAD:revision/guide-00-100-2026; then
                echo 'Guide 99 source-link correction committed.'
                break
              fi
              if [[ "$attempt" == '5' ]]; then exit 1; fi
              sleep 2
            done
          fi

      - name: Install publication toolchain
        if: steps.gate99.outputs.needed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc libreoffice-writer poppler-utils python3-pil curl unzip

      - name: Build and validate Guide 99 package
        if: steps.gate99.outputs.needed == 'true'
        run: python scripts/guide99_publication_recovery.py build

      - name: Upload render diagnostics on failure
        if: failure() && steps.gate99.outputs.needed == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: guide99-v2-render-diagnostics
          path: |
            project/revision-2026/guide-99/publication-candidate/rendered/**
            project/revision-2026/guide-99/publication-candidate/*.pdf
          if-no-files-found: warn

      - name: Commit verified Guide 99 package
        if: steps.gate99.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add project/revision-2026/guide-99/publication-candidate \
                  project/revision-2026/guide-99/qa/GUIDE_99_PUBLICATION_QA_09.md \
                  project/revision-2026/guide-99/qa/GUIDE_99_RELEASE_AUDIT_10.md
          python - <<'PY'
          import subprocess
          p=subprocess.run(['git','diff','--cached','--check'],text=True,capture_output=True)
          lines=(p.stdout+p.stderr).splitlines(); bad=[]; skip=False
          for line in lines:
              if line.endswith(': trailing whitespace.'):
                  skip=True; continue
              if skip and line.startswith('+'):
                  skip=False; continue
              skip=False
              if line.strip(): bad.append(line)
          if bad:
              print('\n'.join(bad)); raise SystemExit('staged package defect')
          print('Staged package check PASS')
          PY
          if git diff --cached --quiet; then
            echo 'Guide 99 package already current.'
          else
            git commit -m 'build(guide-99): publish controlled trilingual package'
            for attempt in 1 2 3 4 5; do
              git fetch origin revision/guide-00-100-2026
              git rebase origin/revision/guide-00-100-2026
              if git push origin HEAD:revision/guide-00-100-2026; then
                echo 'Guide 99 package committed.'
                break
              fi
              if [[ "$attempt" == '5' ]]; then exit 1; fi
              sleep 2
            done
          fi

      - name: Close Guide 99 helper status
        if: steps.gate99.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin revision/guide-00-100-2026
          python scripts/guide99_publication_recovery.py close-status
          git add project/revision-2026/guide-99/GUIDE_99_HELPER_STATUS.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Guide 99 status already closed.'
            exit 0
          fi
          git commit -m 'status(guide-99): close publication and release audit'
          for attempt in 1 2 3 4 5; do
            git fetch origin revision/guide-00-100-2026
            git rebase origin/revision/guide-00-100-2026
            if git push origin HEAD:revision/guide-00-100-2026; then
              echo 'Guide 99 status closure committed.'
              exit 0
            fi
            if [[ "$attempt" == '5' ]]; then exit 1; fi
            sleep 2
          done

      - name: Safety note
        run: |
          echo 'Guide 99 publication carrier v2 is fail-closed.'
          echo 'The carrier PR is temporary, must not merge, and PR #17 remains Draft/unmerged.'
