name: Repository metadata audit
# Temporary visible Guide 96 publication carrier. This branch/PR is never merged.

on:
  pull_request:
    paths:
      - "**/*.md"
      - "**/*.docx"
      - "**/*.pdf"
      - "tools/audit_repository_metadata.py"
      - ".github/workflows/repository-metadata-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run metadata audit
        run: python tools/audit_repository_metadata.py

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: repository-metadata-audit
          path: QA_METADATA_AUDIT.md
          if-no-files-found: error

  guide96-publication-recovery:
    if: >-
      github.event_name == 'pull_request' &&
      github.base_ref == 'revision/guide-00-100-2026' &&
      github.head_ref == 'trigger/guide96-pr-carrier' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Check out controlled revision branch
        uses: actions/checkout@v6
        with:
          ref: revision/guide-00-100-2026
          fetch-depth: 0

      - name: Determine whether Guide 96 still needs publication
        id: gate96
        shell: python
        run: |
          import json, os
          from pathlib import Path
          p = Path('project/revision-2026/guide-96/GUIDE_96_HELPER_STATUS.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          needed = d['stages']['publication']['status'] != 'PASS' or d['stages']['release_audit']['status'] != 'PASS'
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f"needed={'true' if needed else 'false'}\n")
          print(f"Guide 96 publication needed: {needed}")

      - name: Install Guide 96 publication toolchain
        if: steps.gate96.outputs.needed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc libreoffice-writer poppler-utils python3-pil curl

      - name: Build and validate Guide 96 package
        if: steps.gate96.outputs.needed == 'true'
        run: python scripts/guide96_publication_recovery.py build

      - name: Upload Guide 96 render diagnostics on failure
        if: failure() && steps.gate96.outputs.needed == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: guide96-render-diagnostics
          path: |
            project/revision-2026/guide-96/publication-candidate/rendered/**
            project/revision-2026/guide-96/publication-candidate/*.pdf
          if-no-files-found: warn

      - name: Commit verified Guide 96 package
        if: steps.gate96.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add project/revision-2026/guide-96/publication-candidate \
                  project/revision-2026/guide-96/qa/GUIDE_96_PUBLICATION_QA_09.md \
                  project/revision-2026/guide-96/qa/GUIDE_96_RELEASE_AUDIT_10.md

          # The frozen Markdown intentionally uses two trailing spaces for hard
          # line breaks in the metadata block. Allow only that known whitespace
          # class; fail on every other git diff --check finding.
          python - <<'PY'
          import subprocess
          p = subprocess.run(['git','diff','--cached','--check'], text=True, capture_output=True)
          lines = (p.stdout + p.stderr).splitlines()
          bad = []
          skip_payload = False
          for line in lines:
              if line.endswith(': trailing whitespace.'):
                  skip_payload = True
                  continue
              if skip_payload and line.startswith('+'):
                  skip_payload = False
                  continue
              skip_payload = False
              if line.strip():
                  bad.append(line)
          if bad:
              print('\n'.join(bad))
              raise SystemExit('Non-approved staged whitespace/conflict defect detected')
          print('Staged package check PASS; intentional Markdown hard breaks allowed.')
          PY

          if git diff --cached --quiet; then
            echo 'Guide 96 package already current.'
          else
            git commit -m 'build(guide-96): publish controlled trilingual package'
            for attempt in 1 2 3 4 5; do
              git fetch origin revision/guide-00-100-2026
              git rebase origin/revision/guide-00-100-2026
              if git push origin HEAD:revision/guide-00-100-2026; then
                echo 'Guide 96 package committed.'
                break
              fi
              if [[ "$attempt" == '5' ]]; then exit 1; fi
              sleep 2
            done
          fi

      - name: Close Guide 96 helper status after package commit
        if: steps.gate96.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin revision/guide-00-100-2026
          python scripts/guide96_publication_recovery.py close-status
          git add project/revision-2026/guide-96/GUIDE_96_HELPER_STATUS.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Guide 96 status already closed.'
            exit 0
          fi
          git commit -m 'status(guide-96): close publication and release audit'
          for attempt in 1 2 3 4 5; do
            git fetch origin revision/guide-00-100-2026
            git rebase origin/revision/guide-00-100-2026
            if git push origin HEAD:revision/guide-00-100-2026; then
              echo 'Guide 96 status closure committed.'
              exit 0
            fi
            if [[ "$attempt" == '5' ]]; then exit 1; fi
            sleep 2
          done

      - name: Safety note
        run: |
          echo 'Guide 96 publication is fail-closed and does not merge PR #17.'
          echo 'This temporary carrier PR remains unmerged and is closed after verification.'
