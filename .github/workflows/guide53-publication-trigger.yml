name: Guide 53 publication dispatcher

on:
  push:
    branches:
      - revision/guide-00-100-2026
    paths:
      - .github/workflows/guide53-publication-trigger.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch authoritative Guide 53 controlled publication workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run guide53-publication-build.yml \
            --repo Chpmunk31456/lifelong-opportunity-project \
            --ref revision/guide-00-100-2026
          echo 'Guide 53 controlled publication workflow dispatched.'
