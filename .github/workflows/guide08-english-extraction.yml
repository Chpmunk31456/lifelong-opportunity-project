name: Guide 08 English extraction evidence

on:
  workflow_dispatch:
  push:
    branches:
      - revision/guide-00-100-2026
    paths:
      - .github/workflows/guide08-english-extraction.yml
      - scripts/guide08_legacy_extract.py
      - 08-human-resources-assistant/english/docx/Lifelong_Opportunity_Human_Resources_Assistant_Guide_English_v1.0.docx
      - 08-human-resources-assistant/english/pdf/Lifelong_Opportunity_Human_Resources_Assistant_Guide_English_v1.0.pdf

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revision/guide-00-100-2026
      - run: python -m pip install --disable-pip-version-check python-docx==1.1.2 pypdf==5.9.0
      - run: python scripts/guide08_legacy_extract.py
      - uses: actions/upload-artifact@v4
        with:
          name: guide08-legacy-extraction-evidence
          path: |
            project/revision-2026/guide-08/qa/GUIDE_08_LEGACY_ENGLISH_EXTRACTION_RECONCILIATION_02.md
            project/revision-2026/guide-08/qa/evidence/guide08_legacy_docx_extract.txt
            project/revision-2026/guide-08/qa/evidence/guide08_legacy_pdf_extract.txt
