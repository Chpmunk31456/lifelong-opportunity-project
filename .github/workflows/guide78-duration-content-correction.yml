name: Guide 78 controlled duration wording correction

on:
  push:
    branches: [revision/guide-00-100-2026]
    paths:
      - '.github/workflows/guide78-duration-content-correction.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - name: Check out controlled revision branch
        uses: actions/checkout@v5
        with:
          ref: revision/guide-00-100-2026
          fetch-depth: 0

      - name: Normalize English duration wording without changing the fact
        shell: python
        run: |
          from pathlib import Path
          root=Path('project/revision-2026/guide-78')
          p=root/'working-masters/GUIDE_78_WEB_AND_DIGITAL_INTERFACE_DESIGNER_ENGLISH_v2.md'
          text=p.read_text(encoding='utf-8')
          old='SENA Betowa currently lists **Diseño web con Adobe Dreamweaver**, a **40-hour** complementary virtual program.'
          new='SENA Betowa currently lists **Diseño web con Adobe Dreamweaver**, a complementary virtual program totaling **40 hours**.'
          if old in text:
            text=text.replace(old,new,1)
            p.write_text(text,encoding='utf-8')
          elif new not in text:
            raise SystemExit('Guide 78 English 40-hour wording not found')

          qa=root/'qa/GUIDE_78_TRILINGUAL_TECHNICAL_QA_08.md'
          q=qa.read_text(encoding='utf-8')
          note='''\n## Duration wording verification\n\nPublication preflight confirmed the SENA duration fact is **40 hours** in every edition. The English adjectival wording `40-hour` was normalized to `a ... program totaling 40 hours` so the same controlled value is represented consistently across English, `es-419`, and `pt-BR`. The duration itself and its source did not change.\n'''
          if '## Duration wording verification' not in q:
            qa.write_text(q.rstrip()+note+'\n',encoding='utf-8')

      - name: Verify trilingual duration value
        shell: python
        run: |
          from pathlib import Path
          root=Path('project/revision-2026/guide-78/working-masters')
          files=[
            root/'GUIDE_78_WEB_AND_DIGITAL_INTERFACE_DESIGNER_ENGLISH_v2.md',
            root/'GUIDE_78_DISENADOR_DE_INTERFACES_WEB_Y_DIGITALES_ES419_v2.md',
            root/'GUIDE_78_DESIGNER_DE_WEB_E_INTERFACES_DIGITAIS_PTBR_v2.md'
          ]
          for p in files:
            t=p.read_text(encoding='utf-8')
            assert ('40 hours' in t or '40 horas' in t), f'{p.name}: 40-hour duration missing'
          print('Guide 78 40-hour trilingual duration verification PASS')

      - name: Commit controlled wording correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- project/revision-2026/guide-78/working-masters/GUIDE_78_WEB_AND_DIGITAL_INTERFACE_DESIGNER_ENGLISH_v2.md project/revision-2026/guide-78/qa/GUIDE_78_TRILINGUAL_TECHNICAL_QA_08.md
          git diff --cached --quiet && exit 0
          git commit -m 'fix(guide-78): normalize controlled SENA duration wording'
          git pull --rebase origin revision/guide-00-100-2026
          git push origin HEAD:revision/guide-00-100-2026
